// ===== INIT & EVENT DELEGATION =====

function applyTheme(){
  document.documentElement.dataset.theme=APP.st.theme;
  var t=APP.st.theme==='light'?'\u263E':'\u2600';
  var tt=APP.q('tt');
  if(tt)tt.textContent=t;
}


// ---- GLOBAL CLICK DELEGATION ----
document.addEventListener('change',function(e){
  var z=e.target.closest&&e.target.closest('[data-pzoom]');
  if(z)APP.pdfZoom(z.dataset.pdf,z.value);
});
document.addEventListener('click',function(e){
  var t=e.target;
  // Collapse/expand caret
  if(t.closest('.ng')){
    var pid=t.closest('.ni').dataset.s;
    APP.st.cl[pid]=!APP.st.cl[pid];
    APP.rn();APP.cls();
    return;
  }
  // Sidebar nav
  if(t.closest('.ni')&&!t.closest('.ni.at')){
    var ni=t.closest('.ni');
    APP.st.section=ni.dataset.s;APP.st.mode='browse';APP.st.search='';
    var sr=APP.q('srch');if(sr)sr.value='';
    APP.cls();APP.r();
    return;
  }
  // Tab switching
  if(t.closest('.tb2')&&!t.closest('.tb2.at')){
    APP.st.mode=t.closest('.tb2').dataset.m;APP.st.fcIdx=0;APP.st.fcFlip=false;
    var sr2=APP.q('srch');if(sr2)sr2.value='';APP.st.search='';
    APP.r();
    return;
  }
  // Expand all / Compact all
  if(t.closest('.exb2')){
    var open=t.closest('.exb2').dataset.ex==='open';
    APP.sel('#ct details.sk').forEach(function(d){
      if(open)d.setAttribute('open','');
      else d.removeAttribute('open');
    });
    return;
  }
// Theme toggle
if(t.id==='tt'){
  APP.st.theme=APP.st.theme==='light'?'dark':'light';
  localStorage.setItem('fpu-theme',APP.st.theme);
  applyTheme();
  return;
}
// Error log viewer
if(t.id==='lg'){
  LOG.viewer();
  return;
}
// Log viewer actions (clear / export / close)
if(t.closest('[data-lg]')){
  var lg=t.closest('[data-lg]').dataset.lg;
  if(lg==='clear'){LOG.clear();}
  else if(lg==='export'){LOG.exportTxt();}
  else{var m0=APP.q('mod');if(m0)m0.remove();}
  return;
}
  // Language buttons
  if(t.closest('.lb')){
    var lb=t.closest('.lb');
    APP.st.lang=lb.dataset.l;
    APP.sel('.lb').forEach(function(x){x.classList.toggle('at',x.dataset.l===APP.st.lang);});
    APP.r();
    return;
  }
  // Hamburger menu
  if(t.id==='mb'){
    APP.q('sb').classList.toggle('on');APP.q('ov').classList.toggle('on');
    return;
  }
  // Overlay close
  if(t.id==='ov'){
    APP.cls();
    return;
  }
  // Scenario card click
  if(t.closest('.sc[data-sc]')){
    APP.showModal(t.closest('.sc').dataset.sc);
    return;
  }
  // Modal close
  if(t.id==='mx'||t.id==='mbk'||t.closest('.mod')&&!t.closest('.pn')){
    var mod=APP.q('mod');if(mod)mod.remove();
    return;
  }
  // TTS click
  if(t.closest('.tts')){
    var ttsEl=t.closest('.tts');
    var text=ttsEl.dataset.tts;
    if(text){
      var ta=document.createElement('textarea');
      ta.innerHTML=text;
      // ponytail: speak in the current app language at click time (data-tts-lang may be stale)
      var ttsLang=APP.st.lang==='vi'?'vi-VN':(APP.st.lang==='en'?'en-US':(ttsEl.dataset.ttsLang||'en-US'));
      APP.tts(ta.value,ttsLang,ttsEl.dataset.ttsPom==='1');
    }
    return;
  }
  // PDF viewer: open document
  if(t.closest('[data-pdf]')){
    var pid=t.closest('[data-pdf]').dataset.pdf;
    APP.pdfOpen(pid);
    return;
  }
  // Flashcard flip
  if(t.closest('[data-fc="flip"]')){
    APP.st.fcFlip=!APP.st.fcFlip;
    var fcw=APP.q('fcw');if(fcw)fcw.classList.toggle('fl');
    return;
  }
  // Flashcard prev/next
  if(t.closest('[data-fc="prev"]')||t.closest('[data-fc="next"]')){
    var dir=t.closest('[data-fc="prev"]')?-1:1;
    APP.st.fcIdx+=dir;
    if(APP.st.fcIdx<0)APP.st.fcIdx=APP._fcData.length-1;
    if(APP.st.fcIdx>=APP._fcData.length)APP.st.fcIdx=0;
    APP.st.fcFlip=false;
    APP.r();
    return;
  }
});

// ---- SEARCH INPUT ----
var sr=APP.q('srch');if(sr){sr.addEventListener('input',function(){
  var v=this.value.trim();
  APP.st.search=v;
  if(v){APP.st.mode='search';APP.r();}
  else{APP.st.mode='browse';APP.r();}
});}

// ---- INIT ----
APP.rn();
APP.r();

// Restore theme (guarded: some browsers block localStorage on file:// and throw)
var saved=null;
try{if(window.localStorage){saved=localStorage.getItem('fpu-theme');}}catch(e){saved=null;}
if(saved)APP.st.theme=saved;
applyTheme();

// Warm the voice list: Chrome populates getVoices() asynchronously, so pre-call it and re-prime on voiceschanged
if('speechSynthesis' in window){
  window.speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged=function(){window.speechSynthesis.getVoices();};
}
console.log('FPU Peacekeeping Handbook v2.0 loaded');

</script>
