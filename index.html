  {t:{"en": "L10 · Take-aways", "vi": "L10 · Bài học rút ra"},fc:true,d:{"en": "What? — There are internationally recognised standards and principles in the use of force and firearms. UNPOL acts only in the law enforcement paradigm. So What? — The principles of legality, necessity, proportionality, non-discrimination, precaution and accountability must always be respected.", "vi": "Gì? — Có các tiêu chuẩn và nguyên tắc được quốc tế công nhận trong việc sử dụng vũ lực và súng. UNPOL chỉ hoạt động theo khuôn khổ thực thi pháp luật. Vậy sao? — Các nguyên tắc hợp pháp, cần thiết, tương xứng, không phân biệt đối xử, phòng ngừa và trách nhiệm giải trình phải luôn được tôn trọng."},st:[{"en": "Now What? — Familiarise yourself with the mission DUF and assume your responsibilities at mission level", "vi": "Giờ làm gì? — Tìm hiểu DUF của phái bộ và đảm nhận trách nhiệm được giao ở cấp phái bộ"}, {"en": "UNPOL must react properly when host-State police use force in violation of human rights", "vi": "UNPOL phải phản ứng phù hợp khi cảnh sát nước sở tại sử dụng vũ lực vi phạm nhân quyền"}, {"en": "UNPOL must follow established procedures, comply with standards, and set a good example", "vi": "UNPOL phải tuân theo các thủ tục đã đề ra, tuân thủ các tiêu chuẩn và nêu gương tốt"}]},
  {t:{"en": "L11 · Aim & Relevance", "vi": "L11 · Mục đích & Sự liên quan"},fc:true,d:{"en": "To familiarise participants with international standards on apprehension, arrest and detention that the host-State Police as well as UNPOL must follow.", "vi": "Giúp học viên làm quen với các tiêu chuẩn quốc tế về bắt giữ, bắt và giam giữ mà cả Cảnh sát nước sở tại lẫn UNPOL phải tuân theo."},st:[{"en": "Arrested and detained persons are vulnerable to abuses of power — international law sets out detailed guarantees of due process and humane treatment", "vi": "Người bị bắt và bị giam giữ dễ bị lạm dụng quyền lực — luật quốc tế quy định các bảo đảm chi tiết về đúng trình tự và đối xử nhân đạo"}, {"en": "In application of POC mandates, UNPOL may apprehend and detain persons as specified by the DUF and SOPs", "vi": "Khi áp dụng các ủy quyền bảo vệ dân thường, UNPOL có thể bắt giữ và giam giữ người theo quy định của DUF và SOP"}]},
  {t:{"en": "L11 · Learning Objectives", "vi": "L11 · Mục tiêu học tập"},fc:true,d:{"en": "Learners will be able to describe international standards on due process and humane treatment, explain procedures in Peace Operations, describe special procedures for child detention, and comply with procedures on release or handover of detainees.", "vi": "Học viên sẽ có thể mô tả các tiêu chuẩn quốc tế về đúng trình tự và đối xử nhân đạo, giải thích các thủ tục trong hoạt động gìn giữ hòa bình, mô tả các thủ tục đặc biệt cho việc giam giữ trẻ em và tuân thủ các thủ tục trả tự do hoặc bàn giao người bị giam giữ."}},
  {t:{"en": "L11 · Key Definitions", "vi": "L11 · Các định nghĩa chính"},fc:true,d:{"en": "In UN terminology, an 'arrest' is an action conducted only by the host-State; UNPOL carry out 'apprehension'. In non-executive missions UNPOL may apprehend under self-defence or POC mandates.", "vi": "Theo thuật ngữ của LHQ, “bắt” (arrest) là hành động chỉ do nước sở tại thực hiện; UNPOL thực hiện “bắt giữ” (apprehension). Trong các phái bộ không điều hành, UNPOL có thể bắt giữ theo ủy quyền tự vệ hoặc bảo vệ dân thường."},st:[{"en": "Apprehension: the act through which an individual is placed under the effective control or custody of UN personnel", "vi": "Bắt giữ: hành vi đưa một cá nhân vào sự kiểm soát hoặc giam giữ hiệu quả của nhân viên LHQ"}, {"en": "Arrest: the act of apprehending a person for the alleged commission of an offence or by the action of an authority", "vi": "Bắt: hành vi bắt giữ một người vì bị cáo buộc phạm tội hoặc theo hành động của cơ quan có thẩm quyền"}, {"en": "Detained person: any person deprived of personal liberty except as a result of conviction for an offence", "vi": "Người bị giam giữ: bất kỳ người nào bị tước đoạt tự do cá nhân trừ khi là hậu quả của án kết tội"}, {"en": "Imprisoned person: any person deprived of personal liberty as a result of conviction for an offence", "vi": "Người bị tù: bất kỳ người nào bị tước đoạt tự do cá nhân do kết quả của bản án kết tội"}]},
  {t:{"en": "L11 · Human Rights in Arrest & Detention", "vi": "L11 · Nhân quyền trong bắt và giam giữ"},fc:true,d:{"en": "Detainees continue to have human rights and must be treated with due process, without discrimination and with respect for their human dignity.", "vi": "Người bị giam giữ vẫn có nhân quyền và phải được đối xử theo đúng trình tự, không phân biệt đối xử và tôn trọng phẩm giá con người."},st:[{"en": "Human dignity: arrests and detention conditions must respect dignity", "vi": "Phẩm giá con người: việc bắt và điều kiện giam giữ phải tôn trọng phẩm giá"}, {"en": "Necessity and proportionality: any arrest/detention must be necessary and proportional — e.g. an arrested shoplifter generally need not be kept in custody", "vi": "Cần thiết và tương xứng: mọi việc bắt/giam phải cần thiết và tương xứng — ví dụ người bị bắt vì trộm cắp thông thường không cần giữ trong trạm tạm giam"}, {"en": "Legality and due process: sufficient legal basis (warrant procedure); arrest without warrant (caught in the act) must be clearly regulated", "vi": "Hợp pháp và đúng trình tự: đủ cơ sở pháp lý (thủ tục lệnh bắt); bắt không cần lệnh (bắt quả tang) phải được quy định rõ ràng"}, {"en": "Non-discrimination: decisions must not be affected by race, ethnicity, religion, gender or other characteristics", "vi": "Không phân biệt đối xử: các quyết định không bị ảnh hưởng bởi chủng tộc, dân tộc, tôn giáo, giới tính hoặc các đặc điểm khác"}, {"en": "Accountability: officers and commanders are held accountable for arbitrary arrests and violations", "vi": "Trách nhiệm giải trình: sĩ quan và chỉ huy phải chịu trách nhiệm về các vụ bắt giữ tùy tiện và vi phạm"}]},
  {t:{"en": "L11 · Scenario 1 — Conducting an Arrest", "vi": "L11 · Tình huống 1 — Tiến hành bắt"},fc:true,d:{"en": "CNP officers break up a brawl and arrest two men and a woman, all with minor injuries. What steps must CNP take as they conduct the arrest?", "vi": "Các sĩ quan CNP can thiệp vụ ẩu đá và bắt hai người đàn ông và một phụ nữ, tất cả bị thương nhẹ. CNP phải thực hiện những bước nào khi tiến hành bắt?"},st:[{"en": "Inform arrested persons of the (legal) reason for the arrest", "vi": "Thông báo cho người bị bắt lý do (pháp lý) của việc bắt"}, {"en": "Inform arrested persons about their rights", "vi": "Thông báo cho người bị bắt về quyền của họ"}, {"en": "Make sure that the reasons and rights are understood by the persons", "vi": "Đảm bảo người bị bắt hiểu được lý do và quyền"}, {"en": "Make sure that the arrest is recorded properly", "vi": "Đảm bảo việc bắt được ghi chép đúng cách"}, {"en": "Tend to arrested persons' wounds where necessary", "vi": "Chăm sóc vết thương của người bị bắt khi cần thiết"}]},
  {t:{"en": "L11 · Right to be Informed", "vi": "L11 · Quyền được thông báo"},fc:true,d:{"en": "Arrested persons must be promptly informed about the reasons for arrest and their rights. Any arrest and detention must be duly registered.", "vi": "Người bị bắt phải được thông báo kịp thời về lý do bắt và các quyền của họ. Mọi việc bắt và giam giữ phải được đăng ký đầy đủ."},st:[{"en": "Inform the reason for arrest at the time of arrest, in non-technical language the person can understand", "vi": "Thông báo lý do bắt vào thời điểm bắt, bằng ngôn ngữ không chuyên môn mà người đó có thể hiểu"}, {"en": "If impossible at the time, inform at the earliest possible time; promptly inform of any charges", "vi": "Nếu không thể thực hiện ngay, phải thông báo càng sớm càng tốt; kịp thời thông báo mọi cáo buộc"}, {"en": "Minimum rights to communicate: humane treatment & freedom from torture; lawyer/legal aid; medical examination; remain silent; notify a third party; challenge detention before a court", "vi": "Các quyền tối thiểu phải thông báo: đối xử nhân đạo và không bị tra tấn; luật sư/trợ giúp pháp lý; khám y tế; quyền giữ im lặng; thông báo cho bên thứ ba; khiếu nại việc giam giữ trước tòa"}, {"en": "The officer should check that the detainee has understood what they have been told", "vi": "Sĩ quan phải kiểm tra xem người bị giam giữ đã hiểu những gì được thông báo hay chưa"}]},
  {t:{"en": "L11 · Custody Records", "vi": "L11 · Hồ sơ giam giữ"},fc:true,d:{"en": "As soon as a person arrives at the initial place of detention, their detention must be recorded in an official register and a custody record opened. All entries must be signed, timed and dated.", "vi": "Ngay khi một người đến nơi giam giữ ban đầu, việc giam giữ của họ phải được ghi vào sổ đăng ký chính thức và mở hồ sơ giam giữ. Mọi mục phải được ký, ghi giờ và ngày."},st:[{"en": "Include: personal data, arresting officer(s), reason, date/time and place of arrest, transfer details, custodial officer, interrogation details, judicial appearance", "vi": "Bao gồm: dữ liệu cá nhân, sĩ quan bắt, lý do, ngày/giờ và nơi bắt, chi tiết chuyển giao, sĩ quan gác, chi tiết thẩm vấn, ra trước tòa"}, {"en": "Similar procedures apply to UNPOL apprehensions", "vi": "Các thủ tục tương tự áp dụng cho việc bắt giữ của UNPOL"}]},
  {t:{"en": "L11 · Scenario 2 — Child Detention", "vi": "L11 · Tình huống 2 — Giam giữ trẻ em"},fc:true,d:{"en": "The arrested men and woman are brought to the station. One man is 16 — under Carana law he is regarded as a child. What due process must CNP follow?", "vi": "Những người bị bắt được đưa về đồn. Một người đàn ông 16 tuổi — theo luật Carana anh ta được coi là trẻ em. CNP phải tuân theo những thủ tục nào?"},st:[{"en": "Women, men, boys and girls must be detained separately — here CNP needs three separate holding cells", "vi": "Phụ nữ, nam giới, trẻ em trai và gái phải bị giam giữ riêng — ở đây CNP cần ba buồng giam riêng"}, {"en": "International standards for children: UN Rules for the Protection of Juveniles Deprived of their Liberty (Havana Rules, 1990)", "vi": "Các tiêu chuẩn quốc tế cho trẻ em: Quy tắc của LHQ về Bảo vệ Người chưa thành niên bị Tước đoạt Tự do (Quy tắc Havana, 1990)"}, {"en": "Under the Convention on the Rights of the Child, a child is anyone below 18 — apply special protections regardless of host-State age of responsibility", "vi": "Theo Công ước về Quyền Trẻ em, trẻ em là người dưới 18 tuổi — áp dụng các bảo vệ đặc biệt bất kể tuổi chịu trách nhiệm hình sự của nước sở tại"}, {"en": "Respect general civil rights (legal representation, food, sanitation, medical support)", "vi": "Tôn trọng các quyền dân sự chung (đại diện pháp lý, đồ ăn, vệ sinh, hỗ trợ y tế)"}]},
  {t:{"en": "L11 · Medical Care & Humane Treatment", "vi": "L11 · Chăm sóc y tế & Đối xử nhân đạo"},fc:true,d:{"en": "Detainees have a right to access a medical doctor, freedom from torture and degrading treatment, and humane conditions of detention.", "vi": "Người bị giam giữ có quyền tiếp cận bác sĩ, không bị tra tấn và đối xử hạ nhục, và điều kiện giam giữ nhân đạo."},st:[{"en": "Right to independent medical examination at arrest and at regular intervals, and immediately if torture/ill-treatment suspected", "vi": "Quyền khám y tế độc lập khi bắt và định kỳ, và ngay lập tức nếu nghi ngờ tra tấn/đối xử tồi tệ"}, {"en": "Prohibition of torture & ill-treatment: no humiliating actions, coercive interviewing or restraint used as punishment", "vi": "Cấm tra tấn & đối xử tồi tệ: không hành vi hạ nhục, thẩm vấn cưỡng chế hoặc còng kẹp để trừng phạt"}, {"en": "Chains, irons and electric stun belts are inherently painful/degrading and prohibited", "vi": "Xích, cùm và đai điện giật vốn dĩ gây đau đớn/hạ nhục và bị cấm"}, {"en": "Humane conditions (Nelson Mandela Rules): non-discriminatory services, adequate accommodation, hygiene, food, health care, contact with outside world, religious practice", "vi": "Điều kiện nhân đạo (Quy tắc Nelson Mandela): dịch vụ không phân biệt, nơi ở thích hợp, vệ sinh, đồ ăn, chăm sóc y tế, liên lạc với thế giới bên ngoài, thực hành tôn giáo"}]},
  {t:{"en": "L11 · Access to Lawyer, Family & Consulate", "vi": "L11 · Tiếp cận luật sư, gia đình và lãnh sự"},fc:true,d:{"en": "Detained persons have a right to contact a lawyer, notify their families and, for foreign nationals, their consulate. Failure to abide by these rights amounts to prohibited incommunicado detention.", "vi": "Người bị giam giữ có quyền liên hệ luật sư, thông báo cho gia đình và, đối với công dân nước ngoài, cho lãnh sự của họ. Không tuân thủ các quyền này cấu thành giam giữ cô lập bị cấm."},st:[{"en": "Right to legal assistance from the onset of deprivation of liberty, categorically before any questioning", "vi": "Quyền trợ giúp pháp lý ngay khi bị tước đoạt tự do, chắc chắn trước mọi cuộc thẩm vấn"}, {"en": "Free lawyer assigned if the detainee cannot pay, if the interests of justice require; conversations with lawyers must not be monitored", "vi": "Luật sư được chỉ định miễn phí nếu người bị giam giữ không có khả năng chi trả, nếu lợi ích công lý yêu cầu; cuộc trò chuyện với luật sư không được nghe lén hoặc ghi âm"}, {"en": "Right to notify a family member, friend or other person from the outset; direct telephone preferred", "vi": "Quyền thông báo cho thành viên gia đình, bạn bè hoặc người khác ngay từ đầu; ưu tiên đàm thoại trực tiếp"}, {"en": "Foreign nationals: right to communicate with consular representatives (refugees: UNHCR); the choice to notify belongs to the detainee", "vi": "Công dân nước ngoài: quyền liên lạc với đại diện lãnh sự (người tị nạn: UNHCR); quyền lựa chọn thông báo thuộc về người bị giam giữ"}]},
  {t:{"en": "L11 · Separation of Detainees", "vi": "L11 · Tách biệt người bị giam giữ"},fc:true,d:{"en": "Different categories of detainees must be kept separate, including in police custody.", "vi": "Các nhóm người bị giam giữ khác nhau phải bị tách riêng, kể cả trong giam giữ của cảnh sát."},st:[{"en": "Persons facing charges and convicted persons must be kept separate; administrative detainees (migrants) separate from both", "vi": "Người đang bị truy tố và người bị kết án phải bị tách riêng; người bị giam hành chính (người di cư) tách khỏi cả hai nhóm trên"}, {"en": "Female detainees must be housed separately from males with separate sanitary facilities; protected from sexual violence", "vi": "Nữ giới bị giam giữ phải được nhốt riêng khỏi nam giới với cơ sở vệ sinh riêng; được bảo vệ khỏi bạo lực tình dục"}, {"en": "Age recorded immediately; if in doubt, treat the teenager as a child; detention of children is a last resort, for the shortest possible time, and separate from adults", "vi": "Ghi nhận tuổi ngay lập tức; nếu nghi ngờ, coi thanh thiếu niên đó là trẻ em; giam giữ trẻ em là biện pháp cuối cùng, trong thời gian ngắn nhất và tách khỏi người lớn"}, {"en": "Ordinary detainees protected from dangerous detainees; special measures for elderly, minorities, indigenous persons, persons with disabilities", "vi": "Người bị giam giữ thông thường được bảo vệ khỏi người nguy hiểm; các biện pháp đặc biệt cho người già, người thiểu số, người bản địa, người khuyết tật"}]},
  {t:{"en": "L11 · Judicial Review", "vi": "L11 · Xem xét tư pháp"},fc:true,d:{"en": "A detained person must be promptly brought before a judge who will review the lawfulness of the detention.", "vi": "Người bị giam giữ phải được đưa ngay trước thẩm phán, người sẽ xem xét tính hợp pháp của việc giam giữ."},st:[{"en": "Purposes: determine lawfulness of arrest/detention; examine treatment and conditions; determine release and any conditions", "vi": "Mục đích: xác định tính hợp pháp của việc bắt/giam; xem xét đối xử và điều kiện; quyết định trả tự do và mọi điều kiện"}, {"en": "Judicial review within 48 hours of arrest; for children no later than 24 hours", "vi": "Xem xét tư pháp trong vòng 48 giờ sau khi bắt; đối với trẻ em không muộn hơn 24 giờ"}, {"en": "Detainees must appear in person, be seen and be heard; the authority shall act on allegations of ill-treatment", "vi": "Người bị giam giữ phải ra trước tòa trực tiếp, được nhìn và được lắng nghe; cơ quan có thẩm quyền phải xử lý mọi cáo buộc đối xử tồi tệ"}, {"en": "Separate right: habeas corpus / amparo proceedings to challenge the lawfulness of detention", "vi": "Quyền riêng: thủ tục habeas corpus / amparo để khiếu nại tính hợp pháp của việc giam giữ"}]},
  {t:{"en": "L11 · Scenario 3 — Legality Focus Areas", "vi": "L11 · Tình huống 3 — Các lĩnh vực trọng tâm về tính hợp pháp"},fc:true,d:{"en": "UNPOL officers engaged in MMA should pay attention to whether the host-State police follows due process guarantees to ensure the legality of detention.", "vi": "Các sĩ quan UNPOL tham gia MMA nên chú ý xem cảnh sát nước sở tại có tuân theo các bảo đảm đúng trình tự để đảm bảo tính hợp pháp của việc giam giữ hay không."},st:[{"en": "Focus: arrest without valid reason (e.g. to suppress political activity or for conduct that is not a crime)", "vi": "Trọng tâm: bắt mà không có lý do hợp lệ (ví dụ để đàn áp hoạt động chính trị hoặc vì hành vi không phải là tội phạm)"}, {"en": "Focus: due process guarantees upon arrest not complied with, or rights not informed", "vi": "Trọng tâm: các bảo đảm đúng trình tự khi bắt không được tuân thủ hoặc quyền không được thông báo"}, {"en": "Focus: detainees not brought before a judge in the legally required time limit (usually 48h)", "vi": "Trọng tâm: người bị giam giữ không được đưa trước thẩm phán trong thời hạn pháp lý (thường là 48 giờ)"}, {"en": "Focus: no contact with lawyer/family/consulate; custody not registered — prohibited secret detention", "vi": "Trọng tâm: không liên lạc được với luật sư/gia đình/lãnh sự; giam giữ không được đăng ký — giam giữ bí mật bị cấm"}]},
  {t:{"en": "L11 · Treatment in Detention — Focus Areas", "vi": "L11 · Đối xử trong giam giữ — Các lĩnh vực trọng tâm"},fc:true,d:{"en": "UNPOL officers should focus on ensuring the host-State police follows international standards on treatment in detention.", "vi": "Các sĩ quan UNPOL nên tập trung đảm bảo cảnh sát nước sở tại tuân theo các tiêu chuẩn quốc tế về đối xử trong giam giữ."},st:[{"en": "Humane conditions, especially if stations lack budget or facilities", "vi": "Điều kiện nhân đạo, đặc biệt khi đồn cảnh sát thiếu ngân sách hoặc cơ sở vật chất"}, {"en": "Biggest risk of torture/ill-treatment is immediately after arrest, before contact with lawyers or family", "vi": "Nguy cơ tra tấn/đối xử tồi tệ lớn nhất ngay sau khi bắt, trước khi tiếp xúc với luật sư hoặc gia đình"}, {"en": "Separation of detainees is often a problem in smaller facilities", "vi": "Việc tách biệt người bị giam giữ thường là vấn đề ở các cơ sở nhỏ"}, {"en": "Detainees with special vulnerabilities, including children, may not be adequately treated", "vi": "Người bị giam giữ dễ bị tổn thương, bao gồm trẻ em, có thể không được đối xử thích đáng"}]},
  {t:{"en": "L11 · Monitoring Basic Procedures", "vi": "L11 · Các thủ tục giám sát cơ bản"},fc:true,d:{"en": "Basic procedures for police custody monitoring: routine detainee register checks, whole facility inspection, confidential interviews, reprisal protection and prompt follow up.", "vi": "Các thủ tục cơ bản để giám sát giam giữ của cảnh sát: kiểm tra sổ đăng ký người bị giam giữ thường xuyên, kiểm tra toàn bộ cơ sở, phỏng vấn bí mật, bảo vệ khỏi trả thù và theo dõi kịp thời."},st:[{"en": "Routinely consult the detainee register and verify accuracy", "vi": "Thường xuyên kiểm tra sổ đăng ký người bị giam giữ và xác minh tính chính xác"}, {"en": "Ask to inspect the entire facility, including cooking and washing facilities", "vi": "Yêu cầu kiểm tra toàn bộ cơ sở, bao gồm khu vực nấu ăn và giặt giũ"}, {"en": "Speak with individual detainees, one at a time, confidentially (guards within sight if required)", "vi": "Trò chuyện với từng người bị giam giữ, một người một lúc, bí mật (cai ngục có thể trong tầm mắt nếu cần)"}, {"en": "Mitigate reprisal risks: keep information confidential, report alleged reprisals, leave contact details", "vi": "Giảm thiểu nguy cơ trả thù: giữ bí mật thông tin, báo cáo cáo buộc trả thù, để lại thông tin liên hệ"}, {"en": "Promptly share concerns with the human rights component", "vi": "Kịp thời chia sẻ các lo ngại với bộ phận nhân quyền"}]},
  {t:{"en": "L11 · Scenario 4 — UNPOL Response (SOPs)", "vi": "L11 · Tình huống 4 — Phản ứng của UNPOL (SOP)"},fc:true,d:{"en": "Imagine it was not CNP but UN IPOs and a small FPU detachment who first arrived at the brawl. How should UNPOL react? Which documents determine their rights and obligations?", "vi": "Giả sử không phải CNP mà là các IPO của LHQ và một biên đội FPU nhỏ đến hiện trường vụ ẩu đá trước. UNPOL nên phản ứng thế nào? Những văn bản nào quyết định quyền và nghĩa vụ của họ?"},st:[{"en": "Q1: IPOs and FPUs act in accordance with the mandate and DUF; regulations on use of force and arrest/detention may differ for IPOs and FPUs", "vi": "Câu 1: IPO và FPU hành động theo ủy quyền và DUF; các quy định về sử dụng vũ lực và bắt/giam có thể khác nhau giữa IPO và FPU"}, {"en": "Q2: The mandate, SOMA, DUF, SOPs on Handling of Detention and other UN policies (general and mission-specific)", "vi": "Câu 2: Ủy quyền, SOMA, DUF, các SOP về Xử lý Giam giữ và các chính sách khác của LHQ (chung và riêng của phái bộ)"}]},
  {t:{"en": "L11 · SOP Scope & Applicability", "vi": "L11 · Phạm vi & Áp dụng của SOP"},fc:true,d:{"en": "The SOPs on Detention in Peace Operations apply in all situations when UNPOL apprehend and place individual(s) under the effective control of the UN field mission (even briefly). They do NOT grant powers of apprehension/arrest.", "vi": "Các SOP về Giam giữ trong Hoạt động Gìn giữ Hòa bình áp dụng trong mọi tình huống khi UNPOL bắt giữ và đặt cá nhân dưới sự kiểm soát hiệu quả của phái bộ LHQ (thậm chí ngắn ngủi). Các SOP KHÔNG trao quyền bắt giữ/bắt."},st:[{"en": "Defines the procedures of apprehension, transfers, detention and handover or release", "vi": "Xác định các thủ tục bắt giữ, chuyển giao, giam giữ và bàn giao hoặc trả tự do"}, {"en": "Assigns specific roles and responsibilities to the involved UN actors", "vi": "Giao các vai trò và trách nhiệm cụ thể cho các bên liên quan của LHQ"}, {"en": "Once UNPOL has effective control: inform the detainee of the reason, inventory seized items, offer to inform family or third parties", "vi": "Khi UNPOL đã kiểm soát hiệu quả: thông báo cho người bị giam giữ lý do, kiểm kê đồ vật bị tạm giữ/tịch thu, đề nghị thông báo cho gia đình hoặc bên thứ ba"}]},
  {t:{"en": "L11 · SOP Responsibilities (Actors)", "vi": "L11 · Trách nhiệm theo SOP (Các bên)"},fc:true,d:{"en": "The SOPs establish specific responsibilities of the Apprehending Officer, Unit Commander, Joint Operations Centre (JOC), Detention Focal Point (DFP), Human Rights and Justice/Corrections Components, Child Protection Adviser and other UN actors.", "vi": "Các SOP xác lập trách nhiệm cụ thể của Sĩ quan bắt giữ, Chỉ huy đơn vị, Trung tâm Tác chiến Liên hợp (JOC), Đầu mối Giam giữ (DFP), bộ phận Nhân quyền và Tư pháp/Cải tạo, Cố vấn Bảo vệ Trẻ em và các bên khác của LHQ."},st:[{"en": "Apprehending Officer: informs reasons, conducts initial search, identifies, preserves items, organises transport, writes report", "vi": "Sĩ quan bắt giữ: thông báo lý do, khám xét ban đầu, xác minh danh tính, giữ gìn đồ vật, tổ chức vận chuyển, viết báo cáo"}, {"en": "Unit Commander: decides release or continued detention, notifies JOC, maintains records, ensures adequate detention conditions", "vi": "Chỉ huy đơn vị: quyết định trả tự do hoặc tiếp tục giam giữ, thông báo JOC, duy trì hồ sơ, đảm bảo điều kiện giam giữ thích hợp"}, {"en": "Detention Focal Point: coordinates implementation, notifies the ICRC, liaises with host-State authorities", "vi": "Đầu mối Giam giữ: điều phối thực hiện, thông báo cho ICRC, liên lạc với cơ quan nước sở tại"}, {"en": "Head of Mission: ultimately responsible for compliance and final decisions on release, handover or extended detention", "vi": "Trưởng phái bộ: chịu trách nhiệm cuối cùng về việc tuân thủ và các quyết định cuối cùng về trả tự do, bàn giao hoặc gia hạn giam giữ"}]},
  {t:{"en": "L11 · SOP General Principles (96h / 48h Rule)", "vi": "L11 · Các nguyên tắc chung của SOP (Quy tắc 96h / 48h)"},fc:true,d:{"en": "Detainees must be treated humanely and may only be handed over to state authorities if there is no real risk of serious human rights violations. Any person detained by a field mission shall be handed over to host-State authorities or released within 96 hours (48 hours for a child).", "vi": "Người bị giam giữ phải được đối xử nhân đạo và chỉ được bàn giao cho cơ quan nhà nước nếu không có nguy cơ thực sự bị vi phạm nhân quyền nghiêm trọng. Bất kỳ người nào bị phái bộ giam giữ phải được bàn giao cho cơ quan nước sở tại hoặc trả tự do trong vòng 96 giờ (48 giờ đối với trẻ em)."},st:[{"en": "Apprehension only with due process: inform reason and rights, inventory items, notify family, keep detailed records", "vi": "Chỉ bắt giữ theo đúng trình tự: thông báo lý do và quyền, kiểm kê đồ vật, thông báo gia đình, giữ hồ sơ chi tiết"}, {"en": "Mission is responsible for water, food, hygiene and medical care", "vi": "Phái bộ chịu trách nhiệm về nước, đồ ăn, vệ sinh và chăm sóc y tế"}, {"en": "Nelson Mandela Rules guide prison management; Annex A translates them into detailed mission rules", "vi": "Quy tắc Nelson Mandela hướng dẫn quản lý nhà tù; Phụ lục A chuyển thành các quy tắc chi tiết của phái bộ"}, {"en": "Allegations of torture/ill-treatment must be transmitted immediately to the DFP and Conduct & Discipline team", "vi": "Cáo buộc tra tấn/đối xử tồi tệ phải được chuyển ngay cho DFP và đội Hạnh kiểm & Kỷ luật"}]},
  {t:{"en": "L11 · Handover to Host-State Authorities", "vi": "L11 · Bàn giao cho cơ quan nước sở tại"},fc:true,d:{"en": "A handover must take place within 96 hours (48 hours for children), otherwise the person must be released. The Head of Mission decides on individual handovers. Handover requires a host-State warrant and guarantees against persecution, torture, disappearance or summary execution.", "vi": "Việc bàn giao phải diễn ra trong vòng 96 giờ (48 giờ đối với trẻ em), nếu không người đó phải được trả tự do. Trưởng phái bộ quyết định từng trường hợp bàn giao. Bàn giao đòi hỏi lệnh của nước sở tại và các bảo đảm chống bị đàn áp, tra tấn, mất tích hoặc hành quyết."},st:[{"en": "A general legal agreement on handover (supplement to SOFA/SOMA) must be struck with the host government", "vi": "Phải ký thỏa thuận pháp lý chung về bàn giao (phụ lục SOFA/SOMA) với chính phủ nước sở tại"}, {"en": "A handover risk assessment is conducted for each individual case, with subsequent monitoring", "vi": "Tiến hành đánh giá rủi ro bàn giao cho từng trường hợp và theo dõi sau đó"}, {"en": "If the host-State fails to provide required guarantees, the DFP informs the Head of Mission, who orders release", "vi": "Nếu nước sở tại không cung cấp các bảo đảm yêu cầu, DFP thông báo Trưởng phái bộ, người ra lệnh trả tự do"}]},
  {t:{"en": "L11 · No Handover — Refoulement", "vi": "L11 · Không bàn giao — Nguy cơ trục xuất"},fc:true,d:{"en": "The UN is prohibited from handing over a detained person if there are substantial grounds to believe there is a real risk of arbitrary killing, torture, sexual violence, threats to life/freedom, death penalty, disappearance, refoulement, grossly unfair trial, prolonged arbitrary detention, or (for a child) participation in hostilities.", "vi": "LHQ bị cấm bàn giao người bị giam giữ nếu có căn cứ đáng kể để tin rằng có nguy cơ thực sự bị giết tùy tiện, tra tấn, bạo lực tình dục, đe dọa tính mạng/tự do, án tử hình, mất tích, trục xuất, xét xử bất công nghiêm trọng, giam giữ tùy tiện kéo dài hoặc (đối với trẻ em) tham gia xung đột."},st:[{"en": "Refoulement: forcing a refugee or asylum seeker to return to a country where they risk persecution or bad treatment", "vi": "Trục xuất: buộc người tị nạn hoặc người xin tị nạn trở về quốc gia nơi họ có nguy cơ bị đàn áp hoặc đối xử tồi tệ"}]},
  {t:{"en": "L11 · Post-Handover Monitoring & Release", "vi": "L11 · Giám sát sau bàn giao & Trả tự do"},fc:true,d:{"en": "The mission monitors the situation of a person handed over to host-State authorities. If the maximum permissible length of detention is about to be reached (96h or 48h for children), the DFP informs the Head of Mission, who orders release.", "vi": "Phái bộ giám sát tình trạng của người được bàn giao cho cơ quan nước sở tại. Nếu thời hạn giam giữ tối đa sắp hết (96 giờ hoặc 48 giờ đối với trẻ em), DFP thông báo Trưởng phái bộ, người ra lệnh trả tự do."},st:[{"en": "The Human Rights component may formally request corrective measures from host-State authorities", "vi": "Bộ phận Nhân quyền có thể chính thức yêu cầu cơ quan nước sở tại thực hiện các biện pháp khắc phục"}, {"en": "Release procedure: Unit Commander informs the detainee of release details, returns items, ensures safe transport", "vi": "Thủ tục trả tự do: Chỉ huy đơn vị thông báo chi tiết trả tự do cho người bị giam giữ, trả lại đồ vật, đảm bảo vận chuyển an toàn"}, {"en": "The detainee is considered released upon departure from the designated place of detention", "vi": "Người bị giam giữ được coi là đã trả tự do ngay khi rời khỏi nơi giam giữ chỉ định"}]},
  {t:{"en": "L11 · Summary", "vi": "L11 · Tổng kết"},fc:true,d:{"en": "UNPOL may apprehend and detain persons within the limits of the mission mandate & DUF (e.g. to protect civilians from a threat). UNPOL must be aware of applicable rules for detainees' different needs and comply with the SOP on Handling of Detention.", "vi": "UNPOL có thể bắt giữ và giam giữ người trong giới hạn của ủy quyền phái bộ và DUF (ví dụ để bảo vệ dân thường trước mối đe dọa). UNPOL phải nắm rõ các quy tắc áp dụng cho các nhu cầu khác nhau của người bị giam giữ và tuân thủ SOP về Xử lý Giam giữ."}},
  {t:{"en": "027 · Background & Aim", "vi": "027 · Bối cảnh & Mục đích"},fc:true,d:{"en": "UN Police may have to search persons in various circumstances — to prevent crime, secure evidence, for officer safety, or for the security of UN facilities. The officer must be confident they have a legal right to search the individual, whether granted by law or through the Mission Mandate.", "vi": "Cảnh sát LHQ có thể phải khám xét người trong nhiều hoàn cảnh — để phòng chống tội phạm, thu giữ bằng chứng, đảm bảo an toàn sĩ quan hoặc an ninh của các cơ sở LHQ. Sĩ quan phải chắc chắn mình có quyền hợp pháp khám xét cá nhân, dù được luật hoặc Ủy quyền phái bộ cho phép."},st:[{"en": "Failure to properly search and remove all weapons can result in serious injury or death", "vi": "Không khám xét đúng cách và loại bỏ mọi vũ khí có thể dẫn đến thương tích nghiêm trọng hoặc tử vong"}, {"en": "Aim: safely search a suspect in standing position, against a wall, and on the ground", "vi": "Mục đích: khám xét nghi phạm an toàn ở tư thế đứng, dựa tường và nằm trên mặt đất"}, {"en": "Training: 5 x 40-minute periods (1 theory + 3 practice + 1 revision/assessment); 6 hours total", "vi": "Đào tạo: 5 tiết x 40 phút (1 lý thuyết + 3 thực hành + 1 ôn tập/đánh giá); tổng 6 giờ"}]},
  {t:{"en": "027 · Legal Right to Search & Gender", "vi": "027 · Quyền hợp pháp khám xét & giới tính"},fc:true,d:{"en": "The officer must always remember the rights of the individual. Searches should preferably be conducted by an officer of the same gender as the searched individual. Cursory searches can be done in public; more intrusive searches must take place in a private, secure area.", "vi": "Sĩ quan phải luôn nhớ đến quyền của cá nhân. Việc khám xét tốt nhất nên do sĩ quan cùng giới với người bị khám thực hiện. Khám xét sơ bộ có thể thực hiện nơi công cộng; khám xét sâu hơn phải thực hiện ở nơi riêng tư, an toàn."},st:[{"en": "Gloves: disposable rubber gloves recommended; leather gloves protect against sharp objects that rubber does not", "vi": "Găng tay: khuyến nghị găng cao su dùng một lần; găng da bảo vệ khỏi vật sắc nhọn mà găng cao su không chống được"}, {"en": "Search starts where concealed weapons are most immediately accessible — next to the hands even if handcuffed", "vi": "Khám xét bắt đầu từ nơi vũ khí giấu dễ tiếp cận nhất — cạnh bàn tay kể cả khi đã bị còng"}, {"en": "Opposite-gender searches only done by same-gender personnel; field expedient exceptions when safety is critical", "vi": "Khám xét khác giới chỉ do nhân sự cùng giới thực hiện; ngoại lệ thực địa khi an toàn là quan trọng"}, {"en": "Use a pen, flashlight or other hard object to feel for concealed weapons in sensitive areas", "vi": "Dùng bút, đèn pin hoặc vật cứng khác để cảm nhận vũ khí giấu ở khu vực nhạy cảm"}]},
  {t:{"en": "027 · Learning Outcomes", "vi": "027 · Kết quả học tập"},fc:true,d:{"en": "On completion of this module participants will be able to: identify the safety zones, demonstrate the triangular position of control, and safely conduct a search of a suspect standing, against a wall, and on the ground.", "vi": "Sau khi hoàn thành mô-đun, học viên có thể: xác định các vùng an toàn, thực hiện tư thế kiểm soát hình tam giác và khám xét an toàn nghi phạm ở tư thế đứng, dựa tường và nằm trên mặt đất."},st:[{"en": "Search in standing position: 2 techniques", "vi": "Khám xét tư thế đứng: 2 kỹ thuật"}, {"en": "Search against a wall: 1 technique", "vi": "Khám xét dựa tường: 1 kỹ thuật"}, {"en": "Search on the ground: 1 technique", "vi": "Khám xét trên mặt đất: 1 kỹ thuật"}]},
  {t:{"en": "027 · Safety Zones", "vi": "027 · Các vùng an toàn"},fc:true,d:{"en": "Officers must be aware of the safety distances between them and any suspect: the Observation zone, the Zone of physical contact, and the Intimate zone.", "vi": "Sĩ quan phải nắm rõ các khoảng cách an toàn giữa họ và nghi phạm: vùng quan sát, vùng tiếp xúc vật lý và vùng thân mật."},st:[{"en": "Observation zone: can see the suspect but out of reach — use visual, verbal & listening skills to maintain safety", "vi": "Vùng quan sát: nhìn thấy nghi phạm nhưng ngoài tầm với — dùng thị giác, lời nói và thính giác để giữ an toàn"}, {"en": "Zone of physical contact: close enough to make contact by a simple movement — the suspect can also reach the officer with a blade or kick", "vi": "Vùng tiếp xúc vật lý: đủ gần để chạm bằng một cử động đơn giản — nghi phạm cũng có thể chạm tới sĩ quan bằng dao hoặc cú đá"}, {"en": "Intimate zone: close enough to strike with knees/elbows — the most dangerous zone; never let the suspect enter it unless the officer decides (handcuffing, searching, arrest)", "vi": "Vùng thân mật: đủ gần để đánh bằng đầu gối/khuỷu tay — vùng nguy hiểm nhất; không bao giờ để nghi phạm vào vùng này trừ khi sĩ quan quyết định (còng tay, khám xét, bắt giữ)"}]},
  {t:{"en": "027 · Threat Signs", "vi": "027 · Các dấu hiệu đe dọa"},fc:true,d:{"en": "Tactical communication lets you observe the suspect for signs they may be about to engage in physical contact. Officers must remain in control, instructing the suspect what they want from them.", "vi": "Giao tiếp chiến thuật cho phép bạn quan sát các dấu hiệu nghi phạm sắp tham gia tiếp xúc vật lý. Sĩ quan phải giữ quyền kiểm soát, ra lệnh cho nghi phạm những gì họ muốn."},st:[{"en": "Threat signs: head back — shoulders back; face red — twitching/jerking; lips pushed forward bearing teeth; fast shallow breathing; tense stance; glazed eyes; belligerent shouting; clenching fists", "vi": "Dấu hiệu đe dọa: đầu ngả sau — vai ưởng ra; mặt đỏ — giật/của quẩy; môi nhô ra lộ răng; thở nhanh và nông; tư thế căng thẳng; mắt vô hồn; la hét thách thức; nắm chặt tay"}, {"en": "If the suspect becomes aggressive: disengage or escalate to the appropriate level per the use of force matrix", "vi": "Nếu nghi phạm trở nên hung hăng: rút lui hoặc leo thang đến mức phản ứng phù hợp theo thang độ vũ lực"}]},
  {t:{"en": "027 · Approach & Positioning (130°)", "vi": "027 · Tiếp cận & Bố trí vị trí (130°)"},fc:true,d:{"en": "With two officers as a buddy team, the safest position is at a 130-degree angle to the suspect. If officers must engage with firearms they are safe from engaging each other, and the suspect sees only one officer at a time.", "vi": "Với hai sĩ quan trong tổ đôi, vị trí an toàn nhất là tạo góc 130 độ so với nghi phạm. Nếu phải dùng súng, các sĩ quan an toàn khỏi bắn nhầm nhau và nghi phạm chỉ nhìn thấy một sĩ quan mỗi lúc."},st:[{"en": "Control officer (C): faces the suspect, keeps visual contact, remains in the Zone of Observation (green zone)", "vi": "Sĩ quan kiểm soát (C): đối diện nghi phạm, giữ tiếp xúc thị giác, ở trong Vùng quan sát (vùng xanh)"}, {"en": "Protection officer (P): at 130° to the control officer, slightly to the rear of the suspect, in the yellow zone unless required to search/handcuff", "vi": "Sĩ quan y trợ (P): tạo góc 130° với sĩ quan kiểm soát, hơi phía sau nghi phạm, ở vùng vàng trừ khi cần khám xét/còng tay"}, {"en": "The suspect may be allowed to continue after questioning or production of ID", "vi": "Nghi phạm có thể được phép đi tiếp sau khi thẩm vấn hoặc xuất trình giấy tờ"}]},
  {t:{"en": "027 · Triangular Positioning — The Approach", "vi": "027 · Bố trí tam giác — Tiếp cận"},fc:true,d:{"en": "Police officers arrive in front of the person (green zone). The control officer announces 'Police, identity check'. The protection officer takes position at the rear side of the person. Officers always keep visual contact; the protection officer is in charge of handcuffing if required.", "vi": "Các sĩ quan đến trước mặt người đó (vùng xanh). Sĩ quan kiểm soát xưng: “Cảnh sát, kiểm tra giấy tờ”. Sĩ quan y trợ vào vị trí phía sau người đó. Các sĩ quan luôn giữ tiếp xúc thị giác; sĩ quan y trợ phụ trách còng tay nếu cần."},st:[{"en": "Control officer freezes the situation; the protection element takes position at the rear side of the person", "vi": "Sĩ quan kiểm soát đông băng tình huống; sĩ quan y trợ vào vị trí phía sau người đó"}, {"en": "Both elements are in active guard; control at the limit of the observation zone, protection at the limit of the zone of physical contact", "vi": "Cả hai ở tư thế phòng thủ chủ động; sĩ quan kiểm soát ở ranh giới vùng quan sát, sĩ quan y trợ ở ranh giới vùng tiếp xúc vật lý, sẵn sàng can thiệp"}]},
  {t:{"en": "027 · Change of Role", "vi": "027 · Đổi vai trò"},fc:true,d:{"en": "If the person turns back and faces the protection officer, the control officer becomes the protection officer and vice versa.", "vi": "Nếu người đó quay lưng lại và đối diện với sĩ quan y trợ, sĩ quan kiểm soát trở thành sĩ quan y trợ và ngược lại."},st:[{"en": "Roles of Protection and Control can easily be reversed as the suspect turns", "vi": "Vai trò Y trợ và Kiểm soát có thể dễ dàng hoán đổi khi nghi phạm quay người"}]},
  {t:{"en": "027 · Positions Using a Wall & Three Officers", "vi": "027 · Vị trí dùng tường & ba sĩ quan"},fc:true,d:{"en": "If a wall is present, officers may use it to assist in controlling the subject, asking them to move toward the wall before the approach. With three officers, they form a triangular position around the subject; the third acts as support officer, providing 360° protection without crossfire.", "vi": "Nếu có tường, các sĩ quan có thể dùng tường để hỗ trợ khống chế đối tượng, yêu cầu họ di chuyển về phía tường trước khi tiếp cận. Với ba sĩ quan, họ bố trí tam giác quanh đối tượng; người thứ ba làm sĩ quan y trợ, bao phủ 360° không bị hỏa lực chéo."},st:[{"en": "Assume the triangular position in preparation for the body search before the subject approaches", "vi": "Giữ bố trí tam giác để chuẩn bị khám xét trước khi đối tượng tiếp cận"}, {"en": "The officer in the center controls the subject so the others do not pass through a crossfire area", "vi": "Sĩ quan ở giữa kiểm soát đối tượng để những người khác không phải băng qua vùng hỏa lực chéo"}, {"en": "The triangular position lets protection and support see the subject's back and look for weapons on both sides; the subject has no visual contact with them", "vi": "Bố trí tam giác cho phép sĩ quan y trợ và hỗ trợ nhìn thấy lưng đối tượng và tìm vũ khí ở hai bên; đối tượng không nhìn thấy họ"}, {"en": "If the subject reaches into a pocket for ID, the protection officer ensures the movement is slow and checks the pocket", "vi": "Nếu đối tượng thò tay vào túi lấy giấy tờ, sĩ quan y trợ yêu cầu cử động chậm và kiểm tra túi"}]},
  {t:{"en": "027 · Role of the Support Officer", "vi": "027 · Vai trò của sĩ quan hỗ trợ"},fc:true,d:{"en": "The support officer is in charge of the environment so the control and protection officers can safely deal with the subject. He may position at the rear of the control/protection officer to secure the environment and avoid crossfire, making the subject the third part of the triangle.", "vi": "Sĩ quan hỗ trợ chịu trách nhiệm về môi trường để sĩ quan kiểm soát và y trợ xử lý an toàn đối tượng. Anh ta có thể ở phía sau sĩ quan kiểm soát/y trợ để bảo vệ môi trường và tránh hỏa lực chéo, biến đối tượng thành phần thứ ba của tam giác."},st:[{"en": "If other people are present, the support officer directs pedestrians around the control area", "vi": "Nếu có người khác, sĩ quan hỗ trợ hướng dẫn người đi bộ tránh khu vực kiểm soát"}, {"en": "Never be in a crossfire position with the control or protection officer if the subject becomes violent", "vi": "Không bao giờ đứng trong vùng hỏa lực chéo với sĩ quan kiểm soát hoặc y trợ nếu đối tượng trở nên bạo lực"}, {"en": "If no pedestrians or the subject poses a threat, the support officer may assist in controlling the subject", "vi": "Nếu không có người đi bộ hoặc đối tượng gây đe dọa, sĩ quan hỗ trợ có thể hỗ trợ khống chế đối tượng"}]},
  {t:{"en": "027 · Physical Body Search — Basics", "vi": "027 · Khám xét thân thể — Cơ bản"},fc:true,d:{"en": "The body search is a safety measure, not a judicial act. It is done by patting the subject's clothing, not searching inside pockets. If the officer wants to see what is in a pocket without believing it dangerous, the subject should remove the item themselves.", "vi": "Khám xét thân thể là biện pháp an toàn, không phải hành vi tư pháp. Việc khám được thực hiện bằng cách vỗ lên quần áo của đối tượng, không phải lục trong túi. Nếu sĩ quan muốn xem trong túi mà không tin là nguy hiểm, hãy yêu cầu đối tượng tự lấy vật ra."},st:[{"en": "Before searching, ask the suspect if he has any concealed weapons and where they are", "vi": "Trước khi khám, hỏi nghi phạm có giấu vũ khí không và vũ khí ở đâu"}, {"en": "Same-sex officer carries out the search, if possible", "vi": "Sĩ quan cùng giới thực hiện khám xét nếu có thể"}, {"en": "If the suspect becomes violent: take to the ground or wall to control, or back off to regain control with a weapon", "vi": "Nếu nghi phạm trở nên bạo lực: đạt xuống đất hoặc áp vào tường để khống chế hoặc lùi lại để lấy lại thế chủ động với vũ khí"}, {"en": "If a weapon is felt during pat-down: take precautions, possibly handcuff, then remove the object", "vi": "Nếu cảm nhận vũ khí khi vỗ: thận trọng, có thể còng tay rồi lấy vật ra"}]},
  {t:{"en": "027 · Search from the Back — Standard Method", "vi": "027 · Khám từ phía sau — Phương pháp chuẩn"},fc:true,d:{"en": "The standard search is used when the suspect is compliant, not known to be armed or dangerous, and not restrained with handcuffs.", "vi": "Khám xét chuẩn được dùng khi nghi phạm tuân thủ, không được biết là có vũ khí hoặc nguy hiểm và chưa bị còng tay."},st:[{"en": "Approach from the front, announce intentions; the control officer takes the lead, the protection officer triangulates", "vi": "Tiếp cận từ phía trước, thông báo ý định; sĩ quan kiểm soát dẫn đầu, sĩ quan y trợ vào vị trí tam giác"}, {"en": "Only one officer engages the suspect in conversation to avoid confusion", "vi": "Chỉ một sĩ quan trò chuyện với nghi phạm để tránh nhầm lẫn"}, {"en": "The protection officer must have a view of the back of the suspect", "vi": "Sĩ quan y trợ phải nhìn được lưng của nghi phạm"}, {"en": "Decision to search: invite the suspect to show his hands, palms out; visual contact between the 2 officers", "vi": "Quyết định khám xét: yêu cầu nghi phạm giơ tay, lòng bàn tay hướng ra; hai sĩ quan giữ tiếp xúc thị giác"}]},
  {t:{"en": "027 · Search from the Back — Control & Approach", "vi": "027 · Khám từ phía sau — Khống chế & Tiếp cận"},fc:true,d:{"en": "The protection officer secures his weapon away from the suspect and approaches in the active stance, with the leading foot in the centre of the space between the suspect's feet (not between them). He takes hold of the back of the suspect's elbow with the flat of his hand, forearm along the upper arm, elbow resting on the shoulder.", "vi": "Sĩ quan y trợ cất vũ khí xa nghi phạm và tiếp cận ở tư thế chủ động, chân trước ở giữa khoảng không gian giữa hai chân nghi phạm (không phải giữa hai chân). Anh ta nắm phía sau khuỷu tay nghi phạm bằng lòng bàn tay, cẳng tay áp dọc cánh tay trên, khuỷu tay tựa lên vai."},st:[{"en": "Double control (2 points of contact) of the person by hand and elbow", "vi": "Kiểm soát kép (2 điểm tiếp xúc) bằng tay và khuỷu tay"}, {"en": "Immediately search areas of concern (waist line), then abdominal area and chest up to the neck", "vi": "Khám ngay các khu vực đáng quan tâm (thắt lưng), sau đó bụng và ngực đến cổ"}, {"en": "The control officer talks to the suspect to distract him from the protection officer's movements", "vi": "Sĩ quan kiểm soát nói chuyện với nghi phạm để đánh lạc hướng khỏi chuyển động của sĩ quan y trợ"}, {"en": "At this point the officers swap roles: the protection officer now leads communication and becomes the control officer", "vi": "Tại điểm này hai sĩ quan đổi vai: sĩ quan y trợ giờ dẫn dắt giao tiếp và trở thành sĩ quan kiểm soát"}]},
  {t:{"en": "027 · Search from the Back — Sequence", "vi": "027 · Khám từ phía sau — Trình tự"},fc:true,d:{"en": "The search commences with the waist line (the danger area), then moves up to the chest as far as the neck. While searching, the officer keeps contact with the elbow, ready to push the person if necessary.", "vi": "Khám xét bắt đầu từ thắt lưng (khu vực nguy hiểm), sau đó lên ngực đến cổ. Khi khám, sĩ quan giữ tiếp xúc với khuỷu tay, sẵn sàng đẩy người đó nếu cần."},st:[{"en": "Keep control of the elbow while searching the small of the back, the back, the neck and the head", "vi": "Giữ khống chế khuỷu tay trong khi khám thắt lưng, lưng, cổ và đầu"}, {"en": "The person is lightly bending forward", "vi": "Người đó hơi cúi người về phía trước"}, {"en": "Search the armpits and the first arm", "vi": "Khám nách và cánh tay đầu tiên"}]},
  {t:{"en": "027 · Search from the Back — Legs & Transition", "vi": "027 · Khám từ phía sau — Chân & Chuyển đổi"},fc:true,d:{"en": "Bend down gradually in a comfortable position to search the first leg, keeping control of the person's elbow. Beware the foot — a sensitive area. Watch the suspect carefully.", "vi": "Cúi người xuống dần ở tư thế thoải mái để khám chân đầu tiên, giữ khống chế khuỷu tay của người đó. Cẩn thận với bàn chân — khu vực nhạy cảm. Quan sát nghi phạm cẩn thận."},st:[{"en": "Check the groin and buttocks with sensitivity to the customs of the suspect", "vi": "Kiểm tra vùng háng và mông một cách nhạy cảm với phong tục của nghi phạm"}, {"en": "To move to the other side: maintain the active guard position, take grip on the opposite elbow, then the elbow contacts the shoulder releasing the other hand", "vi": "Để chuyển sang bên kia: giữ tư thế phòng thủ chủ động, nắm khuỷu tay đối diện, sau đó khuỷu tay chạm vai giải phóng bàn tay kia"}, {"en": "Ensure visual contact before the transition; the protection officer follows to avoid crossfire", "vi": "Đảm bảo tiếp xúc thị giác trước khi chuyển đổi; sĩ quan y trợ di chuyển theo để tránh hỏa lực chéo"}, {"en": "Repeat the search on the left side (waist, chest, neck, armpit, arm, lower back, back)", "vi": "Lặp lại khám xét bên trái (thắt lưng, ngực, cổ, nách, tay, lưng dưới, lưng)"}, {"en": "When complete: officers take initial position, the suspect is told he is free to leave", "vi": "Khi hoàn tất: hai sĩ quan về vị trí ban đầu, nghi phạm được thông báo tự do rời đi"}]},
  {t:{"en": "027 · Search from the Back — Handcuffed Suspect", "vi": "027 · Khám từ phía sau — Nghi phạm bị còng"},fc:true,d:{"en": "When the suspect is already handcuffed, search immediately the lower back even if you intend to search the person fully. Use a wrist lock and extend the elbow up by pushing on the hand.", "vi": "Khi nghi phạm đã bị còng tay, khám ngay thắt lưng dưới kể cả khi dự định khám toàn thân. Dùng khóa cổ tay và duỗi khuỷu tay lên bằng cách đẩy bàn tay."},st:[{"en": "Search the waist area, chest and lower back", "vi": "Khám vùng thắt lưng, ngực và lưng dưới"}, {"en": "Keep control of the arm and especially the elbow; search the back, neck, armpit and first arm", "vi": "Giữ khống chế cánh tay và đặc biệt là khuỷu tay; khám lưng, cổ, nách và cánh tay đầu tiên"}, {"en": "Bend down gradually to search the first leg, beware the foot, watch carefully", "vi": "Cúi xuống dần để khám chân đầu tiên, cẩn thận với bàn chân, quan sát cẩn thận"}, {"en": "Change position and start the other side with the same methodology", "vi": "Đổi vị trí và khám bên kia với cùng phương pháp"}]},
  {t:{"en": "027 · Search from the Back Against a Wall", "vi": "027 · Khám từ phía sau dựa tường"},fc:true,d:{"en": "A search against a wall gives officers added stability and protection, and the suspect is easier to control if they become non-compliant. Used where a wall is readily available.", "vi": "Khám xét dựa tường mang lại sự ổn định và bảo vệ bổ sung cho sĩ quan và nghi phạm dễ kiểm soát hơn nếu không tuân thủ. Dùng khi có tường sẵn."},st:[{"en": "Identify yourself as police and the reason for the control (ID check); order him to show his hands and face the wall", "vi": "Xưng danh cảnh sát và nêu lý do kiểm soát (kiểm tra giấy tờ); ra lệnh giơ tay và quay mặt vào tường"}, {"en": "Order him to position his hands against the wall (arms extended at shoulder level), feet wide apart and well distanced from the wall (off balance)", "vi": "Ra lệnh đặt tay lên tường (cánh tay duỗi ngang vai), hai chân rộng và xa tường (ở tư thế mất thăng bằng)"}, {"en": "Lateral approach in active guard position; switch of role, the protection officer performs the search", "vi": "Tiếp cận từ bên ở tư thế phòng thủ chủ động; đổi vai, sĩ quan y trợ thực hiện khám xét"}]},
  {t:{"en": "027 · Wall Search — Sequence", "vi": "027 · Khám dựa tường — Trình tự"},fc:true,d:{"en": "The officer makes contact with the same two points (hand on elbow, elbow on shoulder), then searches in the same sequence as the standing search: waist, chest, neck, head, back, armpit, arms and legs.", "vi": "Sĩ quan tiếp xúc với hai điểm như trước (tay trên khuỷu tay, khuỷu tay trên vai), sau đó khám theo cùng trình tự như khám đứng: thắt lưng, ngực, cổ, đầu, lưng, nách, tay và chân."},st:[{"en": "Search the waist area, chest, neck and head; keep control of the elbow while searching the small of the back", "vi": "Khám vùng thắt lưng, ngực, cổ và đầu; giữ khống chế khuỷu tay khi khám thắt lưng"}, {"en": "Maintain contact; bend down to search the first leg, keeping watch on the suspect, not where you are searching", "vi": "Duy trì tiếp xúc; cúi xuống khám chân đầu tiên, luôn quan sát nghi phạm thay vì nơi đang khám"}, {"en": "Visual contact between the 2 officers before the transition; protection officer lowers the muzzle during transition to avoid crossfire", "vi": "Hai sĩ quan tiếp xúc thị giác trước khi chuyển đổi; sĩ quan y trợ hạ nòng súng trong lúc chuyển đổi để tránh hỏa lực chéo"}, {"en": "Search the second side: immediate control of the elbow, double points of contact, then abdomen, chest, back", "vi": "Khám bên thứ hai: khống chế ngay khuỷu tay, hai điểm tiếp xúc, sau đó bụng, ngực, lưng"}, {"en": "Finish: search the second leg, announce search completed, show respect and invite the person to leave", "vi": "Kết thúc: khám chân thứ hai, thông báo hoàn tất khám xét, thể hiện sự tôn trọng và mời người rời đi"}]},
  {t:{"en": "027 · Discovery of an Accessible Weapon", "vi": "027 · Phát hiện vũ khí trong tầm với"},fc:true,d:{"en": "Upon discovery of any dangerous object, the controlling officer alerts the protection officer by code or by stating 'Weapon'. Stop searching, secure the suspect and recover the weapon.", "vi": "Khi phát hiện bất kỳ vật nguy hiểm nào, sĩ quan kiểm soát báo cho sĩ quan y trợ bằng mã hoặc nói “Vũ khí”. Dừng khám xét, khống chế nghi phạm và thu giữ vũ khí."},st:[{"en": "The protection officer steps forward to secure the weapon; decide whether to quickly remove it or handcuff first, depending on the suspect's attitude", "vi": "Sĩ quan y trợ tiến lên thu giữ vũ khí; quyết định lấy nhanh hay còng tay trước, tùy thái độ của nghi phạm"}, {"en": "Protection officer returns to his initial position, the suspect is handcuffed and the search is resumed", "vi": "Sĩ quan y trợ quay về vị trí ban đầu, nghi phạm bị còng tay và việc khám xét được tiếp tục"}]},
  {t:{"en": "027 · Search on the Ground — Control", "vi": "027 · Khám trên mặt đất — Khống chế"},fc:true,d:{"en": "Searching on the ground is normally only carried out on dangerous suspects that have been secured and handcuffed, placed in the prone position. The searching officer's right knee is balanced between the shoulder blades to control the suspect, without pressure as a matter of course (avoid the neck to prevent permanent injury).", "vi": "Khám xét trên mặt đất thường chỉ thực hiện trên nghi phạm nguy hiểm đã được khống chế và còng tay, ở tư thế nằm sấp. Sĩ quan khám đặt đầu gối phải giữa hai xương bả vai để khống chế nghi phạm, không ấn như thói quen (tránh cổ để ngăn chấn thương vĩnh viễn)."},st:[{"en": "The searching officer secures his weapon before approaching, establishes the position of control, and searches only when he has full control", "vi": "Sĩ quan khám cất vũ khí trước khi tiếp cận, thiết lập tư thế khống chế và chỉ khám khi đã kiểm soát hoàn toàn"}, {"en": "Search immediately the waist area, back and head (temporarily remove the knee to search the lower back)", "vi": "Khám ngay vùng thắt lưng, lưng và đầu (tạm nhấc gối để khám lưng dưới)"}, {"en": "He keeps control on the floor: one knee on the lower back and the other on the shoulder, searching all accessible parts (armpits, back, thighs, arms)", "vi": "Anh ta giữ khống chế trên sàn: một gối trên lưng dưới và một gối trên vai, khám mọi phần tiếp cận được (nách, lưng, đùi, tay)"}]},
  {t:{"en": "027 · Search on the Ground — Rolling the Suspect", "vi": "027 · Khám trên mặt đất — Lật nghi phạm"},fc:true,d:{"en": "To search the front, the officer rolls the suspect onto his side: take the upper arm furthest away and pull the suspect toward you, explaining what is happening. As the suspect rolls, the right knee is placed between the handcuffed arms to hold him in place, using care not to exert excessive force.", "vi": "Để khám phía trước, sĩ quan lật nghi phạm nằm nghiêng: nắm cánh tay trên ở xa nhất và kéo nghi phạm về phía mình, giải thích điều sắp xảy ra. Khi nghi phạm lật người, đầu gối phải được đặt giữa hai cánh tay bị còng để giữ anh ta ở nguyên vị trí, cẩn thận không dùng lực quá mức."},st:[{"en": "The upper leg of the suspect is placed at the rear to facilitate the search", "vi": "Chân trên của nghi phạm được đặt ra phía sau để thuận tiện cho việc khám xét"}, {"en": "Control one hand and search with the other, from the belt area from top to bottom; do not forget the neck area", "vi": "Khống chế một tay và khám bằng tay kia, từ thắt lưng từ trên xuống dưới; đừng quên vùng cổ"}, {"en": "Search the lower part (finalized once seated); keep control of the upper leg while searching the other, extended to the rear", "vi": "Khám phần dưới (hoàn tất khi đối tượng ngồi dậy); giữ khống chế chân trên khi khám chân kia, duỗi ra phía sau"}, {"en": "The protection officer can step on the upper foot of the suspect to avoid movement; do not forget to search the groin area", "vi": "Sĩ quan y trợ có thể giẫm lên bàn chân trên của nghi phạm để chống cử động; đừng quên khám vùng háng"}]},
  {t:{"en": "027 · Standing the Suspect Up", "vi": "027 · Đứng nghi phạm dậy"},fc:true,d:{"en": "After the search is completed and the suspect is handcuffed, stand him up. Control the head with the hand in the direction you want to sit the suspect, and maintain control after sitting.", "vi": "Sau khi hoàn tất khám xét và nghi phạm đã bị còng, hãy đứng anh ta dậy. Điều khiển đầu bằng tay theo hướng muốn đặt nghi phạm ngồi và giữ khống chế đầu sau khi ngồi."},st:[{"en": "Tell the suspect he is going to be stood up; control the arms with one hand and the head with the other, pushing the head gently forward when sitting", "vi": "Báo cho nghi phạm rằng anh ta sắp được đứng dậy; khống chế tay bằng một tay và đầu bằng tay kia, đẩy đầu nhẹ về phía trước khi ngồi"}, {"en": "Ask him to bend his leg; control the head; tell him to roll and get on his knees, then stand", "vi": "Yêu cầu gập một chân; giữ khống chế đầu; bảo anh ta lăn và quỳ gối, sau đó đứng lên"}, {"en": "Assist him up in a circular movement to maintain control; then take him to the police vehicle; the protection officer can assist if needed", "vi": "Hỗ trợ anh ta đứng lên theo chuyển động tròn để giữ khống chế; sau đó đưa anh ta đến xe cảnh sát; sĩ quan y trợ có thể hỗ trợ nếu cần"}, {"en": "Key points: fold one leg on the side you intend him to stand; do not stand close above his head (he may knock you down); do not leave too much room between suspect and officer", "vi": "Điểm mấu chốt: gập một chân về phía muốn anh ta đứng; không đứng sát phía trên đầu (anh ta có thể húc bạn ngã); không để quá nhiều khoảng trống giữa nghi phạm và sĩ quan"}]},
  {t:{"en": "027 · Summary", "vi": "027 · Tổng kết"},fc:true,d:{"en": "Summary: Safety zones; positioning of officers (triangular); physical search of the suspect in standing position, against a wall, and on the ground.", "vi": "Tổng kết: Các vùng an toàn; bố trí vị trí sĩ quan (tam giác); khám xét thân thể nghi phạm ở tư thế đứng, dựa tường và trên mặt đất."}},
  {t:{"en": "028 · Background & Aim", "vi": "028 · Bối cảnh & Mục đích"},fc:true,d:{"en": "UN Police may have to use handcuffs to secure suspects on arrest for transport or as a temporary measure to control the individual and prevent harm to themselves or others. The officer must be confident they have a legal right to restrain the individual.", "vi": "Cảnh sát LHQ có thể phải dùng còng tay để khống chế nghi phạm khi bắt để vận chuyển hoặc như biện pháp tạm thời kiểm soát cá nhân và ngăn ngừa tổn hại cho bản thân hoặc người khác. Sĩ quan phải chắc chắn mình có quyền hợp pháp để khống chế cá nhân."},st:[{"en": "Dangerous or violent suspects should be handcuffed to ensure they do not become a risk to themselves, officers or the public", "vi": "Nghi phạm nguy hiểm hoặc bạo lực nên được còng tay để không trở thành mối nguy hiểm cho chính họ, sĩ quan hoặc công chúng"}, {"en": "Aim: safely handcuff a suspect in standing, kneeling, against a wall, and on the ground", "vi": "Mục đích: còng tay nghi phạm an toàn ở tư thế đứng, quỳ, dựa tường và trên mặt đất"}, {"en": "Training: 6 x 40-minute periods (1 theory + 4 practice + 1 revision/assessment); 8 hours total", "vi": "Đào tạo: 6 tiết x 40 phút (1 lý thuyết + 4 thực hành + 1 ôn tập/đánh giá); tổng 8 giờ"}]},
  {t:{"en": "028 · Legal Framework", "vi": "028 · Khung pháp lý"},fc:true,d:{"en": "The Interim SOP on Detention in UN Peace Operations provides the legal framework for physical restraints, considered as 'a use of force' with attached conditions. Instruments of restraint can only be applied in specific circumstances and shall never be used as punishment.", "vi": "SOP tạm thời về Giam giữ trong Hoạt động Gìn giữ Hòa bình cung cấp khung pháp lý cho việc sử dụng các biện pháp khống chế vật lý, được coi là “một hình thức sử dụng vũ lực” kèm các điều kiện. Các công cụ khống chế chỉ được áp dụng trong các hoàn cảnh cụ thể và không bao giờ được dùng để trừng phạt."},st:[{"en": "Allowed: as a precaution against escape during transfer/handover; on medical grounds by direction of qualified UN medical personnel; by order of the responsible Commanding Officer if other methods of control fail", "vi": "Được phép: phòng ngừa trốn thoát trong khi chuyển giao/bàn giao; vì lý do y tế theo chỉ định của nhân viên y tế LHQ có thẩm quyền; theo lệnh của Sĩ quan Chỉ huy phụ trách nếu các biện pháp khác thất bại"}, {"en": "Never as punishment; only purpose-designed handcuffs or flexi-cuffs; staff must be trained in proper use", "vi": "Không bao giờ dùng để trừng phạt; chỉ dùng còng tay hoặc còng nhựa được thiết kế riêng; nhân viên phải được đào tạo cách sử dụng đúng"}, {"en": "Restraints may be removed to undertake ablutions; detained persons shall not be attached to a vehicle or any other object", "vi": "Có thể tháo còng để vệ sinh cá nhân; không được trói người bị giam giữ vào xe hoặc bất kỳ vật nào khác"}]},
  {t:{"en": "028 · Handcuff Application Basics", "vi": "028 · Cơ bản đeo còng tay"},fc:true,d:{"en": "Handcuffing is a safety measure and can only be done if justified in law or under the guidance on use of force. Cuffs too tight or too loose can cause pain, injury, restriction of blood flow, or be considered abuse or torture.", "vi": "Còng tay là biện pháp an toàn và chỉ được thực hiện nếu được pháp luật hoặc hướng dẫn về sử dụng vũ lực cho phép. Còng quá chặt hoặc quá lỏng có thể gây đau, thương tích, cản trở tuần hoàn máu hoặc bị coi là lạm dụng hoặc tra tấn."},st:[{"en": "Once secured, double lock the handcuffs so they cannot tighten further when the suspect moves", "vi": "Sau khi đã khóa, khóa kép còng tay để chúng không thể siết thêm khi nghi phạm cử động"}, {"en": "Periodically check the handcuffs during prolonged detention, such as during transport", "vi": "Định kỳ kiểm tra còng tay trong thời gian giam giữ kéo dài, chẳng hạn khi vận chuyển"}]},
  {t:{"en": "028 · Key Points — Attitude & Protection", "vi": "028 · Điểm mấu chốt — Thái độ & Bảo vệ"},fc:true,d:{"en": "The handcuffing officer approaches from the side in the active guard position, maintaining two points of contact, with the handcuffs firmly held in the strong hand, both loops around the central chain, openings in the same direction.", "vi": "Sĩ quan còng tay tiếp cận từ bên ở tư thế phòng thủ chủ động, duy trì hai điểm tiếp xúc, cầm chắc còng tay ở tay thuận, hai vòng quanh dây xích trung tâm, hai lỗ khóa cùng hướng."},st:[{"en": "Attitude: be ready to react or withdraw if not safe to remain in the intimate (red) zone; be constantly aware of the suspect's movements", "vi": "Thái độ: sẵn sàng phản ứng hoặc rút lui nếu không an toàn khi ở trong vùng thân mật (đỏ); luôn nhận biết chuyển động của nghi phạm"}, {"en": "Protection: the second officer protects the handcuffing officer at a 130° angle; with long-barrel rifles, sling over shoulders, or low ready position for higher threats", "vi": "Bảo vệ: sĩ quan thứ hai bảo vệ sĩ quan còng tay ở góc 130°; với súng trường, đeo sau vai hoặc giữ tư thế sẵn sàng thấp khi mối đe dọa cao hơn"}]},
  {t:{"en": "028 · Key Points — Communication & Support", "vi": "028 · Điểm mấu chốt — Liên lạc & Y trợ"},fc:true,d:{"en": "Both officers must maintain permanent visual contact. The handcuffing officer informs the protection officer of any movement or weapon discovery by voice, signs or visually, and maintains verbal contact with a compliant suspect. There should always be two officers for one suspect.", "vi": "Cả hai sĩ quan phải duy trì tiếp xúc thị giác thường xuyên. Sĩ quan còng tay báo cho sĩ quan y trợ mọi cử động hoặc phát hiện vũ khí bằng lời, tín hiệu hoặc thị giác, và duy trì liên lạc bằng lời với nghi phạm tuân thủ. Luôn có hai sĩ quan cho một nghi phạm."},st:[{"en": "Adopt the 130° positioning and constantly evaluate position to prevent crossfire and maintain environmental awareness", "vi": "Áp dụng vị trí 130° và thường xuyên đánh giá vị trí để ngăn ngừa hỏa lực chéo và duy trì nhận thức môi trường"}]},
  {t:{"en": "028 · Handcuffing in Standing Position", "vi": "028 · Còng tay ở tư thế đứng"},fc:true,d:{"en": "Used only for compliant suspects. The control officer explains that an officer will approach. The handcuffing officer approaches from the side in the active guard position, takes control with hand on elbow and elbow on the shoulder blade, then slides the hand down to the wrist, preloading the handcuffs.", "vi": "Chỉ dùng cho nghi phạm tuân thủ. Sĩ quan kiểm soát giải thích rằng một sĩ quan sẽ tiếp cận. Sĩ quan còng tay tiếp cận từ bên ở tư thế phòng thủ chủ động, khống chế bằng tay trên khuỷu tay và khuỷu tay trên xương bả vai, sau đó trượt tay xuống cổ tay, mở sẵn còng tay."},st:[{"en": "Adopt the 130° position; lateral approach in the active guard position; the control officer becomes the protection officer moving laterally to avoid crossfire", "vi": "Áp dụng vị trí 130°; tiếp cận từ bên ở tư thế phòng thủ chủ động; sĩ quan kiểm soát trở thành sĩ quan y trợ di chuyển sang bên để tránh hỏa lực chéo"}, {"en": "Initially control the suspect (shoulder-elbow control with 2 points of contact); slide your hand down to the wrist and preload the handcuffs", "vi": "Khống chế nghi phạm ban đầu (khống chế vai-khuỷu tay với 2 điểm tiếp xúc); trượt tay xuống cổ tay và mở sẵn còng tay"}]},
  {t:{"en": "028 · Standing Position — Applying the Cuffs", "vi": "028 · Tư thế đứng — Đeo còng"},fc:true,d:{"en": "Clear the wrist of clothing, bring the arm to you, and apply the lower cuff with a sudden pressure that snaps it around the wrist. Adjust with the weak hand if necessary. Then lift the elbow, manipulate the arm toward the rear, changing stance to continue the movement.", "vi": "Gạt quần áo khỏi cổ tay, kéo tay về phía bạn và đeo vòng còng dưới bằng một lực đột ngột khóa quanh cổ tay. Điều chỉnh bằng tay không thuận nếu cần. Sau đó nâng khuỷu tay, hướng cánh tay ra sau, đổi tư thế để tiếp tục động tác."},st:[{"en": "Move the handcuffed wrist to the suspect's lower back so the other loop passes between the arm and the body; avoid a head strike", "vi": "Đưa cổ tay bị còng xuống lưng dưới nghi phạm để vòng còng kia luồn giữa cánh tay và thân; tránh bị húc đầu"}, {"en": "Secure the shoulder with the weak hand, slide down the arm, secure the wrist, and bring the arm toward you to apply the second cuff", "vi": "Giữ vai bằng tay không thuận, trượt xuống cánh tay, giữ cổ tay và kéo tay về phía bạn để đeo vòng còng thứ hai"}, {"en": "After securing: search the small of the back; the protection officer takes care of the environment", "vi": "Sau khi khóa: khám thắt lưng; sĩ quan y trợ quản lý môi trường"}, {"en": "Check and double lock; keyholes facing the officer where possible to make lock-picking more difficult", "vi": "Kiểm tra và khóa kép; lỗ khóa hướng về sĩ quan khi có thể để khó bẻ khóa hơn"}]},
  {t:{"en": "028 · Handcuffing in Kneeling Position", "vi": "028 · Còng tay ở tư thế quỳ"},fc:true,d:{"en": "Suspects who are dangerous or potentially dangerous should be handcuffed in the kneeling or prone position, as they can be more easily controlled. Officers identify themselves, tell the suspect to stand still with palms to the front, then kneel down with arms out, palms open.", "vi": "Nghi phạm nguy hiểm hoặc có khả năng nguy hiểm nên được còng tay ở tư thế quỳ hoặc nằm sấp vì dễ kiểm soát hơn. Các sĩ quan xưng danh, yêu cầu nghi phạm đứng yên với lòng bàn tay hướng ra trước, sau đó quỳ xuống với cánh tay dang ra, lòng bàn tay mở."},st:[{"en": "Officers should be in the safe zone (green) with a distance; conduct a good visual search for weapons or bulges", "vi": "Các sĩ quan nên ở trong vùng an toàn (xanh) với khoảng cách; tiến hành khám xét thị giác kỹ các vũ khí hoặc chỗ phồng"}, {"en": "The control officer tells the suspect to place his hands on top of the head, fingers interlaced (visible, not behind the head)", "vi": "Sĩ quan kiểm soát yêu cầu nghi phạm đặt tay lên đỉnh đầu, các ngón đan vào nhau (nhìn thấy, không để sau đầu)"}, {"en": "Move to the 130° position; the handcuffing officer becomes the control officer moving to the rear; the protection officer covers with his weapon", "vi": "Di chuyển đến vị trí 130°; sĩ quan còng tay trở thành sĩ quan kiểm soát di chuyển ra phía sau; sĩ quan y trợ y trợ bằng vũ khí"}, {"en": "Approach with caution, holster the weapon, preload the handcuffs, secure the suspect's fingers, maintain the active guard position", "vi": "Tiếp cận thận trọng, cất vũ khí, mở sẵn còng tay, giữ chặt các ngón tay của nghi phạm, duy trì tư thế phòng thủ chủ động"}]},
  {t:{"en": "028 · Kneeling Position — Applying the Cuffs", "vi": "028 · Tư thế quỳ — Đeo còng"},fc:true,d:{"en": "Apply the lower cuff, use the weak hand to complete the procedure if necessary, change stance, and manipulate the arm toward the rear while maintaining control of the other hand on the suspect's head.", "vi": "Đeo vòng còng dưới, dùng tay không thuận để hoàn tất quy trình nếu cần, đổi tư thế và hướng cánh tay ra sau trong khi giữ khống chế bàn tay kia của nghi phạm trên đầu."},st:[{"en": "Tell the suspect to bring the second hand to his back; adapt your position while following the movement, keeping control of the second hand", "vi": "Yêu cầu nghi phạm đưa bàn tay thứ hai ra sau lưng; điều chỉnh vị trí theo chuyển động trong khi giữ khống chế bàn tay thứ hai"}, {"en": "Apply pressure on the fingers to guide the second hand to the back; apply the second cuff", "vi": "Ấn lên các ngón tay để dẫn bàn tay thứ hai ra sau; đeo vòng còng thứ hai"}, {"en": "Adjust and lock the cuffs; check the waistband and back for weapons or tools to pick the lock", "vi": "Điều chỉnh và khóa còng; kiểm tra thắt lưng và lưng để tìm vũ khí hoặc dụng cụ bẻ khóa"}, {"en": "Search the small of the back; the protection officer takes care of the environment; beware of a potential head strike", "vi": "Khám thắt lưng; sĩ quan y trợ quản lý môi trường; cảnh giác khả năng bị húc đầu"}]},
  {t:{"en": "028 · Handcuffing Against a Wall", "vi": "028 · Còng tay dựa tường"},fc:true,d:{"en": "Handcuffing against a wall provides more control and a higher degree of safety. Recommended when the situation dictates and the environment permits. The officer positions in the active guard position with the weak hand securing the elbow against the wall; the protection officer stands directly behind the suspect.", "vi": "Còng tay dựa tường mang lại khả năng kiểm soát cao hơn và mức độ an toàn cao hơn. Khuyến nghị khi tình huống đòi hỏi và môi trường cho phép. Sĩ quan ở tư thế phòng thủ chủ động với tay không thuận giữ khuỷu tay áp tường; sĩ quan y trợ đứng thẳng phía sau nghi phạm."},st:[{"en": "Pull the hand away from the wall (clear the wrist), bring the hand lower, apply the lower cuff, adjust with the other hand", "vi": "Kéo tay ra khỏi tường (gạt sạch cổ tay), hạ tay xuống thấp hơn, đeo vòng còng dưới, điều chỉnh bằng tay kia"}, {"en": "Lift the elbow, manipulate the arm toward the rear, change stance; secure the suspect against the wall, pressing the knee against the suspect's leg for added control", "vi": "Nâng khuỷu tay, hướng cánh tay ra sau, đổi tư thế; ép nghi phạm vào tường, dùng đầu gối áp vào chân nghi phạm để tăng kiểm soát"}, {"en": "Slide down the arm, secure the wrist, bring the arm toward you to apply the second cuff", "vi": "Trượt xuống cánh tay, giữ cổ tay, kéo tay về phía bạn để đeo vòng còng thứ hai"}, {"en": "Search the small of the back; the protection officer ensures the 130° angle; if the suspect resists, lift the cuffs to apply pressure", "vi": "Khám thắt lưng; sĩ quan y trợ đảm bảo góc 130°; nếu nghi phạm kháng cự, nâng còng để tăng áp lực"}]},
  {t:{"en": "028 · Handcuffing on the Ground", "vi": "028 · Còng tay trên mặt đất"},fc:true,d:{"en": "Handcuffing on the ground is a technique for dangerous or potentially dangerous suspects. Officers approach from the front at a safe distance within the Observation zone, carry out a visual search, then order the suspect to kneel down, arms out palms to the front, then lie down with arms extended.", "vi": "Còng tay trên mặt đất là kỹ thuật cho nghi phạm nguy hiểm hoặc có khả năng nguy hiểm. Các sĩ quan tiếp cận từ phía trước ở khoảng cách an toàn trong Vùng quan sát, tiến hành khám xét thị giác, sau đó ra lệnh nghi phạm quỳ xuống, tay dang ra lòng bàn tay hướng trước, rồi nằm xuống với cánh tay duỗi ra."},st:[{"en": "Maintain the triangular position (protection officer in front); the intervention officer approaches laterally with caution and holsters his weapon", "vi": "Duy trì bố trí tam giác (sĩ quan y trợ ở phía trước); sĩ quan can thiệp tiếp cận từ bên thận trọng và cất vũ khí"}, {"en": "Weak hand controls the suspect's wrist, strong hand controls the elbow; approach with rotation of the arm to get into the position of control", "vi": "Tay không thuận khống chế cổ tay, tay thuận khống chế khuỷu tay; tiếp cận kết hợp xoay cánh tay để vào tư thế khống chế"}, {"en": "Secure the arm between the knees (position of control), knees tight; preload the handcuffs, clear the wrist, apply the lower cuff", "vi": "Kẹp cánh tay giữa hai đầu gối (tư thế khống chế), ép chặt gối; mở sẵn còng tay, gạt sạch cổ tay, đeo vòng còng dưới"}]},
  {t:{"en": "028 · Ground Position — Second Cuff & Safety", "vi": "028 · Tư thế trên mặt đất — Còng thứ hai & An toàn"},fc:true,d:{"en": "Bring the second arm toward you and apply the second cuff, leaving the suspect's hands in a palm-outwards position. Balance on your legs — do not kneel on the suspect's back, which can exert pressure on the lungs and lead to positional asphyxia.", "vi": "Kéo cánh tay thứ hai về phía bạn và đeo vòng còng thứ hai, để tay nghi phạm ở tư thế lòng bàn tay hướng ra ngoài. Đứng vững trên chân — không quỳ lên lưng nghi phạm vì có thể gây áp lực lên phổi dẫn đến ngạt thở do tư thế."},st:[{"en": "Adjust the handcuffs with the other hand; search the small of the back; the protection officer takes care of the environment", "vi": "Điều chỉnh còng tay bằng tay kia; khám thắt lưng; sĩ quan y trợ quản lý môi trường"}, {"en": "Double lock the handcuffs and search the suspect afterwards", "vi": "Khóa kép còng tay và khám xét nghi phạm sau đó"}, {"en": "Positional asphyxia risk: especially if handcuffing follows an intense run or fight and the suspect is out of breath — it could kill him", "vi": "Nguy cơ ngạt thở do tư thế: đặc biệt nếu còng tay sau khi chạy hoặc đánh nhau mệt sức và nghi phạm hết hơi — có thể gây tử vong"}]},
  {t:{"en": "028 · Standing Up a Handcuffed Suspect", "vi": "028 · Dựng nghi phạm bị còng đứng dậy"},fc:true,d:{"en": "If a suspect was in kneeling or prone position and you intend to stand him up, tell him, guide him and partially support his weight while performing the movement.", "vi": "Nếu nghi phạm ở tư thế quỳ hoặc nằm sấp và bạn định dựng anh ta đứng dậy, hãy báo trước, dẫn dắt và đỡ một phần trọng lượng của anh ta trong lúc thực hiện động tác."},st:[{"en": "Ensure the handcuffs are double locked before this technique is attempted — they will tighten with movement if not", "vi": "Đảm bảo còng tay đã khóa kép trước khi thực hiện kỹ thuật này — nếu không, chúng sẽ siết chặt theo chuyển động"}, {"en": "For suspects in vehicles: order them out one at a time and handcuff using one of the described techniques (standing, kneeling or prone depending on threat and environment)", "vi": "Đối với nghi phạm trên xe: ra lệnh xuống xe từng người một và còng tay bằng một trong các kỹ thuật đã mô tả (đứng, quỳ hoặc nằm sấp tùy mối đe dọa và môi trường)"}]},
  {t:{"en": "028 · Summary", "vi": "028 · Tổng kết"},fc:true,d:{"en": "A suspect can be handcuffed in the following positions: standing, kneeling, against a wall, and on the ground. Officers should be given a summary of the key points of the lesson.", "vi": "Nghi phạm có thể được còng tay ở các tư thế sau: đứng, quỳ, dựa tường và trên mặt đất. Các sĩ quan nên được tổng kết các điểm chính của bài học."}}
