        vi:'B\u1ed1n s\u0129 quan PET chi\u1ebfm c\u00e1c g\u00f3c c\u1ee7a m\u1ed9t h\u00ecnh thoi t\u01b0\u1edfng t\u01b0\u1ee3ng quanh Protectee. Tr\u00f4ng hi\u1ebfu chi\u1ebfn h\u01a1n \u0111\u1ed1i v\u1edbi \u0111\u00e1m \u0111\u00f4ng.'},
     tbl:[
      [{en:'Personnel',vi:'Nh\u00e2n s\u1ef1'},{en:'1 PPO (BG) + 4 PET officers',vi:'1 PPO (BG) + 4 s\u0129 quan PET'}],
      [{en:'Positions',vi:'V\u1ecb tr\u00ed'},{en:'corners of an imaginary lozenge, each with its own area of responsibility',vi:'c\u00e1c g\u00f3c c\u1ee7a m\u1ed9t h\u00ecnh thoi t\u01b0\u1edfng t\u01b0\u1ee3ng, m\u1ed7i ng\u01b0\u1eddi c\u00f3 khu v\u1ef1c tr\u00e1ch nhi\u1ec7m ri\u00eang'}],
      [{en:'Effect',vi:'Hi\u1ec7u \u1ee9ng'},{en:'filters crowds around the Protectee but appears aggressive',vi:'l\u1ecdc \u0111\u00e1m \u0111\u00f4ng quanh Protectee nh\u01b0ng tr\u00f4ng hi\u1ebfu chi\u1ebfn'}]
     ]},
     {t:{en:'Foot Formation - V',vi:'\u0110\u1ed9i h\u00ecnh \u0110i b\u1ed9 - Ch\u1eef V'},fc:true,
     d:{en:'Four PET officers take position along the lines of an imaginary V. Very often used when the team and the Protectee pass through a crowd.',
        vi:'B\u1ed1n s\u0129 quan PET b\u1ed1 tr\u00ed d\u1ecdc theo c\u00e1c \u0111\u01b0\u1eddng c\u1ee7a m\u1ed9t ch\u1eef V t\u01b0\u1edfng t\u01b0\u1ee3ng. R\u1ea5t th\u01b0\u1eddng \u0111\u01b0\u1ee3c s\u1eed d\u1ee5ng khi \u0111\u1ed9i v\u00e0 Protectee \u0111i qua m\u1ed9t \u0111\u00e1m \u0111\u00f4ng.'},
     tbl:[
      [{en:'Personnel',vi:'Nh\u00e2n s\u1ef1'},{en:'1 PPO (BG) + 4 PET officers',vi:'1 PPO (BG) + 4 s\u0129 quan PET'}],
      [{en:'Positions',vi:'V\u1ecb tr\u00ed'},{en:'along the lines of an imaginary V, each with its own area of responsibility',vi:'d\u1ecdc theo c\u00e1c \u0111\u01b0\u1eddng c\u1ee7a ch\u1eef V t\u01b0\u1edfng t\u01b0\u1ee3ng, m\u1ed7i ng\u01b0\u1eddi c\u00f3 khu v\u1ef1c tr\u00e1ch nhi\u1ec7m ri\u00eang'}],
      [{en:'Use',vi:'C\u00e1ch d\u00f9ng'},{en:'very often when passing through a crowd',vi:'r\u1ea5t th\u01b0\u1eddng d\u00f9ng khi \u0111i qua \u0111\u00e1m \u0111\u00f4ng'}]
     ]},
     {t:{en:'Low Profile Formations',vi:'\u0110\u1ed9i h\u00ecnh H\u1ed3 s\u01a1 th\u1ea5p'},fc:true,
     d:{en:'Discreet close protection with two, three or four officers. In some countries, close protection is only spoken of when the protection team has three or more members.',
        vi:'B\u1ea3o v\u1ec7 c\u1eadn c\u1ea3nh k\u00edn \u0111\u00e1o v\u1edbi hai, ba ho\u1eb7c b\u1ed1n s\u0129 quan. \u1ede m\u1ed9t s\u1ed1 qu\u1ed1c gia, ch\u1ec9 g\u1ecdi l\u00e0 b\u1ea3o v\u1ec7 c\u1eadn c\u1ea3nh khi \u0111\u1ed9i b\u1ea3o v\u1ec7 c\u00f3 t\u1eeb ba th\u00e0nh vi\u00ean tr\u1edf l\u00ean.'},
     st:[
      {en:'Two officers: the smallest low profile formation',vi:'Hai s\u0129 quan: \u0111\u1ed9i h\u00ecnh h\u1ed3 s\u01a1 th\u1ea5p nh\u1ecf nh\u1ea5t'},
      {en:'Three officers: the most common system used by the French protection team',vi:'Ba s\u0129 quan: h\u1ec7 th\u1ed1ng ph\u1ed5 bi\u1ebfn nh\u1ea5t \u0111\u01b0\u1ee3c \u0111\u1ed9i b\u1ea3o v\u1ec7 Ph\u00e1p s\u1eed d\u1ee5ng'},
      {en:'Four officers: one officer fully dedicated to the Protectee, in charge of extraction and evacuation',vi:'B\u1ed1n s\u0129 quan: m\u1ed9t s\u0129 quan ho\u00e0n to\u00e0n d\u00e0nh cho Protectee, ph\u1ee5 tr\u00e1ch tr\u1ee5c xu\u1ea5t v\u00e0 s\u01a1 t\u00e1n'}
     ]},
     {t:{en:'Announce of Danger - Clock Code',vi:'H\u00f4 b\u00e1o Nguy hi\u1ec3m - M\u00e3 \u0110\u1ed3ng h\u1ed3'},fc:true,
     d:{en:'The announcement informs on the nature of the danger and the direction it is coming from. In most countries the direction is defined clockwise.',
        vi:'L\u1eddi h\u00f4 b\u00e1o th\u00f4ng tin v\u1ec1 b\u1ea3n ch\u1ea5t nguy hi\u1ec3m v\u00e0 h\u01b0\u1edbng nguy hi\u1ec3m \u0111\u1ebfn. \u1ede h\u1ea7u h\u1ebft c\u00e1c qu\u1ed1c gia, h\u01b0\u1edbng \u0111\u01b0\u1ee3c x\u00e1c \u0111\u1ecbnh theo chi\u1ec1u kim \u0111\u1ed3ng h\u1ed3.'},
     tbl:[
      [{en:'12 o\u2019clock',vi:'12 gi\u1edd'},{en:'danger coming from the front',vi:'nguy hi\u1ec3m t\u1eeb ph\u00eda tr\u01b0\u1edbc'}],
      [{en:'3 o\u2019clock',vi:'3 gi\u1edd'},{en:'danger coming from the right',vi:'nguy hi\u1ec3m t\u1eeb b\u00ean ph\u1ea3i'}],
      [{en:'6 o\u2019clock',vi:'6 gi\u1edd'},{en:'danger coming from the back',vi:'nguy hi\u1ec3m t\u1eeb ph\u00eda sau'}],
      [{en:'9 o\u2019clock',vi:'9 gi\u1edd'},{en:'danger coming from the left',vi:'nguy hi\u1ec3m t\u1eeb b\u00ean tr\u00e1i'}]
     ]},
     {t:{en:'In Case of Attack - Two Modules',vi:'Khi b\u1ecb T\u1ea5n c\u00f4ng - Hai Kh\u1ed1i'},fc:true,
     d:{en:'When danger is announced, the protection team splits into two coordinated modules. Neither can achieve its task without the support of the other.',
        vi:'Khi h\u00f4 b\u00e1o nguy hi\u1ec3m, \u0111\u1ed9i b\u1ea3o v\u1ec7 t\u00e1ch th\u00e0nh hai kh\u1ed1i ph\u1ed1i h\u1ee3p. Kh\u1ed1i n\u00e0o c\u0169ng kh\u00f4ng th\u1ec3 ho\u00e0n th\u00e0nh nhi\u1ec7m v\u1ee5 n\u1ebfu thi\u1ebfu s\u1ef1 h\u1ed7 tr\u1ee3 c\u1ee7a kh\u1ed1i kia.'},
     tbl:[
      [{en:'Fixation Module',vi:'Kh\u1ed1i C\u1ed1 \u0111\u1ecbnh'},{en:'responds to the threat by neutralizing the aggressor when necessary and possible',vi:'\u0111\u00e1p tr\u1ea3 m\u1ed1i \u0111e d\u1ecda b\u1eb1ng c\u00e1ch v\u00f4 hi\u1ec7u h\u00f3a k\u1ebb t\u1ea5n c\u00f4ng khi c\u1ea7n v\u00e0 c\u00f3 th\u1ec3'}],
      [{en:'Evacuation Module',vi:'Kh\u1ed1i S\u01a1 t\u00e1n'},{en:'in charge of the extraction and evacuation of the Principal',vi:'ph\u1ee5 tr\u00e1ch tr\u1ee5c xu\u1ea5t v\u00e0 s\u01a1 t\u00e1n Nh\u00e2n v\u1eadt (Principal)'}]
     ]},
     {t:{en:'Full Contact Report - LIAR',vi:'B\u00e1o c\u00e1o Ti\u1ebfp x\u00fac \u0110\u1ea7y \u0111\u1ee7 - LIAR'},fc:true,
     d:{en:'In case of contact or aggression, a report is made immediately through the LIAR framework to the command post to facilitate decision making.',
        vi:'Khi ti\u1ebfp x\u00fac ho\u1eb7c b\u1ecb t\u1ea5n c\u00f4ng, m\u1ed9t b\u00e1o c\u00e1o \u0111\u01b0\u1ee3c g\u1eedi ngay theo khung LIAR t\u1edbi trung t\u00e2m ch\u1ec9 huy \u0111\u1ec3 h\u1ed7 tr\u1ee3 ra quy\u1ebft \u0111\u1ecbnh.'},
     tbl:[
      [{en:'L: Location',vi:'L: V\u1ecb tr\u00ed'},{en:'grid coordinates, specific description of your location',vi:'t\u1ecda \u0111\u1ed9 l\u01b0\u1edbi, m\u00f4 t\u1ea3 c\u1ee5 th\u1ec3 v\u1ecb tr\u00ed c\u1ee7a b\u1ea1n'}],
      [{en:'I: Incident',vi:'I: S\u1ef1 vi\u1ec7c'},{en:'what occurred, attacked by whom, number of attackers, basic descriptions',vi:'chuy\u1ec7n g\u00ec \u0111\u00e3 x\u1ea3y ra, b\u1ecb ai t\u1ea5n c\u00f4ng, s\u1ed1 l\u01b0\u1ee3ng k\u1ebb t\u1ea5n c\u00f4ng, m\u00f4 t\u1ea3 c\u01a1 b\u1ea3n'}],
      [{en:'A: Action',vi:'A: H\u00e0nh \u0111\u1ed9ng'},{en:'returned fire or not, any useful observations, health of Principal and team',vi:'c\u00f3 b\u1eafn tr\u1ea3 hay kh\u00f4ng, m\u1ecdi quan s\u00e1t h\u1eefu \u00edch, s\u1ee9c kh\u1ecfe c\u1ee7a Principal v\u00e0 \u0111\u1ed9i'}],
      [{en:'R: Request',vi:'R: Y\u00eau c\u1ea7u'},{en:'what your team needs',vi:'\u0111\u1ed9i c\u1ee7a b\u1ea1n c\u1ea7n g\u00ec'}]
     ]},
    {t:{en:'Mobile Protection - Definitions & Driving',vi:'B\u1ea3o v\u1ec7 C\u01a1 \u0111\u1ed9ng - \u0110\u1ecbnh ngh\u0129a & L\u00e1i xe'},
     d:{en:'Mobile protection mitigates a perceived or actual threat during movement by vehicle using defensive driving skills and vehicle formations. Drivers remain responsible for their driving decisions.',
        vi:'B\u1ea3o v\u1ec7 c\u01a1 \u0111\u1ed9ng gi\u1ea3m thi\u1ec3u m\u1ed1i \u0111e d\u1ecda nh\u1eadn th\u1ea5y ho\u1eb7c th\u1ef1c t\u1ebf khi di chuy\u1ec3n b\u1eb1ng xe nh\u1edd k\u1ef9 n\u0103ng l\u00e1i xe ph\u00f2ng th\u1ee7 v\u00e0 \u0111\u1ed9i h\u00ecnh xe. L\u00e1i xe lu\u00f4n ch\u1ecbu tr\u00e1ch nhi\u1ec7m v\u1ec1 c\u00e1c quy\u1ebft \u0111\u1ecbnh l\u00e1i c\u1ee7a m\u00ecnh.'},
     tbl:[
      [{en:'Close Protection Unit',vi:'\u0110\u01a1n v\u1ecb B\u1ea3o v\u1ec7 C\u1eadn c\u1ea3nh'},{en:'all officers deployed to provide protection in transit',vi:'to\u00e0n b\u1ed9 s\u0129 quan \u0111\u01b0\u1ee3c tri\u1ec3n khai \u0111\u1ec3 b\u1ea3o v\u1ec7 khi di chuy\u1ec3n'}],
      [{en:'Convoy',vi:'\u0110o\u00e0n h\u1ed9 t\u1ed1ng'},{en:'the assembly of vehicles travelling together on the movement',vi:'t\u1eadp h\u1ee3p c\u00e1c xe c\u00f9ng di chuy\u1ec3n v\u1edbi nhau'}],
      [{en:'Escort',vi:'H\u1ed9 t\u1ed1ng'},{en:'additional support provided by the respective Host Country',vi:'h\u1ed7 tr\u1ee3 b\u1ed5 sung do n\u01b0\u1edbc s\u1edf t\u1ea1i cung c\u1ea5p'}],
      [{en:'Close Protection Operation',vi:'Chi\u1ebfn d\u1ecbch B\u1ea3o v\u1ec7 C\u1eadn c\u1ea3nh'},{en:'the overall protection package: direct, mobile and static protection phases',vi:'g\u00f3i b\u1ea3o v\u1ec7 t\u1ed5ng th\u1ec3: c\u00e1c giai \u0111o\u1ea1n b\u1ea3o v\u1ec7 tr\u1ef1c ti\u1ebfp, c\u01a1 \u0111\u1ed9ng v\u00e0 t\u0129nh'}],
      [{en:'Mobile Protection Phase',vi:'Giai \u0111o\u1ea1n B\u1ea3o v\u1ec7 C\u01a1 \u0111\u1ed9ng'},{en:'the element concerned with protection in transit',vi:'th\u00e0nh ph\u1ea7n li\u00ean quan \u0111\u1ebfn b\u1ea3o v\u1ec7 khi di chuy\u1ec3n'}]
     ],
     st:[
      {en:'All escort drivers must be trained in defensive driving techniques; only authorised drivers are used',vi:'M\u1ecdi l\u00e1i xe h\u1ed9 t\u1ed1ng ph\u1ea3i \u0111\u01b0\u1ee3c \u0111\u00e0o t\u1ea1o k\u1ef9 thu\u1eadt l\u00e1i xe ph\u00f2ng th\u1ee7; ch\u1ec9 s\u1eed d\u1ee5ng l\u00e1i xe \u0111\u01b0\u1ee3c ph\u00e9p'},
      {en:'Vehicles can themselves constitute lethal force; drivers must justify actions used to force an escape or prevent an attack',vi:'Xe t\u1ef1 th\u00e2n c\u00f3 th\u1ec3 c\u1ea5u th\u00e0nh v\u0169 l\u1ef1c s\u00e1t th\u01b0\u01a1ng; l\u00e1i xe ph\u1ea3i gi\u1ea3i tr\u00ecnh c\u00e1c h\u00e0nh \u0111\u1ed9ng d\u00f9ng \u0111\u1ec3 \u00e9p tho\u00e1t ho\u1eb7c ng\u0103n ch\u1eb7n m\u1ed9t v\u1ee5 t\u1ea5n c\u00f4ng'},
      {en:'Priority is a safe transit for the Protectee, the public and the officers; speed is secondary',vi:'\u01afu ti\u00ean l\u00e0 di chuy\u1ec3n an to\u00e0n cho Protectee, c\u00f4ng ch\u00fang v\u00e0 c\u00e1c s\u0129 quan; t\u1ed1c \u0111\u1ed9 l\u00e0 th\u1ee9 y\u1ebfu'}
     ]},
    {t:{en:'Mobile Protection - Planning',vi:'B\u1ea3o v\u1ec7 C\u01a1 \u0111\u1ed9ng - L\u1eadp k\u1ebf ho\u1ea1ch'},
     d:{en:'Officers in charge of UN mobile protection assess each operation and decide on the relevant protection strategy using the risk management process.',
        vi:'C\u00e1c s\u0129 quan ph\u1ee5 tr\u00e1ch b\u1ea3o v\u1ec7 c\u01a1 \u0111\u1ed9ng c\u1ee7a LHQ \u0111\u00e1nh gi\u00e1 t\u1eebng chi\u1ebfn d\u1ecbch v\u00e0 quy\u1ebft \u0111\u1ecbnh chi\u1ebfn l\u01b0\u1ee3c b\u1ea3o v\u1ec7 ph\u00f9 h\u1ee3p th\u00f4ng qua quy tr\u00ecnh qu\u1ea3n l\u00fd r\u1ee7i ro.'},
     tbl:[
      [{en:'High Profile',vi:'H\u1ed3 s\u01a1 cao'},{en:'overt operations, uniformed officers and marked UN vehicles: high visibility presence intended to deter attack',vi:'chi\u1ebfn d\u1ecbch c\u00f4ng khai, s\u0129 quan \u0111\u1ed3ng ph\u1ee5c v\u00e0 xe LHQ mang nh\u00e3n hi\u1ec7u: hi\u1ec7n di\u1ec7n n\u1ed5i b\u1eadt \u0111\u1ec3 r\u0103n \u0111e t\u1ea5n c\u00f4ng'}],
      [{en:'Low Profile',vi:'H\u1ed3 s\u01a1 th\u1ea5p'},{en:'covert operations, maintaining secrecy and drawing the least attention: unannounced movements, discreet points of arrival and departure',vi:'chi\u1ebfn d\u1ecbch b\u00ed m\u1eadt, gi\u1eef b\u00ed m\u1eadt v\u00e0 thu h\u00fat \u00edt ch\u00fa \u00fd nh\u1ea5t: di chuy\u1ec3n kh\u00f4ng c\u00f4ng b\u1ed1, \u0111i\u1ec3m \u0111\u1ebfn v\u00e0 \u0111i k\u00edn \u0111\u00e1o'}],
      [{en:'High security, low profile',vi:'An ninh cao, h\u1ed3 s\u01a1 th\u1ea5p'},{en:'e.g. armed motorcyclists facilitate progress without road closures or other high profile activities',vi:'v\u00ed d\u1ee5 m\u00f4 t\u00f4 v\u0169 trang h\u1ed7 tr\u1ee3 ti\u1ebfn tr\u00ecnh m\u00e0 kh\u00f4ng \u0111\u00f3ng \u0111\u01b0\u1eddng ho\u1eb7c c\u00e1c ho\u1ea1t \u0111\u1ed9ng h\u1ed3 s\u01a1 cao kh\u00e1c'}],
      [{en:'Decoys / counter assault',vi:'Nghi binh / ch\u1ed1ng t\u1ea5n c\u00f4ng'},{en:'for high security, high profile operations: decoys, overt or covert counter assault capability',vi:'cho chi\u1ebfn d\u1ecbch an ninh cao, h\u1ed3 s\u01a1 cao: nghi binh, n\u0103ng l\u1ef1c ch\u1ed1ng t\u1ea5n c\u00f4ng c\u00f4ng khai ho\u1eb7c b\u00ed m\u1eadt'}]
     ]},
    {t:{en:'Mobile Protection - Convoy Rules',vi:'B\u1ea3o v\u1ec7 C\u01a1 \u0111\u1ed9ng - Quy t\u1eafc \u0110o\u00e0n h\u1ed9 t\u1ed1ng'},
     d:{en:'In principle a convoy should not contain more than five vehicles; most convoys will consist of no more than four.',
        vi:'V\u1ec1 nguy\u00ean t\u1eafc, m\u1ed9t \u0111o\u00e0n h\u1ed9 t\u1ed1ng kh\u00f4ng n\u00ean ch\u1ee9a qu\u00e1 n\u0103m xe; h\u1ea7u h\u1ebft c\u00e1c \u0111o\u00e0n s\u1ebd g\u1ed3m kh\u00f4ng qu\u00e1 b\u1ed1n xe.'},
     st:[
      {en:'Max five vehicles; four is ideal, fewer vehicles make it easier to identify the Protectee car',vi:'T\u1ed1i \u0111a n\u0103m xe; b\u1ed1n l\u00e0 l\u00fd t\u01b0\u1edfng, \u00edt xe h\u01a1n gi\u00fap d\u1ec5 nh\u1eadn di\u1ec7n xe c\u1ee7a Protectee'},
      {en:'Non-essential vehicles not performing a specific task must be excluded',vi:'Lo\u1ea1i b\u1ecf c\u00e1c xe kh\u00f4ng thi\u1ebft y\u1ebfu kh\u00f4ng th\u1ef1c hi\u1ec7n m\u1ed9t nhi\u1ec7m v\u1ee5 c\u1ee5 th\u1ec3'},
      {en:'All vehicles should have four doors and, depending on the threat, be ballistically protected',vi:'M\u1ecdi xe n\u00ean c\u00f3 b\u1ed1n c\u1eeda v\u00e0, t\u00f9y theo m\u1ed1i \u0111e d\u1ecda, \u0111\u01b0\u1ee3c ch\u1ed1ng \u0111\u1ea1n'},
      {en:'Engines kept running until the Protectee is secure inside a building; started in good time before return',vi:'N\u1ed5 m\u00e1y cho \u0111\u1ebfn khi Protectee an to\u00e0n b\u00ean trong t\u00f2a nh\u00e0; kh\u1edfi \u0111\u1ed9ng s\u1edbm tr\u01b0\u1edbc khi tr\u1edf l\u1ea1i'},
      {en:'Convoy vehicles always kept fully fuelled; never below half full exclusive of reserve tanks',vi:'Xe \u0111o\u00e0n lu\u00f4n \u0111\u1ea7y nhi\u00ean li\u1ec7u; kh\u00f4ng bao gi\u1edd d\u01b0\u1edbi n\u1eeda b\u00ecnh, kh\u00f4ng t\u00ednh b\u00ecnh d\u1ef1 tr\u1eef'}
     ]},
    {t:{en:'Convoy Composition - Core Vehicles',vi:'C\u01a1 c\u1ea5u \u0110o\u00e0n h\u1ed9 t\u1ed1ng - C\u00e1c Xe L\u00f5i'},
     d:{en:'The core vehicles of an escorted convoy. The practice of forming a second, separate convoy with its own escort may be considered if required.',
        vi:'C\u00e1c xe l\u00f5i c\u1ee7a m\u1ed9t \u0111o\u00e0n h\u1ed9 t\u1ed1ng. C\u00f3 th\u1ec3 xem x\u00e9t vi\u1ec7c l\u1eadp m\u1ed9t \u0111o\u00e0n th\u1ee9 hai ri\u00eang bi\u1ec7t v\u1edbi h\u1ed9 t\u1ed1ng ri\u00eang n\u1ebfu c\u1ea7n.'},
     tbl:[
      [{en:'Point Car (PC)',vi:'Xe d\u1eabn \u0111\u01b0\u1eddng (PC)'},{en:'ensures the route selected remains clear and travels at a distance in advance of the main convoy',vi:'b\u1ea3o \u0111\u1ea3m tuy\u1ebfn \u0111\u01b0\u1eddng \u0111\u00e3 ch\u1ecdn th\u00f4ng tho\u00e1ng v\u00e0 \u0111i c\u00e1ch m\u1ed9t kho\u1ea3ng ph\u00eda tr\u01b0\u1edbc \u0111o\u00e0n ch\u00ednh'}],
      [{en:'Lead Car (LC)',vi:'Xe d\u1eabn \u0111\u1ea7u (LC)'},{en:'responsible for the speed and position of the convoy on the road',vi:'ch\u1ecbu tr\u00e1ch nhi\u1ec7m v\u1ec1 t\u1ed1c \u0111\u1ed9 v\u00e0 v\u1ecb tr\u00ed c\u1ee7a \u0111o\u00e0n tr\u00ean \u0111\u01b0\u1eddng'}],
      [{en:'Principal Vehicle (PV)',vi:'Xe Nh\u00e2n v\u1eadt (PV)'},{en:'used to transport the Protectee and driven by the Principal Driver',vi:'d\u00f9ng \u0111\u1ec3 ch\u1edf Protectee v\u00e0 do L\u00e1i xe Nh\u00e2n v\u1eadt l\u00e1i'}],
      [{en:'PET Car',vi:'Xe PET'},{en:'used to transport Protection Officers only; may be used as a shield for the Protectee Vehicle',vi:'ch\u1ec9 d\u00f9ng \u0111\u1ec3 ch\u1edf c\u00e1c S\u0129 quan B\u1ea3o v\u1ec7; c\u00f3 th\u1ec3 \u0111\u01b0\u1ee3c d\u00f9ng l\u00e0m l\u00e1 ch\u1eafn cho Xe Protectee'}]
     ]},
    {t:{en:'Convoy Composition - Support Vehicles',vi:'C\u01a1 c\u1ea5u \u0110o\u00e0n h\u1ed9 t\u1ed1ng - Xe H\u1ed7 tr\u1ee3'},
     d:{en:'Additional vehicles that may be deployed in support of the convoy while not being attached to its speed or route.',
        vi:'C\u00e1c xe b\u1ed5 sung c\u00f3 th\u1ec3 \u0111\u01b0\u1ee3c tri\u1ec3n khai \u0111\u1ec3 h\u1ed7 tr\u1ee3 \u0111o\u00e0n h\u1ed9 t\u1ed1ng trong khi kh\u00f4ng g\u1eafn v\u1edbi t\u1ed1c \u0111\u1ed9 ho\u1eb7c tuy\u1ebfn \u0111\u01b0\u1eddng c\u1ee7a \u0111o\u00e0n.'},
     tbl:[
      [{en:'Pilot Vehicle (PiV)',vi:'Xe hoa ti\u00eau (PiV)'},{en:'provided across unfamiliar boundaries: enhanced communication and detailed working knowledge of local routes',vi:'\u0111\u01b0\u1ee3c cung c\u1ea5p khi v\u01b0\u1ee3t c\u00e1c ranh gi\u1edbi kh\u00f4ng quen thu\u1ed9c: li\u00ean l\u1ea1c t\u1ed1t h\u01a1n v\u00e0 am hi\u1ec3u chi ti\u1ebft c\u00e1c tuy\u1ebfn \u0111\u1ecba ph\u01b0\u01a1ng'}],
      [{en:'Rear Car (RC)',vi:'Xe ch\u1ed1t h\u1eadu (RC)'},{en:'maintains a sterile area to the rear; utilized only in high profile operations',vi:'gi\u1eef m\u1ed9t khu v\u1ef1c tr\u1ed1ng ph\u00eda sau; ch\u1ec9 \u0111\u01b0\u1ee3c s\u1eed d\u1ee5ng trong c\u00e1c chi\u1ebfn d\u1ecbch h\u1ed3 s\u01a1 cao'}],
      [{en:'Counter Assault Team (CAT)',vi:'T\u1ed5 Ch\u1ed1ng T\u1ea5n c\u00f4ng (CAT)'},{en:'opposes an attack to protect the Protectee directly or cover the withdrawal; for particularly high threat escorts',vi:'\u0111\u1ed1i ph\u00f3 m\u1ed9t cu\u1ed9c t\u1ea5n c\u00f4ng \u0111\u1ec3 b\u1ea3o v\u1ec7 tr\u1ef1c ti\u1ebfp Protectee ho\u1eb7c y\u1ec3m tr\u1ee3 r\u00fat lui; cho c\u00e1c v\u1ee5 h\u1ed9 t\u1ed1ng \u0111e d\u1ecda \u0111\u1eb7c bi\u1ec7t cao'}],
      [{en:'Sweep Car (SC)',vi:'Xe d\u1ecdn \u0111\u01b0\u1eddng (SC)'},{en:'detached component shadowing the convoy; stops for incidents, replaces disabled vehicles, provides contingent tactical support',vi:'th\u00e0nh ph\u1ea7n t\u00e1ch r\u1eddi theo d\u00f5i \u0111o\u00e0n; d\u1eebng x\u1eed l\u00fd s\u1ef1 c\u1ed1, thay th\u1ebf xe h\u1ecfng, cung c\u1ea5p h\u1ed7 tr\u1ee3 chi\u1ebfn thu\u1eadt d\u1ef1 ph\u00f2ng'}]
     ],
     st:[
      {en:'The Sweep Car is normally staffed by three officers, all armed with handguns, two with enhanced firearms capability',vi:'Xe d\u1ecdn \u0111\u01b0\u1eddng th\u01b0\u1eddng c\u00f3 ba s\u0129 quan, t\u1ea5t c\u1ea3 mang s\u00fang ng\u1eafn, hai ng\u01b0\u1eddi c\u00f3 kh\u1ea3 n\u0103ng h\u1ecfa l\u1ef1c m\u1ea1nh h\u01a1n'},
      {en:'FPUs take part in the convoy as Point or Lead Car and as Rear or Sweep Car in most cases',vi:'FPU tham gia \u0111o\u00e0n v\u1edbi vai tr\u00f2 Xe d\u1eabn \u0111\u01b0\u1eddng ho\u1eb7c Xe d\u1eabn \u0111\u1ea7u v\u00e0 Xe ch\u1ed1t h\u1eadu ho\u1eb7c Xe d\u1ecdn \u0111\u01b0\u1eddng trong h\u1ea7u h\u1ebft c\u00e1c tr\u01b0\u1eddng h\u1ee3p'}
     ]},
    {t:{en:'Convoy Communication',vi:'Li\u00ean l\u1ea1c \u0110o\u00e0n h\u1ed9 t\u1ed1ng'},
     d:{en:'Effective communications within, from and to the convoy and with any Host Country escort are vital. Standard radio channels may be monitored.',
        vi:'Li\u00ean l\u1ea1c hi\u1ec7u qu\u1ea3 trong, t\u1eeb v\u00e0 \u0111\u1ebfn \u0111o\u00e0n h\u1ed9 t\u1ed1ng c\u0169ng nh\u01b0 v\u1edbi b\u1ea5t k\u1ef3 h\u1ed9 t\u1ed1ng n\u00e0o c\u1ee7a n\u01b0\u1edbc s\u1edf t\u1ea1i l\u00e0 r\u1ea5t quan tr\u1ecdng. C\u00e1c k\u00eanh \u0111\u00e0m ti\u00eau chu\u1ea9n c\u00f3 th\u1ec3 b\u1ecb theo d\u00f5i.'},
     st:[
      {en:'Maintain radio silence except in emergencies; use robust encrypted systems where high security is required',vi:'Gi\u1eef im l\u1eb7ng tr\u00ean s\u00f3ng \u0111\u00e0m tr\u1eeb tr\u01b0\u1eddng h\u1ee3p kh\u1ea9n c\u1ea5p; s\u1eed d\u1ee5ng h\u1ec7 th\u1ed1ng m\u00e3 h\u00f3a m\u1ea1nh khi c\u1ea7n an ninh cao'},
      {en:'Venue and road names are not given in plain language: coded alternatives are recommended',vi:'T\u00ean \u0111\u1ecba \u0111i\u1ec3m v\u00e0 \u0111\u01b0\u1eddng kh\u00f4ng \u0111\u01b0\u1ee3c n\u00eau b\u1eb1ng ng\u00f4n ng\u1eef th\u01b0\u1eddng: n\u00ean d\u00f9ng c\u00e1c m\u00e3 thay th\u1ebf'},
      {en:'All vehicles in an escorted convoy should have direct car-to-car communications',vi:'M\u1ecdi xe trong \u0111o\u00e0n \u0111\u01b0\u1ee3c h\u1ed9 t\u1ed1ng n\u00ean c\u00f3 li\u00ean l\u1ea1c tr\u1ef1c ti\u1ebfp gi\u1eefa xe v\u1edbi xe'},
      {en:'Radio call signs should be changed regularly, especially for ongoing or repeat escort operations',vi:'M\u00e3 hi\u1ec7u \u0111\u00e0m n\u00ean \u0111\u01b0\u1ee3c thay \u0111\u1ed5i th\u01b0\u1eddng xuy\u00ean, \u0111\u1eb7c bi\u1ec7t cho c\u00e1c ho\u1ea1t \u0111\u1ed9ng h\u1ed9 t\u1ed1ng \u0111ang di\u1ec5n ra ho\u1eb7c l\u1eb7p l\u1ea1i'},
      {en:'Radio communication with venues should be established: the convoy is most vulnerable on final approach',vi:'N\u00ean thi\u1ebft l\u1eadp li\u00ean l\u1ea1c v\u1edbi c\u00e1c \u0111\u1ecba \u0111i\u1ec3m: \u0111o\u00e0n d\u1ec5 b\u1ecb t\u1ed5n th\u01b0\u01a1ng nh\u1ea5t khi ti\u1ebfp c\u1eadn cu\u1ed1i'},
      {en:'For cross-border movement, keep links with the original centre until firmly established with the new area',vi:'Khi di chuy\u1ec3n xuy\u00ean bi\u00ean gi\u1edbi, gi\u1eef li\u00ean l\u1ea1c v\u1edbi trung t\u00e2m g\u1ed1c cho \u0111\u1ebfn khi \u0111\u01b0\u1ee3c thi\u1ebft l\u1eadp ch\u1eafc ch\u1eafn v\u1edbi khu v\u1ef1c m\u1edbi'}
     ]},
     {t:{en:'Attacks on Convoys',vi:'C\u00e1c v\u1ee5 T\u1ea5n c\u00f4ng \u0110o\u00e0n h\u1ed9 t\u1ed1ng'},fc:true,
     d:{en:'If a convoy is attacked, all escort officers must be informed immediately by car-to-car radio. The convoy\u2019s primary defensive characteristic is its ability to distance itself rapidly from the site of an attack.',
        vi:'N\u1ebfu m\u1ed9t \u0111o\u00e0n b\u1ecb t\u1ea5n c\u00f4ng, m\u1ecdi s\u0129 quan h\u1ed9 t\u1ed1ng ph\u1ea3i \u0111\u01b0\u1ee3c th\u00f4ng b\u00e1o ngay qua \u0111\u00e0m gi\u1eefa c\u00e1c xe. \u0110\u1eb7c t\u00ednh ph\u00f2ng th\u1ee7 ch\u00ednh c\u1ee7a \u0111o\u00e0n l\u00e0 kh\u1ea3 n\u0103ng nhanh ch\u00f3ng t\u1ea1o kho\u1ea3ng c\u00e1ch v\u1edbi \u0111\u1ecba \u0111i\u1ec3m b\u1ecb t\u1ea5n c\u00f4ng.'},
     tbl:[
      [{en:'Attack from the left',vi:'T\u1ea5n c\u00f4ng t\u1eeb tr\u00e1i'},{en:'the PET places itself between the PV and the shooters',vi:'PET \u0111\u1eb7t xe gi\u1eefa PV v\u00e0 c\u00e1c tay s\u00fang'}],
      [{en:'Attack from the right',vi:'T\u1ea5n c\u00f4ng t\u1eeb ph\u1ea3i'},{en:'the same tactic on the right side',vi:'chi\u1ebfn thu\u1eadt t\u01b0\u01a1ng t\u1ef1 \u1edf b\u00ean ph\u1ea3i'}],
      [{en:'Attack from the front',vi:'T\u1ea5n c\u00f4ng t\u1eeb ph\u00eda tr\u01b0\u1edbc'},{en:'the PET overtakes the PV and stops its progression; both then move backwards, the PV always protected',vi:'PET v\u01b0\u1ee3t l\u00ean PV v\u00e0 d\u1eebng b\u01b0\u1edbc ti\u1ebfn; sau \u0111\u00f3 c\u1ea3 hai l\u00f9i l\u1ea1i, PV lu\u00f4n \u0111\u01b0\u1ee3c b\u1ea3o v\u1ec7'}],
      [{en:'Attack from the rear',vi:'T\u1ea5n c\u00f4ng t\u1eeb ph\u00eda sau'},{en:'the PET is already in position, keeps moving forward and accelerates under self-defence principles',vi:'PET v\u1ed1n \u0111\u00e3 \u1edf v\u1ecb tr\u00ed, ti\u1ebfp t\u1ee5c ti\u1ebfn l\u00ean v\u00e0 t\u0103ng t\u1ed1c theo nguy\u00ean t\u1eafc t\u1ef1 v\u1ec7'}],
      [{en:'Roadblocks',vi:'Ch\u1ed1t ch\u1eb7n \u0111\u01b0\u1eddng'},{en:'make a U-turn when feasible; otherwise use the PET or PC as a hammer to remove objects and keep the convoy moving',vi:'quay \u0111\u1ea7u xe khi kh\u1ea3 thi; n\u1ebfu kh\u00f4ng d\u00f9ng PET ho\u1eb7c PC l\u00e0m b\u00faa \u0111\u1ec3 d\u1ecdn v\u1eadt c\u1ea3n v\u00e0 gi\u1eef \u0111o\u00e0n di chuy\u1ec3n'}]
     ],
     st:[
      {en:'In a contact, the BG gets into the back seat with the Principal and gives cover',vi:'Khi ti\u1ebfp x\u00fac, BG v\u00e0o gh\u1ebf sau c\u00f9ng Principal v\u00e0 y\u1ec3m tr\u1ee3'},
      {en:'If possible, the operators in the PET vehicle engage the threat',vi:'N\u1ebfu c\u00f3 th\u1ec3, c\u00e1c s\u0129 quan trong xe PET giao chi\u1ebfn v\u1edbi m\u1ed1i \u0111e d\u1ecda'},
      {en:'At all times during a fire fight, be careful not to muzzle each other',vi:'M\u1ecdi l\u00fac khi \u0111\u1ea5u s\u00fang, c\u1ea9n th\u1eadn kh\u00f4ng \u0111\u1ec3 n\u00f2ng s\u00fang ch\u1ec9 v\u00e0o nhau'},
      {en:'If an attacker halts the convoy, skirt the obstruction where possible; ramming is a further option if justified',vi:'N\u1ebfu k\u1ebb t\u1ea5n c\u00f4ng ch\u1eb7n \u0111o\u00e0n, v\u00f2ng tr\u00e1nh v\u1eadt c\u1ea3n khi c\u00f3 th\u1ec3; h\u00fac xe l\u00e0 m\u1ed9t l\u1ef1a ch\u1ecdn n\u1eefa n\u1ebfu c\u00f3 th\u1ec3 bi\u1ec7n minh'},
      {en:'The Protectee Vehicle should not engage in ramming unless completely unavoidable',vi:'Xe Protectee kh\u00f4ng n\u00ean h\u00fac xe tr\u1eeb khi ho\u00e0n to\u00e0n kh\u00f4ng th\u1ec3 tr\u00e1nh \u0111\u01b0\u1ee3c'},
      {en:'Where definitive care is further than 60 minutes away, medical assets should be assigned or staged along the route',vi:'N\u01a1i ch\u0103m s\u00f3c chuy\u00ean s\u00e2u c\u00e1ch xa h\u01a1n 60 ph\u00fat, c\u1ea7n b\u1ed1 tr\u00ed y t\u1ebf \u0111i c\u00f9ng ho\u1eb7c ch\u1ed1t d\u1ecdc tuy\u1ebfn'}
     ]},
    {t:{en:'Static Protection - Planning',vi:'B\u1ea3o v\u1ec7 T\u0129nh - L\u1eadp k\u1ebf ho\u1ea1ch'},
     d:{en:'Static protection applies counter-measures at, outside or within perimeters. It relies on information gathering, liaison and reconnaissance.',
        vi:'B\u1ea3o v\u1ec7 t\u0129nh \u00e1p d\u1ee5ng c\u00e1c bi\u1ec7n ph\u00e1p \u0111\u1ed1i ph\u00f3 t\u1ea1i, b\u00ean ngo\u00e0i ho\u1eb7c trong c\u00e1c v\u00f2ng b\u1ea3o v\u1ec7. N\u00f3 d\u1ef1a tr\u00ean thu th\u1eadp th\u00f4ng tin, li\u00ean l\u1ea1c v\u00e0 trinh s\u00e1t.'},
     st:[
      {en:'Information gathering: the foundation of the risk management process, based mainly on liaison and reconnaissance',vi:'Thu th\u1eadp th\u00f4ng tin: n\u1ec1n t\u1ea3ng c\u1ee7a quy tr\u00ecnh qu\u1ea3n l\u00fd r\u1ee7i ro, ch\u1ee7 y\u1ebfu d\u1ef1a tr\u00ean li\u00ean l\u1ea1c v\u00e0 trinh s\u00e1t'},
      {en:'Liaison: operations are conducted in partnership with other organisations and groups; ongoing, not one-time',vi:'Li\u00ean l\u1ea1c: c\u00e1c ho\u1ea1t \u0111\u1ed9ng \u0111\u01b0\u1ee3c ti\u1ebfn h\u00e0nh h\u1ee3p t\u00e1c v\u1edbi c\u00e1c t\u1ed5 ch\u1ee9c v\u00e0 nh\u00f3m kh\u00e1c; li\u00ean t\u1ee5c, kh\u00f4ng ph\u1ea3i m\u1ed9t l\u1ea7n'},
      {en:'Reconnaissance: gain a thorough tactical appreciation of the area, its inherent strengths and vulnerabilities',vi:'Trinh s\u00e1t: n\u1eafm \u0111\u01b0\u1ee3c s\u1ef1 \u0111\u00e1nh gi\u00e1 chi\u1ebfn thu\u1eadt th\u1ea5u \u0111\u00e1o v\u1ec1 khu v\u1ef1c, nh\u1eefng \u0111i\u1ec3m m\u1ea1nh v\u00e0 \u0111i\u1ec3m y\u1ebfu v\u1ed1n c\u00f3'},
      {en:'Carry out hostile surveillance detection during reconnaissance: it may compromise operational intent',vi:'Th\u1ef1c hi\u1ec7n ph\u00e1t hi\u1ec7n gi\u00e1m s\u00e1t th\u00f9 \u0111\u1ecbch khi trinh s\u00e1t: n\u00f3 c\u00f3 th\u1ec3 l\u00e0m l\u1ed9 \u00fd \u0111\u1ecbnh t\u00e1c chi\u1ebfn'},
      {en:'Reconnaissance should be done on the same day of the week and time of day as the proposed event',vi:'Trinh s\u00e1t n\u00ean \u0111\u01b0\u1ee3c th\u1ef1c hi\u1ec7n \u0111\u00fang ng\u00e0y trong tu\u1ea7n v\u00e0 gi\u1edd trong ng\u00e0y nh\u01b0 s\u1ef1 ki\u1ec7n d\u1ef1 ki\u1ebfn'},
      {en:'Use digital or video cameras and aerial photographs, particularly in high risk locations',vi:'S\u1eed d\u1ee5ng m\u00e1y \u1ea3nh k\u1ef9 thu\u1eadt s\u1ed1 ho\u1eb7c camera v\u00e0 \u1ea3nh tr\u00ean kh\u00f4ng, \u0111\u1eb7c bi\u1ec7t \u1edf c\u00e1c \u0111\u1ecba \u0111i\u1ec3m r\u1ee7i ro cao'}
     ]},
    {t:{en:'Static Protection - Defense in Depth',vi:'B\u1ea3o v\u1ec7 T\u0129nh - Ph\u00f2ng th\u1ee7 theo Chi\u1ec1u s\u00e2u'},
     d:{en:'Defence in depth presents an attacker with a series of perimeters, each increasing the risk of detection, delay or defeat.',
        vi:'Ph\u00f2ng th\u1ee7 theo chi\u1ec1u s\u00e2u khi\u1ebfn k\u1ebb t\u1ea5n c\u00f4ng ph\u1ea3i \u0111\u1ed1i m\u1eb7t v\u1edbi m\u1ed9t chu\u1ed7i c\u00e1c v\u00f2ng b\u1ea3o v\u1ec7, m\u1ed7i v\u00f2ng l\u00e0m t\u0103ng nguy c\u01a1 b\u1ecb ph\u00e1t hi\u1ec7n, b\u1ecb tr\u00ec ho\u00e3n ho\u1eb7c b\u1ecb \u0111\u00e1nh b\u1ea1i.'},
     st:[
      {en:'A perimeter is any measure that deters, detects, delays or defeats an attacker',vi:'V\u00f2ng b\u1ea3o v\u1ec7 l\u00e0 b\u1ea5t k\u1ef3 bi\u1ec7n ph\u00e1p n\u00e0o ng\u0103n ch\u1eb7n, ph\u00e1t hi\u1ec7n, tr\u00ec ho\u00e3n ho\u1eb7c \u0111\u00e1nh b\u1ea1i k\u1ebb t\u1ea5n c\u00f4ng'},
      {en:'Outer perimeter: deter and detect at distance: armed security, vehicle screening, patrols, monitoring weapons launch sites, VBIED searches, host country traffic points',vi:'V\u00f2ng ngo\u00e0i: ng\u0103n ch\u1eb7n v\u00e0 ph\u00e1t hi\u1ec7n t\u1eeb xa: an ninh v\u0169 trang, s\u00e0ng l\u1ecdc xe, tu\u1ea7n tra, theo d\u00f5i c\u00e1c \u0111i\u1ec3m ph\u00f3ng v\u0169 kh\u00ed, t\u00ecm ki\u1ebfm VBIED, c\u00e1c ch\u1ed1t giao th\u00f4ng c\u1ee7a n\u01b0\u1edbc s\u1edf t\u1ea1i'},
      {en:'Intermediate perimeter: deter, detect and delay: signs, exclusion of unconnected vehicles, demarcation line',vi:'V\u00f2ng trung gian: ng\u0103n ch\u1eb7n, ph\u00e1t hi\u1ec7n v\u00e0 tr\u00ec ho\u00e3n: bi\u1ec3n b\u00e1o, lo\u1ea1i c\u00e1c xe kh\u00f4ng li\u00ean quan, \u0111\u01b0\u1eddng ph\u00e2n gi\u1edbi'},
      {en:'Inner perimeter: the last physical impediment: search then keep the area sterile',vi:'V\u00f2ng trong: r\u00e0o c\u1ea3n v\u1eadt l\u00fd cu\u1ed1i c\u00f9ng: kh\u00e1m x\u00e9t r\u1ed3i gi\u1eef khu v\u1ef1c s\u1ea1ch'},
      {en:'Inner perimeter tasks: take control, escort the Protectee, secure escape routes, place covert personnel, set up a safe haven or holding room',vi:'Nhi\u1ec7m v\u1ee5 v\u00f2ng trong: ki\u1ec3m so\u00e1t, h\u1ed9 t\u1ed1ng Protectee, b\u1ea3o v\u1ec7 c\u00e1c tuy\u1ebfn tho\u00e1t, b\u1ed1 tr\u00ed nh\u00e2n s\u1ef1 b\u00ed m\u1eadt, thi\u1ebft l\u1eadp n\u01a1i an to\u00e0n ho\u1eb7c ph\u00f2ng gi\u1eef'}
     ]},
    {t:{en:'Static Protection - Venue Search',vi:'B\u1ea3o v\u1ec7 T\u0129nh - Kh\u00e1m x\u00e9t \u0110\u1ecba \u0111i\u1ec3m'},
     d:{en:'The overall security of the operation depends on how well the advance team searches the venue. Allow enough time for a thorough, unrushed search with the consent of the owner.',
        vi:'An ninh t\u1ed5ng th\u1ec3 c\u1ee7a chi\u1ebfn d\u1ecbch ph\u1ee5 thu\u1ed9c v\u00e0o ch\u1ea5t l\u01b0\u1ee3ng kh\u00e1m x\u00e9t \u0111\u1ecba \u0111i\u1ec3m c\u1ee7a \u0111\u1ed9i ti\u1ec1n tr\u1ea1m. D\u00e0nh \u0111\u1ee7 th\u1eddi gian cho m\u1ed9t cu\u1ed9c kh\u00e1m x\u00e9t k\u1ef9 l\u01b0\u1ee1ng, kh\u00f4ng v\u1ed9i v\u00e0ng v\u1edbi s\u1ef1 \u0111\u1ed3ng \u00fd c\u1ee7a ch\u1ee7 s\u1edf h\u1eefu.'},
     st:[
      {en:'Know what you are searching for: locate and recognize anything that may pose a threat to the Protectee',vi:'Bi\u1ebft r\u00f5 b\u1ea1n \u0111ang t\u00ecm g\u00ec: x\u00e1c \u0111\u1ecbnh v\u00e0 nh\u1eadn di\u1ec7n b\u1ea5t c\u1ee9 th\u1ee9 g\u00ec c\u00f3 th\u1ec3 \u0111e d\u1ecda \u0111\u1ebfn Protectee'},
      {en:'Once searched, the area must be secured',vi:'Sau khi kh\u00e1m x\u00e9t, khu v\u1ef1c ph\u1ea3i \u0111\u01b0\u1ee3c b\u1ea3o v\u1ec7'},
      {en:'Search from outside to the inside',vi:'Kh\u00e1m x\u00e9t t\u1eeb ngo\u00e0i v\u00e0o trong'},
      {en:'Search from the bottom to the top',vi:'Kh\u00e1m x\u00e9t t\u1eeb d\u01b0\u1edbi l\u00ean tr\u00ean'},
      {en:'Investigate all possible hiding places and articles',vi:'Ki\u1ec3m tra m\u1ecdi n\u01a1i v\u00e0 v\u1eadt c\u00f3 th\u1ec3 \u1ea9n n\u1ea5p'},
      {en:'Divide the room in levels and by area of responsibility',vi:'Chia ph\u00f2ng theo c\u00e1c t\u1ea7ng v\u00e0 theo khu v\u1ef1c tr\u00e1ch nhi\u1ec7m'}
     ]}
  ],

  // ==== 025-025 Checkpoints (chk) ====
  chk:[
    {t:{en:'Background & Aim',vi:'B\u1ed1i c\u1ea3nh & M\u1ee5c \u0111\u00edch'},
     d:{en:'FPU members are likely to carry out checkpoints in both executive and non-executive missions - in the former as part of general duties maintaining the peace, and in the latter protecting UN Staff and facilities where checkpoints sit at the entrance to UN buildings to control access. There are fixed and temporary types, capable of dealing with pedestrians, vehicles or both.',vi:'Th\u00e0nh vi\u00ean FPU th\u01b0\u1eddng ph\u1ea3i th\u1ef1c hi\u1ec7n ch\u1ed1t ki\u1ec3m so\u00e1t trong c\u1ea3 nhi\u1ec7m v\u1ee5 th\u1ef1c thi v\u00e0 kh\u00f4ng th\u1ef1c thi - trong nhi\u1ec7m v\u1ee5 th\u1ef1c thi nh\u01b0 m\u1ed9t ph\u1ea7n nhi\u1ec7m v\u1ee5 chung gi\u1eef g\u00ecn h\u00f2a b\u00ecnh, v\u00e0 trong nhi\u1ec7m v\u1ee5 kh\u00f4ng th\u1ef1c thi \u0111\u1ec3 b\u1ea3o v\u1ec7 nh\u00e2n vi\u00ean v\u00e0 c\u01a1 s\u1edf LHQ, n\u01a1i ch\u1ed1t ki\u1ec3m so\u00e1t \u0111\u01b0\u1ee3c \u0111\u1eb7t \u1edf l\u1ed1i v\u00e0o c\u00e1c t\u00f2a nh\u00e0 LHQ \u0111\u1ec3 ki\u1ec3m so\u00e1t l\u01b0u th\u00f4ng. C\u00f3 lo\u1ea1i c\u1ed1 \u0111\u1ecbnh v\u00e0 t\u1ea1m th\u1eddi, x\u1eed l\u00fd ng\u01b0\u1eddi \u0111i b\u1ed9, ph\u01b0\u01a1ng ti\u1ec7n ho\u1eb7c c\u1ea3 hai.'},
     st:[
      {en:'Explain the goal of a checkpoint',vi:'Gi\u1ea3i th\u00edch m\u1ee5c \u0111\u00edch c\u1ee7a ch\u1ed1t ki\u1ec3m so\u00e1t'},
      {en:'Identify tactical considerations',vi:'X\u00e1c \u0111\u1ecbnh c\u00e1c c\u00e2n nh\u1eafc chi\u1ebfn thu\u1eadt'},
      {en:'Describe the different zones of a checkpoint',vi:'M\u00f4 t\u1ea3 c\u00e1c khu v\u1ef1c kh\u00e1c nhau c\u1ee7a ch\u1ed1t ki\u1ec3m so\u00e1t'},
      {en:'Conduct vehicle and pedestrian checkpoints',vi:'Th\u1ef1c hi\u1ec7n ch\u1ed1t ki\u1ec3m so\u00e1t ph\u01b0\u01a1ng ti\u1ec7n v\u00e0 ng\u01b0\u1eddi \u0111i b\u1ed9'},
      {en:'React to incidents at checkpoints',vi:'\u1ee8ng ph\u00f3 v\u1edbi c\u00e1c s\u1ef1 c\u1ed1 t\u1ea1i ch\u1ed1t ki\u1ec3m so\u00e1t'}
     ]},
    {t:{en:'Definition & Objectives',vi:'\u0110\u1ecbnh ngh\u0129a & M\u1ee5c ti\u00eau'},fc:true,
     d:{en:'A checkpoint is a military and police tactic involving the set up of a hasty roadblock to disrupt unauthorized or unwanted movement of vehicles and pedestrians. It aims to monitor and control the movement of people and materials in order to prevent violence or attack, or investigate and identify offenders.',vi:'Ch\u1ed1t ki\u1ec3m so\u00e1t l\u00e0 m\u1ed9t chi\u1ebfn thu\u1eadt qu\u00e2n s\u1ef1 v\u00e0 c\u1ea3nh s\u00e1t bao g\u1ed3m vi\u1ec7c thi\u1ebft l\u1eadp m\u1ed9t ch\u1ed1t ch\u1eb7n nhanh nh\u1eb1m ng\u0103n ch\u1eb7n s\u1ef1 di chuy\u1ec3n kh\u00f4ng \u0111\u01b0\u1ee3c ph\u00e9p ho\u1eb7c kh\u00f4ng mong mu\u1ed1n c\u1ee7a ph\u01b0\u01a1ng ti\u1ec7n v\u00e0 ng\u01b0\u1eddi \u0111i b\u1ed9. M\u1ee5c ti\u00eau l\u00e0 gi\u00e1m s\u00e1t v\u00e0 ki\u1ec3m so\u00e1t s\u1ef1 di chuy\u1ec3n c\u1ee7a ng\u01b0\u1eddi v\u00e0 v\u1eadt ch\u1ea5t \u0111\u1ec3 ng\u0103n ch\u1eb7n b\u1ea1o l\u1ef1c ho\u1eb7c t\u1ea5n c\u00f4ng, ho\u1eb7c \u0111i\u1ec1u tra v\u00e0 x\u00e1c \u0111\u1ecbnh th\u1ee7 ph\u1ea1m.'},
     st:[
      {en:'Stop vehicles and/or persons; verify identities; search possessions; decide to detain or allow to pass',vi:'D\u1eebng ph\u01b0\u01a1ng ti\u1ec7n v\u00e0/ho\u1eb7c ng\u01b0\u1eddi; x\u00e1c minh danh t\u00ednh; kh\u00e1m x\u00e9t \u0111\u1ed3 v\u1eadt; quy\u1ebft \u0111\u1ecbnh t\u1ea1m gi\u1eef ho\u1eb7c cho ph\u00e9p \u0111i qua'},
      {en:'Control an area and allow a "safe area" protected from outside influence',vi:'Ki\u1ec3m so\u00e1t m\u1ed9t khu v\u1ef1c v\u00e0 t\u1ea1o ra "khu v\u1ef1c an to\u00e0n" tr\u00e1nh kh\u1ecfi t\u00e1c \u0111\u1ed9ng b\u00ean ngo\u00e0i'},
      {en:'Deny hostile intelligence gathering opportunities',vi:'Ng\u0103n ch\u1eb7n c\u01a1 h\u1ed9i thu th\u1eadp tin t\u1ee9c t\u00ecnh b\u00e1o c\u1ee7a \u0111\u1ed1i ph\u01b0\u01a1ng'},
      {en:'Be effective they must not be able to be bypassed',vi:'\u0110\u1ec3 hi\u1ec7u qu\u1ea3, ch\u1ed1t ph\u1ea3i kh\u00f4ng th\u1ec3 b\u1ecb v\u00f2ng qua'},
      {en:'In UN missions usually at the entrance to major UN facilities, for both pedestrians and vehicles',vi:'Trong c\u00e1c ph\u00e1i b\u1ed9 LHQ th\u01b0\u1eddng \u0111\u1eb7t \u1edf l\u1ed1i v\u00e0o c\u00e1c c\u01a1 s\u1edf ch\u00ednh c\u1ee7a LHQ, cho c\u1ea3 ng\u01b0\u1eddi \u0111i b\u1ed9 v\u00e0 ph\u01b0\u01a1ng ti\u1ec7n'}
     ]},
    {t:{en:'Tactical Considerations',vi:'C\u00e2n nh\u1eafc Chi\u1ebfn thu\u1eadt'},fc:true,
     d:{en:'When considering a checkpoint the Commander must weigh factors affecting the layout and whether the location is suitable: legal basis, mission, environment/terrain, intelligence, strength and resources, duration, and advantages/disadvantages. It must be set within the mandate or local laws.',vi:'Khi xem x\u00e9t ch\u1ed1t ki\u1ec3m so\u00e1t, Ch\u1ec9 huy ph\u1ea3i c\u00e2n nh\u1eafc c\u00e1c y\u1ebfu t\u1ed1 \u1ea3nh h\u01b0\u1edfng \u0111\u1ebfn b\u1ed1 tr\u00ed v\u00e0 li\u1ec7u v\u1ecb tr\u00ed c\u00f3 ph\u00f9 h\u1ee3p: c\u01a1 s\u1edf ph\u00e1p l\u00fd, nhi\u1ec7m v\u1ee5, m\u00f4i tr\u01b0\u1eddng/\u0111\u1ecba h\u00ecnh, t\u00ecnh b\u00e1o, l\u1ef1c l\u01b0\u1ee3ng v\u00e0 trang b\u1ecb, th\u1eddi gian, v\u00e0 l\u1ee3i th\u1ebf/b\u1ea5t l\u1ee3i. Ch\u1ed1t ph\u1ea3i \u0111\u01b0\u1ee3c thi\u1ebft l\u1eadp trong khu\u00f4n kh\u1ed5 \u1ee7y quy\u1ec1n ho\u1eb7c lu\u1eadt ph\u00e1p \u0111\u1ecba ph\u01b0\u01a1ng.'},
     tbl:[
      [{en:'Legal basis',vi:'C\u01a1 s\u1edf ph\u00e1p l\u00fd'},{en:'set up upon UN initiative for UN base access, or within mandate/local laws',vi:'thi\u1ebft l\u1eadp theo s\u00e1ng ki\u1ebfn LHQ \u0111\u1ec3 b\u1ea3o v\u1ec7 l\u1ed1i v\u00e0o c\u0103n c\u1ee9 LHQ, ho\u1eb7c trong khu\u00f4n kh\u1ed5 \u1ee7y quy\u1ec1n/lu\u1eadt \u0111\u1ecba ph\u01b0\u01a1ng'}],
      [{en:'Mission',vi:'Nhi\u1ec7m v\u1ee5'},{en:'pedestrians or vehicles or both; UN initiative or support/tasked',vi:'ng\u01b0\u1eddi \u0111i b\u1ed9 ho\u1eb7c ph\u01b0\u01a1ng ti\u1ec7n ho\u1eb7c c\u1ea3 hai; s\u00e1ng ki\u1ebfn LHQ ho\u1eb7c h\u1ed7 tr\u1ee3/\u0111\u01b0\u1ee3c giao nhi\u1ec7m v\u1ee5'}],
      [{en:'Environment / terrain',vi:'M\u00f4i tr\u01b0\u1eddng / \u0111\u1ecba h\u00ecnh'},{en:'location, weather conditions; uphill approach, crossroads, one-way street',vi:'v\u1ecb tr\u00ed, \u0111i\u1ec1u ki\u1ec7n th\u1eddi ti\u1ebft; h\u01b0\u1edbng ti\u1ebfp c\u1eadn d\u1ed1c, ng\u00e3 t\u01b0, \u0111\u01b0\u1eddng m\u1ed9t chi\u1ec1u'}],
      [{en:'Intelligence',vi:'T\u00ecnh b\u00e1o'},{en:'photos, guidance, daily register from JMAC; computer database access',vi:'\u1ea3nh, ch\u1ec9 d\u1eabn, s\u1ed5 \u0111\u0103ng k\u00fd h\u00e0ng ng\u00e0y t\u1eeb JMAC; truy c\u1eadp c\u01a1 s\u1edf d\u1eef li\u1ec7u m\u00e1y t\u00ednh'}],
      [{en:'Strength & resources',vi:'L\u1ef1c l\u01b0\u1ee3ng & trang b\u1ecb'},{en:'crew served weapons and snipers oversee the CP; security patrols in the locality',vi:'v\u0169 kh\u00ed t\u1ef1 \u0111\u1ed9ng v\u00e0 s\u00fang b\u1eafn t\u1ec9a gi\u00e1m s\u00e1t ch\u1ed1t; tu\u1ea7n tra an ninh khu v\u1ef1c l\u00e2n c\u1eadn'}],
      [{en:'Duration',vi:'Th\u1eddi gian'},{en:'immediate or short term',vi:'ngay l\u1eadp t\u1ee9c ho\u1eb7c ng\u1eafn h\u1ea1n'}],
      [{en:'Advantages / disadvantages',vi:'L\u1ee3i th\u1ebf / b\u1ea5t l\u1ee3i'},{en:'show of force, gauges population attitude, gathers intelligence; resource intensive, unpopular, vulnerable to attack',vi:'th\u1ec3 hi\u1ec7n s\u1ee9c m\u1ea1nh, \u0111\u00e1nh gi\u00e1 th\u00e1i \u0111\u1ed9 d\u00e2n ch\u00fang, thu th\u1eadp t\u00ecnh b\u00e1o; t\u1ed1n nhi\u1ec1u ngu\u1ed3n l\u1ef1c, kh\u00f4ng \u0111\u01b0\u1ee3c l\u00f2ng d\u00e2n, d\u1ec5 b\u1ecb t\u1ea5n c\u00f4ng'}]
     ]},
    {t:{en:'Mobile Checkpoint',vi:'Ch\u1ed1t Ki\u1ec3m so\u00e1t Di \u0111\u1ed9ng'},fc:true,
     d:{en:'A mobile checkpoint responds to an immediate operational need and can be removed immediately after the operation without impact on security of the area. It is normally set up as a result of intelligence that an activity will happen at a certain point and time, or to reassure the population in insecure areas.',vi:'Ch\u1ed1t ki\u1ec3m so\u00e1t di \u0111\u1ed9ng \u0111\u00e1p \u1ee9ng nhu c\u1ea7u t\u00e1c chi\u1ebfn t\u1ee9c th\u1eddi v\u00e0 c\u00f3 th\u1ec3 \u0111\u01b0\u1ee3c d\u1ee1 b\u1ecf ngay sau khi ho\u1ea1t \u0111\u1ed9ng k\u1ebft th\u00fac m\u00e0 kh\u00f4ng \u1ea3nh h\u01b0\u1edfng \u0111\u1ebfn an ninh khu v\u1ef1c. Ch\u1ed1t th\u01b0\u1eddng \u0111\u01b0\u1ee3c thi\u1ebft l\u1eadp d\u1ef1a tr\u00ean tin t\u1ee9c t\u00ecnh b\u00e1o r\u1eb1ng m\u1ed9t ho\u1ea1t \u0111\u1ed9ng s\u1ebd x\u1ea3y ra t\u1ea1i m\u1ed9t \u0111i\u1ec3m v\u00e0 th\u1eddi \u0111i\u1ec3m nh\u1ea5t \u0111\u1ecbnh, ho\u1eb7c \u0111\u1ec3 tr\u1ea5n an ng\u01b0\u1eddi d\u00e2n \u1edf khu v\u1ef1c m\u1ea5t an to\u00e0n.'},
     st:[
      {en:'Information gathering drives the decision to set up',vi:'Thu th\u1eadp th\u00f4ng tin th\u00fac \u0111\u1ea9y quy\u1ebft \u0111\u1ecbnh thi\u1ebft l\u1eadp'},
      {en:'Mission: coordinated or UN; tasked by Chain of Command and pre-planned during the order',vi:'Nhi\u1ec7m v\u1ee5: ph\u1ed1i h\u1ee3p ho\u1eb7c LHQ; \u0111\u01b0\u1ee3c giao b\u1edfi chu\u1ed7i ch\u1ec9 huy v\u00e0 l\u1eadp k\u1ebf ho\u1ea1ch tr\u01b0\u1edbc trong l\u1ec7nh'},
      {en:'Duration: immediate (after a robbery) or short term (combat crime, collect intelligence)',vi:'Th\u1eddi gian: t\u1ee9c th\u1eddi (sau v\u1ee5 c\u01b0\u1edbp) ho\u1eb7c ng\u1eafn h\u1ea1n (ch\u1ed1ng t\u1ed9i ph\u1ea1m, thu th\u1eadp t\u00ecnh b\u00e1o)'},
      {en:'Location: ensure security of personnel and control of the whole sector; narrow streets funnel people/vehicles; cannot be easily escaped',vi:'V\u1ecb tr\u00ed: \u0111\u1ea3m b\u1ea3o an to\u00e0n nh\u00e2n s\u1ef1 v\u00e0 ki\u1ec3m so\u00e1t to\u00e0n b\u1ed9 khu v\u1ef1c; \u0111\u01b0\u1eddng h\u1eb9p d\u1eabn ng\u01b0\u1eddi/ph\u01b0\u01a1ng ti\u1ec7n v\u00e0o; kh\u00f3 tho\u00e1t'},
      {en:'Separate areas of control, search and retention for vehicles and pedestrians',vi:'Khu v\u1ef1c ki\u1ec3m so\u00e1t, kh\u00e1m x\u00e9t v\u00e0 gi\u1eef t\u00e1ch bi\u1ec7t cho ph\u01b0\u01a1ng ti\u1ec7n v\u00e0 ng\u01b0\u1eddi \u0111i b\u1ed9'},
      {en:'Initiative: Chief of patrol can establish one to prevent delinquency; initiative CPs last no longer than 30 minutes',vi:'S\u00e1ng ki\u1ebfn: Tr\u01b0\u1edfng tu\u1ea7n tra c\u00f3 th\u1ec3 thi\u1ebft l\u1eadp \u0111\u1ec3 ph\u00f2ng ch\u1ed1ng t\u1ed9i ph\u1ea1m; ch\u1ed1t theo s\u00e1ng ki\u1ebfn kh\u00f4ng qu\u00e1 30 ph\u00fat'}
     ]},
    {t:{en:'Pedestrian Checkpoint',vi:'Ch\u1ed1t Ki\u1ec3m so\u00e1t Ng\u01b0\u1eddi \u0111i b\u1ed9'},fc:true,
     d:{en:'Pedestrian checkpoints are a good way to control movement, gather intelligence and deter criminal or terrorist behaviour. Principles are similar to a vehicle checkpoint (VCP). Where on a road and combined with a VCP, separate pedestrians from vehicles with barriers to ensure safety.',vi:'Ch\u1ed1t ki\u1ec3m so\u00e1t ng\u01b0\u1eddi \u0111i b\u1ed9 l\u00e0 c\u00e1ch t\u1ed1t \u0111\u1ec3 ki\u1ec3m so\u00e1t s\u1ef1 di chuy\u1ec3n, thu th\u1eadp tin t\u1ee9c v\u00e0 r\u0103n \u0111e h\u00e0nh vi t\u1ed9i ph\u1ea1m ho\u1eb7c kh\u1ee7ng b\u1ed1. Nguy\u00ean t\u1eafc t\u01b0\u01a1ng t\u1ef1 ch\u1ed1t ph\u01b0\u01a1ng ti\u1ec7n (VCP). Khi tr\u00ean \u0111\u01b0\u1eddng v\u00e0 k\u1ebft h\u1ee3p v\u1edbi VCP, ph\u1ea3i t\u00e1ch ng\u01b0\u1eddi \u0111i b\u1ed9 kh\u1ecfi ph\u01b0\u01a1ng ti\u1ec7n b\u1eb1ng r\u00e0o ch\u1eafn \u0111\u1ec3 \u0111\u1ea3m b\u1ea3o an to\u00e0n.'},
     st:[
      {en:'Use barriers to regulate flow; separate inspection lines from vehicles',vi:'D\u00f9ng r\u00e0o ch\u1eafn \u0111i\u1ec1u ti\u1ebft d\u00f2ng ng\u01b0\u1eddi; t\u00e1ch v\u1ea1ch ki\u1ec3m tra kh\u1ecfi ph\u01b0\u01a1ng ti\u1ec7n'},
      {en:'Keep numbers in line to a minimum; establish more than one inspection line for heavy traffic',vi:'H\u1ea1n ch\u1ebf s\u1ed1 ng\u01b0\u1eddi trong h\u00e0ng; thi\u1ebft l\u1eadp nhi\u1ec1u v\u1ea1ch ki\u1ec3m tra khi \u0111\u00f4ng ng\u01b0\u1eddi'},
      {en:'Sign or communicate the type of documentation needed to pass',vi:'Ni\u00eam y\u1ebft ho\u1eb7c th\u00f4ng b\u00e1o lo\u1ea1i gi\u1ea5y t\u1edd c\u1ea7n thi\u1ebft \u0111\u1ec3 \u0111i qua'},
      {en:'Partitioned or isolated areas for detailed personnel searches; nominate male & female search teams',vi:'Khu v\u1ef1c t\u00e1ch bi\u1ec7t cho kh\u00e1m x\u00e9t chi ti\u1ebft; ch\u1ec9 \u0111\u1ecbnh \u0111\u1ed9i kh\u00e1m x\u00e9t nam & n\u1eef'},
      {en:'Search methodically and with high vigilance - dissuasion search or detailed search in a dedicated room',vi:'Kh\u00e1m x\u00e9t c\u00f3 ph\u01b0\u01a1ng ph\u00e1p v\u00e0 c\u1ea3nh gi\u00e1c cao - kh\u00e1m ng\u0103n ch\u1eb7n ho\u1eb7c kh\u00e1m chi ti\u1ebft trong ph\u00f2ng ri\u00eang'},
      {en:'Special equipment: metal detectors, arches, flexi cuffs, gloves; organise a reserve party',vi:'Trang b\u1ecb \u0111\u1eb7c bi\u1ec7t: m\u00e1y d\u00f2 kim lo\u1ea1i, c\u1ed5ng d\u00f2, c\u00f2ng nh\u1ef1a, g\u0103ng tay; t\u1ed5 ch\u1ee9c l\u1ef1c l\u01b0\u1ee3ng d\u1ef1 b\u1ecb'}
     ]},
    {t:{en:'Vehicle Checkpoint (VCP)',vi:'Ch\u1ed1t Ki\u1ec3m so\u00e1t Ph\u01b0\u01a1ng ti\u1ec7n (VCP)'},fc:true,
     d:{en:'Particularly in a hostile area, security of the checkpoint is critical. Cut off and security teams are positioned covertly; the unit ensures all-round security at all times and conducts isolation and security patrols. Vehicle inspection lines must be separated from pedestrians.',vi:'\u0110\u1eb7c bi\u1ec7t \u1edf khu v\u1ef1c th\u00f9 \u0111\u1ecbch, an ninh c\u1ee7a ch\u1ed1t l\u00e0 y\u1ebfu t\u1ed1 quan tr\u1ecdng. \u0110\u1ed9i ch\u1eb7n v\u00e0 \u0111\u1ed9i an ninh \u0111\u01b0\u1ee3c b\u1ed1 tr\u00ed k\u00edn \u0111\u00e1o; \u0111\u01a1n v\u1ecb lu\u00f4n \u0111\u1ea3m b\u1ea3o an ninh to\u00e0n di\u1ec7n v\u00e0 th\u1ef1c hi\u1ec7n tu\u1ea7n tra c\u00f4 l\u1eadp, an ninh. V\u1ea1ch ki\u1ec3m tra ph\u01b0\u01a1ng ti\u1ec7n ph\u1ea3i t\u00e1ch kh\u1ecfi ng\u01b0\u1eddi \u0111i b\u1ed9.'},
     st:[
      {en:'Set up so approaching vehicles cannot see the CP until they pass the cut off teams',vi:'B\u1ed1 tr\u00ed sao cho ph\u01b0\u01a1ng ti\u1ec7n ti\u1ebfp c\u1eadn kh\u00f4ng nh\u00ecn th\u1ea5y ch\u1ed1t cho \u0111\u1ebfn khi qua \u0111\u1ed9i ch\u1eb7n'},
      {en:'Obstacles or parked vehicles funnel and slow down approaching vehicles',vi:'V\u1eadt c\u1ea3n ho\u1eb7c xe \u0111\u1ed7 d\u1eabn v\u00e0 l\u00e0m ch\u1eadm ph\u01b0\u01a1ng ti\u1ec7n ti\u1ebfp c\u1eadn'},
      {en:'Section leader questions drivers, accompanied by a Buddy Team (male & female) doing the searching',vi:'Ti\u1ec3u \u0111\u1ed9i tr\u01b0\u1edfng h\u1ecfi t\u00e0i x\u1ebf, k\u00e8m theo \u0110\u1ed9i b\u1ea1n (nam & n\u1eef) th\u1ef1c hi\u1ec7n kh\u00e1m x\u00e9t'},
      {en:'Vehicle occupants exit and are also searched; search teams stay professional, avoid escalating the situation',vi:'Ng\u01b0\u1eddi tr\u00ean xe xu\u1ed1ng xe v\u00e0 \u0111\u01b0\u1ee3c kh\u00e1m x\u00e9t; \u0111\u1ed9i kh\u00e1m x\u00e9t gi\u1eef th\u00e1i \u0111\u1ed9 chuy\u00ean nghi\u1ec7p, tr\u00e1nh leo thang t\u00ecnh hu\u1ed1ng'},
      {en:'Search criteria come from Commander/HQ, normally intelligence based; selective allows greater throughput',vi:'Ti\u00eau ch\u00ed kh\u00e1m x\u00e9t \u0111\u1ebfn t\u1eeb Ch\u1ec9 huy/HQ, th\u01b0\u1eddng d\u1ef1a tr\u00ean t\u00ecnh b\u00e1o; ch\u1ed1t ch\u1ecdn l\u1ecdc cho ph\u00e9p l\u01b0u l\u01b0\u1ee3ng cao h\u01a1n'},
      {en:'Failure of a vehicle to stop triggers Use of Force, proportionate to the level of threat',vi:'Ph\u01b0\u01a1ng ti\u1ec7n kh\u00f4ng d\u1eebng s\u1ebd k\u00edch ho\u1ea1t S\u1eed d\u1ee5ng v\u0169 l\u1ef1c, t\u01b0\u01a1ng x\u1ee9ng v\u1edbi m\u1ee9c \u0111\u1ed9 \u0111e d\u1ecda'},
      {en:'Rehearsals are essential; FPU must be trained in short term/hasty CPs',vi:'Di\u1ec5n t\u1eadp l\u00e0 thi\u1ebft y\u1ebfu; FPU ph\u1ea3i \u0111\u01b0\u1ee3c hu\u1ea5n luy\u1ec7n ch\u1ed1t ng\u1eafn h\u1ea1n/ch\u1ed1t nhanh'}
     ]},
    {t:{en:'Mobile VCP - 4 Zones',vi:'Ch\u1ed1t Ph\u01b0\u01a1ng ti\u1ec7n Di \u0111\u1ed9ng - 4 Khu v\u1ef1c'},fc:true,
     d:{en:'A mobile vehicle checkpoint is organised into four zones: Funnelling, Turning/Deceleration, Search, and Safe. Obstacles funnel vehicles into one lane with no way out; barriers force deceleration; search is conducted in a secure area; the safe zone hosts the officers.',vi:'Ch\u1ed1t ph\u01b0\u01a1ng ti\u1ec7n di \u0111\u1ed9ng \u0111\u01b0\u1ee3c t\u1ed5 ch\u1ee9c th\u00e0nh b\u1ed1n khu v\u1ef1c: Khu d\u1eabn h\u01b0\u1edbng, Khu quay/gi\u1ea3m t\u1ed1c, Khu kh\u00e1m x\u00e9t, v\u00e0 Khu an to\u00e0n. V\u1eadt c\u1ea3n d\u1eabn ph\u01b0\u01a1ng ti\u1ec7n v\u00e0o m\u1ed9t l\u00e0n kh\u00f4ng l\u1ed1i tho\u00e1t; r\u00e0o ch\u1eafn bu\u1ed9c gi\u1ea3m t\u1ed1c; kh\u00e1m x\u00e9t \u0111\u01b0\u1ee3c th\u1ef1c hi\u1ec7n trong khu v\u1ef1c an to\u00e0n; khu an to\u00e0n d\u00e0nh cho s\u0129 quan.'},
     tbl:[
      [{en:'Funnelling Zone',vi:'Khu d\u1eabn h\u01b0\u1edbng'},{en:'natural/artificial obstacles funnel vehicles into one lane; signs placed forward; no way out once in',vi:'v\u1eadt c\u1ea3n t\u1ef1 nhi\u00ean/nh\u00e2n t\u1ea1o d\u1eabn ph\u01b0\u01a1ng ti\u1ec7n v\u00e0o m\u1ed9t l\u00e0n; \u0111\u1eb7t bi\u1ec3n b\u00e1o ph\u00eda tr\u01b0\u1edbc; v\u00e0o r\u1ed3i kh\u00f4ng tho\u00e1t \u0111\u01b0\u1ee3c'}],
      [{en:'Turning / Deceleration Zone',vi:'Khu quay / gi\u1ea3m t\u1ed1c'},{en:'barriers force slow hard turns; obstacles must stop a vehicle: downed trees, dragon\'s teeth, debris, rocks, concertina wire, tires, road cratering',vi:'r\u00e0o ch\u1eafn bu\u1ed9c quay ch\u1eadm kh\u00f3 kh\u0103n; v\u1eadt c\u1ea3n ph\u1ea3i ch\u1eb7n \u0111\u01b0\u1ee3c xe: c\u00e2y \u0111\u1ed5, b\u00ea t\u00f4ng ch\u1ed1ng xe, \u0111\u00e1 l\u1edbn, d\u00e2y k\u1ebdm gai, l\u1ed1p, \u0111\u00e0o h\u1ed1 \u0111\u01b0\u1eddng'}],
      [{en:'Search Zone',vi:'Khu kh\u00e1m x\u00e9t'},{en:'vehicles directed to secure area; blocking obstacle denies escape; subdivided into personnel, vehicle and reaction force zones; overwatch with crew served weapon',vi:'ph\u01b0\u01a1ng ti\u1ec7n \u0111\u01b0\u1ee3c d\u1eabn v\u00e0o khu v\u1ef1c an to\u00e0n; v\u1eadt c\u1ea3n ng\u0103n tr\u1ed1n tho\u00e1t; chia th\u00e0nh khu ng\u01b0\u1eddi, khu ph\u01b0\u01a1ng ti\u1ec7n v\u00e0 khu ph\u1ea3n \u1ee9ng; v\u0169 kh\u00ed t\u1ef1 \u0111\u1ed9ng gi\u00e1m s\u00e1t'}],
      [{en:'Safe Zone',vi:'Khu an to\u00e0n'},{en:'assembly area for officers on duty; staff can stand down, eat or sleep in relative security',vi:'khu t\u1eadp trung c\u1ee7a s\u0129 quan tr\u1ef1c ch\u1ed1t; nh\u00e2n vi\u00ean c\u00f3 th\u1ec3 ngh\u1ec9 ng\u01a1i, \u0103n ho\u1eb7c ng\u1ee7 trong an to\u00e0n t\u01b0\u01a1ng \u0111\u1ed1i'}]
     ]},
    {t:{en:'Searching Procedures',vi:'Quy tr\u00ecnh Kh\u00e1m x\u00e9t'},fc:true,
     d:{en:'Local police must be present in non-executive mandates, as UN Police are unlikely to have the mandate to stop or search vehicles without them (unless for UN building access). Vehicle searching follows set principles.',vi:'C\u1ea3nh s\u00e1t \u0111\u1ecba ph\u01b0\u01a1ng ph\u1ea3i c\u00f3 m\u1eb7t trong nhi\u1ec7m v\u1ee5 kh\u00f4ng th\u1ef1c thi, v\u00ec C\u1ea3nh s\u00e1t LHQ kh\u00f3 c\u00f3 th\u1ea9m quy\u1ec1n d\u1eebng ho\u1eb7c kh\u00e1m x\u00e9t ph\u01b0\u01a1ng ti\u1ec7n khi kh\u00f4ng c\u00f3 h\u1ecd (tr\u1eeb khi cho vi\u1ec7c v\u00e0o t\u00f2a nh\u00e0 LHQ). Kh\u00e1m x\u00e9t ph\u01b0\u01a1ng ti\u1ec7n tu\u00e2n theo c\u00e1c nguy\u00ean t\u1eafc nh\u1ea5t \u0111\u1ecbnh.'},
     st:[
      {en:'Driver shuts off engine and releases the hood (bonnet) and trunk (boot)',vi:'T\u00e0i x\u1ebf t\u1eaft m\u00e1y v\u00e0 m\u1edf n\u1eafp capo v\u00e0 c\u1ed1p xe'},
      {en:'Driver gets out; must be present during the search; keep hands visible',vi:'T\u00e0i x\u1ebf ra kh\u1ecfi xe; ph\u1ea3i c\u00f3 m\u1eb7t trong l\u00fac kh\u00e1m x\u00e9t; gi\u1eef tay nh\u00ecn th\u1ea5y \u0111\u01b0\u1ee3c'},
      {en:'Remove other occupants to a holding area, watched, while search is conducted',vi:'\u0110\u01b0a ng\u01b0\u1eddi ng\u1ed3i tr\u00ean xe kh\u00e1c \u0111\u1ebfn khu gi\u1eef, \u0111\u01b0\u1ee3c gi\u00e1m s\u00e1t, trong l\u00fac kh\u00e1m x\u00e9t'},
      {en:'Use mirrors to look into difficult areas',vi:'D\u00f9ng g\u01b0\u01a1ng soi c\u00e1c khu v\u1ef1c kh\u00f3 nh\u00ecn'},
      {en:'Establish a warning signal if officers become suspicious or find something illegal',vi:'Thi\u1ebft l\u1eadp t\u00edn hi\u1ec7u c\u1ea3nh b\u00e1o khi s\u0129 quan nghi ng\u1edd ho\u1eb7c ph\u00e1t hi\u1ec7n v\u1eadt b\u1ea5t h\u1ee3p ph\u00e1p'},
      {en:'Ask for ID and relevant documents, record the details - much intelligence is gained from routine stops',vi:'Y\u00eau c\u1ea7u CMND v\u00e0 gi\u1ea5y t\u1edd li\u00ean quan, ghi ch\u00e9p chi ti\u1ebft - thu th\u1eadp \u0111\u01b0\u1ee3c nhi\u1ec1u tin t\u1ee9c t\u1eeb c\u00e1c l\u1ea7n d\u1eebng th\u01b0\u1eddng l\u1ec7'},
      {en:'If suspect detained, impound the vehicle (by local police if non-executive); when cleared, thank occupants and allow them to proceed',vi:'N\u1ebfu nghi ph\u1ea1m b\u1ecb t\u1ea1m gi\u1eef, t\u1ea1m gi\u1eef ph\u01b0\u01a1ng ti\u1ec7n (c\u1ea3nh s\u00e1t \u0111\u1ecba ph\u01b0\u01a1ng n\u1ebfu kh\u00f4ng th\u1ef1c thi); khi s\u1ea1ch, c\u1ea3m \u01a1n v\u00e0 cho ph\u00e9p \u0111i ti\u1ebfp'}
     ]},
    {t:{en:'Fixed Checkpoint',vi:'Ch\u1ed1t Ki\u1ec3m so\u00e1t C\u1ed1 \u0111\u1ecbnh'},fc:true,
     d:{en:'A fixed checkpoint is permanent or temporary, at a place where checks are carried out on a regular or daily basis. If permanent, it is designed to full specifications. It normally takes at least a Platoon to operate a systematic checkpoint.',vi:'Ch\u1ed1t ki\u1ec3m so\u00e1t c\u1ed1 \u0111\u1ecbnh l\u00e0 v\u0129nh vi\u1ec5n ho\u1eb7c t\u1ea1m th\u1eddi, t\u1ea1i n\u01a1i ti\u1ebfn h\u00e0nh ki\u1ec3m tra th\u01b0\u1eddng xuy\u00ean ho\u1eb7c h\u00e0ng ng\u00e0y. N\u1ebfu v\u0129nh vi\u1ec5n, ch\u1ed1t \u0111\u01b0\u1ee3c thi\u1ebft k\u1ebf theo \u0111\u1ea7y \u0111\u1ee7 th\u00f4ng s\u1ed1. Th\u01b0\u1eddng c\u1ea7n \u00edt nh\u1ea5t m\u1ed9t Trung \u0111\u1ed9i \u0111\u1ec3 v\u1eadn h\u00e0nh ch\u1ed1t h\u1ec7 th\u1ed1ng.'},
     st:[
      {en:'Rotate the team regularly to prevent complacency',vi:'Lu\u00e2n phi\u00ean \u0111\u1ed9i th\u01b0\u1eddng xuy\u00ean \u0111\u1ec3 tr\u00e1nh ch\u1ee7 quan'},
      {en:'Deploy for all contingencies: defend from terrorist/insurgent attack and from violent protests (riot control measures)',vi:'Tri\u1ec3n khai cho m\u1ecdi t\u00ecnh hu\u1ed1ng: ph\u00f2ng th\u1ee7 tr\u01b0\u1edbc t\u1ea5n c\u00f4ng kh\u1ee7ng b\u1ed1/n\u1ed5i d\u1eady v\u00e0 bi\u1ec3u t\u00ecnh b\u1ea1o l\u1ef1c (bi\u1ec7n ph\u00e1p ch\u1ed1ng b\u1ea1o lo\u1ea1n)'},
      {en:'Search teams: mixed UN-local police or UN only (for UN premises); all vehicles and pedestrians checked',vi:'\u0110\u1ed9i kh\u00e1m x\u00e9t: h\u1ed7n h\u1ee3p LHQ-c\u1ea3nh s\u00e1t \u0111\u1ecba ph\u01b0\u01a1ng ho\u1eb7c ch\u1ec9 LHQ (cho c\u01a1 s\u1edf LHQ); m\u1ecdi ph\u01b0\u01a1ng ti\u1ec7n v\u00e0 ng\u01b0\u1eddi \u0111i b\u1ed9 \u0111\u1ec1u \u0111\u01b0\u1ee3c ki\u1ec3m tra'},
      {en:'Presence of local police essential in non-executive mandate for legal framework',vi:'C\u00f3 m\u1eb7t c\u1ea3nh s\u00e1t \u0111\u1ecba ph\u01b0\u01a1ng l\u00e0 thi\u1ebft y\u1ebfu trong nhi\u1ec7m v\u1ee5 kh\u00f4ng th\u1ef1c thi \u0111\u1ec3 c\u00f3 khung ph\u00e1p l\u00fd'},
      {en:'Overwatch vital - must cover the entire checkpoint; permanent CPs are obvious targets',vi:'Gi\u00e1m s\u00e1t y\u1ec3m tr\u1ee3 quan tr\u1ecdng - ph\u1ea3i bao ph\u1ee7 to\u00e0n b\u1ed9 ch\u1ed1t; ch\u1ed1t c\u1ed1 \u0111\u1ecbnh l\u00e0 m\u1ee5c ti\u00eau r\u00f5 r\u00e0ng'},
      {en:'Establish signals for unauthorised vehicles approaching',vi:'Thi\u1ebft l\u1eadp t\u00edn hi\u1ec7u cho ph\u01b0\u01a1ng ti\u1ec7n kh\u00f4ng \u0111\u01b0\u1ee3c ph\u00e9p ti\u1ebfp c\u1eadn'}
     ]},
    {t:{en:'Possible Attachments',vi:'C\u00e1c L\u1ef1c l\u01b0\u1ee3ng C\u00f3 th\u1ec3 B\u1ed1 tr\u00ed Th\u00eam'},fc:true,
     d:{en:'The commander should consider possible attachments to any checkpoint to enhance capability and legal authority.',vi:'Ch\u1ec9 huy n\u00ean c\u00e2n nh\u1eafc c\u00e1c l\u1ef1c l\u01b0\u1ee3ng c\u00f3 th\u1ec3 b\u1ed1 tr\u00ed th\u00eam cho b\u1ea5t k\u1ef3 ch\u1ed1t ki\u1ec3m so\u00e1t n\u00e0o \u0111\u1ec3 t\u0103ng c\u01b0\u1eddng n\u0103ng l\u1ef1c v\u00e0 th\u1ea9m quy\u1ec1n ph\u00e1p l\u00fd.'},
     tbl:[
      [{en:'Interpreter',vi:'Phi\u00ean d\u1ecbch vi\u00ean'},{en:'bridge language gaps with the local population',vi:'thu h\u1eb9p kho\u1ea3ng c\u00e1ch ng\u00f4n ng\u1eef v\u1edbi ng\u01b0\u1eddi d\u00e2n \u0111\u1ecba ph\u01b0\u01a1ng'}],
      [{en:'Host Nation Assets',vi:'L\u1ef1c l\u01b0\u1ee3ng N\u01b0\u1edbc s\u1edf t\u1ea1i'},{en:'CID, counter drug, immigration etc.',vi:'C\u1ea3nh s\u00e1t \u0111i\u1ec1u tra, ch\u1ed1ng ma t\u00fay, xu\u1ea5t nh\u1eadp c\u1ea3nh...'}],
      [{en:'Canine Unit',vi:'\u0110\u01a1n v\u1ecb ch\u00f3 nghi\u1ec7p v\u1ee5'},{en:'drug/explosive detection',vi:'ph\u00e1t hi\u1ec7n ma t\u00fay/ch\u1ea5t n\u1ed5'}],
      [{en:'EOD',vi:'\u0110\u1ed9i x\u1eed l\u00fd bom m\u00ecn'},{en:'explosive ordnance disposal',vi:'x\u1eed l\u00fd bom m\u00ecn'}],
      [{en:'UN Security',vi:'An ninh LHQ'},{en:'UN Department of Safety and Security staff',vi:'nh\u00e2n vi\u00ean An to\u00e0n v\u00e0 An ninh LHQ'}],
      [{en:'UN Military Force',vi:'L\u1ef1c l\u01b0\u1ee3ng Qu\u00e2n s\u1ef1 LHQ'},{en:'military support element',vi:'y\u1ebfu t\u1ed1 h\u1ed7 tr\u1ee3 qu\u00e2n s\u1ef1'}],
      [{en:'Military Police',vi:'C\u1ea3nh s\u00e1t Qu\u00e2n s\u1ef1'},{en:'military police liaison',vi:'li\u00ean l\u1ea1c c\u1ea3nh s\u00e1t qu\u00e2n s\u1ef1'}]
     ]},
    {t:{en:'Reaction - Proxy Delivered Bomb',vi:'\u1ee8ng ph\u00f3 - Bom Do Ng\u01b0\u1eddi Trung gian Mang'},fc:true,
     d:{en:'A hostage or innocent party has been told to deliver a bomb, normally in a vehicle, although it could be strapped to the individual or in a holdall/suitcase. Follow the Immediate Action drill: isolate, share information, use of force if needed, freeze, watch, wait for experts.',vi:'M\u1ed9t con tin ho\u1eb7c ng\u01b0\u1eddi v\u00f4 t\u1ed9i \u0111\u01b0\u1ee3c b\u1ea3o mang bom, th\u01b0\u1eddng trong xe, m\u1eb7c d\u00f9 bom c\u00f3 th\u1ec3 g\u1eafn tr\u00ean ng\u01b0\u1eddi ho\u1eb7c trong t\u00fai/vali. Th\u1ef1c hi\u1ec7n b\u00e0i t\u1eadp ph\u1ea3n \u1ee9ng ngay: c\u00f4 l\u1eadp, chia s\u1ebb th\u00f4ng tin, d\u00f9ng v\u0169 l\u1ef1c n\u1ebfu c\u1ea7n, \u0111\u00f3ng b\u0103ng t\u00ecnh hu\u1ed1ng, quan s\u00e1t, ch\u1edd chuy\u00ean gia.'},
     st:[
      {en:'Isolate the threat - direct to a safe area if possible so an explosion harms the fewest people',vi:'C\u00f4 l\u1eadp m\u1ed1i \u0111e d\u1ecda - d\u1eabn \u0111\u1ebfn khu v\u1ef1c an to\u00e0n n\u1ebfu c\u00f3 th\u1ec3 \u0111\u1ec3 v\u1ee5 n\u1ed5 g\u00e2y h\u1ea1i \u00edt ng\u01b0\u1eddi nh\u1ea5t'},
      {en:'Share information & report up the chain of command to HQ - start obtaining explosives experts',vi:'Chia s\u1ebb th\u00f4ng tin & b\u00e1o c\u00e1o l\u00ean chu\u1ed7i ch\u1ec9 huy \u0111\u1ebfn HQ - b\u1eaft \u0111\u1ea7u tri\u1ec7u t\u1eadp chuy\u00ean gia bom'},
      {en:'Use of force if suspect does not comply; deadly force if under mortal threat (must justify later)',vi:'D\u00f9ng v\u0169 l\u1ef1c n\u1ebfu nghi ph\u1ea1m kh\u00f4ng tu\u00e2n th\u1ee7; v\u0169 l\u1ef1c ch\u1ebft ng\u01b0\u1eddi n\u1ebfu b\u1ecb \u0111e d\u1ecda t\u00ednh m\u1ea1ng (ph\u1ea3i bi\u1ec7n minh sau \u0111\u00f3)'},
      {en:'Freeze the situation - once secured do nothing, do not open compartments, keep hands visible',vi:'\u0110\u00f3ng b\u0103ng t\u00ecnh hu\u1ed1ng - sau khi kh\u1ed1ng ch\u1ebf kh\u00f4ng l\u00e0m g\u00ec th\u00eam, kh\u00f4ng m\u1edf khoang, gi\u1eef tay nh\u00ecn th\u1ea5y \u0111\u01b0\u1ee3c'},
      {en:'Watch - the proxy may be a diversionary tactic or set off by a third party',vi:'Quan s\u00e1t - ng\u01b0\u1eddi trung gian c\u00f3 th\u1ec3 l\u00e0 \u0111\u00f2n nghi binh ho\u1eb7c do b\u00ean th\u1ee9 ba k\u00edch n\u1ed5'},
      {en:'Wait for the explosive experts',vi:'Ch\u1edd chuy\u00ean gia x\u1eed l\u00fd bom'},
      {en:'No electronic devices near the person/vehicle (no cell phone, radio) - most are set off by radio control',vi:'Kh\u00f4ng d\u00f9ng thi\u1ebft b\u1ecb \u0111i\u1ec7n t\u1eed g\u1ea7n ng\u01b0\u1eddi/ph\u01b0\u01a1ng ti\u1ec7n (kh\u00f4ng \u0111i\u1ec7n tho\u1ea1i, b\u1ed9 \u0111\u00e0m) - h\u1ea7u h\u1ebft \u0111\u01b0\u1ee3c k\u00edch n\u1ed5 b\u1eb1ng s\u00f3ng v\u00f4 tuy\u1ebfn'},
      {en:'Radio jammers can prevent detonation from outside',vi:'Thi\u1ebft b\u1ecb g\u00e2y nhi\u1ec5u s\u00f3ng c\u00f3 th\u1ec3 ng\u0103n k\u00edch n\u1ed5 t\u1eeb b\u00ean ngo\u00e0i'}
     ]},
    {t:{en:'Reaction - Mortar / Rocket Attack',vi:'\u1ee8ng ph\u00f3 - T\u1ea5n c\u00f4ng B\u1eb1ng Ph\u00e1o c\u1ed1i / Rocket'},fc:true,
     d:{en:'Fixed checkpoints become targets for rebel units, terrorists and insurgents who may shell them from a distance with light or heavy artillery. There is little the FPU can do other than reduce the risk as much as possible.',vi:'Ch\u1ed1t c\u1ed1 \u0111\u1ecbnh tr\u1edf th\u00e0nh m\u1ee5c ti\u00eau c\u1ee7a c\u00e1c \u0111\u01a1n v\u1ecb n\u1ed5i d\u1eady, kh\u1ee7ng b\u1ed1 v\u00e0 phi\u1ebfn qu\u00e2n c\u00f3 th\u1ec3 b\u1eafn ph\u00e1 t\u1eeb xa b\u1eb1ng ph\u00e1o nh\u1eb9 ho\u1eb7c n\u1eb7ng. FPU kh\u00f3 l\u00e0m g\u00ec kh\u00e1c ngo\u00e0i gi\u1ea3m thi\u1ec3u r\u1ee7i ro t\u1ed1i \u0111a.'},
     st:[
      {en:'Seek cover wherever possible - sandbagged emplacements are safest; highest risk is shrapnel; stay until directed otherwise',vi:'T\u00ecm n\u01a1i \u1ea9n n\u1ea5p b\u1ea5t c\u1ee9 khi n\u00e0o - c\u00f4ng s\u1ef1 bao c\u00e1t an to\u00e0n nh\u1ea5t; nguy c\u01a1 cao nh\u1ea5t l\u00e0 m\u1ea3nh \u0111\u1ea1n; gi\u1eef nguy\u00ean v\u1ecb tr\u00ed \u0111\u1ebfn khi c\u00f3 l\u1ec7nh'},
      {en:'Raise alarm, report up the chain of command, note the direction the shelling comes from',vi:'B\u00e1o \u0111\u1ed9ng, b\u00e1o c\u00e1o l\u00ean chu\u1ed7i ch\u1ec9 huy, ghi nh\u1eadn h\u01b0\u1edbng \u0111\u1ea1n ph\u00e1o t\u1edbi'},
      {en:'If close enough and resourced, deploy a unit to counter attack - coordinated with HQ',vi:'N\u1ebfu \u0111\u1ee7 g\u1ea7n v\u00e0 \u0111\u1ee7 l\u1ef1c l\u01b0\u1ee3ng, tri\u1ec3n khai \u0111\u01a1n v\u1ecb ph\u1ea3n c\u00f4ng - ph\u1ed1i h\u1ee3p v\u1edbi HQ'},
      {en:'Commander considers if shelling is the start of a major attack - keep officers with the CP',vi:'Ch\u1ec9 huy xem x\u00e9t li\u1ec7u ph\u00e1o k\u00edch c\u00f3 ph\u1ea3i kh\u1edfi \u0111\u1ea7u cu\u1ed9c t\u1ea5n c\u00f4ng l\u1edbn - gi\u1eef s\u0129 quan t\u1ea1i ch\u1ed1t'},
      {en:'Care for the wounded - first aid and evacuation as soon as safe',vi:'Ch\u0103m s\u00f3c ng\u01b0\u1eddi b\u1ecb th\u01b0\u01a1ng - s\u01a1 c\u1ee9u v\u00e0 s\u01a1 t\u00e1n ngay khi an to\u00e0n'}
     ]},
    {t:{en:'Reaction - IED / Booby Traps',vi:'\u1ee8ng ph\u00f3 - IED / B\u1eaby'},fc:true,
     d:{en:'IEDs may be found on persons being searched or, if the checkpoint is occasional, left as booby traps for the next time the unit moves into the CP. Follow the Immediate Action drill: raise alarm, confirm, cordon, clear, wait.',vi:'IED c\u00f3 th\u1ec3 \u0111\u01b0\u1ee3c t\u00ecm th\u1ea5y tr\u00ean ng\u01b0\u1eddi \u0111ang b\u1ecb kh\u00e1m x\u00e9t ho\u1eb7c, n\u1ebfu ch\u1ed1t ho\u1ea1t \u0111\u1ed9ng \u0111\u1ecbnh k\u1ef3, \u0111\u1ec3 l\u1ea1i nh\u01b0 b\u1eaby cho l\u1ea7n t\u1edbi khi \u0111\u01a1n v\u1ecb v\u00e0o ch\u1ed1t. Th\u1ef1c hi\u1ec7n b\u00e0i t\u1eadp ph\u1ea3n \u1ee9ng ngay: b\u00e1o \u0111\u1ed9ng, x\u00e1c nh\u1eadn, phong t\u1ecfa, d\u1ecdn s\u1ea1ch, ch\u1edd.'},
     st:[
      {en:'Raise the alarm, freeze the situation, isolate the potential threat; inform chain of command and HQ',vi:'B\u00e1o \u0111\u1ed9ng, \u0111\u00f3ng b\u0103ng t\u00ecnh hu\u1ed1ng, c\u00f4 l\u1eadp m\u1ed1i \u0111e d\u1ecda ti\u1ec1m t\u00e0ng; th\u00f4ng b\u00e1o chu\u1ed7i ch\u1ec9 huy v\u00e0 HQ'},
      {en:'Confirm the device as safely as possible - note description (size, colours, letters, figures) for bomb disposal',vi:'X\u00e1c nh\u1eadn thi\u1ebft b\u1ecb an to\u00e0n nh\u1ea5t c\u00f3 th\u1ec3 - ghi nh\u1eadn m\u00f4 t\u1ea3 (k\u00edch th\u01b0\u1edbc, m\u00e0u s\u1eafc, ch\u1eef, s\u1ed1) cho \u0111\u1ed9i x\u1eed l\u00fd bom'},
      {en:'Cordon off the area to a safe distance, dependent on the size of the IED',vi:'Phong t\u1ecfa khu v\u1ef1c \u0111\u1ebfn kho\u1ea3ng c\u00e1ch an to\u00e0n, t\u00f9y theo k\u00edch th\u01b0\u1edbc IED'},
      {en:'Clear the area - move all personnel to safer areas',vi:'D\u1ecdn s\u1ea1ch khu v\u1ef1c - di chuy\u1ec3n to\u00e0n b\u1ed9 nh\u00e2n s\u1ef1 \u0111\u1ebfn n\u01a1i an to\u00e0n h\u01a1n'},
      {en:'Wait for the arrival of bomb disposal units',vi:'Ch\u1edd s\u1ef1 xu\u1ea5t hi\u1ec7n c\u1ee7a \u0111\u1ed9i x\u1eed l\u00fd bom'}
     ]},
    {t:{en:'Reaction - Sniper Attack',vi:'\u1ee8ng ph\u00f3 - B\u1ecb B\u1eafn T\u1ec9a'},fc:true,
     d:{en:'As with shelling, the first safety concern is to seek cover. If the location of the sniper can be ascertained, the correct cover can be sought.',vi:'Nh\u01b0 v\u1edbi ph\u00e1o k\u00edch, m\u1ed1i quan t\u00e2m an to\u00e0n \u0111\u1ea7u ti\u00ean l\u00e0 t\u00ecm n\u01a1i \u1ea9n n\u1ea5p. N\u1ebfu x\u00e1c \u0111\u1ecbnh \u0111\u01b0\u1ee3c v\u1ecb tr\u00ed c\u1ee7a l\u00ednh b\u1eafn t\u1ec9a, c\u00f3 th\u1ec3 t\u00ecm n\u01a1i \u1ea9n n\u1ea5p \u0111\u00fang.'},
     st:[
      {en:'Seek cover based on the sniper\'s location',vi:'T\u00ecm n\u01a1i \u1ea9n n\u1ea5p d\u1ef1a tr\u00ean v\u1ecb tr\u00ed l\u00ednh b\u1eafn t\u1ec9a'},
      {en:'Raise the alarm - within the unit, on the radio, up the chain of command',vi:'B\u00e1o \u0111\u1ed9ng - trong \u0111\u01a1n v\u1ecb, tr\u00ean b\u1ed9 \u0111\u00e0m, l\u00ean chu\u1ed7i ch\u1ec9 huy'},
      {en:'Locate the sniper using the checkpoint\'s observation posts',vi:'X\u00e1c \u0111\u1ecbnh v\u1ecb tr\u00ed l\u00ednh b\u1eafn t\u1ec9a b\u1eb1ng tr\u1ea1m quan s\u00e1t c\u1ee7a ch\u1ed1t'},
      {en:'Deploy personnel in a counter sniper role; use smoke to screen movement',vi:'Tri\u1ec3n khai nh\u00e2n s\u1ef1 vai tr\u00f2 ch\u1ed1ng b\u1eafn t\u1ec9a; d\u00f9ng kh\u00f3i che di chuy\u1ec3n'},
      {en:'If safe, send out a unit to arrest or neutralise the sniper',vi:'N\u1ebfu an to\u00e0n, c\u1eed \u0111\u01a1n v\u1ecb b\u1eaft gi\u1eef ho\u1eb7c v\u00f4 hi\u1ec7u h\u00f3a l\u00ednh b\u1eafn t\u1ec9a'},
      {en:'Care for the wounded - first aid and evacuation as soon as safe',vi:'Ch\u0103m s\u00f3c ng\u01b0\u1eddi b\u1ecb th\u01b0\u01a1ng - s\u01a1 c\u1ee9u v\u00e0 s\u01a1 t\u00e1n ngay khi an to\u00e0n'},
     ]},
    {t:{en:'Detailed Vehicle Inspection Procedure',vi:'Quy trình Khám xét Phương tiện Chi tiết'},fc:true,
     d:{en:'Step-by-step procedure to stop and search a suspect vehicle at a mobile checkpoint. The officer controls the driver, keeps the subject observed, and searches systematically from outside to inside to avoid missing hidden items or triggering IEDs.',vi:'Quy trình từng bước để dừng và khám xét một phương tiện nghi vấn tại checkpoint di động. Sĩ quan kiểm soát tài xế, giữ đối tượng được quan sát và khám xét có hệ thống từ ngoài vào trong để không bỏ sót vật giấu hoặc kích hoạt IED.'},
     st:[
      {en:'Place spike strips / dragon\'s teeth in front of and behind the vehicle to prevent escape.',vi:'Ném dải chông/răng rồng trước và sau xe phòng khi đối tượng tăng ga bỏ chạy.'},
      {en:'Order the driver to turn off the engine, place the key on the roof, hands on the wheel.',vi:'Yêu cầu tài xế tắt máy, đặt chìa khóa lên nóc xe, hai tay để lên vô lăng.'},
      {en:'Move passengers to the pedestrian check area while the search is conducted.',vi:'Yêu cầu hành khách di chuyển ra khu vực kiểm tra người đi bộ trong khi khám xét.'},
      {en:'Driver: hands on the window, open the door, step out slowly, hands on your head.',vi:'Tài xế: đặt hai tay lên cửa sổ, mở cửa xe, bước ra chậm rãi, hai tay để lên đầu.'},
      {en:'Driver: turn one round slowly, then step back to the rear of the car.',vi:'Tài xế: quay một vòng chậm rãi, sau đó bước lùi ra phía đuôi xe.'},
      {en:'Body check: subject turns face to the car, puts hands on it.',vi:'Khám xét người: đối tượng quay mặt vào xe, đặt tay lên thành xe.'},
      {en:'Keep the subject observed throughout; searches can be simultaneous by several officers or sequential.',vi:'Đảm bảo đối tượng được quan sát suốt quá trình; có thể khám xét đồng thời bởi nhiều sĩ quan hoặc tuần tự.'},
      {en:'The searching officer maintains control of the elbow and watches the subject\'s face.',vi:'Sĩ quan khám xét luôn duy trì khống chế khuỷu tay và quan sát khuôn mặt đối tượng.'},
      {en:'Ask the subject to open doors, hood and trunk; the officer stands at a safe distance.',vi:'Yêu cầu đối tượng mở cửa xe, nắp capo và cốp xe; sĩ quan đứng ở khoảng cách an toàn.'},
      {en:'External check by senses: look, smell, touch; note abnormal load, fresh paint, unusual dirt.',vi:'Kiểm tra bên ngoài bằng giác quan: nhìn, ngửi, sờ; chú ý quá tải trọng, sơn mới, bẩn bất thường.'},
      {en:'Engine bay: compare parts against the catalogue (battery, engine, coolant); then body, then rear.',vi:'Đầu xe: đối chiếu từng bộ phận với catalogue (accu, máy, nước mát); sau đó thân xe, đuôi xe.'},
      {en:'Bend down to observe around the wheels; no physical contact, to avoid triggering IEDs.',vi:'Cúi xuống quan sát quanh bánh xe; không tương tác vật lý, tránh kích hoạt IED.'},
      {en:'Rear: lie down and crawl fully under; check the area above the drive shaft.',vi:'Đuôi xe: nằm xuống chui hẳn vào gầm; quan sát khu vực trên trục truyền động.'},
      {en:'Interior: check boxes, compartments, floor mats, seat cushions and backrests clockwise with a flashlight.',vi:'Bên trong: kiểm tra hộp, hộc chứa, thảm lót, nệm ghế, lót lưng theo chiều kim đồng hồ với đèn pin.'},
      {en:'Report each completed search area to the commander outside.',vi:'Báo cáo từng khu vực đã kiểm tra xong cho chỉ huy bên ngoài.'}
     ],
     bad:[
      {en:'Always remain professional, calm and confident.',vi:'Luôn giữ thái độ chuyên nghiệp, bình tĩnh và tự tin.'},
      {en:'Use short, clear and easy-to-understand language, especially in emergencies.',vi:'Sử dụng ngôn ngữ ngắn gọn, rõ ràng, dễ hiểu, đặc biệt trong tình huống khẩn cấp.'},
      {en:'Maintain fluent communications within the team and with command.',vi:'Duy trì liên lạc thông suốt giữa các thành viên trong đội và với sở chỉ huy.'},
      {en:'Stay alert and aware of changes in the surrounding environment.',vi:'Luôn cảnh giác và nhận biết những thay đổi trong môi trường xung quanh.'},
      {en:'Never interact physically with wheels or the underbody without cause.',vi:'Không bao giờ tương tác vật lý với bánh xe hoặc gầm xe khi không có lý do.'}
     ]}
  ],
