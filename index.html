  // ===== Tactical Progression (025-032) =====
  tp:[
  {t:{"en": "Lesson 1 — Aim & Background", "vi": "Bài 1 — Mục đích & Bối cảnh"},fc:true,d:{"en": "Armed officers need to move across land and through buildings safely where there is danger or perceived danger from armed suspects. Tactical Progression provides a set of individual and collective methods so officers maintain a tactical advantage over suspects they seek to detain.", "vi": "Sĩ quan vũ trang cần di chuyển qua địa hình và qua các tòa nhà một cách an toàn khi có nguy hiểm hoặc nguy cơ bị nghi ngờ từ nghi phạm vũ trang. Di chuyển chiến thuật cung cấp một loạt phương pháp cá nhân và tập thể để sĩ quan giữ ưu thế chiến thuật với nghi phạm cần bắt giữ."},st:[{"en": "Aim: familiarize FPU members with progressing across open ground and through buildings safely and professionally", "vi": "Mục đích: giúp cán bộ FPU làm quen với việc di chuyển qua địa hình trống và qua các tòa nhà một cách an toàn và chuyên nghiệp"}, {"en": "Delivered over 16 x 40-minute periods: 3 theory + 13 practical lessons", "vi": "Được giảng dạy trong 16 tiết x 40 phút: 3 tiết lý thuyết + 13 tiết thực hành"}, {"en": "Minimum session time: 32 hours", "vi": "Thời gian tối thiểu: 32 giờ"}, {"en": "Cross-over training between firearms and core police techniques in a tactical environment", "vi": "Đào tạo giao thoa giữa kỹ năng súng ống và kỹ thuật cảnh sát cốt lõi trong môi trường chiến thuật"}, {"en": "Enables different FPUs to work together using a uniform technique during high-risk operations", "vi": "Cho phép các đơn vị FPU khác nhau phối hợp bằng một kỹ thuật thống nhất trong các chiến dịch rủi ro cao"}]},
  {t:{"en": "Learning Outcomes", "vi": "Kết quả học tập"},fc:true,d:{"en": "On completion of this module, participants will be able to demonstrate: tactical signs, relay movement, over-bounding movement, safely crossing openings, corner crossing, moving through stairs, room entry, and all of the above in low light situations.", "vi": "Sau khi hoàn thành mô-đun, học viên có thể thực hiện được: tín hiệu chiến thuật, di chuyển chạy vòng, di chuyển vượt quãng, băng qua ô cửa an toàn, vượt góc, di chuyển qua cầu thang, tiến vào phòng và tất cả trong điều kiện ánh sáng yếu."},st:[{"en": "Demonstrate the tactical signs", "vi": "Thực hiện các tín hiệu chiến thuật"}, {"en": "Demonstrate relay movement", "vi": "Thực hiện di chuyển chạy vòng (relay)"}, {"en": "Demonstrate Over Bounding movement", "vi": "Thực hiện di chuyển vượt quãng (over bounding)"}, {"en": "Demonstrate safely crossing openings", "vi": "Thực hiện băng qua ô cửa an toàn"}, {"en": "Demonstrate corner crossing and moving through stairs", "vi": "Thực hiện vượt góc và di chuyển qua cầu thang"}, {"en": "Demonstrate room entry", "vi": "Thực hiện tiến vào phòng"}, {"en": "All of the above in low light situations", "vi": "Tất cả các kỹ năng trên trong điều kiện ánh sáng yếu"}]},
  {t:{"en": "Basic Principles", "vi": "Các nguyên tắc cơ bản"},fc:true,d:{"en": "The aim of tactical progression is to secure a new area or to intervene in that area by advancing safely: secure areas to your front and leave a secured area behind. At every progression officers must ensure the area they are moving through is clear of hostile presence and secured.", "vi": "Mục đích của di chuyển chiến thuật là bảo đảm an toàn một khu vực mới hoặc can thiệp vào khu vực bằng cách tiến lên an toàn: bảo đảm an toàn khu vực phía trước và để lại khu vực đã được kiểm soát phía sau. Ở mỗi bước tiến, sĩ quan phải đảm bảo khu vực đang di chuyển qua không có sự hiện diện của đối phương và đã được kiểm soát."},st:[{"en": "\"In Force\": threat is located — speed is important", "vi": "“Cưỡng chế” (In Force): đã xác định được mối đe dọa — tốc độ là quan trọng"}, {"en": "\"Tactical\": threat not located — secure the area bit by bit, discretion is important", "vi": "“Chiến thuật” (Tactical): chưa xác định được mối đe dọa — cần bảo đảm an toàn khu vực từng phần, thận trọng là quan trọng"}, {"en": "In both cases, safety and protection of personnel remain the priority", "vi": "Trong cả hai trường hợp, an toàn và bảo vệ nhân sự vẫn là ưu tiên hàng đầu"}]},
  {t:{"en": "In Force vs Tactical Progression", "vi": "Di chuyển Cưỡng chế so với Chiến thuật"},fc:true,d:{"en": "\"In Force\" is used when the threat is located and the team must secure the area or suspect as quickly as possible. \"Tactical\" progression is used when the threat is not located or too large and the area must be secured to discover or rule out the suspect.", "vi": "“Cưỡng chế” được dùng khi đã xác định mối đe dọa và đội phải bảo đảm an toàn khu vực hoặc nghi phạm càng nhanh càng tốt. Di chuyển “chiến thuật” dùng khi chưa xác định mối đe dọa hoặc mối đe dọa quá lớn và cần bảo đảm an toàn khu vực để phát hiện hoặc loại trừ nghi phạm."},st:[{"en": "In Force: only if the commander is sure the area and suspects can be controlled within 10 seconds after hard entry", "vi": "Cưỡng chế: chỉ khi chỉ huy chắc chắn kiểm soát được khu vực và nghi phạm trong vòng 10 giây sau khi đột nhập"}, {"en": "Tactical: no rush except when crossing danger areas — slow, deliberate, using stealth", "vi": "Chiến thuật: không vội vã trừ khi băng qua khu vực nguy hiểm — chậm, thận trọng, lợi dụng tính kín đáo"}, {"en": "Tactical progression aims to surprise the suspects: silent and discrete progression (use of tactical signs)", "vi": "Di chuyển chiến thuật nhằm gây bất ngờ cho nghi phạm: tiến quân im lặng và kín đáo (dùng tín hiệu chiến thuật)"}, {"en": "Safety is the priority: public, officers, and if possible the suspect", "vi": "An toàn là ưu tiên: công chúng, sĩ quan và nếu có thể cả nghi phạm"}]},
  {t:{"en": "APCS — The Four Key Principles", "vi": "APCS — Bốn nguyên tắc then chốt"},fc:true,d:{"en": "The four elements that underpin safe tactical progression: Attitude, Protection, Support and Communication.", "vi": "Bốn yếu tố nền tảng cho di chuyển chiến thuật an toàn: Thái độ (Attitude), Bảo vệ (Protection), Y trợ (Support) và Thông tin liên lạc (Communication)."},st:[{"en": "Attitude: professional and self-contained, avoid the 'red mist' — vision tunnelled, hearing dulled; response must remain proportionate", "vi": "Thái độ: chuyên nghiệp và tự kiểm soát, tránh “hoả khí” — tầm nhìn bị thu hẹp, thính giác kém đi; phản ứng phải tương xứng"}, {"en": "Protection: correct protective equipment (body protection, ballistic shields, torches, mirrors); best use of cover — cover from view is NOT cover from fire", "vi": "Bảo vệ: trang bị bảo hộ đúng (giáp, khiên chống đạn, đèn pin, gương); tận dụng vật che chắn — che tầm nhìn KHÔNG phải che được hỏa lực"}, {"en": "Support: support fire available at every stage; 'when one operator moves, his buddy team is ready to support with fixed and permanent fire capacity'", "vi": "Y trợ: hỏa lực y trợ có sẵn ở mọi giai đoạn; “khi một chiến sĩ di chuyển, đồng đội sẵn sàng y trợ bằng hỏa lực cố định và liên tục”"}, {"en": "Communication: key to a good operation — radio or tactical signals when silence is required", "vi": "Thông tin liên lạc: chìa khóa của một chiến dịch tốt — bộ đàm hoặc tín hiệu chiến thuật khi cần im lặng"}]},
  {t:{"en": "Use of Force Continuum", "vi": "Thang độ sử dụng vũ lực"},fc:true,d:{"en": "Pepper spray is ranked below physical strikes and baton strikes, since spray and tear gas do not induce permanent injuries that strikes are very likely to cause. Officers must engage in dialogue where appropriate — tactical communication can resolve incidents without any use of force.", "vi": "Bình xịt hơi cay được xếp dưới cú đánh vật lý và cú đánh bằng dũi cui, vì hơi cay và hơi cay khóc không gây chấn thương vĩnh viễn như các cú đánh. Sĩ quan phải đối thoại khi thích hợp — giao tiếp chiến thuật có thể giải quyết sự việc mà không cần dùng vũ lực."},st:[{"en": "Use of force continuum and the level of force engaged, only provided the circumstance warrants it", "vi": "Thang độ vũ lực và mức độ vũ lực được phép dùng, chỉ khi hoàn cảnh cho phép"}, {"en": "Any use of force must be justified against the rules laid down in the Mission", "vi": "Mọi hành vi sử dụng vũ lực phải được biện minh theo quy định của Phái bộ"}, {"en": "Mission-specific rules should be referred to", "vi": "Cần tham chiếu các quy định riêng của Phái bộ"}]},
  {t:{"en": "Personal & Environmental Protection", "vi": "Bảo vệ cá nhân & môi trường"},fc:true,d:{"en": "Officers wear ballistic body protection (body armour) and a ballistic helmet. Fig. 2 shows a ballistic shield — excellent protection but bulky and heavy. Fig. 3 shows poor use of natural cover (upper body exposed); Fig. 4 shows good use of a building line, concealing as much of the body as possible.", "vi": "Sĩ quan mặc áo giáp chống đạn và đội mũ chống đạn. Hình 2 cho thấy khiên chống đạn — bảo vệ tốt nhưng cồng kềnh và nặng. Hình 3 cho thấy sử dụng vật che chắn tự nhiên kém (phần trên cơ thể hở); Hình 4 cho thấy dùng tòa nhà làm vật che tốt, che càng nhiều phần cơ thể càng tốt."},st:[{"en": "Choose cover correctly — cover from view only (bushes, light wooden fences) is dangerous", "vi": "Chọn vật che chắn đúng — chỉ che tầm nhìn (bụi cây, hàng rào gỗ mỏng) là nguy hiểm"}, {"en": "Survey the area before moving, define the path, and know where to seek cover", "vi": "Quan sát khu vực trước khi di chuyển, xác định lộ trình và biết nơi ẩn nấp"}]},
  {t:{"en": "Tactical Hand Signals", "vi": "Tín hiệu tay chiến thuật"},fc:true,d:{"en": "Internationally recognised tactical hand signals allow the team to plan their course of action without letting the suspect know their intention. This can have a psychological effect on the suspect which benefits the officers.", "vi": "Các tín hiệu tay chiến thuật được quốc tế công nhận cho phép đội lên kế hoạch hành động mà không để nghi phạm biết ý định. Điều này có thể tạo hiệu ứng tâm lý có lợi cho sĩ quan."},st:[{"en": "Use hand signals instead of verbal communication when a suspect may be close by", "vi": "Dùng tín hiệu tay thay vì giao tiếp bằng lời khi nghi phạm có thể ở gần"}, {"en": "Other signals must be agreed and practiced by the team before the operation", "vi": "Các tín hiệu khác phải được đội thống nhất và luyện tập trước khi hoạt động"}]},
  {t:{"en": "The Buddy Team", "vi": "Tổ chiến đấu đôi (Buddy Team)"},fc:true,d:{"en": "The basic unit is the Buddy Team of two officers. The Reconnaissance (Recce) Officer leads, contacts and communicates with the suspect. The Support Officer is slightly behind, brings fire support and scans the environment beyond the Recce Officer's focus.", "vi": "Đơn vị cơ bản là tổ chiến đấu đôi gồm hai sĩ quan. Sĩ quan trinh sát (Recce) dẫn đầu, tiếp xúc và giao tiếp với nghi phạm. Sĩ quan y trợ ở phía sau một chút, cung cấp hỏa lực y trợ và quan sát môi trường ngoài tầm tập trung của sĩ quan trinh sát."},st:[{"en": "Support Officer must be close enough for contact — the Recce Officer need not turn his head away from the threat area", "vi": "Sĩ quan y trợ phải ở đủ gần để liên lạc — sĩ quan trinh sát không cần quay đầu khỏi vùng nguy hiểm"}, {"en": "In relay or over-bounding, officers should have some form of physical contact to communicate", "vi": "Khi chạy vòng hoặc vượt quãng, hai sĩ quan nên có một hình thức tiếp xúc vật lý để liên lạc"}]},
  {t:{"en": "Progression in Relay", "vi": "Di chuyển chạy vòng (Relay)"},fc:true,d:{"en": "A method for two officers advancing through an unsecured area: each moves separately while the other covers. It can be used in buildings or open country, and relies on sufficient cover and good communication.", "vi": "Phương pháp cho hai sĩ quan tiến qua khu vực chưa được kiểm soát: mỗi người di chuyển riêng trong khi người kia y trợ. Có thể dùng trong nhà hoặc ngoài trời, dựa vào vật che chắn đủ và liên lạc tốt."},st:[{"en": "Progression is by short bounds", "vi": "Tiến lên theo từng quãng ngắn"}, {"en": "Officer 1 moves whilst officer 2 covers the danger area", "vi": "Sĩ quan 1 di chuyển trong khi sĩ quan 2 y trợ khu vực nguy hiểm"}, {"en": "When officer 1 reaches protection, they cover the danger areas while officer 2 moves forward", "vi": "Khi sĩ quan 1 tới vị trí che chắn, họ y trợ các khu vực nguy hiểm trong khi sĩ quan 2 tiến lên"}, {"en": "Officer 1 communicates arrival by tactical signal; officer 2 arrives and communicates by touching officer 1's foot or shoulder", "vi": "Sĩ quan 1 báo đã tới vị trí bằng tín hiệu chiến thuật; sĩ quan 2 tới nơi và báo bằng cách chạm vào chân hoặc vai sĩ quan 1"}, {"en": "Roles between the two officers remain the same all along the progression", "vi": "Vai trò của hai sĩ quan giữ nguyên trong suốt quá trình di chuyển"}]},
  {t:{"en": "Over-Bounding Progression", "vi": "Di chuyển vượt quãng (Over-Bounding)"},fc:true,d:{"en": "A similar method for two officers, but they move in longer bounds and overtake the covering officer on each bound to the next piece of protection.", "vi": "Phương pháp tương tự cho hai sĩ quan, nhưng họ di chuyển với quãng dài hơn và vượt qua sĩ quan y trợ ở mỗi quãng để tới vị trí bảo vệ tiếp theo."},st:[{"en": "Officer 1 completes their bound and gives a tactical signal", "vi": "Sĩ quan 1 hoàn thành quãng di chuyển và ra tín hiệu chiến thuật"}, {"en": "Officer 2 then commences their move forwards, passing officer 1 on the way", "vi": "Sĩ quan 2 sau đó bắt đầu tiến lên, vượt qua sĩ quan 1 trên đường"}, {"en": "Officer 2 informs officer 1 by tactical signal when in position; officer 1 then moves forward", "vi": "Sĩ quan 2 báo cho sĩ quan 1 bằng tín hiệu chiến thuật khi đã vào vị trí; sĩ quan 1 sau đó tiến lên"}]},
  {t:{"en": "The 3rd Dimension", "vi": "Chiều không gian thứ 3"},fc:true,d:{"en": "When using any form of tactical progression, officers must be aware of the third dimension — at least one officer must look towards upper levels, roofs and windows that may pose a threat.", "vi": "Khi sử dụng bất kỳ hình thức di chuyển chiến thuật nào, sĩ quan phải lưu ý đến chiều không gian thứ 3 — ít nhất một sĩ quan phải quan sát các tầng trên, mái và cửa sổ có thể gây đe dọa."},st:[{"en": "Counter snipers may cover these areas, but officers must still check upper levels before movement", "vi": "Có thể triển khai bắn tỉa để y trợ, nhưng sĩ quan vẫn phải kiểm tra các tầng trên trước khi di chuyển"}, {"en": "Covering the height of a building from too close is difficult — the shooting angle is too narrow; distance yourself while keeping protection", "vi": "Y trợ độ cao của tòa nhà từ quá gần là khó — góc bắn quá hẹp; cần giãn khoảng cách trong khi giữ mức bảo vệ"}, {"en": "Consider the use of ballistic shields for this role", "vi": "Cân nhắc sử dụng khiên chống đạn cho vai trò này"}]},
  {t:{"en": "Crossing Openings (no ballistic protection)", "vi": "Băng qua ô cửa (không có khiên chống đạn)"},fc:true,d:{"en": "Openings are always treated as a possible threat. Cross them quickly, only one officer at a time, and if possible without being seen.", "vi": "Ô cửa luôn được coi là mối đe dọa tiềm ẩn. Phải băng qua nhanh, mỗi lần chỉ một sĩ quan và nếu có thể mà không bị nhìn thấy."},st:[{"en": "Standing: turn weapon and head in the direction of the opening, ready to counter any threat", "vi": "Đứng: hướng vũ khí và đầu về phía ô cửa, sẵn sàng đối phó mối đe dọa"}, {"en": "To remain unseen: kneel, low standing, or crawl under the opening", "vi": "Để không bị nhìn thấy: quỳ gối, đứng thấp hoặc bò dưới ô cửa"}, {"en": "In buddy teams, officer 2 waits and covers while officer 1 crosses", "vi": "Trong tổ đôi, sĩ quan 2 chờ và y trợ trong khi sĩ quan 1 băng qua"}]},
  {t:{"en": "Crossing Openings (with ballistic protection)", "vi": "Băng qua ô cửa (có khiên chống đạn)"},fc:true,d:{"en": "With full ballistic protection the officer moves the upper body as well as weapon and head toward the opening, to be in a better position to return fire and make best use of the ballistic vest (the weak point of a flak jacket is under the arm).", "vi": "Với bảo vệ chống đạn đầy đủ, sĩ quan di chuyển phần thân trên cũng như vũ khí và đầu về phía ô cửa, để có tư thế tốt hơn trong việc bắn trả và tận dụng áo giáp (điểm yếu của áo chống đạn là dưới nách)."},st:[{"en": "Maintain forward movement — never stop in front of the opening", "vi": "Duy trì chuyển động tiến lên — không bao giờ dừng lại trước ô cửa"}]},
  {t:{"en": "Lesson 2 — Aim & Tactical Principles (buildings)", "vi": "Bài 2 — Mục đích & Các nguyên tắc chiến thuật (trong nhà)"},fc:true,d:{"en": "To teach the FPU member how to safely progress through buildings in a tactical manner when there is a known or perceived danger of the use of firearms.", "vi": "Hướng dẫn cán bộ FPU cách di chuyển qua các tòa nhà một cách an toàn và chiến thuật khi có nguy hiểm hoặc nguy cơ bị nghi ngờ từ việc sử dụng súng."},st:[{"en": "Do not be drawn into buildings if it is unnecessary", "vi": "Không bị cuốn vào việc vào nhà nếu không cần thiết"}, {"en": "Keep the initiative", "vi": "Giữ thế chủ động"}, {"en": "Gather intelligence", "vi": "Thu thập tình báo"}, {"en": "Use distraction techniques to distract the suspect(s)", "vi": "Dùng kỹ thuật đánh lạc hướng để đánh lạc hướng nghi phạm"}, {"en": "Do not use obvious tactics that can be anticipated by the suspect(s)", "vi": "Không dùng chiến thuật hiển nhiên mà nghi phạm có thể đoán trước"}, {"en": "Do not under-estimate the target, in number, in capacity or in determination", "vi": "Không đánh giá thấp mục tiêu về số lượng, khả năng hay quyết tâm"}]},
  {t:{"en": "Before Entering a Building", "vi": "Trước khi tiến vào tòa nhà"},fc:true,d:{"en": "Entering a building where a suspect is located is usually more dangerous than catching him by surprise outside. Consider the surrounding with a cordon, communicate with the suspect inside, and keep the initiative.", "vi": "Tiến vào tòa nhà nơi nghi phạm ẩn náu thường nguy hiểm hơn việc bắt bất ngờ bên ngoài. Cần phong tỏa xung quanh, liên lạc với nghi phạm bên trong và giữ thế chủ động."},st:[{"en": "Cordon the surroundings with armed officers; use telephone or loudhailer to request surrender", "vi": "Phong tỏa xung quanh bằng sĩ quan vũ trang; dùng điện thoại hoặc loa phóng thanh yêu cầu đầu hàng"}, {"en": "Move slowly, methodically and quietly; control power and communications to persuade surrender", "vi": "Di chuyển chậm, có phương pháp và im lặng; kiểm soát điện và thông tin liên lạc để thuyết phục đầu hàng"}, {"en": "Study plans or photographs of the inside; learn about the suspect's behaviour and weapons", "vi": "Nghiên cứu bản vẽ hoặc ảnh bên trong; tìm hiểu hành vi và vũ khí của nghi phạm"}, {"en": "Distraction: engage on the telephone, noise/lights as a feint, stun grenades or CS gas on entry", "vi": "Đánh lạc hướng: gọi điện thoại, tiếng ồn/ánh sáng giả vờ, lựu đạn choáng hoặc hơi cay khi tiến vào"}, {"en": "The commander must not make their techniques obvious to the suspect(s)", "vi": "Chỉ huy không được để lộ kỹ thuật cho nghi phạm"}]},
  {t:{"en": "Approach Phase (outdoor)", "vi": "Giai đoạn tiếp cận (ngoài trời)"},fc:true,d:{"en": "An indoor progression always starts outside. Choose the approach wisely (blind side of the house), get 'eyes on' the objective, conduct a recce if possible, and keep heavy equipment in reserve.", "vi": "Di chuyển trong nhà luôn bắt đầu từ bên ngoài. Chọn hướng tiếp cận khôn ngoan (phía khuất của ngôi nhà), “quan sát” mục tiêu, trinh sát nếu có thể và giữ thiết bị nặng trong dự bị."},st:[{"en": "Choose the approach through cover, hidden from the occupants", "vi": "Chọn hướng tiếp cận qua vật che chắn, khuất khỏi những người trong nhà"}, {"en": "Post a sniper or observer to pass information back to the tactical commander", "vi": "Bố trí bắn tỉa hoặc quan sát viên để truyền thông tin về chỉ huy chiến thuật"}, {"en": "If possible, recce the route before entry without being detected", "vi": "Nếu có thể, trinh sát tuyến đường trước khi vào mà không bị phát hiện"}, {"en": "Use an officer familiar with the route to guide the team in", "vi": "Dùng sĩ quan quen thuộc tuyến đường để dẫn đội vào"}, {"en": "Heavy equipment (ladders, door breakers) held at the rear to preserve the element of surprise", "vi": "Thiết bị nặng (thang, phá cửa) giữ phía sau để giữ yếu tố bất ngờ"}]},
  {t:{"en": "Indoor Progression — 4 Main Phases", "vi": "Di chuyển trong nhà — 4 giai đoạn chính"},fc:true,d:{"en": "Progression is split into four main areas: approaching the site, entering the building, searching corridors and rooms, and securing the suspect(s) and other persons found on the site.", "vi": "Di chuyển được chia thành bốn khu vực chính: tiếp cận hiện trường, tiến vào tòa nhà, khám xét hành lang và phòng, và khống chế nghi phạm cũng như những người khác có mặt."},st:[{"en": "Entry: effected quickly and quietly — it is a danger point", "vi": "Tiến vào: thực hiện nhanh và im lặng — đây là điểm nguy hiểm"}, {"en": "Searching: quietly, using tactical hand signals and slow steady balanced movement", "vi": "Khám xét: im lặng, dùng tín hiệu tay chiến thuật và chuyển động chậm, cân bằng"}, {"en": "Securing: secure the suspect and any other persons before removal to custody or debriefing", "vi": "Khống chế: khống chế nghi phạm và những người khác trước khi đưa đến nơi giam giữ hoặc khai thác"}]},
  {t:{"en": "Corner Crossing — Aim & Methods", "vi": "Vượt góc — Mục đích & Phương pháp"},fc:true,d:{"en": "Movement around corners is a point of danger. The aim is to expose as small a target as possible while allowing the officer to see if a suspect is on the other side. Two methods: Tactical Angle Widening ('slicing the pie') and the Flash method.", "vi": "Di chuyển quanh góc là điểm nguy hiểm. Mục đích là để lộ diện tích mục tiêu càng nhỏ càng tốt trong khi sĩ quan vẫn nhìn được phía bên kia góc. Hai phương pháp: Mở rộng góc chiến thuật (“cắt lát bánh”) và phương pháp Chớp náng."},st:[{"en": "Tactical Angle Widening ('slicing the pie') — recommended", "vi": "Mở rộng góc chiến thuật (“cắt lát bánh”) — khuyến nghị"}, {"en": "Flash method — not recommended unless the situation dictates an aggressive immediate response", "vi": "Phương pháp chớp náng — không khuyến nghị trừ khi tình huống cần phản ứng nhanh, tấn công"}, {"en": "Mirrors can be used to search around corners before movement, with one of the other techniques", "vi": "Có thể dùng gương để quan sát quanh góc trước khi di chuyển, kết hợp với một trong các kỹ thuật khác"}]},
  {t:{"en": "Slicing the Pie (Angle Widening)", "vi": "Cắt lát bánh (Mở rộng góc)"},fc:true,d:{"en": "The officer moves away from the wall slowly, remaining behind the corner and gradually widening the angle of view until the area is confirmed clear. The wall continues to cover the officer if a threat appears.", "vi": "Sĩ quan di chuyển ra khỏi tường từ từ, giữ người sau góc và dần dần mở rộng góc nhìn cho đến khi xác nhận khu vực trống. Bức tường tiếp tục che chở sĩ quan nếu xuất hiện mối đe dọa."},st:[{"en": "As a buddy team, the officers work together to 'slice the pie'", "vi": "Khi hoạt động theo tổ đôi, hai sĩ quan phối hợp để “cắt lát bánh”"}]},
  {t:{"en": "Flash Method & Quick Look", "vi": "Phương pháp chớp náng & Nhìn nhanh"},fc:true,d:{"en": "The lead officer takes a very quick step around the corner with the weapon at high ready and then proceeds in force. A degree of safety is compromised when forward progress must be aggressive.", "vi": "Sĩ quan dẫn đầu bước thật nhanh vòng qua góc với súng ở tư thế sẵn sàng cao rồi tiến quân cưỡng chế. Một mức độ an toàn sẽ bị hy sinh khi cần tiến quân quyết liệt."},st:[{"en": "Can be used in conjunction with a mirror to confirm the area is clear", "vi": "Có thể kết hợp với gương để xác nhận khu vực trống"}, {"en": "Quick look: stick the head out and withdraw in almost one swift movement with eyes open — done so fast that the brain only registers the image when back behind cover", "vi": "Nhìn nhanh: thò đầu ra và rút lại trong gần như một chuyển động nhanh với mắt mở — nhanh đến mức não chỉ ghi nhận hình ảnh khi đã về sau vật che"}, {"en": "To be performed correctly, must be done extremely quickly with eyes open", "vi": "Để thực hiện đúng, phải thực hiện cực nhanh với mắt mở"}]},
  {t:{"en": "Peripheral Approach Phase", "vi": "Giai đoạn tiếp cận ngoại vi"},fc:true,d:{"en": "Reaching the specific part of the building where the suspect is located is a critical phase: higher risk of detection, the environment change may require a change of progression method, and communication must be maintained between inside and outside.", "vi": "Đến khu vực cụ thể của tòa nhà nơi nghi phạm ẩn náu là giai đoạn quan trọng: nguy cơ bị phát hiện cao hơn, sự thay đổi môi trường có thể đòi hỏi thay đổi phương pháp di chuyển và phải duy trì liên lạc giữa trong và ngoài."},st:[{"en": "Use your 'outside eyes' (observers or snipers) and report on the progression of the arrest team", "vi": "Dùng “đôi mắt bên ngoài” (quan sát viên hoặc bắn tỉa) và báo cáo về tiến trình của đội bắt giữ"}, {"en": "The team must work closely together; use a plan of the building with designated locations", "vi": "Đội phải phối hợp chặt chẽ; dùng sơ đồ tòa nhà với các vị trí đã chỉ định"}, {"en": "Give contingency plans for all elements before the operation starts", "vi": "Đưa ra kế hoạch dự phòng cho mọi thành phần trước khi hoạt động bắt đầu"}, {"en": "Keep everybody informed", "vi": "Giữ cho mọi người được thông báo"}]},
  {t:{"en": "Indoor Progression Principles", "vi": "Các nguyên tắc di chuyển trong nhà"},fc:true,d:{"en": "Key rules for operating inside a building: no progression without fixed fire support, avoid elevators, limit radio traffic, cell phones on silent, weapons with chambered ammunition, avoid touching walls, and keep non-lethal solutions immediately available.", "vi": "Các quy tắc chính khi hoạt động trong nhà: không di chuyển nếu không có hỏa lực y trợ cố định, tránh thang máy, hạn chế liên lạc radio, điện thoại để chế độ im lặng, vũ khí có đạn ở nòng, tránh chạm tường và giữ các phương án không gây chết người ở trong tầm tay."},st:[{"en": "No progression without a fixed fire support", "vi": "Không di chuyển nếu không có hỏa lực y trợ cố định"}, {"en": "Avoid the elevators — risk of being trapped and meeting residents", "vi": "Tránh thang máy — nguy cơ bị kẹt và gặp cư dân"}, {"en": "Limit radio traffic once inside — criminals carry scanners; radio waves may trigger explosive devices", "vi": "Hạn chế liên lạc radio khi đã vào trong — tội phạm có thể mang máy quét; sóng radio có thể kích nổ thiết bị"}, {"en": "All cell phones on silence; weapons with chambered ammunition (four golden rules of firearm safety)", "vi": "Mọi điện thoại để chế độ im lặng; vũ khí có đạn ở nòng (bốn nguyên tắc vàng an toàn súng)"}, {"en": "Avoid touching/sliding along walls — noise, and ricochet can travel parallel to the wall", "vi": "Tránh chạm/trượt dọc tường — gây tiếng ồn và đạn bắn vào tường có thể bật lại song song với tường"}, {"en": "Keep non-lethal solutions immediately available (SKP, tasers, teargas, flash-bangs)", "vi": "Giữ các giải pháp không gây chết người trong tầm tay (súng bắn đạn cao su, súng điện, hơi cay, lựu đạn choáng)"}]},
  {t:{"en": "Communication & Movement Inside", "vi": "Liên lạc & di chuyển bên trong"},fc:true,d:{"en": "Teams inside the building communicate by tactical signs or touch to maintain silence. Lights should not be turned on; subdued lighting conceals movement. Multiple targets should be dealt with at the same time to preserve surprise.", "vi": "Đội bên trong tòa nhà liên lạc bằng tín hiệu chiến thuật hoặc chạm tay để giữ im lặng. Không nên bật đèn; ánh sáng dịu che giấu sự di chuyển. Nhiều mục tiêu nên được xử lý cùng một lúc để giữ tính bất ngờ."},st:[{"en": "Accustom night vision prior to entry; use night vision equipment if possible", "vi": "Làm quen thị giác ban đêm trước khi vào; dùng thiết bị nhìn ban đêm nếu có thể"}, {"en": "Allocate individual areas to clear — two teams on the same area risk a 'blue on blue' encounter", "vi": "Phân khu vực khám xét riêng cho từng đội — hai đội cùng một khu vực có nguy cơ bắn nhầm nhau"}, {"en": "Building clearance must be progressive, leaving officers to secure cleared areas", "vi": "Khám xét tòa nhà phải tiến hành từng bước, để lại sĩ quan bảo vệ các khu vực đã khám xét"}, {"en": "'In Force' only when there is an imminent danger to life; do not mix the two methods", "vi": "“Cưỡng chế” chỉ khi có nguy hiểm tính mạng sắp xảy ra; không trộn lẫn hai phương pháp"}]},
  {t:{"en": "Stairs — Open Stairway Progression", "vi": "Cầu thang — Di chuyển cầu thang hở"},fc:true,d:{"en": "Progressing and clearing stairs is one of the more dangerous elements due to the added third dimension. Proper equipment, low-light considerations, adequate officers, and communication with support are key. Adaptability is essential.", "vi": "Tiến và khám xét cầu thang là một trong những yếu tố nguy hiểm nhất do chiều không gian thứ 3. Trang bị phù hợp, điều kiện ánh sáng yếu, đủ sĩ quan và liên lạc với y trợ là yếu tố quan trọng. Khả năng thích ứng là then chốt."},st:[{"en": "Approach with weapons at the ready, a back safety element covering the corridor below", "vi": "Tiếp cận với vũ khí ở tư thế sẵn sàng, có yếu tố an toàn phía sau y trợ hành lang bên dưới"}, {"en": "Officer #2 opens the vertical corner, followed by officer #1 who covers the front", "vi": "Sĩ quan #2 mở góc thẳng đứng, tiếp theo là sĩ quan #1 y trợ phía trước"}, {"en": "Officers must remain together to cover the 360-degree angle and the third dimension", "vi": "Hai sĩ quan phải ở cạnh nhau để y trợ góc 360 độ và chiều không gian thứ 3"}, {"en": "Three areas of concern: respect your area of responsibility, clear communication, both at the same level", "vi": "Ba điều cần lưu ý: tôn trọng khu vực trách nhiệm, giao tiếp rõ ràng, cả hai ở cùng một mức"}, {"en": "Stair progression = opening all the angles (horizontal, vertical, diagonal) and progressing in safety", "vi": "Di chuyển cầu thang = mở tất cả các góc (ngang, dọc, chéo) và tiến quân an toàn"}]},
  {t:{"en": "Room Entry — Hard vs Tactical", "vi": "Tiến vào phòng — Cưỡng chế so với Chiến thuật"},fc:true,d:{"en": "There are two methods of room entry. 'Hard Entry' means entry by force, breaking the door down, normally operated by a specialist buddy team. 'Tactical Entry' is preferred when the door can be opened quietly and the room checked from the outside — stealth and surprise are maintained.", "vi": "Có hai phương pháp tiến vào phòng. “Đột nhập cưỡng chế” nghĩa là tiến vào bằng vũ lực, phá cửa, thường do tổ đôi chuyên trách thực hiện. “Tiến vào chiến thuật” được ưu tiên khi cửa có thể mở một cách im lặng và phòng được kiểm tra từ bên ngoài — giữ được tính kín đáo và bất ngờ."},st:[{"en": "Hard entry: ram the door only on the team leader's 'go'; the break-in buddy team moves back to let the rest in", "vi": "Đột nhập cưỡng chế: chỉ phá cửa khi có lệnh “go” của trưởng đội; tổ phá cửa lùi lại để cho phần còn lại tiến vào"}, {"en": "Tactical entry: door opened or open without breaking — stealth maintained", "vi": "Tiến vào chiến thuật: cửa được mở hoặc đã mở sẵn không cần phá — giữ được tính kín đáo"}]},
  {t:{"en": "Room Entry — Methods", "vi": "Tiến vào phòng — Các phương pháp"},fc:true,d:{"en": "There are three methods for entering the room, depending on circumstances. Officer 1 moves to the left and clears behind the door; officer 2 moves to the right and clears the corner not visible from outside. Officers must enter at the same time to confuse any suspect and present two targets.", "vi": "Có ba phương pháp để tiến vào phòng, tùy hoàn cảnh. Sĩ quan 1 di chuyển sang trái và khám xét sau cửa; sĩ quan 2 di chuyển sang phải và khám xét góc không nhìn thấy từ ngoài. Hai sĩ quan phải vào cùng một lúc để gây bối rối cho nghi phạm và tạo ra hai mục tiêu."},st:[{"en": "Enter from one side: officer 1 left, clearing behind the door; officer 2 right, clearing the unseen corner", "vi": "Vào từ một bên: sĩ quan 1 sang trái, khám xét sau cửa; sĩ quan 2 sang phải, khám xét góc khuất"}, {"en": "From either side of the doorway: direct to opposite corners, or the hook method staying on the entry side", "vi": "Từ hai bên cửa: vào thẳng các góc đối diện hoặc phương pháp móc câu giữ cùng phía vào và khám xét phần đó"}, {"en": "Do not become focused on any particular area — a threat may appear from any part of the room", "vi": "Không tập trung vào bất kỳ khu vực nào cụ thể — mối đe dọa có thể xuất hiện từ bất kỳ đâu trong phòng"}]},
  {t:{"en": "Room Entry — Tactical Principles", "vi": "Tiến vào phòng — Các nguyên tắc chiến thuật"},fc:true,d:{"en": "Hard entry assumes the suspect will be alerted. Unless the suspect can be subdued in less than ten seconds after breaking the door, don't use hard entry. If compromised and the suspect is armed, negotiate and isolate the area.", "vi": "Đột nhập cưỡng chế giả định nghi phạm sẽ bị cảnh báo. Trừ khi khống chế được nghi phạm trong chưa đầy mười giây sau khi phá cửa, không nên dùng đột nhập cưỡng chế. Nếu lộ và nghi phạm có vũ khí, đàm phán và cô lập khu vực."},st:[{"en": "For several rooms: the closer to the last room, the safer the entry technique must be", "vi": "Với nhiều phòng: càng gần phòng cuối cùng, kỹ thuật tiến vào phải càng an toàn"}, {"en": "For the last room, don't enter — attempt to call the suspect out", "vi": "Đối với phòng cuối, không vào — cố gọi nghi phạm ra"}, {"en": "The 'go' to enter a room is given by the officer entering first, by signs or touch", "vi": "Lệnh “go” vào phòng do sĩ quan vào trước ra, bằng tín hiệu hoặc chạm tay"}, {"en": "Go beyond the peripheral sight of the suspect, two at a time; never stay in the doorway", "vi": "Tiến vào vượt qua tầm nhìn ngoại vi của nghi phạm, hai người cùng lúc; không bao giờ dừng ở cửa"}, {"en": "Use the ballistic shield (if available) with a team of three; search rooms thoroughly, keeping protective equipment on", "vi": "Dùng khiên chống đạn (nếu có) với đội ba người; khám xét phòng kỹ lưỡng, giữ trang bị bảo hộ"}]},
  {t:{"en": "Search of Rooms", "vi": "Khám xét phòng"},fc:true,d:{"en": "The search must be conducted swiftly but methodically. A cursory search may miss the hiding place, allowing the suspect to escape or attack the team from the rear. The standard principles apply (attitude, protection, communication, support).", "vi": "Khám xét phải được tiến hành nhanh nhưng có phương pháp. Khám xét qua loa có thể bỏ sót nơi ẩn náu, khiến nghi phạm trốn thoát hoặc tấn công từ phía sau. Áp dụng các nguyên tắc chuẩn (thái độ, bảo vệ, liên lạc, y trợ)."},st:[{"en": "Using a tactical shield doesn't supersede the usual searching methods — it creates an intermediate between tactical and 'hard entry'", "vi": "Dùng khiên chiến thuật không thay thế các phương pháp khám xét thông thường — nó tạo ra bước trung gian giữa chiến thuật và “đột nhập cưỡng chế”"}, {"en": "Requires a lot of training and perfect coordination", "vi": "Đòi hỏi nhiều đào tạo và sự phối hợp hoàn hảo"}]},
  {t:{"en": "Lesson 3 — Low Light Tactical Environment", "vi": "Bài 3 — Môi trường chiến thuật ánh sáng yếu"},fc:true,d:{"en": "There is a basic distinction between night time and a low/no light environment during day time. At night the whole environment is in darkness and the body adjusts eyes and brain, but the body is normally more tired, reducing reaction time.", "vi": "Có sự khác biệt cơ bản giữa môi trường ban đêm và môi trường ít/không ánh sáng ban ngày. Ban đêm cả môi trường chìm trong bóng tối, cơ thể điều chỉnh mắt và não, nhưng cơ thể thường mệt mỏi hơn, làm giảm thời gian phản ứng."},st:[{"en": "Day time low light: brain has more difficulty adjusting after being in daylight; adjustment time is crucial in the first minutes", "vi": "Ánh sáng yếu ban ngày: não khó điều chỉnh hơn sau khi ở ngoài ánh sáng ban ngày; thời gian điều chỉnh rất quan trọng trong những phút đầu"}, {"en": "Rhodopsin in the rods of the eye bleaches when exposed to light; ~30 min to fully regenerate, most adaptation in the first 5-10 min", "vi": "Rhodopsin trong tế bào hình que của mắt bị tẩy màu khi gặp ánh sáng; mất ~30 phút để phục hồi hoàn toàn, phần lớn sự thích nghi xảy ra trong 5-10 phút đầu"}, {"en": "77% of shootings happen in low light; shooting performance drops ~30% in low light", "vi": "77% các vụ nổ súng xảy ra trong điều kiện ánh sáng yếu; hiệu suất bắn giảm ~30% trong điều kiện ánh sáng yếu"}]},
  {t:{"en": "Low Light — Tactical Principles", "vi": "Ánh sáng yếu — Các nguyên tắc chiến thuật"},fc:true,d:{"en": "With the use of a torch/flashlight there are two simple rules: use it only when necessary, and use it scarcely. The white light will reveal your position to the suspect and destroy night/low light vision.", "vi": "Khi sử dụng đèn pin có hai quy tắc đơn giản: chỉ dùng khi cần thiết và dùng hạn chế. Ánh sáng trắng sẽ lộ vị trí của bạn cho nghi phạm và phá hủy khả năng nhìn ban đêm/ánh sáng yếu."},st:[{"en": "Use it only when necessary — when other methods or equipment are not available or relevant", "vi": "Chỉ dùng khi cần thiết — khi các phương pháp hoặc thiết bị khác không có hoặc không phù hợp"}, {"en": "Use it scarcely — it destroys night vision and indicates your location to the suspect", "vi": "Dùng hạn chế — nó phá hủy thị giác ban đêm và cho nghi phạm biết vị trí của bạn"}]},
  {t:{"en": "Low Light — Tactical Considerations", "vi": "Ánh sáng yếu — Cân nhắc chiến thuật"},fc:true,d:{"en": "The beam of most torches will not reveal the whole of a room, but the comfort of having light can give a false feeling of security. Don't overlook the psychological factor on both officer and suspect.", "vi": "Chùm ánh của hầu hết đèn pin sẽ không chiếu sáng cả căn phòng, nhưng sự thoải mái có ánh sáng có thể tạo cảm giác an toàn giả tạo. Đừng bỏ qua yếu tố tâm lý đối với cả sĩ quan và nghi phạm."},st:[{"en": "Red light does not have such a devastating effect on night vision and is easier to conceal — use for environment, maps, equipment", "vi": "Ánh sáng đỏ không ảnh hưởng nặng đến thị giác ban đêm và dễ che giấu hơn — dùng cho môi trường, bản đồ, thiết bị"}, {"en": "White light: keep for illuminating the suspect or areas where there may be a threat", "vi": "Ánh sáng trắng: giữ để soi nghi phạm hoặc các khu vực có thể có mối đe dọa"}, {"en": "Analyze the threat before shooting; don't expose yourself when not needed", "vi": "Phân tích mối đe dọa trước khi bắn; không lộ diện khi không cần thiết"}, {"en": "Roll a lit torch into the room or point a powerful flashlight at the ceiling to light the whole room from behind cover", "vi": "Lăn đèn đang sáng vào phòng hoặc chiếu đèn mạnh lên trần để chiếu sáng cả phòng từ sau vật che"}]},
  {t:{"en": "Tactical Use of the Torch/Flashlight", "vi": "Sử dụng chiến thuật đèn pin"},fc:true,d:{"en": "There are many ways to hold a torch; the main element is comfort. The beam may attract a shot at the officer — do not put it next to your head. Change position immediately after using your light.", "vi": "Có nhiều cách cầm đèn pin; yếu tố chính là sự thoải mái. Chùm ánh có thể thu hút phát bắn vào sĩ quan — không đặt đèn cạnh đầu. Đổi vị trí ngay sau khi dùng đèn."},st:[{"en": "Keep a simple grip — you may hold it for a long time; support the weapon hand or keep the light far from the body", "vi": "Giữ cầm đơn giản — có thể phải cầm lâu; đỡ tay cầm súng hoặc giữ đèn xa cơ thể"}, {"en": "Only use the light briefly, then change position immediately to avoid making a target", "vi": "Chỉ dùng đèn trong thời gian ngắn rồi đổi vị trí ngay để tránh lộ mục tiêu"}]},
  {t:{"en": "Using Your Other Senses", "vi": "Sử dụng các giác quan khác"},fc:true,d:{"en": "Use your other senses like smell and touch, but be careful not to create excessive noise. Use your peripheral vision, avoiding the eye's 'blind spot', rotating the eyes in an 'S' pattern. Be careful with aftershave/perfume — the suspect will also be using their senses.", "vi": "Sử dụng các giác quan khác như khứu giác và xúc giác, nhưng cẩn thận không tạo quá nhiều tiếng ồn. Dùng thị giác ngoại vi, tránh “điểm mù” của mắt, xoay mắt theo hình chữ “S”. Cẩn thận với nước hoa — nghi phạm cũng đang dùng giác quan của chúng."},st:[{"en": "Always leave time for your eyes to adjust to the darkness", "vi": "Luôn dành thời gian cho mắt thích nghi với bóng tối"}, {"en": "You can use the light switch in the room only if it is safe — it may give away your location", "vi": "Chỉ dùng công tắc đèn trong phòng nếu an toàn — nó có thể lộ vị trí của bạn"}]},
  {t:{"en": "Types of Torch/Flashlight", "vi": "Các loại đèn pin"},fc:true,d:{"en": "There are tactical, simple and complex torches/flashlights, each with different uses.", "vi": "Có các loại đèn pin chiến thuật, đơn giản và phức tạp, mỗi loại có công dụng khác nhau."},st:[{"en": "Tactical: many types, worn or held, different filters, colours and high/low intensity beams", "vi": "Chiến thuật: nhiều loại, đeo hoặc cầm, nhiều bộ lọc, màu sắc và cường độ cao/thấp"}, {"en": "Simple: standard domestic types, often limited brightness; useful with a red cover/filter; can be hung on a lanyard around the neck", "vi": "Đơn giản: loại gia dụng tiêu chuẩn, thường độ sáng hạn chế; hữu ích với vỏ/bộ lọc màu đỏ; có thể treo dây quanh cổ"}, {"en": "Complex: combined effects, multi-colours, strobe for distraction and disorientation; complicated to operate when holding a firearm", "vi": "Phức tạp: hiệu ứng kết hợp, nhiều màu, nhấp nháy để đánh lạc hướng; khó thao tác khi đang cầm súng"}]},
  {t:{"en": "Other Lighting Devices", "vi": "Các thiết bị chiếu sáng khác"},fc:true,d:{"en": "Additional lighting includes Cyalume light sticks, projectors, night vision devices, laser pointers, infrared spotters, flash grenades and parachute flares.", "vi": "Các thiết bị chiếu sáng bổ sung gồm thanh phát sáng Cyalume, máy chiếu, thiết bị nhìn ban đêm, con trỏ laser, đèn hồng ngoại, lựu đạn choáng và pháo sáng dù."},st:[{"en": "Cyalume (light/glow sticks): single use, can be thrown into a room while officers remain in cover", "vi": "Cyalume (que phát sáng): dùng một lần, có thể ném vào phòng trong khi sĩ quan giữ vị trí che chắn"}, {"en": "Projectors: several million candle power, dazzle the suspect; strobe projection used as distraction; normally for hostage rescue", "vi": "Máy chiếu: cường độ hàng triệu nến, làm chói mắt nghi phạm; nhấp nháy dùng để đánh lạc hướng; thường dùng trong giải cứu con tin"}, {"en": "Night vision devices: best compromise — see when the suspect cannot; difficulty with close-range distance perception if unfamiliar", "vi": "Thiết bị nhìn ban đêm: sự dung hòa tốt nhất — nhìn thấy khi nghi phạm không thể; khó đánh giá khoảng cách gần nếu không quen"}, {"en": "Laser pointer: pinpointing targets, does not light the area; Infrared spotter: invisible, used with night vision goggles", "vi": "Con trỏ laser: chỉ định mục tiêu, không chiếu sáng khu vực; Đèn hồng ngoại: vô hình, dùng kèm kính nhìn ban đêm"}, {"en": "Flash grenades/stroboscopic balls: create very bright light to distract the suspect; Parachute flares: cover a large area, outdoor only", "vi": "Lựu đạn choáng/quả cầu nhấp nháy: tạo ánh sáng rực rỡ để đánh lạc hướng nghi phạm; Pháo sáng dù: chiếu sáng diện rộng, chỉ dùng ngoài trời"}]},
  {t:{"en": "Tactical Use of Light Devices — 5 Purposes", "vi": "Sử dụng chiến thuật đèn — 5 mục đích"},fc:true,d:{"en": "The use of light serves five main purposes: light an area, illuminate a target, identify a threat, blind and distract a threat, and deter the suspect from leaving or engaging the police.", "vi": "Sử dụng ánh sáng phục vụ năm mục đích chính: chiếu sáng khu vực, soi rõ mục tiêu, nhận dạng mối đe dọa, làm chói và đánh lạc hướng mối đe dọa và ngăn nghi phạm rời khỏi vị trí hoặc đối đầu với cảnh sát."},st:[{"en": "Light an area / Illuminate a target / Identify a threat", "vi": "Chiếu sáng khu vực / Soi rõ mục tiêu / Nhận dạng mối đe dọa"}, {"en": "Blind and distract a threat / Deter the suspect from leaving or engaging the police", "vi": "Làm chói và đánh lạc hướng mối đe dọa / Ngăn nghi phạm rời đi hoặc đối đầu cảnh sát"}, {"en": "Each purpose may require a specific type of device", "vi": "Mỗi mục đích có thể cần một loại thiết bị cụ thể"}]},
  {t:{"en": "Scenario — Search & Clear a Room", "vi": "Tình huống — Khám xét & dọn sạch phòng"},fc:true,d:{"en": "When the suspect is believed to be in a building but the location is unknown and several rooms may need to be searched, use night goggles while clearing. Once located, if the suspect won't surrender, use distraction devices before entering.", "vi": "Khi nghi phạm được cho là ở trong tòa nhà nhưng chưa rõ vị trí và có thể phải khám xét nhiều phòng, hãy dùng kính nhìn ban đêm khi dọn sạch. Khi đã xác định vị trí, nếu nghi phạm không đầu hàng, hãy dùng thiết bị đánh lạc hướng trước khi tiến vào."},st:[{"en": "If no night goggles: use red lights in brief flashes, moving just after", "vi": "Nếu không có kính nhìn ban đêm: dùng đèn đỏ nhấp nháy ngắn, di chuyển ngay sau đó"}, {"en": "Roll a powerful light into a dangerous new area — the suspect is likely to react and give away their position", "vi": "Lăn một đèn mạnh vào khu vực nguy hiểm mới — nghi phạm rất có thể phản ứng và lộ vị trí"}, {"en": "To enter a room where the suspect may be: use distraction light devices (flash grenades, strobes)", "vi": "Để vào phòng có thể có nghi phạm: dùng thiết bị ánh sáng đánh lạc hướng (lựu đạn choáng, đèn nhấp nháy)"}]},
  {t:{"en": "Scenario — Show of Force Required", "vi": "Tình huống — Cần thể hiện sức mạnh"},fc:true,d:{"en": "When the suspect is in a secured location but will not surrender, use powerful projectors to blind the opponent (light wall) and distraction devices when access is necessary, e.g. for hostage rescue.", "vi": "Khi nghi phạm ở trong vị trí được bảo vệ nhưng không chịu đầu hàng, hãy dùng máy chiếu mạnh để làm chói mắt đối phương (bức tường ánh sáng) và thiết bị đánh lạc hướng khi cần tiếp cận, ví dụ giải cứu con tin."},st:[{"en": "Powerful projectors distract/disorientate until surrender", "vi": "Máy chiếu mạnh làm mất tập trung/choáng cho đến khi đầu hàng"}, {"en": "Distraction devices used when it is necessary to enter", "vi": "Thiết bị đánh lạc hướng dùng khi cần tiến vào"}]},
  {t:{"en": "Low Light — Summary", "vi": "Ánh sáng yếu — Tổng kết"},fc:true,d:{"en": "Summary: low light environment, light devices, main purposes of light in tactical progression. The use of all this equipment takes a lot of training, but should not be deemed a substitute for common sense, experience and professionalism.", "vi": "Tổng kết: môi trường ánh sáng yếu, các thiết bị chiếu sáng, các mục đích chính của ánh sáng trong di chuyển chiến thuật. Việc sử dụng tất cả thiết bị này đòi hỏi nhiều đào tạo, nhưng không nên xem đó là thay thế cho lý trí thông thường, kinh nghiệm và tính chuyên nghiệp."}}

  gen:[
  {t:{"en": "L10 · Aim & Relevance", "vi": "L10 · Mục đích & Sự liên quan"},fc:true,d:{"en": "To provide an understanding of human rights implications related to the use of force by law enforcement officials, and the procedures to follow once human rights violations have been detected.", "vi": "Cung cấp sự hiểu biết về các tác động nhân quyền liên quan đến việc sử dụng vũ lực của các quan chức thực thi pháp luật, và các thủ tục cần tuân theo sau khi phát hiện vi phạm nhân quyền."},st:[{"en": "As UNPOL, you must have a clear understanding of human rights standards on the use of force that guide your own operations and your monitoring, mentoring and advising (MMA) of host-State police", "vi": "Là UNPOL, bạn phải hiểu rõ các tiêu chuẩn nhân quyền về sử dụng vũ lực áp dụng cho hoạt động của chính bạn và cho công tác giám sát, cố vấn, đào tạo (MMA) đối với cảnh sát nước sở tại"}, {"en": "Take actions to prevent abuses", "vi": "Thực hiện các hành động để ngăn chặn lạm dụng"}, {"en": "Duration: 90 minutes — 30 min interactive presentation + 60 min scenario-based discussion", "vi": "Thời lượng: 90 phút — 30 phút trình bày tương tác + 60 phút thảo luận theo tình huống"}]},
  {t:{"en": "L10 · Learning Objectives", "vi": "L10 · Mục tiêu học tập"},fc:true,d:{"en": "Participants will be able to apply the principles on use of force based on relevant international human rights standards, explain the permissible circumstances and procedures, and determine the appropriate means of force in different situations typical for Peace Operations.", "vi": "Học viên sẽ có thể áp dụng các nguyên tắc sử dụng vũ lực dựa trên các tiêu chuẩn nhân quyền quốc tế liên quan, giải thích các hoàn cảnh và thủ tục được phép, và xác định biện pháp vũ lực phù hợp trong các tình huống điển hình của hoạt động gìn giữ hòa bình."},st:[{"en": "Follow procedures after force is used", "vi": "Tuân thủ các thủ tục sau khi sử dụng vũ lực"}]},
  {t:{"en": "L10 · Legal Basis for UNPOL Use of Force", "vi": "L10 · Cơ sở pháp lý cho việc sử dụng vũ lực của UNPOL"},fc:true,d:{"en": "UNPOL's use of force is based on the Security Council Mandate and the Status of Forces Agreement (SOFA). The Police CONOPS and Directives on Detention, Searches and Use of Force (DUF) spell out the authority to use force.", "vi": "Việc sử dụng vũ lực của UNPOL dựa trên ủy quyền của Hội đồng Bảo an và Hiệp định về Quy chế lực lượng (SOFA). Khái niệm tác chiến Cảnh sát (CONOPS) và Chỉ thị về Giam giữ, Khám xét và Sử dụng Vũ lực (DUF) nêu rõ thẩm quyền sử dụng vũ lực."},st:[{"en": "UNPOL acts only in the law enforcement paradigm — not under military Rules of Engagement", "vi": "UNPOL chỉ hoạt động theo khuôn khổ thực thi pháp luật — không theo Quy tắc giao chiến quân sự"}, {"en": "The DUF typically imposes stricter standards than military RoE (law enforcement v. IHL paradigm)", "vi": "DUF thường áp đặt các tiêu chuẩn nghiêm ngặt hơn RoE quân sự (khuôn khổ thực thi pháp luật so với luật nhân đạo quốc tế)"}, {"en": "UNPOL must respect international human rights and criminal justice requirements in the Strategic Guidance Framework and mission DUF", "vi": "UNPOL phải tôn trọng các yêu cầu về nhân quyền quốc tế và tư pháp hình sự trong Khung Hướng dẫn Chiến lược và DUF của phái bộ"}, {"en": "In MMA work, IPOs must emphasize that host-State police operate in a human rights/law enforcement paradigm", "vi": "Trong công tác MMA, các IPO phải nhấn mạnh rằng cảnh sát nước sở tại hoạt động theo khuôn khổ nhân quyền/thực thi pháp luật"}]},
  {t:{"en": "L10 · Scenario 1 — What is Use of Force?", "vi": "L10 · Tình huống 1 — Sử dụng vũ lực là gì?"},fc:true,d:{"en": "A CNP patrol car stops near an intersection; officers unfold a map on the hood. Drivers slow down, fearing they might be stopped. Does this behaviour constitute a use of force?", "vi": "Xe tuần tra của Cảnh sát Carana (CNP) dừng gần ngã tư; các sĩ quan mở bản đồ trên nắp ca pô. Các lái xe giảm tốc vì sợ bị dừng lại. Hành vi này có cấu thành sử dụng vũ lực không?"},st:[{"en": "Q1: No — there is no action from the CNP, neither visible nor intended, directed at another person", "vi": "Câu 1: Không — không có hành động nào của CNP, dù nhìn thấy hay chủ ý, nhắm vào người khác"}, {"en": "Q2: Yes — signalling with arms and shouting commands to stop are direct actions with the intent to influence the driver's decisions", "vi": "Câu 2: Có — ra hiệu bằng tay và hô lệnh dừng lại là hành động trực tiếp với ý định tác động đến quyết định của lái xe"}, {"en": "Q3: Observation alone is not use of force — there is no intention to intervene or control the situation", "vi": "Câu 3: Quan sát đơn thuần không phải là sử dụng vũ lực — không có ý định can thiệp hoặc kiểm soát tình hình"}]},
  {t:{"en": "L10 · Definition of Force", "vi": "L10 · Định nghĩa về vũ lực"},fc:true,d:{"en": "Use of force means any verbal command or physical action to gain subject control — the amount of effort required by police to compel compliance by an unwilling subject. It covers a broad range of actions, not only the use of firearms.", "vi": "Sử dụng vũ lực nghĩa là bất kỳ mệnh lệnh bằng lời hoặc hành động vật lý nào nhằm khống chế đối tượng — mức nỗ lực mà cảnh sát cần để buộc một đối tượng không hợp tác tuân thủ. Nó bao gồm nhiều loại hành động, không chỉ việc sử dụng súng ống."},st:[{"en": "Physical means: hands and body, batons, chemical irritants (pepper spray), restraints (handcuffs), dogs, firearms", "vi": "Các biện pháp vật lý: tay và cơ thể, dũi cui, chất kích thích hóa học (hơi cay), công cụ khống chế (còng tay), chó, súng ống"}, {"en": "Use of force can inflict harm, cause (serious) injury, and may be lethal in some instances", "vi": "Sử dụng vũ lực có thể gây tổn hại, chấn thương (nghiêm trọng) và trong một số trường hợp có thể gây chết người"}]},
  {t:{"en": "L10 · Scenario 2 — Legal Basis for Intervention", "vi": "L10 · Tình huống 2 — Cơ sở pháp lý để can thiệp"},fc:true,d:{"en": "Two CNP officers encounter a man threatening a woman with a knife. Are they allowed to use force? What is the legal basis?", "vi": "Hai sĩ quan CNP gặp một người đàn ông dùng dao đe dọa một phụ nữ. Họ có được phép sử dụng vũ lực không? Cơ sở pháp lý là gì?"},st:[{"en": "Q1: Yes — with the intention to prevent further harm to the woman", "vi": "Câu 1: Có — với ý định ngăn chặn thiệt hại thêm cho người phụ nữ"}, {"en": "Q2: The intervention could be based on the Carana Police Code (preventive) and/or the code of criminal procedure (arrest a suspect)", "vi": "Câu 2: Can thiệp có thể dựa trên Bộ luật Cảnh sát Carana (phòng ngừa) và/hoặc bộ luật tố tụng hình sự (bắt nghi phạm)"}, {"en": "Q3 (IPOs): Intervene to prevent harm while accounting for their own safety; arrest is only a secondary aim under applicable IPO rules", "vi": "Câu 3 (IPO): Can thiệp để ngăn chặn thiệt hại trong khi đảm bảo an toàn cho bản thân; bắt giữ chỉ là mục đích phụ theo các quy tắc IPO áp dụng"}, {"en": "Q4: Must be determined by the DUF — DUF-UNAC para. 26 determines the use of lethal force, in accordance with the principle of proportionality", "vi": "Câu 4: Phải được xác định bởi DUF — điều 26 DUF-UNAC xác định việc sử dụng vũ lực gây chết người, theo nguyên tắc tương xứng"}]},
  {t:{"en": "L10 · Authority to Use Force (WHEN)", "vi": "L10 · Thẩm quyền sử dụng vũ lực (KHI NÀO)"},fc:true,d:{"en": "The authority for UN Police to use force derives from the Security Council Mandate, the SOFA, the Directive on the Use of Force (DUF), and host-State law (where in line with international standards).", "vi": "Thẩm quyền của Cảnh sát LHQ sử dụng vũ lực bắt nguồn từ ủy quyền Hội đồng Bảo an, SOFA, Chỉ thị về Sử dụng Vũ lực (DUF) và luật pháp nước sở tại (khi phù hợp với tiêu chuẩn quốc tế)."},st:[{"en": "Security Council Mandate: source of use-of-force authority in each specific situation", "vi": "Ủy quyền Hội đồng Bảo an: nguồn của thẩm quyền sử dụng vũ lực trong từng tình huống cụ thể"}, {"en": "SOFA: regulates the presence of the operation, general procedures and tactics", "vi": "SOFA: điều chỉnh sự hiện diện của hoạt động, các thủ tục và chiến thuật chung"}, {"en": "DUF: defines policy, principles and responsibilities, including limits and circumstances (self-defence, defence of the mandate, protection of civilians)", "vi": "DUF: xác định chính sách, nguyên tắc và trách nhiệm, bao gồm giới hạn và hoàn cảnh (tự vệ, bảo vệ ủy quyền, bảo vệ dân thường)"}, {"en": "Host-State law: followed only to the extent it is in line with international standards; UNPOL should seek guidance from chain of command in case of contradictions", "vi": "Luật nước sở tại: chỉ tuân theo trong phạm vi phù hợp với tiêu chuẩn quốc tế; UNPOL nên xin chỉ đạo từ chuỗi chỉ huy khi có mâu thuẫn"}]},
  {t:{"en": "L10 · Limits on Use of Force (HOW)", "vi": "L10 · Giới hạn sử dụng vũ lực (NHƯ THẾ NÀO)"},fc:true,d:{"en": "Limits come from International Human Rights Law (UDHR, ICCPR, CAT) and international criminal justice standards, notably the UN Basic Principles on the Use of Force and Firearms and the Code of Conduct for Law Enforcement Officials.", "vi": "Các giới hạn xuất phát từ Luật Nhân quyền Quốc tế (UDHR, ICCPR, CAT) và các tiêu chuẩn tư pháp hình sự quốc tế, đặc biệt là Các Nguyên tắc cơ bản của LHQ về Sử dụng Vũ lực và Súng ống và Bộ Quy tắc ứng xử cho Các quan chức thực thi pháp luật."},st:[{"en": "Any use of force must be based on: legality, necessity, proportionality, non-discrimination, precaution and accountability", "vi": "Mọi việc sử dụng vũ lực phải dựa trên: tính hợp pháp, tính cần thiết, tính tương xứng, không phân biệt đối xử, phòng ngừa và trách nhiệm giải trình"}]},
  {t:{"en": "L10 · Principle of Legality", "vi": "L10 · Nguyên tắc hợp pháp"},fc:true,d:{"en": "The principle of legality has three components: there must be a sufficiently defined legal basis; the legal basis must comply with international law; and the force must be used to achieve a lawful law enforcement objective.", "vi": "Nguyên tắc hợp pháp có ba thành phần: phải có cơ sở pháp lý được xác định rõ ràng; cơ sở pháp lý phải tuân thủ luật pháp quốc tế; và vũ lực phải được sử dụng nhằm đạt được mục tiêu thực thi pháp luật hợp pháp."},st:[{"en": "Domestic law must define when force may be used and for what purpose, clearly and unambiguously", "vi": "Luật quốc gia phải xác định khi nào vũ lực được sử dụng và với mục đích gì, một cách rõ ràng và không mơ hồ"}, {"en": "Force for personal gain or as ad hoc punishment is never compliant with the principle of legality", "vi": "Sử dụng vũ lực vì lợi ích cá nhân hoặc như hình phạt tùy tiện không bao giờ tuân thủ nguyên tắc hợp pháp"}]},
  {t:{"en": "L10 · Scenario 3.a — Necessity", "vi": "L10 · Tình huống 3.a — Tính cần thiết"},fc:true,d:{"en": "Officers stop a nervous cab driver who refuses to get out. One officer pulls him out and slams him across the hood; the other handcuffs him. Are the officers' actions legal?", "vi": "Các sĩ quan dừng một tài xế taxi lo lắng từ chối xuống xe. Một sĩ quan lôi anh ta ra và đập anh ta lên nắp ca pô; người kia còng tay anh ta. Hành động của họ có hợp pháp không?"},st:[{"en": "Q1: No — the principle of necessity is not apparent; pulling the person out and slamming him across the hood is not proportional", "vi": "Câu 1: Không — nguyên tắc cần thiết không rõ ràng; lôi người ra và đập anh ta lên nắp ca pô không tương xứng"}, {"en": "The necessity of handcuffing is also questionable; since the initial intervention is illegal, related interventions are illegal as well", "vi": "Tính cần thiết của việc còng tay cũng đáng nghi ngờ; vì can thiệp ban đầu bất hợp pháp, các can thiệp liên quan cũng bất hợp pháp"}]},
  {t:{"en": "L10 · Principle of Necessity", "vi": "L10 · Nguyên tắc cần thiết"},fc:true,d:{"en": "Use of force is the last resort. Law enforcement officials shall apply non-violent means as far as possible before resorting to force and firearms. Police must proactively de-escalate potentially violent situations.", "vi": "Sử dụng vũ lực là giải pháp cuối cùng. Các quan chức thực thi pháp luật phải áp dụng các biện pháp không bạo lực càng nhiều càng tốt trước khi dùng đến vũ lực và súng ống. Cảnh sát phải chủ động giảm leo thang các tình huống có khả năng bạo lực."},st:[{"en": "Step 1: No force if non-forcible means can be employed (e.g., negotiate voluntary surrender)", "vi": "Bước 1: Không dùng vũ lực nếu có thể dùng biện pháp không vũ lực (ví dụ đàm phán đầu hàng tự nguyện)"}, {"en": "Step 2: Only minimum use of force necessary (e.g., bodily force rather than a Taser if sufficient)", "vi": "Bước 2: Chỉ dùng mức vũ lực tối thiểu cần thiết (ví dụ dùng vũ lực cơ thể thay vì súng điện nếu đủ)"}, {"en": "Necessity includes a temporal component: force is lawful only until the objective is accomplished or becomes unachievable", "vi": "Tính cần thiết bao gồm yếu tố thời gian: vũ lực chỉ hợp pháp cho đến khi mục tiêu đạt được hoặc không thể đạt được nữa"}]},
  {t:{"en": "L10 · Scenario 3.b — Proportionality", "vi": "L10 · Tình huống 3.b — Tính tương xứng"},fc:true,d:{"en": "The cab driver locks his doors and pulls a wooden club, throws out the car key but refuses to get out. One officer shoots at the car, deflating a tire. Are the officers' actions legal?", "vi": "Tài xế taxi khóa cửa và rút một cây gậy gỗ, ném chìa khóa ra ngoài nhưng không chịu xuống xe. Một sĩ quan bắn vào xe làm xẹp lốp. Hành động của họ có hợp pháp không?"},st:[{"en": "Q2: No — there was no need to use the firearm; the driver could not start the vehicle without its key", "vi": "Câu 2: Không — không cần thiết phải dùng súng; tài xế không thể khởi động xe nếu không có chìa khóa"}, {"en": "The requirements for using firearms are particularly high and must be respected; officers should have worked to de-escalate", "vi": "Các yêu cầu khi sử dụng súng rất cao và phải được tôn trọng; các sĩ quan đáng lẽ phải tìm cách giảm leo thang"}]},
  {t:{"en": "L10 · Principle of Proportionality", "vi": "L10 · Nguyên tắc tương xứng"},fc:true,d:{"en": "Whenever lawful use of force is unavoidable, UNPOL shall act in proportion to the seriousness of the offence or threat and the legitimate objective. Damage and injury are to be minimized; a range of means for differentiated use of force is to be made available.", "vi": "Bất cứ khi nào việc sử dụng vũ lực hợp pháp là không thể tránh khỏi, UNPOL phải hành động tương xứng với mức độ nghiêm trọng của hành vi vi phạm hoặc mối đe dọa và mục tiêu hợp pháp. Thiệt hại và thương tích phải được giảm thiểu; phải có sẵn một loạt biện pháp cho việc sử dụng vũ lực phân cấp."},st:[{"en": "If catching a petty thief requires firearms (potentially lethal force), officials should refrain — even if the thief escapes", "vi": "Nếu bắt một kẻ trộm vặt cần phải dùng súng (có thể gây chết người), các quan chức nên từ bỏ — kể cả khi kẻ trộm bỏ trốn"}, {"en": "Police cannot accept civilian casualties (unlike the military in armed conflict)", "vi": "Cảnh sát không được chấp nhận thương vong dân thường (khác với quân đội trong xung đột vũ trang)"}, {"en": "Assessed based on what a reasonable officer knew or could have known at the time (“heat of the moment”), not hindsight", "vi": "Đánh giá dựa trên những gì một sĩ quan hợp lý biết hoặc có thể biết vào thời điểm đó (“trong lúc nóng”), không phải nhìn lại sau này"}]},
  {t:{"en": "L10 · Range of Means (Continuum of Force)", "vi": "L10 · Thang độ vũ lực (Liên tục vũ lực)"},fc:true,d:{"en": "The type and development of the situation determines what approach is proportional. Gradation of response and early involvement to prevent escalation are the norm; dialogue and mediation must be applied whenever possible.", "vi": "Loại hình và diễn biến của tình huống quyết định biện pháp nào là tương xứng. Phân cấp mức độ phản ứng và tham gia sớm để ngăn chặn leo thang là chuẩn mực; đối thoại và hòa giải phải được áp dụng bất cứ khi nào có thể."},st:[{"en": "Normal threat (peaceful assembly): presence, dialogue, information, de-escalation", "vi": "Mối đe dọa bình thường (tập hợp hòa bình): hiện diện, đối thoại, cung cấp thông tin, giảm leo thang"}, {"en": "Serious threat (non-compliant, resistant): show of force, then reasonable and proportional less-lethal means only", "vi": "Mối đe dọa nghiêm trọng (không tuân thủ, kháng cự): thể hiện sức mạnh, sau đó chỉ dùng các biện pháp không gây chết người hợp lý và tương xứng"}, {"en": "Imminent threat (deadly threat to officers/bystanders): proportional and reasonable use of firearms; intentional lethal force only where absolutely necessary to protect life", "vi": "Mối đe dọa sắp xảy ra (đe dọa chết người với sĩ quan/người xung quanh): sử dụng súng hợp lý và tương xứng; vũ lực chủ ý gây chết người chỉ khi thật sự không thể tránh khỏi để bảo vệ tính mạng"}, {"en": "The continuum does NOT imply step-by-step escalation — officers choose the most appropriate response based on their assessment", "vi": "Thang độ vũ lực KHÔNG có nghĩa là leo thang từng bước — sĩ quan chọn phản ứng phù hợp nhất dựa trên đánh giá của họ"}]},
  {t:{"en": "L10 · Types & Means of Force", "vi": "L10 · Các loại và biện pháp vũ lực"},fc:true,d:{"en": "UNPOL should be able to choose from a range of instruments and techniques to use the least intrusive and most proportional one in the circumstances.", "vi": "UNPOL cần có khả năng lựa chọn từ một loạt công cụ và kỹ thuật để sử dụng biện pháp ít xâm phạm nhất và tương xứng nhất trong hoàn cảnh đó."},st:[{"en": "Without instruments: open-hand, pressure points, body impact, hard empty hand, closed hand (fists)", "vi": "Không dùng công cụ: lòng bàn tay, ấn huyệt, va chạm cơ thể, kỹ thuật tay không cứng, nắm đấm"}, {"en": "Using instruments: sticks/batons, shields, handcuffs, chemical irritants, water cannon, dogs, electroshock weapons, kinetic impact weapons, firearms", "vi": "Dùng công cụ: gậy/dũi cui, khiên, còng tay, chất kích thích hóa học, súng phun nước, chó, vũ khí điện giật, vũ khí động năng, súng ống"}, {"en": "Most applications of force do not involve instruments — they use hands, arms and body to gain control", "vi": "Hầu hết các trường hợp sử dụng vũ lực không dùng công cụ — mà dùng tay, cánh tay và cơ thể để khống chế"}]},
  {t:{"en": "L10 · Non-discrimination", "vi": "L10 · Không phân biệt đối xử"},fc:true,d:{"en": "IPOs and FPUs must respect and protect the human rights of every person without discrimination on the basis of race, colour, sex, language, religion, political or other opinion, national or social origin, property, birth or other status.", "vi": "Các IPO và FPU phải tôn trọng và bảo vệ nhân quyền của mọi người không phân biệt chủng tộc, màu da, giới tính, ngôn ngữ, tôn giáo, quan điểm chính trị hoặc quan điểm khác, nguồn gốc dân tộc hoặc xã hội, tài sản, nơi sinh hoặc địa vị khác."},st:[{"en": "It would be unlawful to introduce racial profiling at stop and search checkpoints", "vi": "Việc áp dụng hồ sơ chủng tộc tại các chốt dừng xe và khám xét là bất hợp pháp"}, {"en": "Non-discrimination must be built into the assessment of necessity and proportionality", "vi": "Không phân biệt đối xử phải được lồng ghép vào việc đánh giá tính cần thiết và tương xứng"}]},
  {t:{"en": "L10 · Precaution", "vi": "L10 · Phòng ngừa"},fc:true,d:{"en": "UNPOL officers at all levels should take precautions to avoid or minimize the use of force. This requires above all effective planning prior to law enforcement operations.", "vi": "Các sĩ quan UNPOL ở mọi cấp nên thực hiện các biện pháp phòng ngừa để tránh hoặc giảm thiểu việc sử dụng vũ lực. Điều này đòi hỏi trên hết phải lập kế hoạch hiệu quả trước các hoạt động thực thi pháp luật."},st:[{"en": "Plan for: equipment with proper training, personnel and orders, command and control, vulnerable groups (children, elderly)", "vi": "Lập kế hoạch cho: trang thiết bị với đào tạo phù hợp, nhân sự và mệnh lệnh, chỉ huy và kiểm soát, các nhóm dễ bị tổn thương (trẻ em, người già)"}, {"en": "Negative example: using firearms against a violent crowd because deployed in too small numbers or without less-lethal equipment", "vi": "Ví dụ tiêu cực: phải dùng súng với đám đông bạo lực vì triển khai quá ít người hoặc không có thiết bị không gây chết người"}]},
  {t:{"en": "L10 · Use of Force Equipment", "vi": "L10 · Trang thiết bị sử dụng vũ lực"},fc:true,d:{"en": "UNPOL must have adequate protective equipment; authorized equipment is detailed in the DUF. Safety and security of UN police is a priority — police must be protected to protect civilians.", "vi": "UNPOL phải có trang thiết bị bảo hộ đầy đủ; các thiết bị được phép sử dụng được nêu chi tiết trong DUF. An toàn và an ninh của cảnh sát LHQ là ưu tiên — cảnh sát phải được bảo vệ để bảo vệ dân thường."},st:[{"en": "MoU between police contributing country and UN details what equipment must be brought", "vi": "Biên bản ghi nhớ (MoU) giữa nước cử cảnh sát và LHQ nêu chi tiết thiết bị phải mang theo"}, {"en": "FPUs are not allowed to use rubber-coated metal bullets for public order management", "vi": "Các FPU không được phép dùng đạn kim loại bọc cao su cho quản lý trật tự công cộng"}, {"en": "The more exposed and unprotected officers are, the more likely they are to resort to excessive force", "vi": "Sĩ quan càng lộ diện và không được bảo vệ thì càng có khả năng sử dụng vũ lực quá mức"}]},
  {t:{"en": "L10 · Accountability", "vi": "L10 · Trách nhiệm giải trình"},fc:true,d:{"en": "Police officers will be investigated, subjected to due process, and punished for any excessive, arbitrary or abusive use of force and/or firearms. Commanders are accountable for any use of force by officers under their command.", "vi": "Các sĩ quan cảnh sát sẽ bị điều tra, xử lý theo đúng trình tự và bị xử phạt vì bất kỳ việc sử dụng vũ lực và/hoặc súng quá mức, tùy tiện hoặc lạm dụng nào. Chỉ huy phải chịu trách nhiệm về mọi việc sử dụng vũ lực của sĩ quan dưới quyền."},st:[{"en": "Incidents involving use of firearms, injury or death must be immediately reported to the supervisor", "vi": "Các vụ việc liên quan đến sử dụng súng, thương tích hoặc tử vong phải báo cáo ngay cho chỉ huy trực tiếp"}, {"en": "For firearms, serious injury or death: prompt ex officio investigation, then disciplinary/criminal measures as warranted", "vi": "Đối với sử dụng súng, thương tích nghiêm trọng hoặc tử vong: tiến hành điều tra ngay theo chức trách, sau đó các biện pháp kỷ luật và hình sự nếu cần"}, {"en": "Superiors who knew or should have known about abuses but failed to act also bear responsibility", "vi": "Cấp trên biết hoặc đáng lẽ phải biết về các hành vi lạm dụng nhưng không hành động cũng phải chịu trách nhiệm"}, {"en": "UNPOL will regularly monitor, mentor and advise host-State police on investigating use-of-force incidents", "vi": "UNPOL sẽ thường xuyên giám sát, cố vấn và đào tạo cảnh sát nước sở tại về việc điều tra các vụ sử dụng vũ lực"}]},
  {t:{"en": "L10 · UN Principles on Use of Firearms", "vi": "L10 · Các nguyên tắc của LHQ về sử dụng súng"},fc:true,d:{"en": "Firearms shall be used only in extreme circumstances. They are always the last option and can be used only when less extreme means are insufficient.", "vi": "Súng chỉ được sử dụng trong các hoàn cảnh cực đoan. Súng luôn là lựa chọn cuối cùng và chỉ được dùng khi các biện pháp ít cực đoan hơn không đủ."},st:[{"en": "Self-defence or defence of others against imminent threat of death or serious injury", "vi": "Tự vệ hoặc bảo vệ người khác trước mối đe dọa tử vong hoặc thương tích nghiêm trọng sắp xảy ra"}, {"en": "To prevent serious crime involving a grave threat of life; or arrest/prevent escape of a person posing a grave threat to life", "vi": "Để ngăn chặn tội phạm nghiêm trọng đe dọa nghiêm trọng đến tính mạng; hoặc bắt giữ/ngăn trốn thoát của người gây đe dọa nghiêm trọng đến tính mạng"}, {"en": "Intentional lethal force ('shooting to kill') ONLY to protect life against an imminent threat", "vi": "Vũ lực chủ ý gây chết người (“bắn để giết”) CHỈ để bảo vệ tính mạng trước mối đe dọa sắp xảy ra"}, {"en": "No use of firearms for the sole purpose of protecting property", "vi": "Không sử dụng súng chỉ vì mục đích bảo vệ tài sản"}, {"en": "A fleeing thief posing no immediate danger should never be shot at, even if the thief escapes", "vi": "Một kẻ trộm bỏ chạy không gây nguy hiểm trức tiếp không bao giờ được bắn, kể cả khi hắn trốn thoát"}]},
  {t:{"en": "L10 · Intentional Lethal Use of Firearms", "vi": "L10 · Sử dụng súng chủ ý gây chết người"},fc:true,d:{"en": "On rare occasions the only way to stop the threat is by killing the person posing it. Intentional lethal use of firearms may only be made when strictly unavoidable to protect life — a higher threshold than potentially lethal force (which may also protect against serious injury).", "vi": "Trong những trường hợp hiếm hoi, cách duy nhất để chặn đứng mối đe dọa là tiêu diệt kẻ gây ra nó. Việc sử dụng súng chủ ý gây chết người chỉ được thực hiện khi thật sự không thể tránh khỏi để bảo vệ tính mạng — một ngưỡng cao hơn vũ lực có thể gây chết người (vốn cũng có thể bảo vệ chống thương tích nghiêm trọng)."},st:[{"en": "Any other purpose than protecting life amounts to arbitrary use of force and possibly extrajudicial execution", "vi": "Bất kỳ mục đích nào khác ngoài bảo vệ tính mạng đều cấu thành sử dụng vũ lực tùy tiện và có thể là hành quyết ngoài vòng pháp luật"}, {"en": "Example: suicide bomber ready to detonate, or an 'active shooter' scenario posing a threat to further persons", "vi": "Ví dụ: kẻ đánh bom tự sát sẵn sàng kích nổ, hoặc tình huống “xạ thủ đang hoạt động” đe dọa các nạn nhân khác"}]},
  {t:{"en": "L10 · Firearms Procedure (Warning)", "vi": "L10 · Thủ tục sử dụng súng (Cảnh báo)"},fc:true,d:{"en": "Before using firearms, UNPOL must follow a procedure incorporating a clear warning: identify yourself as police, give a clear verbal warning (not a warning shot), and allow adequate time for the warning to be obeyed.", "vi": "Trước khi sử dụng súng, UNPOL phải tuân theo một thủ tục bao gồm cảnh báo rõ ràng: xưng danh là cảnh sát, đưa ra cảnh báo bằng lời rõ ràng (không phải bắn cảnh cáo), và cho đủ thời gian để tuân thủ cảnh báo."},st:[{"en": "Officer to identify himself/herself as police official", "vi": "Sĩ quan phải xưng danh là cảnh sát"}, {"en": "Give a clear verbal warning (not a warning shot due to the risk involved)", "vi": "Đưa ra cảnh báo bằng lời rõ ràng (không bắn cảnh cáo vì rủi ro liên quan)"}, {"en": "Allow adequate time for warning to be obeyed", "vi": "Cho đủ thời gian để tuân thủ cảnh báo"}, {"en": "No warning required if the delay places officers or others at risk of death/serious harm, or is clearly inappropriate or pointless", "vi": "Không cần cảnh báo nếu sự trì hoãn đặt các sĩ quan hoặc người khác vào nguy cơ tử vong/tổn hại nghiêm trọng, hoặc rõ ràng không phù hợp hoặc vô nghĩa"}, {"en": "Host-State police should not use warning shots with live ammunition in densely populated places", "vi": "Cảnh sát nước sở tại không nên bắn cảnh cáo bằng đạn thật ở những nơi đông dân cư"}]},
  {t:{"en": "L10 · Scenario 4 — Firearms Procedure", "vi": "L10 · Tình huống 4 — Thủ tục sử dụng súng"},fc:true,d:{"en": "Two IPOs are in a car accident. The other driver pulls a knife and demands money. Fearing the man will stab them, one IPO shoots him in the leg. Did the IPO act in line with UNPOL firearms procedures?", "vi": "Hai IPO gặp tai nạn ô tô. Tài xế chiếc xe kia rút dao ra và đòi tiền. Sợ người đàn ông sẽ đâm họ, một IPO rút súng bắn vào chân anh ta. IPO đó có hành động đúng theo thủ tục sử dụng súng của UNPOL không?"},st:[{"en": "Q1: No — the IPO did not identify himself or give a warning; proper course: draw the gun for self-defence, create distance, get behind cover, then follow the warning procedure", "vi": "Câu 1: Không — IPO không xưng danh hoặc cảnh báo; cách đúng: rút súng để tự vệ, tạo khoảng cách, ẩn sau vật che, sau đó tuân theo thủ tục cảnh báo"}, {"en": "Participants should consider the circumstances: the man was just in an accident and may act under shock and high stress", "vi": "Học viên nên cân nhắc hoàn cảnh: người đàn ông vừa gặp tai nạn và có thể hành động trong trạng thái sốc và căng thẳng cao"}, {"en": "Q2 (next steps): provide medical aid to all injured, notify relatives/friends, provide a full report, promptly initiate investigation", "vi": "Câu 2 (các bước tiếp theo): cung cấp hỗ trợ y tế cho tất cả người bị thương, thông báo cho người thân/bạn bè, lập báo cáo đầy đủ, nhanh chóng tiến hành điều tra"}]},
  {t:{"en": "L10 · After Any Use of Force", "vi": "L10 · Sau mọi lần sử dụng vũ lực"},fc:true,d:{"en": "UNPOL officers must ensure that anyone injured during a police operation receives proper assistance or first/medical aid promptly, and that relatives and friends of affected persons are notified.", "vi": "Các sĩ quan UNPOL phải đảm bảo rằng bất kỳ ai bị thương trong hoạt động cảnh sát đều nhận được sự hỗ trợ hoặc sơ cứu/y tế kịp thời và người thân hoặc bạn bè của những người liên quan được thông báo."},st:[{"en": "Assistance applies to innocent bystanders, target persons and officers — regardless of who caused the injury", "vi": "Hỗ trợ áp dụng cho người ngoài cuộc, đối tượng và sĩ quan — bất kể ai gây ra thương tích"}, {"en": "These requirements are at the top of the reporting and investigation requirements", "vi": "Các yêu cầu này đứng đầu trong các yêu cầu báo cáo và điều tra"}]},
  {t:{"en": "L10 · Host-State Police Use Excessive Force", "vi": "L10 · Cảnh sát nước sở tại sử dụng vũ lực quá mức"},fc:true,d:{"en": "If UNPOL witnesses, discovers or is made aware of host-State police's excessive use of force or another human rights violation, UNPOL shall put an end to the violation and prevent further violations in line with the mandate and capacity.", "vi": "Nếu UNPOL chứng kiến, phát hiện hoặc được thông báo về việc cảnh sát nước sở tại sử dụng vũ lực quá mức hoặc một vi phạm nhân quyền khác, UNPOL phải chấm dứt vi phạm và ngăn chặn các vi phạm tiếp theo theo ủy quyền và khả năng."},st:[{"en": "Provide assistance to the victim(s) as necessary", "vi": "Cung cấp hỗ trợ cho nạn nhân khi cần thiết"}, {"en": "Mentor and advise host authorities accordingly", "vi": "Cố vấn và đào tạo các nhà chức trách nước sở tại cho phù hợp"}, {"en": "Record relevant information and violation for immediate supervisor", "vi": "Ghi lại thông tin và vi phạm liên quan cho chỉ huy trực tiếp"}, {"en": "Report the violation to the human rights component of the mission and consult on further action", "vi": "Báo cáo vi phạm cho bộ phận nhân quyền của phái bộ và tham vấn về các hành động tiếp theo"}, {"en": "Keep information on victims & witnesses confidential", "vi": "Giữ bí mật thông tin về nạn nhân và nhân chứng"}]},
  {t:{"en": "L10 · Executive vs Non-Executive Mandates", "vi": "L10 · Ủy quyền điều hành so với không điều hành"},fc:true,d:{"en": "In non-executive missions, UNPOL may only use force in a narrow range of circumstances, notably self-defence and defence of others. Under an executive mandate (e.g. UNTAET, UNMIK), UNPOL may assume responsibility for law and order.", "vi": "Trong các phái bộ không điều hành, UNPOL chỉ được sử dụng vũ lực trong một phạm vi hẹp, đặc biệt là tự vệ và bảo vệ người khác. Theo ủy quyền điều hành (ví dụ UNTAET, UNMIK), UNPOL có thể đảm nhận trách nhiệm về pháp luật và trật tự."},st:[{"en": "Six missions with explicit POC mandates: MINUSMA, MINUSCA, UNISFA, UNIFIL, UNMISS, MONUSCO", "vi": "Sáu phái bộ có ủy quyền bảo vệ dân thường rõ ràng: MINUSMA, MINUSCA, UNISFA, UNIFIL, UNMISS, MONUSCO"}, {"en": "Force must be used in accordance with the DUF, which incorporates international standards", "vi": "Vũ lực phải được sử dụng theo DUF, vốn kết hợp các tiêu chuẩn quốc tế"}, {"en": "Excessive use of force and other serious misconduct by UN Police must be reported to the Head of Mission", "vi": "Sử dụng vũ lực quá mức và các hành vi sai trái nghiêm trọng khác của Cảnh sát LHQ phải được báo cáo cho Trưởng phái bộ"}]},
  {t:{"en": "L10 · Implications of (In)appropriate Use of Force", "vi": "L10 · Hệ quả của việc sử dụng vũ lực (không) phù hợp"},fc:true,d:{"en": "Misuse or excessive force negatively affects human rights, the legitimacy of the mission, the cooperation it receives from the local population, and the safety of UN personnel. Appropriate use of force supports the mandate.", "vi": "Lạm dụng hoặc sử dụng vũ lực quá mức ảnh hưởng tiêu cực đến nhân quyền, tính chính danh của phái bộ, sự hợp tác của người dân địa phương và sự an toàn của nhân viên LHQ. Sử dụng vũ lực phù hợp hỗ trợ việc thực hiện ủy quyền."},st:[{"en": "Excessive force risks violence escalation and loss of local population support", "vi": "Vũ lực quá mức có nguy cơ làm leo thang bạo lực và mất sự ủng hộ của người dân"}, {"en": "Failure to use force where the mandate requires can also result in disciplinary or criminal accountability", "vi": "Không sử dụng vũ lực khi ủy quyền yêu cầu cũng có thể dẫn đến trách nhiệm kỷ luật hoặc hình sự"}, {"en": "Some UNPOL may fear violating standards and fail to act — failure to act also harms the mission", "vi": "Một số UNPOL có thể sợ vi phạm tiêu chuẩn mà không hành động — không hành động cũng gây hại cho phái bộ"}]},
