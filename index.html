// ==== 025-030 Patrols + 025-031 Vehicles control (pat) ====
  pat:[
    {t:{en:'Background & Aim',vi:'B\u1ed1i c\u1ea3nh & M\u1ee5c \u0111\u00edch'},
     d:{en:'Patrolling is one of the basic functions of the police, whether in a community environment or in a peacekeeping mission. Within peacekeeping, a more varied patrol regime is needed because of the diversity of potential threats and missions undertaken without an executive authority. FPUs must be aware of the various patrol types and the preparation required to carry out the task safely.',vi:'Tu\u1ea7n tra l\u00e0 m\u1ed9t ch\u1ee9c n\u0103ng c\u01a1 b\u1ea3n c\u1ee7a c\u1ea3nh s\u00e1t, d\u00f9 trong m\u00f4i tr\u01b0\u1eddng c\u1ed9ng \u0111\u1ed3ng hay trong ph\u00e1i b\u1ed9 g\u00ecn gi\u1eef h\u00f2a b\u00ecnh. Trong g\u00ecn gi\u1eef h\u00f2a b\u00ecnh, c\u1ea7n ch\u1ebf \u0111\u1ed9 tu\u1ea7n tra \u0111a d\u1ea1ng h\u01a1n v\u00ec s\u1ef1 \u0111a d\u1ea1ng c\u1ee7a c\u00e1c m\u1ed1i \u0111e d\u1ecda v\u00e0 nhi\u1ec7m v\u1ee5 \u0111\u01b0\u1ee3c th\u1ef1c hi\u1ec7n m\u00e0 kh\u00f4ng c\u00f3 quy\u1ec1n th\u1ef1c thi. FPU ph\u1ea3i n\u1eafm r\u00f5 c\u00e1c lo\u1ea1i tu\u1ea7n tra v\u00e0 c\u00f4ng t\u00e1c chu\u1ea9n b\u1ecb c\u1ea7n thi\u1ebft \u0111\u1ec3 th\u1ef1c hi\u1ec7n nhi\u1ec7m v\u1ee5 an to\u00e0n.'},
     st:[
      {en:'Identify the different types of patrols',vi:'X\u00e1c \u0111\u1ecbnh c\u00e1c lo\u1ea1i tu\u1ea7n tra kh\u00e1c nhau'},
      {en:'Organize, prepare and conduct a patrol',vi:'T\u1ed5 ch\u1ee9c, chu\u1ea9n b\u1ecb v\u00e0 th\u1ef1c hi\u1ec7n m\u1ed9t cu\u1ed9c tu\u1ea7n tra'},
      {en:'Organize a debrief',vi:'T\u1ed5 ch\u1ee9c b\u00e1o c\u00e1o sau tu\u1ea7n tra'}
     ]},
    {t:{en:'Tactical Considerations',vi:'C\u00e2n nh\u1eafc Chi\u1ebfn thu\u1eadt'},fc:true,
     d:{en:'Before conducting a patrol the Commander assesses: legal aspect and use of force, threat assessment, mission of the unit (objective, prevention, repression, identification), coordination with other partners, equipment and strength involved, and availability of patrol brief files.',vi:'Tr\u01b0\u1edbc khi th\u1ef1c hi\u1ec7n tu\u1ea7n tra, Ch\u1ec9 huy \u0111\u00e1nh gi\u00e1: kh\u00eda c\u1ea1nh ph\u00e1p l\u00fd v\u00e0 s\u1eed d\u1ee5ng v\u0169 l\u1ef1c, \u0111\u00e1nh gi\u00e1 \u0111e d\u1ecda, nhi\u1ec7m v\u1ee5 c\u1ee7a \u0111\u01a1n v\u1ecb (m\u1ee5c ti\u00eau, ph\u00f2ng ng\u1eeba, tr\u1ea5n \u00e1p, nh\u1eadn di\u1ec7n), ph\u1ed1i h\u1ee3p v\u1edbi c\u00e1c \u0111\u1ed1i t\u00e1c kh\u00e1c, trang b\u1ecb v\u00e0 l\u1ef1c l\u01b0\u1ee3ng tham gia, v\u00e0 s\u1ef1 s\u1eb5n c\u00f3 c\u1ee7a h\u1ed3 s\u01a1 tu\u1ea7n tra.'},
     st:[
      {en:'Legal aspect and use of force',vi:'Kh\u00eda c\u1ea1nh ph\u00e1p l\u00fd v\u00e0 s\u1eed d\u1ee5ng v\u0169 l\u1ef1c'},
      {en:'Threat assessment',vi:'\u0110\u00e1nh gi\u00e1 \u0111e d\u1ecda'},
      {en:'Mission of the unit (objective to be reached, prevention, repression, identification)',vi:'Nhi\u1ec7m v\u1ee5 c\u1ee7a \u0111\u01a1n v\u1ecb (m\u1ee5c ti\u00eau c\u1ea7n \u0111\u1ea1t, ph\u00f2ng ng\u1eeba, tr\u1ea5n \u00e1p, nh\u1eadn di\u1ec7n)'},
      {en:'Coordination with other partners',vi:'Ph\u1ed1i h\u1ee3p v\u1edbi c\u00e1c \u0111\u1ed1i t\u00e1c kh\u00e1c'},
      {en:'Equipment and strength of the unit involved',vi:'Trang b\u1ecb v\u00e0 l\u1ef1c l\u01b0\u1ee3ng c\u1ee7a \u0111\u01a1n v\u1ecb tham gia'},
      {en:'Availability of patrol brief files',vi:'S\u1ef1 s\u1eb5n c\u00f3 c\u1ee7a h\u1ed3 s\u01a1 tu\u1ea7n tra'}
     ]},
    {t:{en:'Types of Patrols',vi:'C\u00e1c Lo\u1ea1i Tu\u1ea7n tra'},fc:true,
     d:{en:'Patrols can be conducted by many different means depending on the environment, equipment and mission requirements. The main types are foot, vehicle, air and water patrols, plus special patrols using animals or snow equipment in certain areas and climates.',vi:'Tu\u1ea7n tra c\u00f3 th\u1ec3 \u0111\u01b0\u1ee3c th\u1ef1c hi\u1ec7n b\u1eb1ng nhi\u1ec1u ph\u01b0\u01a1ng ti\u1ec7n kh\u00e1c nhau t\u00f9y thu\u1ed9c m\u00f4i tr\u01b0\u1eddng, trang b\u1ecb v\u00e0 y\u00eau c\u1ea7u nhi\u1ec7m v\u1ee5. C\u00e1c lo\u1ea1i ch\u00ednh l\u00e0 tu\u1ea7n tra \u0111i b\u1ed9, ph\u01b0\u01a1ng ti\u1ec7n, \u0111\u01b0\u1eddng kh\u00f4ng v\u00e0 \u0111\u01b0\u1eddng th\u1ee7y, c\u00f9ng tu\u1ea7n tra \u0111\u1eb7c bi\u1ec7t d\u00f9ng \u0111\u1ed9ng v\u1eadt ho\u1eb7c thi\u1ebft b\u1ecb tuy\u1ebft \u1edf m\u1ed9t s\u1ed1 khu v\u1ef1c v\u00e0 kh\u00ed h\u1eadu.'},
     tbl:[
      [{en:'Foot patrols',vi:'Tu\u1ea7n tra \u0111i b\u1ed9'},{en:'most effective - direct interaction with population; restricted to a small area; consider radio reliability and range',vi:'hi\u1ec7u qu\u1ea3 nh\u1ea5t - t\u01b0\u01a1ng t\u00e1c tr\u1ef1c ti\u1ebfp v\u1edbi ng\u01b0\u1eddi d\u00e2n; gi\u1edbi h\u1ea1n trong khu v\u1ef1c nh\u1ecf; xem x\u00e9t \u0111\u1ed9 tin c\u1eady v\u00e0 t\u1ea7m ph\u1ee7 c\u1ee7a b\u1ed9 \u0111\u00e0m'}],
      [{en:'Vehicle patrols',vi:'Tu\u1ea7n tra ph\u01b0\u01a1ng ti\u1ec7n'},{en:'travel further, cover more ground; restricted to what officers see from vehicle; combine with foot patrol in towns',vi:'\u0111i xa h\u01a1n, ph\u1ee7 r\u1ed9ng h\u01a1n; gi\u1edbi h\u1ea1n \u1edf nh\u1eefng g\u00ec s\u0129 quan nh\u00ecn th\u1ea5y t\u1eeb xe; k\u1ebft h\u1ee3p tu\u1ea7n tra b\u1ed9 \u1edf th\u1ecb tr\u1ea5n'}],
      [{en:'Air patrols',vi:'Tu\u1ea7n tra \u0111\u01b0\u1eddng kh\u00f4ng'},{en:'less common due to restricted air facilities; drones or helicopters; helicopters can insert/extract foot patrols',vi:'\u00edt ph\u1ed5 bi\u1ebfn do h\u1ea1n ch\u1ebf ph\u01b0\u01a1ng ti\u1ec7n kh\u00f4ng l\u01b0u; m\u00e1y bay kh\u00f4ng ng\u01b0\u1eddi l\u00e1i ho\u1eb7c tr\u1ef1c th\u0103ng; tr\u1ef1c th\u0103ng c\u00f3 th\u1ec3 \u0111\u01b0a/\u0111\u00f3n tu\u1ea7n tra b\u1ed9'}],
      [{en:'Water patrols',vi:'Tu\u1ea7n tra \u0111\u01b0\u1eddng th\u1ee7y'},{en:'check areas difficult to access; deter river-borne criminal activity or piracy',vi:'ki\u1ec3m tra khu v\u1ef1c kh\u00f3 ti\u1ebfp c\u1eadn; r\u0103n \u0111e t\u1ed9i ph\u1ea1m \u0111\u01b0\u1eddng s\u00f4ng ho\u1eb7c c\u01b0\u1edbp bi\u1ec3n'}],
      [{en:'Special patrols',vi:'Tu\u1ea7n tra \u0111\u1eb7c bi\u1ec7t'},{en:'horses, camels, donkeys; or skis, snowshoes, snowmobiles in cold climates',vi:'ng\u1ef1a, l\u1ea1c \u0111\u00e0, l\u1eeba; ho\u1eb7c v\u00e1n tr\u01b0\u1ee3t, gi\u00e0y tuy\u1ebft, xe tr\u01b0\u1ee3t tuy\u1ebft \u1edf v\u00f9ng l\u1ea1nh'}]
     ]},
    {t:{en:'Patrol Objectives',vi:'M\u1ee5c ti\u00eau Tu\u1ea7n tra'},fc:true,
     d:{en:'The focus of a patrol is oriented by the results expected from the headquarters that initiated it. Objectives include compliance with the mandate, gathering information, crime prevention/repression, supporting investigations, apprehension of offenders, liaison, community policing and keeping contact with isolated detachments.',vi:'Tr\u1ecdng t\u00e2m c\u1ee7a tu\u1ea7n tra \u0111\u1ecbnh h\u01b0\u1edbng theo k\u1ebft qu\u1ea3 mong \u0111\u1ee3i t\u1eeb s\u1edf ch\u1ec9 huy \u0111\u00e3 kh\u1edfi x\u01b0\u1edbng. M\u1ee5c ti\u00eau bao g\u1ed3m tu\u00e2n th\u1ee7 \u1ee7y quy\u1ec1n, thu th\u1eadp th\u00f4ng tin, ph\u00f2ng ng\u1eeba/tr\u1ea5n \u00e1p t\u1ed9i ph\u1ea1m, h\u1ed7 tr\u1ee3 \u0111i\u1ec1u tra, b\u1eaft gi\u1eef t\u1ed9i ph\u1ea1m, li\u00ean l\u1ea1c, c\u1ea3nh s\u00e1t c\u1ed9ng \u0111\u1ed3ng v\u00e0 gi\u1eef li\u00ean l\u1ea1c v\u1edbi c\u00e1c \u0111\u01a1n v\u1ecb c\u00f4 l\u1eadp.'},
     st:[
      {en:'Compliance with the mandate: confirm agreements (ceasefire, curfew), stabilize an area, control an area, determine local groups',vi:'Tu\u00e2n th\u1ee7 \u1ee7y quy\u1ec1n: x\u00e1c nh\u1eadn th\u1ecfa thu\u1eadn (ng\u1eebng b\u1eafn, gi\u1edbi nghi\u00eam), b\u00ecnh \u1ed5n khu v\u1ef1c, ki\u1ec3m so\u00e1t khu v\u1ef1c, x\u00e1c \u0111\u1ecbnh c\u00e1c nh\u00f3m \u0111\u1ecba ph\u01b0\u01a1ng'},
      {en:'Dominating the area - patrols emphasize visibility and deterrence to prove UN presence',vi:'Kh\u1ed1ng ch\u1ebf khu v\u1ef1c - tu\u1ea7n tra nh\u1ea5n m\u1ea1nh s\u1ef1 hi\u1ec7n di\u1ec7n v\u00e0 r\u0103n \u0111e \u0111\u1ec3 ch\u1ee9ng minh s\u1ef1 hi\u1ec7n di\u1ec7n c\u1ee7a LHQ'},
      {en:'Gathering information - ascertain the mood of the population; female officers reach women and children',vi:'Thu th\u1eadp th\u00f4ng tin - n\u1eafm b\u1eaft t\u00e2m tr\u1ea1ng ng\u01b0\u1eddi d\u00e2n; n\u1eef s\u0129 quan ti\u1ebfp c\u1eadn ph\u1ee5 n\u1eef v\u00e0 tr\u1ebb em'},
      {en:'Crime prevention - proactive patrolling, interact with locals, vary times and routes to be unpredictable',vi:'Ph\u00f2ng ng\u1eeba t\u1ed9i ph\u1ea1m - tu\u1ea7n tra ch\u1ee7 \u0111\u1ed9ng, t\u01b0\u01a1ng t\u00e1c v\u1edbi ng\u01b0\u1eddi d\u00e2n, thay \u0111\u1ed5i gi\u1edd gi\u1ea5c v\u00e0 l\u1ed9 tr\u00ecnh kh\u00f3 \u0111o\u00e1n'},
      {en:'Protection of UN staff and facilities - cooperate with UN Security, have an evacuation plan',vi:'B\u1ea3o v\u1ec7 nh\u00e2n vi\u00ean v\u00e0 c\u01a1 s\u1edf LHQ - ph\u1ed1i h\u1ee3p An ninh LHQ, c\u00f3 k\u1ebf ho\u1ea1ch s\u01a1 t\u00e1n'},
      {en:'Liaison with local police and support in non-executive mandate',vi:'Li\u00ean l\u1ea1c v\u1edbi c\u1ea3nh s\u00e1t \u0111\u1ecba ph\u01b0\u01a1ng v\u00e0 h\u1ed7 tr\u1ee3 trong nhi\u1ec7m v\u1ee5 kh\u00f4ng th\u1ef1c thi'},
      {en:'Determine position, volume, armament of local military/police/rebel factions',vi:'X\u00e1c \u0111\u1ecbnh v\u1ecb tr\u00ed, s\u1ed1 l\u01b0\u1ee3ng, v\u0169 kh\u00ed c\u1ee7a c\u00e1c phe qu\u00e2n s\u1ef1/c\u1ea3nh s\u00e1t/n\u1ed5i d\u1eady \u0111\u1ecba ph\u01b0\u01a1ng'},
      {en:'Community policing - interact with the population, maintain neutrality and impartiality',vi:'C\u1ea3nh s\u00e1t c\u1ed9ng \u0111\u1ed3ng - t\u01b0\u01a1ng t\u00e1c v\u1edbi ng\u01b0\u1eddi d\u00e2n, gi\u1eef trung l\u1eadp v\u00e0 v\u00f4 t\u01b0'},
      {en:'Keep contact with isolated detachments - lifeline providing resupply and reinforcements',vi:'Gi\u1eef li\u00ean l\u1ea1c v\u1edbi c\u00e1c \u0111\u01a1n v\u1ecb c\u00f4 l\u1eadp - \u0111\u01b0\u1eddng sinh m\u1ea1ng ti\u1ebfp t\u1ebf v\u00e0 t\u0103ng vi\u1ec7n'},
      {en:'Support investigations - first responders, place a cordon to freeze the crime scene',vi:'H\u1ed7 tr\u1ee3 \u0111i\u1ec1u tra - ng\u01b0\u1eddi \u0111\u1ea7u ti\u00ean c\u00f3 m\u1eb7t, phong t\u1ecfa \u0111\u1ec3 gi\u1eef nguy\u00ean hi\u1ec7n tr\u01b0\u1eddng'}
     ]},
    {t:{en:'Phases of a Patrol',vi:'C\u00e1c Giai \u0111o\u1ea1n Tu\u1ea7n tra'},fc:true,
     d:{en:'A patrol is organised and conducted in four phases: the planning phase, the practical/logistic preparation, the conduct of the patrol itself, and the debriefing and report.',vi:'M\u1ed9t cu\u1ed9c tu\u1ea7n tra \u0111\u01b0\u1ee3c t\u1ed5 ch\u1ee9c v\u00e0 th\u1ef1c hi\u1ec7n theo b\u1ed1n giai \u0111o\u1ea1n: giai \u0111o\u1ea1n l\u1eadp k\u1ebf ho\u1ea1ch, chu\u1ea9n b\u1ecb th\u1ef1c t\u1ebf/h\u1eadu c\u1ea7n, th\u1ef1c hi\u1ec7n tu\u1ea7n tra, v\u00e0 b\u00e1o c\u00e1o sau tu\u1ea7n tra.'},
     st:[
      {en:'Planning phase - commander decides implementation and resources; evaluates options and analyses the best course of action with available intelligence',vi:'Giai \u0111o\u1ea1n l\u1eadp k\u1ebf ho\u1ea1ch - ch\u1ec9 huy quy\u1ebft \u0111\u1ecbnh tri\u1ec3n khai v\u00e0 ngu\u1ed3n l\u1ef1c; \u0111\u00e1nh gi\u00e1 c\u00e1c ph\u01b0\u01a1ng \u00e1n v\u00e0 ph\u00e2n t\u00edch h\u01b0\u1edbng h\u00e0nh \u0111\u1ed9ng t\u1ed1t nh\u1ea5t v\u1edbi tin t\u1ee9c s\u1eb5n c\u00f3'},
      {en:'Intelligence gathering - information on the area, maps, past events, opponent forces, mines/IED, weather',vi:'Thu th\u1eadp tin t\u1ee9c - th\u00f4ng tin khu v\u1ef1c, b\u1ea3n \u0111\u1ed3, s\u1ef1 ki\u1ec7n qu\u00e1 kh\u1ee9, l\u1ef1c l\u01b0\u1ee3ng \u0111\u1ed1i ph\u01b0\u01a1ng, m\u00ecn/IED, th\u1eddi ti\u1ebft'},
      {en:'Operation plan and detailed briefing - task order, warning order, 5-paragraph order format',vi:'K\u1ebf ho\u1ea1ch t\u00e1c chi\u1ebfn v\u00e0 giao nhi\u1ec7m v\u1ee5 chi ti\u1ebft - l\u1ec7nh nhi\u1ec7m v\u1ee5, b\u00e1o \u0111\u1ed9ng tr\u01b0\u1edbc, \u0111\u1ecbnh d\u1ea1ng l\u1ec7nh 5 m\u1ee5c'},
      {en:'Logistic preparation - collective, individual and vehicle equipment checks',vi:'Chu\u1ea9n b\u1ecb h\u1eadu c\u1ea7n - ki\u1ec3m tra trang b\u1ecb t\u1eadp th\u1ec3, c\u00e1 nh\u00e2n v\u00e0 ph\u01b0\u01a1ng ti\u1ec7n'},
      {en:'Conduct of the patrol',vi:'Th\u1ef1c hi\u1ec7n tu\u1ea7n tra'},
      {en:'Debriefing and report - with all patrol members; written report with sketch; check vehicles & equipment',vi:'B\u00e1o c\u00e1o sau tu\u1ea7n tra - v\u1edbi to\u00e0n b\u1ed9 th\u00e0nh vi\u00ean; b\u00e1o c\u00e1o vi\u1ebft k\u00e8m s\u01a1 \u0111\u1ed3; ki\u1ec3m tra ph\u01b0\u01a1ng ti\u1ec7n & trang b\u1ecb'}
     ]},
    {t:{en:'Intelligence Gathering',vi:'Thu th\u1eadp Tin t\u1ee9c'},fc:true,
     d:{en:'The practical preparation phase coordinates with units involved in the mission - UN military, other police units, local police, and specific UN bodies such as JMAC - to gather necessary intelligence, and considers threats such as rebel groups, hostile communities, flooding and damaged roads.',vi:'Giai \u0111o\u1ea1n chu\u1ea9n b\u1ecb th\u1ef1c t\u1ebf ph\u1ed1i h\u1ee3p v\u1edbi c\u00e1c \u0111\u01a1n v\u1ecb tham gia nhi\u1ec7m v\u1ee5 - qu\u00e2n s\u1ef1 LHQ, c\u00e1c \u0111\u01a1n v\u1ecb c\u1ea3nh s\u00e1t kh\u00e1c, c\u1ea3nh s\u00e1t \u0111\u1ecba ph\u01b0\u01a1ng, v\u00e0 c\u00e1c c\u01a1 quan LHQ nh\u01b0 JMAC - \u0111\u1ec3 thu th\u1eadp tin t\u1ee9c c\u1ea7n thi\u1ebft, v\u00e0 xem x\u00e9t c\u00e1c m\u1ed1i \u0111e d\u1ecda nh\u01b0 nh\u00f3m n\u1ed5i d\u1eady, c\u1ed9ng \u0111\u1ed3ng th\u00f9 \u0111\u1ecbch, l\u0169 l\u1ee5t v\u00e0 \u0111\u01b0\u1eddng h\u01b0 h\u1ecfng.'},
     st:[
      {en:'Get information on the area of patrol and the distance',vi:'Thu th\u1eadp th\u00f4ng tin khu v\u1ef1c tu\u1ea7n tra v\u00e0 kho\u1ea3ng c\u00e1ch'},
      {en:'Collect maps to identify clearly the area of patrol',vi:'Thu th\u1eadp b\u1ea3n \u0111\u1ed3 \u0111\u1ec3 x\u00e1c \u0111\u1ecbnh r\u00f5 khu v\u1ef1c tu\u1ea7n tra'},
      {en:'Take into consideration past events in the area (criminal activities and types of crimes)',vi:'Xem x\u00e9t c\u00e1c s\u1ef1 ki\u1ec7n qu\u00e1 kh\u1ee9 trong khu v\u1ef1c (ho\u1ea1t \u0111\u1ed9ng t\u1ed9i ph\u1ea1m v\u00e0 lo\u1ea1i t\u1ed9i ph\u1ea1m)'},
      {en:'Get information on opponent forces in the area',vi:'Thu th\u1eadp th\u00f4ng tin l\u1ef1c l\u01b0\u1ee3ng \u0111\u1ed1i ph\u01b0\u01a1ng trong khu v\u1ef1c'},
      {en:'Get information on potential mines/IED; use the latest UN Mine Action Service or military report',vi:'Thu th\u1eadp th\u00f4ng tin m\u00ecn/IED ti\u1ec1m n\u0103ng; d\u00f9ng b\u00e1o c\u00e1o m\u1edbi nh\u1ea5t c\u1ee7a UNMAS ho\u1eb7c qu\u00e2n \u0111\u1ed9i'},
      {en:'Get information on weather conditions; check flood, damaged roads risks',vi:'Thu th\u1eadp th\u00f4ng tin \u0111i\u1ec1u ki\u1ec7n th\u1eddi ti\u1ebft; ki\u1ec3m tra r\u1ee7i ro l\u0169 l\u1ee5t, \u0111\u01b0\u1eddng h\u01b0 h\u1ecfng'},
      {en:'Read similar previous patrol reports to analyse past events',vi:'\u0110\u1ecdc b\u00e1o c\u00e1o c\u00e1c tu\u1ea7n tra t\u01b0\u01a1ng t\u1ef1 tr\u01b0\u1edbc \u0111\u00e2y \u0111\u1ec3 ph\u00e2n t\u00edch s\u1ef1 ki\u1ec7n qu\u00e1 kh\u1ee9'},
      {en:'Contacts with the population and various NGOs can provide critical information',vi:'Li\u00ean h\u1ec7 v\u1edbi ng\u01b0\u1eddi d\u00e2n v\u00e0 c\u00e1c t\u1ed5 ch\u1ee9c phi ch\u00ednh ph\u1ee7 c\u00f3 th\u1ec3 cung c\u1ea5p th\u00f4ng tin quan tr\u1ecdng'}
     ]},
    {t:{en:'Logistic Prep - Collective',vi:'Chu\u1ea9n b\u1ecb H\u1eadu c\u1ea7n - T\u1eadp th\u1ec3'},fc:true,
     d:{en:'Equipment requirements come in two forms: for the patrol as a whole and for the individual member. Collective equipment includes weapons and ammunition beyond personal weapons (CS gas launchers, flare pistols, crew served machine guns), shields and batons.',vi:'Y\u00eau c\u1ea7u trang b\u1ecb c\u00f3 hai d\u1ea1ng: cho c\u1ea3 tu\u1ea7n tra v\u00e0 cho t\u1eebng th\u00e0nh vi\u00ean. Trang b\u1ecb t\u1eadp th\u1ec3 bao g\u1ed3m v\u0169 kh\u00ed v\u00e0 \u0111\u1ea1n d\u01b0\u1ee3c ngo\u00e0i v\u0169 kh\u00ed c\u00e1 nh\u00e2n (\u1ed1ng ph\u00f3ng h\u01a1i cay, s\u00fang b\u1eafn ph\u00e1o hi\u1ec7u, s\u00fang m\u00e1y), khi\u00ean v\u00e0 d\u00f9i cui.'},
     st:[
      {en:'Armament and ammunition including crowd control equipment',vi:'V\u0169 kh\u00ed v\u00e0 \u0111\u1ea1n d\u01b0\u1ee3c bao g\u1ed3m trang b\u1ecb ch\u1ed1ng b\u1ea1o lo\u1ea1n'},
      {en:'Radio + batteries',vi:'B\u1ed9 \u0111\u00e0m + pin'},
      {en:'First aid kits',vi:'B\u1ed9 s\u01a1 c\u1ee9u'},
      {en:'Identification (flags) - UN flags flown from vehicles for high visibility patrols',vi:'Ph\u01b0\u01a1ng ti\u1ec7n nh\u1eadn di\u1ec7n (c\u1edd) - treo c\u1edd LHQ tr\u00ean xe cho tu\u1ea7n tra \u0111\u1ed9 hi\u1ec7n di\u1ec7n cao'},
      {en:'Patrol file with maps, GPS - appropriate scale maps, compasses, allocation plan',vi:'H\u1ed3 s\u01a1 tu\u1ea7n tra k\u00e8m b\u1ea3n \u0111\u1ed3, GPS - b\u1ea3n \u0111\u1ed3 t\u1ef7 l\u1ec7 ph\u00f9 h\u1ee3p, la b\u00e0n, k\u1ebf ho\u1ea1ch ph\u00e2n b\u1ed5'},
      {en:'Equipment for night patrol at vehicles and sub-unit level - night vision, search lights, torches',vi:'Trang b\u1ecb tu\u1ea7n tra \u0111\u00eam cho xe v\u00e0 c\u1ea5p ph\u00e2n \u0111\u1ed9i - k\u00ednh nh\u00ecn \u0111\u00eam, \u0111\u00e8n pha, \u0111\u00e8n pin'},
      {en:'Evidence gathering equipment - cameras, property bags, statement forms, tape, labels, forensic markers, cordon tape',vi:'Trang b\u1ecb thu th\u1eadp ch\u1ee9ng c\u1ee9 - m\u00e1y \u1ea3nh, t\u00fai \u0111\u1ef1ng t\u00e0i s\u1ea3n, m\u1eabu bi\u00ean b\u1ea3n, b\u0103ng keo, nh\u00e3n, v\u1eadt \u0111\u00e1nh d\u1ea5u ph\u00e1p y, b\u0103ng phong t\u1ecfa'},
      {en:'Water and food according to the mission and duration, with cooking means',vi:'N\u01b0\u1edbc v\u00e0 th\u1ef1c ph\u1ea9m theo nhi\u1ec7m v\u1ee5 v\u00e0 th\u1eddi gian, k\u00e8m ph\u01b0\u01a1ng ti\u1ec7n n\u1ea5u \u0103n'}
     ]},
    {t:{en:'Logistic Prep - Individual',vi:'Chu\u1ea9n b\u1ecb H\u1eadu c\u1ea7n - C\u00e1 nh\u00e2n'},fc:true,
     d:{en:'Individual equipment covers personal protective equipment and personal items needed in case the individual is cut off from the remainder of the patrol.',vi:'Trang b\u1ecb c\u00e1 nh\u00e2n bao g\u1ed3m thi\u1ebft b\u1ecb b\u1ea3o h\u1ed9 c\u00e1 nh\u00e2n v\u00e0 v\u1eadt d\u1ee5ng c\u00e1 nh\u00e2n c\u1ea7n thi\u1ebft trong tr\u01b0\u1eddng h\u1ee3p c\u00e1 nh\u00e2n b\u1ecb t\u00e1ch kh\u1ecfi ph\u1ea7n c\u00f2n l\u1ea1i c\u1ee7a tu\u1ea7n tra.'},
     st:[
      {en:'Personal Protective Equipment - helmet, bulletproof jacket',vi:'Thi\u1ebft b\u1ecb b\u1ea3o h\u1ed9 c\u00e1 nh\u00e2n - m\u0169 b\u1ea3o hi\u1ec3m, \u00e1o ch\u1ed1ng \u0111\u1ea1n'},
      {en:'Sidearm if available and officers trained',vi:'S\u00fang ng\u1eafn n\u1ebfu c\u00f3 v\u00e0 s\u0129 quan \u0111\u01b0\u1ee3c hu\u1ea5n luy\u1ec7n'},
      {en:'UN ID card, UN driving licence - all UN personnel must be able to identify themselves',vi:'Th\u1ebb nh\u1eadn di\u1ec7n LHQ, gi\u1ea5y ph\u00e9p l\u00e1i xe LHQ - m\u1ecdi nh\u00e2n s\u1ef1 LHQ ph\u1ea3i ch\u1ee9ng minh \u0111\u01b0\u1ee3c danh t\u00ednh'},
      {en:'Badges and blue berets/helmets',vi:'Ph\u00f9 hi\u1ec7u v\u00e0 m\u0169 n\u1ed3i/m\u0169 b\u1ea3o hi\u1ec3m xanh'},
      {en:'Torch, knife, compass, notebook, pens - to record evidence or reports',vi:'\u0110\u00e8n pin, dao, la b\u00e0n, s\u1ed5 tay, b\u00fat - \u0111\u1ec3 ghi ch\u00e9p ch\u1ee9ng c\u1ee9 ho\u1eb7c b\u00e1o c\u00e1o'},
      {en:'Individual first aid kit - in case cut off from the patrol',vi:'B\u1ed9 s\u01a1 c\u1ee9u c\u00e1 nh\u00e2n - trong tr\u01b0\u1eddng h\u1ee3p b\u1ecb t\u00e1ch kh\u1ecfi tu\u1ea7n tra'},
      {en:'Money (only sufficient for the patrol) and spare clothes (mosquito net in tropical overnight patrols)',vi:'Ti\u1ec1n (ch\u1ec9 \u0111\u1ee7 cho tu\u1ea7n tra) v\u00e0 qu\u1ea7n \u00e1o d\u1ef1 ph\u00f2ng (m\u00e0n ch\u1ed1ng mu\u1ed7i khi tu\u1ea7n tra qua \u0111\u00eam \u1edf v\u00f9ng nhi\u1ec7t \u0111\u1edbi)'},
      {en:'Personal water supply with purification tablets or device',vi:'Ngu\u1ed3n n\u01b0\u1edbc c\u00e1 nh\u00e2n k\u00e8m vi\u00ean l\u1ecdc ho\u1eb7c thi\u1ebft b\u1ecb l\u1ecdc n\u01b0\u1edbc'}
     ]},
    {t:{en:'Logistic Prep - Vehicle Checks',vi:'Chu\u1ea9n b\u1ecb H\u1eadu c\u1ea7n - Ki\u1ec3m tra Ph\u01b0\u01a1ng ti\u1ec7n'},fc:true,
     d:{en:'Checks on vehicles are two-fold, particularly for long distance patrols over rough terrain: daily maintenance and additional maintenance for long distance.',vi:'Ki\u1ec3m tra ph\u01b0\u01a1ng ti\u1ec7n g\u1ed3m hai ph\u1ea7n, \u0111\u1eb7c bi\u1ec7t cho tu\u1ea7n tra \u0111\u01b0\u1eddng d\u00e0i tr\u00ean \u0111\u1ecba h\u00ecnh g\u1ed3 gh\u1ec1: b\u1ea3o d\u01b0\u1ee1ng h\u00e0ng ng\u00e0y v\u00e0 b\u1ea3o d\u01b0\u1ee1ng b\u1ed5 sung cho \u0111\u01b0\u1eddng d\u00e0i.'},
     tbl:[
      [{en:'Daily maintenance',vi:'B\u1ea3o d\u01b0\u1ee1ng h\u00e0ng ng\u00e0y'},{en:'lubricants, oil, petrol/diesel, water, coolants, battery levels',vi:'d\u1ea7u b\u00f4i tr\u01a1n, d\u1ea7u m\u00e1y, x\u0103ng/d\u1ea7u diesel, n\u01b0\u1edbc, n\u01b0\u1edbc l\u00e0m m\u00e1t, m\u1ee9c \u1eafc quy'}],
      [{en:'Tyres',vi:'L\u1ed1p xe'},{en:'not worn, sufficient tread depth and grip, correct inflation for terrain',vi:'kh\u00f4ng m\u00f2n, \u0111\u1ee7 \u0111\u1ed9 s\u00e2u gai v\u00e0 \u0111\u1ed9 b\u00e1m, \u00e1p su\u1ea5t \u0111\u00fang cho \u0111\u1ecba h\u00ecnh'}],
      [{en:'Electrical devices',vi:'Thi\u1ebft b\u1ecb \u0111i\u1ec7n'},{en:'all working correctly, sufficient charge received, battery levels correct',vi:'ho\u1ea1t \u0111\u1ed9ng \u0111\u00fang, nh\u1eadn \u0111\u1ee7 s\u1ea1c, m\u1ee9c \u1eafc quy \u0111\u00fang'}],
      [{en:'Additional (long distance)',vi:'B\u1ed5 sung (\u0111\u01b0\u1eddng d\u00e0i)'},{en:'spare tyre, tow chains or ropes, tools for self-help repairs',vi:'l\u1ed1p d\u1ef1 ph\u00f2ng, x\u00edch k\u00e9o ho\u1eb7c d\u00e2y, d\u1ee5ng c\u1ee5 t\u1ef1 s\u1eeda ch\u1eefa'}]
     ]},
    {t:{en:'Briefing',vi:'Giao nhi\u1ec7m v\u1ee5'},fc:true,
     d:{en:'The Commander sends a warning order to sub unit commanders with brief details of the mission and times for briefings. The operational order follows the recognised format: Situation, Mission, Execution, Administration/Logistics, Command/Communications.',vi:'Ch\u1ec9 huy g\u1eedi l\u1ec7nh b\u00e1o \u0111\u1ed9ng tr\u01b0\u1edbc cho ti\u1ec3u \u0111\u01a1n v\u1ecb tr\u01b0\u1edfng k\u00e8m chi ti\u1ebft ng\u1eafn g\u1ecdn v\u1ec1 nhi\u1ec7m v\u1ee5 v\u00e0 th\u1eddi gian giao nhi\u1ec7m v\u1ee5. L\u1ec7nh t\u00e1c chi\u1ebfn theo \u0111\u1ecbnh d\u1ea1ng chu\u1ea9n: T\u00ecnh h\u00ecnh, Nhi\u1ec7m v\u1ee5, Thi h\u00e0nh, H\u00e0nh ch\u00ednh/H\u1eadu c\u1ea7n, Ch\u1ec9 huy/Th\u00f4ng tin.'},
     st:[
      {en:'Send out a warning order to sub unit commanders with brief mission details and readiness requirements',vi:'G\u1eedi l\u1ec7nh b\u00e1o \u0111\u1ed9ng tr\u01b0\u1edbc cho ti\u1ec3u \u0111\u01a1n v\u1ecb tr\u01b0\u1edfng k\u00e8m chi ti\u1ebft ng\u1eafn g\u1ecdn v\u00e0 y\u00eau c\u1ea7u s\u1eb5n s\u00e0ng'},
      {en:'Sub unit commanders start equipment checks; personnel check individual readiness',vi:'Ti\u1ec3u \u0111\u01a1n v\u1ecb tr\u01b0\u1edfng b\u1eaft \u0111\u1ea7u ki\u1ec3m tra trang b\u1ecb; nh\u00e2n s\u1ef1 ki\u1ec3m tra s\u1ef1 s\u1eb5n s\u00e0ng c\u00e1 nh\u00e2n'},
      {en:'Drivers carry out vehicle checks; radio frequencies and call signs obtained',vi:'T\u00e0i x\u1ebf th\u1ef1c hi\u1ec7n ki\u1ec3m tra ph\u01b0\u01a1ng ti\u1ec7n; x\u00e1c nh\u1eadn t\u1ea7n s\u1ed1 v\u00e0 t\u00edn hi\u1ec7u g\u1ecdi'},
      {en:'Consider contingencies and emergency procedures for all potential scenarios',vi:'Xem x\u00e9t c\u00e1c t\u00ecnh hu\u1ed1ng kh\u1ea9n c\u1ea5p v\u00e0 quy tr\u00ecnh \u1ee9ng ph\u00f3 cho m\u1ecdi k\u1ecbch b\u1ea3n ti\u1ec1m n\u0103ng'},
      {en:'Issue the briefing in the format: 1) Situation 2) Mission 3) Execution 4) Administration/Logistics 5) Command/Communications',vi:'Giao nhi\u1ec7m v\u1ee5 theo \u0111\u1ecbnh d\u1ea1ng: 1) T\u00ecnh h\u00ecnh 2) Nhi\u1ec7m v\u1ee5 3) Thi h\u00e0nh 4) H\u00e0nh ch\u00ednh/H\u1eadu c\u1ea7n 5) Ch\u1ec9 huy/Th\u00f4ng tin'},
      {en:'Execution starts: "In order to..., my intention is....in phase 1 with elements x, y, z...we will..."',vi:'Ph\u1ea7n Thi h\u00e0nh b\u1eaft \u0111\u1ea7u: "\u0110\u1ec3..., \u00fd \u0111\u1ecbnh c\u1ee7a t\u00f4i l\u00e0...trong giai \u0111o\u1ea1n 1 v\u1edbi c\u00e1c y\u1ebfu t\u1ed1 x, y, z...ch\u00fang ta s\u1ebd..."'}
     ]},
    {t:{en:'Conduct a Patrol',vi:'Th\u1ef1c hi\u1ec7n Tu\u1ea7n tra'},fc:true,
     d:{en:'Having been briefed and equipment checked, the patrol starts the Conduct phase. For a vehicle patrol the Command vehicle consists of the Patrol commander, a radio operator, a driver and support officers to protect the commander.',vi:'Sau khi giao nhi\u1ec7m v\u1ee5 v\u00e0 ki\u1ec3m tra trang b\u1ecb, tu\u1ea7n tra b\u1eaft \u0111\u1ea7u giai \u0111o\u1ea1n Th\u1ef1c hi\u1ec7n. \u0110\u1ed1i v\u1edbi tu\u1ea7n tra ph\u01b0\u01a1ng ti\u1ec7n, xe Ch\u1ec9 huy g\u1ed3m Ch\u1ec9 huy tu\u1ea7n tra, nh\u00e2n vi\u00ean v\u00f4 tuy\u1ebfn, t\u00e0i x\u1ebf v\u00e0 s\u0129 quan h\u1ed7 tr\u1ee3 \u0111\u1ec3 b\u1ea3o v\u1ec7 ch\u1ec9 huy.'},
     st:[
      {en:'A patrol can be made of one, two or several vehicles',vi:'M\u1ed9t cu\u1ed9c tu\u1ea7n tra c\u00f3 th\u1ec3 g\u1ed3m m\u1ed9t, hai ho\u1eb7c nhi\u1ec1u xe'},
      {en:'If at least two vehicles: one is the intervention (command) vehicle, one is the protection vehicle',vi:'N\u1ebfu \u00edt nh\u1ea5t hai xe: m\u1ed9t xe l\u00e0 xe can thi\u1ec7p (ch\u1ec9 huy), m\u1ed9t xe l\u00e0 xe b\u1ea3o v\u1ec7'},
      {en:'Intervention (command) vehicle: driver, radio operator, patrol commander, protection and support elements',vi:'Xe can thi\u1ec7p (ch\u1ec9 huy): t\u00e0i x\u1ebf, nh\u00e2n vi\u00ean v\u00f4 tuy\u1ebfn, ch\u1ec9 huy tu\u1ea7n tra, c\u00e1c y\u1ebfu t\u1ed1 b\u1ea3o v\u1ec7 v\u00e0 h\u1ed7 tr\u1ee3'},
      {en:'Minimum deployable party: at least 10 officers including the commanding officer, in compliance with FPU policy',vi:'T\u1ed1i thi\u1ec3u s\u1ed1 l\u01b0\u1ee3ng tri\u1ec3n khai: \u00edt nh\u1ea5t 10 s\u0129 quan k\u1ec3 c\u1ea3 ch\u1ec9 huy, theo ch\u00ednh s\u00e1ch FPU'},
      {en:'Other vehicles contain a Team or Section dependant on size and type of vehicle',vi:'C\u00e1c xe kh\u00e1c ch\u1edf m\u1ed9t \u0110\u1ed9i ho\u1eb7c Trung \u0111\u1ed9i t\u00f9y k\u00edch th\u01b0\u1edbc v\u00e0 lo\u1ea1i xe'},
      {en:'All members given sectors of observation',vi:'M\u1ecdi th\u00e0nh vi\u00ean \u0111\u01b0\u1ee3c ph\u00e2n khu v\u1ef1c quan s\u00e1t'},
      {en:'UN patrols are normally high visibility - white vehicles bearing the UN and flags',vi:'Tu\u1ea7n tra LHQ th\u01b0\u1eddng c\u00f3 \u0111\u1ed9 hi\u1ec7n di\u1ec7n cao - xe tr\u1eafng mang bi\u1ec3u t\u01b0\u1ee3ng LHQ v\u00e0 c\u1edd'}
     ]},
    {t:{en:'Responsibilities - Driver',vi:'Tr\u00e1ch nhi\u1ec7m - T\u00e0i x\u1ebf'},fc:true,
     d:{en:'While carrying out a vehicle patrol there are certain responsibilities that fall on the driver.',vi:'Khi th\u1ef1c hi\u1ec7n tu\u1ea7n tra ph\u01b0\u01a1ng ti\u1ec7n, t\u00e0i x\u1ebf c\u00f3 c\u00e1c tr\u00e1ch nhi\u1ec7m nh\u1ea5t \u0111\u1ecbnh.'},
     st:[
      {en:'Knowledge of the patrol area and the route',vi:'N\u1eafm r\u00f5 khu v\u1ef1c tu\u1ea7n tra v\u00e0 l\u1ed9 tr\u00ecnh'},
      {en:'Keep a distance between vehicles; do not allow vehicles to bunch up',vi:'Gi\u1eef kho\u1ea3ng c\u00e1ch gi\u1eefa c\u00e1c xe; kh\u00f4ng \u0111\u1ec3 c\u00e1c xe d\u1ed3n c\u1ee5m l\u1ea1i'},
      {en:'Look always for the best, safe parking place; stay on the main road',vi:'Lu\u00f4n t\u00ecm n\u01a1i \u0111\u1ed7 xe an to\u00e0n t\u1ed1t nh\u1ea5t; gi\u1eef tr\u00ean \u0111\u01b0\u1eddng ch\u00ednh'},
      {en:'Avoid using shortcuts, especially if the route is unknown',vi:'Tr\u00e1nh \u0111i \u0111\u01b0\u1eddng t\u1eaft, \u0111\u1eb7c bi\u1ec7t khi kh\u00f4ng n\u1eafm l\u1ed9 tr\u00ecnh'},
      {en:'When parked, normally remain with the vehicle to guard it (Patrol commander decides)',vi:'Khi \u0111\u1ed7 xe, th\u01b0\u1eddng \u1edf l\u1ea1i v\u1edbi xe \u0111\u1ec3 canh g\u00e1c (Ch\u1ec9 huy tu\u1ea7n tra quy\u1ebft \u0111\u1ecbnh)'},
      {en:'For short stops keep the engine running for quick response',vi:'Khi d\u1eebng ng\u1eafn gi\u1eef m\u00e1y n\u1ed5 \u0111\u1ec3 ph\u1ea3n \u1ee9ng nhanh'},
      {en:'Often act as the communication relay between vehicles in the patrol',vi:'Th\u01b0\u1eddng \u0111\u00f3ng vai tr\u00f2 chuy\u1ec3n ti\u1ebfp li\u00ean l\u1ea1c gi\u1eefa c\u00e1c xe trong tu\u1ea7n tra'}
     ]},
    {t:{en:'Responsibilities - Radio Operator',vi:'Tr\u00e1ch nhi\u1ec7m - Nh\u00e2n vi\u00ean V\u00f4 tuy\u1ebfn'},fc:true,
     d:{en:'The Radio operator has specific responsibilities for reporting and radio discipline during the patrol.',vi:'Nh\u00e2n vi\u00ean V\u00f4 tuy\u1ebfn c\u00f3 c\u00e1c tr\u00e1ch nhi\u1ec7m c\u1ee5 th\u1ec3 v\u1ec1 b\u00e1o c\u00e1o v\u00e0 k\u1ef7 lu\u1eadt v\u00f4 tuy\u1ebfn trong tu\u1ea7n tra.'},
     st:[
      {en:'Report according to procedure laid down in the operational briefing',vi:'B\u00e1o c\u00e1o theo quy tr\u00ecnh quy \u0111\u1ecbnh trong giao nhi\u1ec7m v\u1ee5'},
      {en:'Give situation reports when appropriate or required',vi:'B\u00e1o c\u00e1o t\u00ecnh h\u00ecnh khi th\u00edch h\u1ee3p ho\u1eb7c \u0111\u01b0\u1ee3c y\u00eau c\u1ea7u'},
      {en:'Give positioning reports (parking, mobile, stop) as appropriate',vi:'B\u00e1o c\u00e1o v\u1ecb tr\u00ed (\u0111\u1ed7, di \u0111\u1ed9ng, d\u1eebng) khi th\u00edch h\u1ee3p'},
      {en:'If an incident occurs, send information straight back to UN HQ; incident and flash reports',vi:'N\u1ebfu c\u00f3 s\u1ef1 c\u1ed1, g\u1eedi th\u00f4ng tin ngay v\u1ec1 HQ LHQ; b\u00e1o c\u00e1o s\u1ef1 c\u1ed1 v\u00e0 b\u00e1o c\u00e1o nhanh'},
      {en:'Always keep the radio with them; remain close to the commander unless instructed otherwise',vi:'Lu\u00f4n mang b\u1ed9 \u0111\u00e0m b\u00ean m\u00ecnh; gi\u1eef g\u1ea7n ch\u1ec9 huy tr\u1eeb khi c\u00f3 ch\u1ec9 th\u1ecb kh\u00e1c'},
      {en:'Use discretion during broadcasts - keep language appropriate, do not disclose important information',vi:'Th\u1eadn tr\u1ecdng khi ph\u00e1t s\u00f3ng - gi\u1eef ng\u00f4n ng\u1eef ph\u00f9 h\u1ee3p, kh\u00f4ng ti\u1ebft l\u1ed9 th\u00f4ng tin quan tr\u1ecdng'}
     ]},
    {t:{en:'Debriefing',vi:'B\u00e1o c\u00e1o sau Tu\u1ea7n tra'},fc:true,
     d:{en:'On return from the patrol the Debriefing phase begins. A debriefing takes place with all members of the patrol attending; for a large patrol it may be done by Team or Section Commanders who report into the Patrol Commander.',vi:'Khi tr\u1edf v\u1ec1 sau tu\u1ea7n tra, giai \u0111o\u1ea1n B\u00e1o c\u00e1o b\u1eaft \u0111\u1ea7u. Bu\u1ed5i b\u00e1o c\u00e1o di\u1ec5n ra v\u1edbi s\u1ef1 tham d\u1ef1 c\u1ee7a t\u1ea5t c\u1ea3 th\u00e0nh vi\u00ean tu\u1ea7n tra; v\u1edbi tu\u1ea7n tra l\u1edbn c\u00f3 th\u1ec3 do Ch\u1ec9 huy \u0110\u1ed9i ho\u1eb7c Trung \u0111\u1ed9i b\u00e1o c\u00e1o cho Ch\u1ec9 huy tu\u1ea7n tra.'},
     st:[
      {en:'Debriefing with all patrol members',vi:'B\u00e1o c\u00e1o v\u1edbi t\u1ea5t c\u1ea3 th\u00e0nh vi\u00ean tu\u1ea7n tra'},
      {en:'All report exactly what they saw - included in the final written report',vi:'T\u1ea5t c\u1ea3 b\u00e1o c\u00e1o ch\u00ednh x\u00e1c nh\u1eefng g\u00ec \u0111\u00e3 th\u1ea5y - \u0111\u01b0a v\u00e0o b\u00e1o c\u00e1o vi\u1ebft cu\u1ed1i c\u00f9ng'},
      {en:'Written report with sketch map and grid coordinates/GPS readings for key locations',vi:'B\u00e1o c\u00e1o vi\u1ebft k\u00e8m s\u01a1 \u0111\u1ed3 v\u00e0 t\u1ecda \u0111\u1ed9 l\u01b0\u1edbi/\u0111\u1ecdc GPS cho c\u00e1c v\u1ecb tr\u00ed ch\u00ednh'},
      {en:'Check vehicles & equipment and resupply ready for next deployment',vi:'Ki\u1ec3m tra ph\u01b0\u01a1ng ti\u1ec7n & trang b\u1ecb v\u00e0 ti\u1ebfp t\u1ebf s\u1eb5n s\u00e0ng cho l\u1ea7n tri\u1ec3n khai sau'},
      {en:'Submit incident reports along with the written report',vi:'N\u1ed9p b\u00e1o c\u00e1o s\u1ef1 c\u1ed1 k\u00e8m b\u00e1o c\u00e1o vi\u1ebft'},
      {en:'Use GPS to map little-known areas - reported all along, critical for rescue or reinforcement',vi:'D\u00f9ng GPS l\u1eadp b\u1ea3n \u0111\u1ed3 khu v\u1ef1c \u00edt \u0111\u01b0\u1ee3c bi\u1ebft - b\u00e1o c\u00e1o li\u00ean t\u1ee5c, quan tr\u1ecdng cho c\u1ee9u h\u1ed9 ho\u1eb7c t\u0103ng vi\u1ec7n'}
     ]},
    {t:{en:'Patrol & Radio Usage',vi:'Tu\u1ea7n tra & S\u1eed d\u1ee5ng B\u1ed9 \u0111\u00e0m'},fc:true,
     d:{en:'The radio is one of the most important tools of modern law enforcement - the officer\'s primary source of information and lifeline. There are three basic types of radios: portable radio, two-way car radio, and control centre or base station.',vi:'B\u1ed9 \u0111\u00e0m l\u00e0 m\u1ed9t trong nh\u1eefng c\u00f4ng c\u1ee5 quan tr\u1ecdng nh\u1ea5t c\u1ee7a c\u1ea3nh s\u00e1t hi\u1ec7n \u0111\u1ea1i - ngu\u1ed3n th\u00f4ng tin ch\u00ednh v\u00e0 \u0111\u01b0\u1eddng sinh m\u1ea1ng c\u1ee7a s\u0129 quan. C\u00f3 ba lo\u1ea1i b\u1ed9 \u0111\u00e0m c\u01a1 b\u1ea3n: b\u1ed9 \u0111\u00e0m c\u1ea7m tay, b\u1ed9 \u0111\u00e0m \u00f4 t\u00f4, v\u00e0 trung t\u00e2m \u0111i\u1ec1u khi\u1ec3n ho\u1eb7c tr\u1ea1m g\u1ed1c.'},
     st:[
      {en:'Types: portable radio, two-way car radio, control centre/base station',vi:'Lo\u1ea1i: b\u1ed9 \u0111\u00e0m c\u1ea7m tay, b\u1ed9 \u0111\u00e0m \u00f4 t\u00f4, trung t\u00e2m \u0111i\u1ec1u khi\u1ec3n/tr\u1ea1m g\u1ed1c'},
      {en:'Variation in features: number of frequencies, three-way capability, standard channel assignment',vi:'Kh\u00e1c bi\u1ec7t t\u00ednh n\u0103ng: s\u1ed1 t\u1ea7n s\u1ed1, kh\u1ea3 n\u0103ng li\u00ean l\u1ea1c ba chi\u1ec1u, g\u00e1n k\u00eanh chu\u1ea9n'},
      {en:'Call signs: vehicle patrols have permanent call signs per vehicle and area; foot patrol call signs based on geographical beat name (e.g. B1, B2)',vi:'T\u00edn hi\u1ec7u g\u1ecdi: tu\u1ea7n tra xe c\u00f3 t\u00edn hi\u1ec7u c\u1ed1 \u0111\u1ecbnh theo xe v\u00e0 khu v\u1ef1c; tu\u1ea7n tra b\u1ed9 theo t\u00ean \u0111\u1ecba l\u00fd khu v\u1ef1c (vd B1, B2)'},
      {en:'Required communications: on arrival, before leaving vehicle, stopping a vehicle/questioning suspects, assignment completed, transferring a prisoner',vi:'C\u00e1c l\u1ea7n li\u00ean l\u1ea1c b\u1eaft bu\u1ed9c: khi \u0111\u1ebfn n\u01a1i, tr\u01b0\u1edbc khi r\u1eddi xe, d\u1eebng xe/h\u1ecfi nghi ph\u1ea1m, ho\u00e0n th\u00e0nh nhi\u1ec7m v\u1ee5, b\u00e0n giao t\u00f9 nh\u00e2n'},
      {en:'Volume control: adjust to hear without distracting others; turn low/off during building searches',vi:'\u0110i\u1ec1u ch\u1ec9nh \u00e2m l\u01b0\u1ee3ng: nghe \u0111\u01b0\u1ee3c m\u00e0 kh\u00f4ng l\u00e0m phi\u1ec1n ng\u01b0\u1eddi kh\u00e1c; gi\u1ea3m/t\u1eaft khi kh\u00e1m x\u00e9t t\u00f2a nh\u00e0'},
      {en:'Batteries: rechargeable; remove defective batteries from service',vi:'Pin: s\u1ea1c \u0111\u01b0\u1ee3c; lo\u1ea1i b\u1ecf pin h\u1ecfng kh\u1ecfi s\u1eed d\u1ee5ng'},
      {en:'Correct procedure: wait for a break in traffic, start with base call sign then personal call sign, wait for acknowledgement',vi:'Quy tr\u00ecnh \u0111\u00fang: ch\u1edd kho\u1ea3ng tr\u1ed1ng k\u00eanh, b\u1eaft \u0111\u1ea7u b\u1eb1ng t\u00edn hi\u1ec7u tr\u1ea1m g\u1ed1c r\u1ed3i t\u00edn hi\u1ec7u c\u00e1 nh\u00e2n, ch\u1edd x\u00e1c nh\u1eadn'},
      {en:'Speak into the microphone ~20cm from mouth, never shout, even tone, don\'t let voice trail off, speak slowly and carefully, spell names using the phonetic alphabet',vi:'N\u00f3i v\u00e0o micro c\u00e1ch ~20cm, kh\u00f4ng h\u00e9t, gi\u1ecdng \u0111\u1ec1u, kh\u00f4ng \u0111\u1ec3 gi\u1ecdng nh\u1ecf d\u1ea7n cu\u1ed1i c\u00e2u, n\u00f3i ch\u1eadm r\u00e3i, \u0111\u00e1nh v\u1ea7n t\u00ean b\u1eb1ng b\u1ea3ng ch\u1eef c\u00e1i phi\u00ean \u00e2m'},
      {en:'Range depends on topography (repeaters increase range), operation in cities, type of radio, dead spots',vi:'T\u1ea7m ho\u1ea1t \u0111\u1ed9ng ph\u1ee5 thu\u1ed9c \u0111\u1ecba h\u00ecnh (tr\u1ea1m chuy\u1ec3n ti\u1ebfp t\u0103ng t\u1ea7m), ho\u1ea1t \u0111\u1ed9ng trong th\u00e0nh ph\u1ed1, lo\u1ea1i b\u1ed9 \u0111\u00e0m, v\u00f9ng s\u00f3ng ch\u1ebft'},
      {en:'Obstacles: atmospheric interference, interruptions, badly constructed messages; think before transmitting',vi:'Tr\u1edf ng\u1ea1i: nhi\u1ec5u kh\u00ed quy\u1ec3n, gi\u00e1n \u0111o\u1ea1n, th\u00f4ng \u0111i\u1ec7p x\u00e2y d\u1ef1ng k\u00e9m; suy ngh\u0129 tr\u01b0\u1edbc khi ph\u00e1t'}
     ]},
    {t:{en:'Vehicle Control - Risk Factors',vi:'Ki\u1ec3m so\u00e1t Ph\u01b0\u01a1ng ti\u1ec7n - Y\u1ebfu t\u1ed1 R\u1ee7i ro'},fc:true,
     d:{en:'There is no such thing as a routine vehicle stop. Risk factors common to all vehicle stops include weather, location, procedural behaviour of the officers, and weapons. Daily routine and complacency are among the biggest dangers.',vi:'Kh\u00f4ng c\u00f3 v\u1ee5 d\u1eebng xe th\u01b0\u1eddng l\u1ec7 n\u00e0o. C\u00e1c y\u1ebfu t\u1ed1 r\u1ee7i ro chung cho m\u1ecdi l\u1ea7n d\u1eebng xe g\u1ed3m th\u1eddi ti\u1ebft, v\u1ecb tr\u00ed, h\u00e0nh vi quy tr\u00ecnh c\u1ee7a s\u0129 quan, v\u00e0 v\u0169 kh\u00ed. Th\u00f3i quen h\u00e0ng ng\u00e0y v\u00e0 ch\u1ee7 quan l\u00e0 nh\u1eefng nguy c\u01a1 l\u1edbn nh\u1ea5t.'},
     tbl:[
      [{en:'Weather',vi:'Th\u1eddi ti\u1ebft'},{en:'night, rain, fog impair vision; rain/snow/ice affect braking distance; heat causes glare and affects tyres',vi:'\u0111\u00eam, m\u01b0a, s\u01b0\u01a1ng m\u00f9 gi\u1ea3m t\u1ea7m nh\u00ecn; m\u01b0a/tuy\u1ebft/b\u0103ng \u1ea3nh h\u01b0\u1edfng kho\u1ea3ng c\u00e1ch phanh; n\u1eafng n\u00f3ng g\u00e2y ch\u00f3i v\u00e0 \u1ea3nh h\u01b0\u1edfng l\u1ed1p'}],
      [{en:'Location',vi:'V\u1ecb tr\u00ed'},{en:'urban areas may lack room off the roadway; best on a straight stretch clearly visible; avoid bends, hills',vi:'khu \u0111\u00f4 th\u1ecb c\u00f3 th\u1ec3 thi\u1ebfu ch\u1ed7 \u0111\u1ed7 ngo\u00e0i \u0111\u01b0\u1eddng; t\u1ed1t nh\u1ea5t tr\u00ean \u0111o\u1ea1n th\u1eb3ng nh\u00ecn r\u00f5; tr\u00e1nh kh\u00fac cua, \u0111\u1ed3i'}],
      [{en:'Procedural',vi:'Quy tr\u00ecnh'},{en:'how officers behave and control occupants; never walk between vehicles until driver secured; never take eyes off suspect vehicle',vi:'c\u00e1ch s\u0129 quan h\u00e0nh x\u1eed v\u00e0 kh\u1ed1ng ch\u1ebf ng\u01b0\u1eddi tr\u00ean xe; kh\u00f4ng bao gi\u1edd \u0111i gi\u1eefa hai xe cho \u0111\u1ebfn khi t\u00e0i x\u1ebf \u0111\u01b0\u1ee3c kh\u1ed1ng ch\u1ebf; kh\u00f4ng r\u1eddi m\u1eaft kh\u1ecfi xe nghi ph\u1ea1m'}],
      [{en:'Weapons',vi:'V\u0169 kh\u00ed'},{en:'vehicles have many hiding places; suspect can quickly access a weapon; if a weapon is found assume there is another',vi:'xe c\u00f3 nhi\u1ec1u n\u01a1i gi\u1ea5u; nghi ph\u1ea1m c\u00f3 th\u1ec3 nhanh ch\u00f3ng l\u1ea5y v\u0169 kh\u00ed; n\u1ebfu t\u00ecm th\u1ea5y m\u1ed9t v\u0169 kh\u00ed, gi\u1ea3 \u0111\u1ecbnh c\u00f2n v\u0169 kh\u00ed kh\u00e1c'}]
     ]},
    {t:{en:'Vehicle Control - General Considerations',vi:'Ki\u1ec3m so\u00e1t Ph\u01b0\u01a1ng ti\u1ec7n - C\u00e2n nh\u1eafc Chung'},fc:true,
     d:{en:'Prior to stopping any vehicle the officers consider the traffic conditions, adequate stopping space, light at night, a safe retreat, and whether the vehicle matches a description associated with danger. Stop the vehicle in a familiar place and be certain of the exact location.',vi:'Tr\u01b0\u1edbc khi d\u1eebng b\u1ea5t k\u1ef3 ph\u01b0\u01a1ng ti\u1ec7n n\u00e0o, s\u0129 quan c\u00e2n nh\u1eafc \u0111i\u1ec1u ki\u1ec7n giao th\u00f4ng, kh\u00f4ng gian d\u1eebng \u0111\u1ee7, \u00e1nh s\u00e1ng ban \u0111\u00eam, n\u01a1i r\u00fat lui an to\u00e0n, v\u00e0 li\u1ec7u xe c\u00f3 kh\u1edbp m\u00f4 t\u1ea3 li\u00ean quan \u0111\u1ebfn nguy hi\u1ec3m. D\u1eebng xe \u1edf n\u01a1i quen thu\u1ed9c v\u00e0 x\u00e1c \u0111\u1ecbnh ch\u00ednh x\u00e1c v\u1ecb tr\u00ed.'},
     st:[
      {en:'Are the traffic conditions safe for stopping a vehicle?',vi:'\u0110i\u1ec1u ki\u1ec7n giao th\u00f4ng c\u00f3 an to\u00e0n \u0111\u1ec3 d\u1eebng xe kh\u00f4ng?'},
      {en:'Is there adequate space for a vehicle to stop on the side of the road without being a danger?',vi:'C\u00f3 \u0111\u1ee7 kh\u00f4ng gian \u0111\u1ec3 xe d\u1eebng b\u00ean \u0111\u01b0\u1eddng m\u00e0 kh\u00f4ng g\u00e2y nguy hi\u1ec3m kh\u00f4ng?'},
      {en:'If the stop is during the night, is there adequate light available?',vi:'N\u1ebfu d\u1eebng xe ban \u0111\u00eam, c\u00f3 \u0111\u1ee7 \u00e1nh s\u00e1ng kh\u00f4ng?'},
      {en:'Is there a safe place for the officers to retreat should something go wrong?',vi:'C\u00f3 n\u01a1i an to\u00e0n \u0111\u1ec3 s\u0129 quan r\u00fat lui n\u1ebfu c\u00f3 s\u1ef1 c\u1ed1 kh\u00f4ng?'},
      {en:'Does the vehicle fit the description of one associated with someone dangerous?',vi:'Xe c\u00f3 kh\u1edbp m\u00f4 t\u1ea3 c\u1ee7a xe li\u00ean quan \u0111\u1ebfn ng\u01b0\u1eddi nguy hi\u1ec3m kh\u00f4ng?'},
      {en:'If possible, stop the vehicle in a place familiar to the officer',vi:'N\u1ebfu c\u00f3 th\u1ec3, d\u1eebng xe \u1edf n\u01a1i quen thu\u1ed9c v\u1edbi s\u0129 quan'},
      {en:'Be certain of your exact location when the vehicle stops, in case you need immediate assistance',vi:'X\u00e1c \u0111\u1ecbnh ch\u00ednh x\u00e1c v\u1ecb tr\u00ed khi xe d\u1eebng, ph\u00f2ng khi c\u1ea7n h\u1ed7 tr\u1ee3 ngay'},
      {en:'Ask the driver to step out and show their hands are clear; remaining passengers stay until sufficient officers arrive',vi:'Y\u00eau c\u1ea7u t\u00e0i x\u1ebf b\u01b0\u1edbc ra v\u00e0 gi\u01a1 tay r\u00f5 r\u00e0ng; h\u00e0nh kh\u00e1ch \u1edf l\u1ea1i xe cho \u0111\u1ebfn khi \u0111\u1ee7 s\u0129 quan'},
      {en:'Decide who will be the Control and who will be the Protection element before the stop',vi:'Quy\u1ebft \u0111\u1ecbnh ai l\u00e0 y\u1ebfu t\u1ed1 Ki\u1ec3m so\u00e1t v\u00e0 ai l\u00e0 y\u1ebfu t\u1ed1 B\u1ea3o v\u1ec7 tr\u01b0\u1edbc khi d\u1eebng xe'}
     ]},
    {t:{en:'Control Element',vi:'Y\u1ebfu t\u1ed1 Ki\u1ec3m so\u00e1t'},fc:true,
     d:{en:'Officers should at least deploy in buddy teams to conduct a vehicle control. The control element handles radio communication, direct contact with the driver, issuing instructions, interviewing, checking documentation and handcuffing/arresting if needed.',vi:'S\u0129 quan n\u00ean tri\u1ec3n khai theo \u0111\u1ed9i b\u1ea1n \u0111\u1ec3 ki\u1ec3m so\u00e1t ph\u01b0\u01a1ng ti\u1ec7n. Y\u1ebfu t\u1ed1 ki\u1ec3m so\u00e1t x\u1eed l\u00fd li\u00ean l\u1ea1c v\u00f4 tuy\u1ebfn, ti\u1ebfp x\u00fac tr\u1ef1c ti\u1ebfp v\u1edbi t\u00e0i x\u1ebf, ra ch\u1ec9 th\u1ecb, h\u1ecfi cung, ki\u1ec3m tra gi\u1ea5y t\u1edd v\u00e0 c\u00f2ng tay/b\u1eaft gi\u1eef n\u1ebfu c\u1ea7n.'},
     st:[
      {en:'Responsible for all radio communications',vi:'Ch\u1ecbu tr\u00e1ch nhi\u1ec7m m\u1ecdi li\u00ean l\u1ea1c v\u00f4 tuy\u1ebfn'},
      {en:'Obtain identification information from the driver',vi:'L\u1ea5y th\u00f4ng tin nh\u1eadn d\u1ea1ng t\u1eeb t\u00e0i x\u1ebf'},
      {en:'Interview suspect(s) and check documents',vi:'H\u1ecfi nghi ph\u1ea1m v\u00e0 ki\u1ec3m tra gi\u1ea5y t\u1edd'},
      {en:'Give all verbal commands and instructions to the suspect and other vehicle occupants',vi:'Ra m\u1ecdi m\u1ec7nh l\u1ec7nh v\u00e0 ch\u1ec9 th\u1ecb b\u1eb1ng l\u1eddi cho nghi ph\u1ea1m v\u00e0 ng\u01b0\u1eddi tr\u00ean xe'},
      {en:'Apply handcuffs and search each person after they are handcuffed',vi:'C\u00f2ng tay v\u00e0 kh\u00e1m x\u00e9t t\u1eebng ng\u01b0\u1eddi sau khi b\u1ecb c\u00f2ng'},
      {en:'Arrest the driver, if required',vi:'B\u1eaft gi\u1eef t\u00e0i x\u1ebf, n\u1ebfu c\u1ea7n'}
     ]},
    {t:{en:'Protection Element',vi:'Y\u1ebfu t\u1ed1 B\u1ea3o v\u1ec7'},fc:true,
     d:{en:'The protection element keeps the suspects under close observation for any movements which may indicate danger, and takes any necessary action. If the driver is arrested, it ensures the vehicle is clear by approaching from the rear using the \'slice the pie\' method.',vi:'Y\u1ebfu t\u1ed1 b\u1ea3o v\u1ec7 theo d\u00f5i s\u00e1t nghi ph\u1ea1m \u0111\u1ec3 ph\u00e1t hi\u1ec7n m\u1ecdi c\u1eed \u0111\u1ed9ng c\u00f3 th\u1ec3 b\u00e1o hi\u1ec7u nguy hi\u1ec3m, v\u00e0 th\u1ef1c hi\u1ec7n h\u00e0nh \u0111\u1ed9ng c\u1ea7n thi\u1ebft. N\u1ebfu t\u00e0i x\u1ebf b\u1ecb b\u1eaft, y\u1ebfu t\u1ed1 b\u1ea3o v\u1ec7 \u0111\u1ea3m b\u1ea3o xe an to\u00e0n b\u1eb1ng c\u00e1ch ti\u1ebfp c\u1eadn t\u1eeb ph\u00eda sau theo ph\u01b0\u01a1ng ph\u00e1p \'c\u1eaft l\u00e1t b\u00e1nh\'.'},
     st:[
      {en:'Protect the control element until they are in position',vi:'B\u1ea3o v\u1ec7 y\u1ebfu t\u1ed1 ki\u1ec3m so\u00e1t cho \u0111\u1ebfn khi h\u1ecd v\u00e0o v\u1ecb tr\u00ed'},
      {en:'Ensure safety of the suspect vehicle while the control element completes its duties',vi:'\u0110\u1ea3m b\u1ea3o an to\u00e0n xe nghi ph\u1ea1m trong khi y\u1ebfu t\u1ed1 ki\u1ec3m so\u00e1t ho\u00e0n th\u00e0nh nhi\u1ec7m v\u1ee5'},
      {en:'Keep suspects under close observation for dangerous movements; take necessary action',vi:'Theo d\u00f5i s\u00e1t nghi ph\u1ea1m \u0111\u1ec3 ph\u00e1t hi\u1ec7n c\u1eed \u0111\u1ed9ng nguy hi\u1ec3m; th\u1ef1c hi\u1ec7n h\u00e0nh \u0111\u1ed9ng c\u1ea7n thi\u1ebft'},
      {en:'After driver arrested, check the vehicle clear from the rear using \'slice the pie\'',vi:'Sau khi t\u00e0i x\u1ebf b\u1ecb b\u1eaft, ki\u1ec3m tra xe t\u1eeb ph\u00eda sau theo ph\u01b0\u01a1ng ph\u00e1p \'c\u1eaft l\u00e1t b\u00e1nh\''}
     ]},
    {t:{en:'Support Element',vi:'Y\u1ebfu t\u1ed1 H\u1ed7 tr\u1ee3'},fc:true,
     d:{en:'The support element focuses on the wider environment and reinforces the control and protection elements as necessary.',vi:'Y\u1ebfu t\u1ed1 h\u1ed7 tr\u1ee3 t\u1eadp trung v\u00e0o m\u00f4i tr\u01b0\u1eddng r\u1ed9ng h\u01a1n v\u00e0 t\u0103ng c\u01b0\u1eddng cho y\u1ebfu t\u1ed1 ki\u1ec3m so\u00e1t v\u00e0 b\u1ea3o v\u1ec7 khi c\u1ea7n.'},
     st:[
      {en:'Focus on high positions',vi:'T\u1eadp trung c\u00e1c v\u1ecb tr\u00ed cao'},
      {en:'Focus on the environment',vi:'T\u1eadp trung m\u00f4i tr\u01b0\u1eddng xung quanh'},
      {en:'Cover 360 degrees',vi:'Bao ph\u1ee7 360 \u0111\u1ed9'},
      {en:'Redirect the traffic if necessary',vi:'\u0110i\u1ec1u h\u01b0\u1edbng giao th\u00f4ng n\u1ebfu c\u1ea7n'},
      {en:'Ensure safety of the suspect vehicle while protection and control elements move toward it',vi:'\u0110\u1ea3m b\u1ea3o an to\u00e0n xe nghi ph\u1ea1m trong khi y\u1ebfu t\u1ed1 b\u1ea3o v\u1ec7 v\u00e0 ki\u1ec3m so\u00e1t di chuy\u1ec3n \u0111\u1ebfn'},
      {en:'Reinforce control and protection elements if necessary',vi:'T\u0103ng c\u01b0\u1eddng cho y\u1ebfu t\u1ed1 ki\u1ec3m so\u00e1t v\u00e0 b\u1ea3o v\u1ec7 n\u1ebfu c\u1ea7n'},
      {en:'Hold rifles and gas launchers',vi:'Mang s\u00fang tr\u01b0\u1eddng v\u00e0 \u1ed1ng ph\u00f3ng h\u01a1i cay'}
     ]},
    {t:{en:'Vehicle Control Methodology',vi:'Ph\u01b0\u01a1ng ph\u00e1p Ki\u1ec3m so\u00e1t Ph\u01b0\u01a1ng ti\u1ec7n'},fc:true,
     d:{en:'The methodology of a vehicle stop: select an appropriate location, use warning equipment, maintain a safe distance (approximately 10 metres) until the suspect vehicle stops, prepare for the unexpected, and correctly position the vehicle when stopped (about 5-7 metres behind).',vi:'Ph\u01b0\u01a1ng ph\u00e1p d\u1eebng xe: ch\u1ecdn v\u1ecb tr\u00ed ph\u00f9 h\u1ee3p, d\u00f9ng thi\u1ebft b\u1ecb c\u1ea3nh b\u00e1o, gi\u1eef kho\u1ea3ng c\u00e1ch an to\u00e0n (kho\u1ea3ng 10 m\u00e9t) cho \u0111\u1ebfn khi xe nghi ph\u1ea1m d\u1eebng, chu\u1ea9n b\u1ecb cho b\u1ea5t ng\u1edd, v\u00e0 \u0111\u1ed7 xe \u0111\u00fang v\u1ecb tr\u00ed khi d\u1eebng (c\u00e1ch kho\u1ea3ng 5-7 m\u00e9t ph\u00eda sau).'},
     st:[
      {en:'Select location; use warning equipment (blue lights, sirens) if available',vi:'Ch\u1ecdn v\u1ecb tr\u00ed; d\u00f9ng thi\u1ebft b\u1ecb c\u1ea3nh b\u00e1o (\u0111\u00e8n xanh, c\u00f2i) n\u1ebfu c\u00f3'},
      {en:'Maintain safe distance (~10 metres) until the suspect vehicle stops; depends on speed and weather',vi:'Gi\u1eef kho\u1ea3ng c\u00e1ch an to\u00e0n (~10 m\u00e9t) cho \u0111\u1ebfn khi xe nghi ph\u1ea1m d\u1eebng; t\u00f9y t\u1ed1c \u0111\u1ed9 v\u00e0 th\u1eddi ti\u1ebft'},
      {en:'Be prepared for the unexpected - drivers may stop suddenly in the middle of the road or ignore the request',vi:'Chu\u1ea9n b\u1ecb cho b\u1ea5t ng\u1edd - t\u00e0i x\u1ebf c\u00f3 th\u1ec3 d\u1eebng \u0111\u1ed9t ng\u1ed9t gi\u1eefa \u0111\u01b0\u1eddng ho\u1eb7c b\u1ecf qua y\u00eau c\u1ea7u'},
      {en:'Correctly position the vehicle: police vehicle parked about 5-7 metres behind, offset to protect the Control Officer',vi:'\u0110\u1ed7 xe \u0111\u00fang v\u1ecb tr\u00ed: xe c\u1ea3nh s\u00e1t c\u00e1ch kho\u1ea3ng 5-7 m\u00e9t ph\u00eda sau, \u0111\u1eb7t l\u1ec7ch \u0111\u1ec3 b\u1ea3o v\u1ec7 s\u0129 quan Ki\u1ec3m so\u00e1t'},
      {en:'At night: use high beam; spot light directed at interior toward the rear view mirror',vi:'Ban \u0111\u00eam: d\u00f9ng \u0111\u00e8n pha; \u0111\u00e8n pha t\u00ecm h\u01b0\u1edbng v\u00e0o trong xe v\u1ec1 ph\u00eda g\u01b0\u01a1ng chi\u1ebfu h\u1eadu'},
      {en:'If the vehicle refuses to stop: contact control/operations room; pursuits are dangerous, seek authorisation; in non-executive mandate unlikely to be justified',vi:'N\u1ebfu xe kh\u00f4ng ch\u1ecbu d\u1eebng: li\u00ean h\u1ec7 trung t\u00e2m \u0111i\u1ec1u khi\u1ec3n; \u0111u\u1ed5i theo nguy hi\u1ec3m, xin ph\u00e9p; trong nhi\u1ec7m v\u1ee5 kh\u00f4ng th\u1ef1c thi kh\u00f3 c\u00f3 th\u1ec3 ch\u00ednh \u0111\u00e1ng'},
      {en:'Report exact location, vehicle description, occupants, why high risk, and instructions for backup',vi:'B\u00e1o c\u00e1o v\u1ecb tr\u00ed ch\u00ednh x\u00e1c, m\u00f4 t\u1ea3 xe, ng\u01b0\u1eddi tr\u00ean xe, v\u00ec sao r\u1ee7i ro cao, v\u00e0 ch\u1ec9 th\u1ecb cho l\u1ef1c l\u01b0\u1ee3ng chi vi\u1ec7n'}
     ]},
    {t:{en:'High-Risk Stop (Day)',vi:'D\u1eebng xe R\u1ee7i ro Cao (Ban ng\u00e0y)'},fc:true,
     d:{en:'For a high risk vehicle stop during the day: select a suitable location, use warning lights/siren, follow at 7-10 metres until the suspect stops, stop about 7 metres behind with the wheels on full lock, and take position using the vehicle as cover with weapons in the ready position.',vi:'\u0110\u1ed1i v\u1edbi d\u1eebng xe r\u1ee7i ro cao ban ng\u00e0y: ch\u1ecdn v\u1ecb tr\u00ed ph\u00f9 h\u1ee3p, d\u00f9ng \u0111\u00e8n/c\u00f2i c\u1ea3nh b\u00e1o, \u0111i theo c\u00e1ch 7-10 m\u00e9t cho \u0111\u1ebfn khi nghi ph\u1ea1m d\u1eebng, d\u1eebng c\u00e1ch kho\u1ea3ng 7 m\u00e9t ph\u00eda sau v\u1edbi b\u00e1nh xe quay h\u1ebft l\u00e1i, v\u00e0 v\u00e0o v\u1ecb tr\u00ed d\u00f9ng xe l\u00e0m v\u1eadt che ch\u1eafn v\u1edbi v\u0169 kh\u00ed \u1edf t\u01b0 th\u1ebf s\u1eb5n s\u00e0ng.'},
     st:[
      {en:'Select a suitable location considering all factors',vi:'Ch\u1ecdn v\u1ecb tr\u00ed ph\u00f9 h\u1ee3p xem x\u00e9t m\u1ecdi y\u1ebfu t\u1ed1'},
      {en:'Use the warning lights/siren if available to indicate the suspect vehicle to stop',vi:'D\u00f9ng \u0111\u00e8n/c\u00f2i c\u1ea3nh b\u00e1o n\u1ebfu c\u00f3 \u0111\u1ec3 ra hi\u1ec7u xe nghi ph\u1ea1m d\u1eebng'},
      {en:'Follow at a distance of 7-10 metres until the suspect stops',vi:'\u0110i theo c\u00e1ch 7-10 m\u00e9t cho \u0111\u1ebfn khi nghi ph\u1ea1m d\u1eebng'},
      {en:'Stop approx. 7 metres behind the suspect and angle the vehicle tyres on full lock',vi:'D\u1eebng c\u00e1ch kho\u1ea3ng 7 m\u00e9t ph\u00eda sau v\u00e0 quay b\u00e1nh xe h\u1ebft l\u00e1i'},
      {en:'Take position using the vehicle as cover and bring weapons into the ready position',vi:'V\u00e0o v\u1ecb tr\u00ed d\u00f9ng xe l\u00e0m v\u1eadt che v\u00e0 \u0111\u01b0a v\u0169 kh\u00ed v\u00e0o t\u01b0 th\u1ebf s\u1eb5n s\u00e0ng'}
     ]},
    {t:{en:'High-Risk Stop (Night)',vi:'D\u1eebng xe R\u1ee7i ro Cao (Ban \u0111\u00eam)'},fc:true,
     d:{en:'If the stop is at night, the high beams should be turned on to maximize visibility for the officers and decrease visibility for the suspect occupants. If the patrol vehicle has a spotlight, direct it at the interior of the suspect vehicle toward the rear view mirror.',vi:'N\u1ebfu d\u1eebng xe ban \u0111\u00eam, n\u00ean b\u1eadt \u0111\u00e8n pha \u0111\u1ec3 t\u1ed1i \u0111a t\u1ea7m nh\u00ecn cho s\u0129 quan v\u00e0 gi\u1ea3m t\u1ea7m nh\u00ecn c\u1ee7a ng\u01b0\u1eddi trong xe nghi ph\u1ea1m. N\u1ebfu xe tu\u1ea7n tra c\u00f3 \u0111\u00e8n pha t\u00ecm, chi\u1ebfu v\u00e0o trong xe nghi ph\u1ea1m v\u1ec1 ph\u00eda g\u01b0\u01a1ng chi\u1ebfu h\u1eadu.'},
     st:[
      {en:'Use high beam to maximize officer visibility and decrease suspect visibility',vi:'D\u00f9ng \u0111\u00e8n pha \u0111\u1ec3 t\u1ed1i \u0111a t\u1ea7m nh\u00ecn c\u1ee7a s\u0129 quan v\u00e0 gi\u1ea3m t\u1ea7m nh\u00ecn c\u1ee7a nghi ph\u1ea1m'},
      {en:'Use vehicle spot light if available, directed at the interior toward the rear view mirror',vi:'D\u00f9ng \u0111\u00e8n pha t\u00ecm c\u1ee7a xe n\u1ebfu c\u00f3, chi\u1ebfu v\u00e0o trong xe v\u1ec1 ph\u00eda g\u01b0\u01a1ng chi\u1ebfu h\u1eadu'},
      {en:'This reduces suspect night vision so officers keep the advantage when they step out',vi:'\u0110i\u1ec1u n\u00e0y gi\u1ea3m t\u1ea7m nh\u00ecn ban \u0111\u00eam c\u1ee7a nghi ph\u1ea1m \u0111\u1ec3 s\u0129 quan gi\u1eef l\u1ee3i th\u1ebf khi h\u1ecd b\u01b0\u1edbc ra'},
      {en:'All remaining procedures are the same, whether in day or night conditions',vi:'M\u1ecdi quy tr\u00ecnh c\u00f2n l\u1ea1i \u0111\u1ec1u gi\u1ed1ng nhau, d\u00f9 ban ng\u00e0y hay ban \u0111\u00eam'}
     ]},
    {t:{en:'Extraction of Suspects',vi:'\u0110\u01b0a Nghi ph\u1ea1m ra kh\u1ecfi xe'},fc:true,
     d:{en:'Extraction of suspects from the vehicle is a key stage; the driver, being the person in control of the vehicle, must be removed first, followed by the remaining passengers one at a time. A sequence of verbal commands controls the process.',vi:'\u0110\u01b0a nghi ph\u1ea1m ra kh\u1ecfi xe l\u00e0 giai \u0111o\u1ea1n then ch\u1ed1t; t\u00e0i x\u1ebf, ng\u01b0\u1eddi \u0111i\u1ec1u khi\u1ec3n ph\u01b0\u01a1ng ti\u1ec7n, ph\u1ea3i \u0111\u01b0\u1ee3c \u0111\u01b0a ra tr\u01b0\u1edbc, sau \u0111\u00f3 \u0111\u1ebfn c\u00e1c h\u00e0nh kh\u00e1ch c\u00f2n l\u1ea1i l\u1ea7n l\u01b0\u1ee3t t\u1eebng ng\u01b0\u1eddi. M\u1ed9t chu\u1ed7i m\u1ec7nh l\u1ec7nh b\u1eb1ng l\u1eddi ki\u1ec3m so\u00e1t qu\u00e1 tr\u00ecnh.'},
     st:[
      {en:'"All passengers inside the vehicle put your hands up where they can be seen."',vi:'"T\u1ea5t c\u1ea3 ng\u01b0\u1eddi tr\u00ean xe gi\u01a1 tay l\u00ean n\u01a1i nh\u00ecn th\u1ea5y \u0111\u01b0\u1ee3c."'},
      {en:'"Driver, slowly roll down the window with your right hand."',vi:'"T\u00e0i x\u1ebf, t\u1eeb t\u1eeb k\u00e9o c\u1eeda k\u00ednh xu\u1ed1ng b\u1eb1ng tay ph\u1ea3i."'},
      {en:'"Driver, slowly place the keys on the roof."',vi:'"T\u00e0i x\u1ebf, t\u1eeb t\u1eeb \u0111\u1eb7t ch\u00eca kh\u00f3a l\u00ean n\u00f3c xe."'},
      {en:'"Driver, with your right hand, open the door from the outside and put both hands out the door so I can see them."',vi:'"T\u00e0i x\u1ebf, d\u00f9ng tay ph\u1ea3i m\u1edf c\u1eeda t\u1eeb b\u00ean ngo\u00e0i v\u00e0 \u0111\u01b0a c\u1ea3 hai tay ra ngo\u00e0i c\u1eeda \u0111\u1ec3 t\u00f4i nh\u00ecn th\u1ea5y."'},
      {en:'"Driver, slowly get out of the car, facing away from my voice, keeping your hands straight above your head with your fingers spread."',vi:'"T\u00e0i x\u1ebf, t\u1eeb t\u1eeb ra kh\u1ecfi xe, quay l\u01b0ng v\u1ec1 ph\u00eda t\u00f4i, gi\u1eef hai tay gi\u01a1 th\u1eb3ng qua \u0111\u1ea7u v\u1edbi c\u00e1c ng\u00f3n x\u00f2e ra."'},
      {en:'"Driver, slowly turn around in a complete circle." / "Driver, slowly walk backwards, toward my voice."',vi:'"T\u00e0i x\u1ebf, t\u1eeb t\u1eeb xoay m\u1ed9t v\u00f2ng tr\u00f2n." / "T\u00e0i x\u1ebf, t\u1eeb t\u1eeb \u0111i l\u00f9i v\u1ec1 ph\u00eda t\u00f4i."'},
      {en:'"Driver stop!"',vi:'"T\u00e0i x\u1ebf d\u1eebng l\u1ea1i!"'},
      {en:'"Driver, keeping your hands in the air above your head, slowly drop to your knees."',vi:'"T\u00e0i x\u1ebf, gi\u1eef tay gi\u01a1 cao qua \u0111\u1ea7u, t\u1eeb t\u1eeb qu\u1ef3 xu\u1ed1ng."'},
      {en:'Do not tell the driver to throw the keys out - they may be needed later to open the trunk or drive away',vi:'Kh\u00f4ng y\u00eau c\u1ea7u t\u00e0i x\u1ebf n\u00e9m ch\u00eca kh\u00f3a ra - c\u00f3 th\u1ec3 c\u1ea7n sau \u0111\u00f3 \u0111\u1ec3 m\u1edf c\u1ed1p ho\u1eb7c l\u00e1i xe \u0111i'},
      {en:'Other occupants called out one at a time, identified by seat or clothing; ideal ratio is two officers per suspect',vi:'C\u00e1c h\u00e0nh kh\u00e1ch kh\u00e1c \u0111\u01b0\u1ee3c g\u1ecdi ra t\u1eebng ng\u01b0\u1eddi, x\u00e1c \u0111\u1ecbnh theo gh\u1ebf ng\u1ed3i ho\u1eb7c qu\u1ea7n \u00e1o; t\u1ef7 l\u1ec7 l\u00fd t\u01b0\u1edfng hai s\u0129 quan m\u1ed9t nghi ph\u1ea1m'}
     ]},
    {t:{en:'Approach & Search of Vehicles',vi:'Ti\u1ebfp c\u1eadn & Kh\u00e1m x\u00e9t Ph\u01b0\u01a1ng ti\u1ec7n'},fc:true,
     d:{en:'When all suspects have been handcuffed, searched and secured, the vehicle is searched. The protection and control elements approach from the rear with weapons in the high ready position, from both sides to avoid crossfire exposure, watching for any movement.',vi:'Khi m\u1ecdi nghi ph\u1ea1m \u0111\u00e3 b\u1ecb c\u00f2ng tay, kh\u00e1m x\u00e9t v\u00e0 kh\u1ed1ng ch\u1ebf, ti\u1ebfn h\u00e0nh kh\u00e1m x\u00e9t ph\u01b0\u01a1ng ti\u1ec7n. Y\u1ebfu t\u1ed1 b\u1ea3o v\u1ec7 v\u00e0 ki\u1ec3m so\u00e1t ti\u1ebfp c\u1eadn t\u1eeb ph\u00eda sau v\u1edbi v\u0169 kh\u00ed \u1edf t\u01b0 th\u1ebf s\u1eb5n s\u00e0ng cao, t\u1eeb hai b\u00ean \u0111\u1ec3 tr\u00e1nh h\u1ecfa l\u1ef1c ch\u00e9o, quan s\u00e1t m\u1ecdi c\u1eed \u0111\u1ed9ng.'},
     st:[
      {en:'Two officers - one protection element, one support element',vi:'Hai s\u0129 quan - m\u1ed9t y\u1ebfu t\u1ed1 b\u1ea3o v\u1ec7, m\u1ed9t y\u1ebfu t\u1ed1 h\u1ed7 tr\u1ee3'},
      {en:'Approach with weapons in the ready position',vi:'Ti\u1ebfp c\u1eadn v\u1edbi v\u0169 kh\u00ed \u1edf t\u01b0 th\u1ebf s\u1eb5n s\u00e0ng'},
      {en:'Watch for any movement or anything suspicious',vi:'Quan s\u00e1t m\u1ecdi c\u1eed \u0111\u1ed9ng ho\u1eb7c \u0111i\u1ec1u \u0111\u00e1ng ng\u1edd'},
      {en:'Approach from both sides of the suspect vehicle',vi:'Ti\u1ebfp c\u1eadn t\u1eeb c\u1ea3 hai b\u00ean xe nghi ph\u1ea1m'},
      {en:'Avoid cross fire exposures',vi:'Tr\u00e1nh nguy c\u01a1 h\u1ecfa l\u1ef1c ch\u00e9o'},
      {en:'Approach from the rear, to maximize available cover',vi:'Ti\u1ebfp c\u1eadn t\u1eeb ph\u00eda sau, \u0111\u1ec3 t\u1ed1i \u0111a n\u01a1i \u1ea9n n\u1ea5p s\u1eb5n c\u00f3'},
      {en:'Once clear, the driver can be brought back for a full search in their presence',vi:'Khi an to\u00e0n, \u0111\u01b0a t\u00e0i x\u1ebf tr\u1edf l\u1ea1i \u0111\u1ec3 kh\u00e1m x\u00e9t to\u00e0n b\u1ed9 khi h\u1ecd c\u00f3 m\u1eb7t'},
      {en:'Care in opening the trunk/boot - stand to the side, cover with weapons, never stand directly in front',vi:'Th\u1eadn tr\u1ecdng khi m\u1edf c\u1ed1p xe - \u0111\u1ee9ng sang b\u00ean, d\u00f9ng v\u0169 kh\u00ed y\u1ec3m tr\u1ee3, kh\u00f4ng bao gi\u1edd \u0111\u1ee9ng ch\u00ednh di\u1ec7n'}
     ]},
    {t:{en:'Search Equipment & Method',vi:'Trang b\u1ecb & Ph\u01b0\u01a1ng ph\u00e1p Kh\u00e1m x\u00e9t'},fc:true,
     d:{en:'Officers should wear gloves during all searches and always use a flashlight while searching vehicles, plus a small mirror, multi-tool or knife, and small polythene bags for storing evidence. Call for a dog able to detect drugs and/or explosives if available.',vi:'S\u0129 quan n\u00ean \u0111eo g\u0103ng tay trong m\u1ecdi l\u1ea7n kh\u00e1m x\u00e9t v\u00e0 lu\u00f4n d\u00f9ng \u0111\u00e8n pin khi kh\u00e1m x\u00e9t xe, c\u00f9ng g\u01b0\u01a1ng nh\u1ecf, dao \u0111a n\u0103ng, v\u00e0 t\u00fai nilon nh\u1ecf \u0111\u1ec3 \u0111\u1ef1ng ch\u1ee9ng c\u1ee9. G\u1ecdi ch\u00f3 nghi\u1ec7p v\u1ee5 ph\u00e1t hi\u1ec7n ma t\u00fay v\u00e0/ho\u1eb7c ch\u1ea5t n\u1ed5 n\u1ebfu c\u00f3.'},
     st:[
      {en:'Use your senses - look wrong, smell strange, feel odd, sound different',vi:'D\u00f9ng gi\u00e1c quan - nh\u00ecn b\u1ea5t th\u01b0\u1eddng, ng\u1eedi l\u1ea1, s\u1edd kh\u00e1c, nghe kh\u00e1c'},
      {en:'Tap side-panels - does one sound different because something is hidden behind?',vi:'G\u00f5 t\u1ea5m \u1ed1p b\u00ean h\u00f4ng - c\u00f3 t\u1ea5m n\u00e0o k\u00eau kh\u00e1c v\u00ec c\u00f3 v\u1eadt gi\u1ea5u ph\u00eda sau?'},
      {en:'Seize contraband with your partner (and driver if safe) witnessing before it is moved',vi:'Thu gi\u1eef h\u00e0ng c\u1ea5m v\u1edbi \u0111\u1ed1i t\u00e1c (v\u00e0 t\u00e0i x\u1ebf n\u1ebfu an to\u00e0n) l\u00e0m ch\u1ee9ng tr\u01b0\u1edbc khi di chuy\u1ec3n'},
      {en:'Preserve fingerprint evidence - wear latex gloves, sterile evidence bags, chain of custody',vi:'B\u1ea3o qu\u1ea3n ch\u1ee9ng c\u1ee9 d\u1ea5u v\u00e2n tay - \u0111eo g\u0103ng latex, t\u00fai ch\u1ee9ng c\u1ee9 v\u00f4 tr\u00f9ng, chu\u1ed7i b\u1ea3o qu\u1ea3n'},
      {en:'Preserve other evidence (blood, scratches) - notify forensic specialists, cover biological traces',vi:'B\u1ea3o qu\u1ea3n ch\u1ee9ng c\u1ee9 kh\u00e1c (m\u00e1u, v\u1ebft x\u01b0\u1edbc) - b\u00e1o chuy\u00ean gia ph\u00e1p y, che ch\u1eafn v\u1ebft sinh h\u1ecdc'},
      {en:'Always professional to take photos first!',vi:'Lu\u00f4n chuy\u00ean nghi\u1ec7p khi ch\u1ee5p \u1ea3nh tr\u01b0\u1edbc!'}
     ],
     tbl:[
      [{en:'Wear protective gloves',vi:'\u0110eo g\u0103ng tay b\u1ea3o h\u1ed9'},{en:'latex (sensitivity, bio-hazard protection), cut-resistant, heavy rubber (acids, chemicals, narcotics)',vi:'g\u0103ng latex (nh\u1ea1y c\u1ea3m, ch\u1ed1ng sinh h\u1ecdc), g\u0103ng ch\u1ed1ng c\u1eaft, g\u0103ng cao su d\u00e0y (axit, h\u00f3a ch\u1ea5t, ma t\u00fay)'}],
      [{en:'Use proper tools',vi:'D\u00f9ng d\u1ee5ng c\u1ee5 ph\u00f9 h\u1ee3p'},{en:'mirrors for the underside, torches for dark areas, evidence bags',vi:'g\u01b0\u01a1ng soi g\u1ea7m xe, \u0111\u00e8n pin cho khu v\u1ef1c t\u1ed1i, t\u00fai \u0111\u1ef1ng ch\u1ee9ng c\u1ee9'}],
      [{en:'Use search dogs',vi:'D\u00f9ng ch\u00f3 nghi\u1ec7p v\u1ee5'},{en:'detect drugs and/or explosive devices if available',vi:'ph\u00e1t hi\u1ec7n ma t\u00fay v\u00e0/ho\u1eb7c ch\u1ea5t n\u1ed5 n\u1ebfu c\u00f3'}],
      [{en:'List all confiscated property',vi:'L\u1eadp danh s\u00e1ch t\u00e0i s\u1ea3n b\u1ecb t\u1ecbch thu'},{en:'owner witnesses the list and signs; receipt given; note where each item was found; photograph before removing',vi:'ch\u1ee7 xe l\u00e0m ch\u1ee9ng danh s\u00e1ch v\u00e0 k\u00fd; c\u1ea5p bi\u00ean nh\u1eadn; ghi n\u01a1i t\u00ecm th\u1ea5y t\u1eebng v\u1eadt; ch\u1ee5p \u1ea3nh tr\u01b0\u1edbc khi l\u1ea5y'}]
     ]},
    {t:{en:'Systematic Searching',vi:'Kh\u00e1m x\u00e9t c\u00f3 H\u1ec7 th\u1ed1ng'},fc:true,
     d:{en:'All searches must be systematic to avoid missing any area of the vehicle. Start at the top and work your way down or work in a clockwise direction; break the car into imaginary quadrants and search clockwise, top to bottom for each.',vi:'M\u1ecdi kh\u00e1m x\u00e9t ph\u1ea3i c\u00f3 h\u1ec7 th\u1ed1ng \u0111\u1ec3 tr\u00e1nh b\u1ecf s\u00f3t khu v\u1ef1c n\u00e0o c\u1ee7a xe. B\u1eaft \u0111\u1ea7u t\u1eeb tr\u00ean xu\u1ed1ng ho\u1eb7c theo chi\u1ec1u kim \u0111\u1ed3ng h\u1ed3; chia xe th\u00e0nh c\u00e1c g\u00f3c ph\u1ea7n t\u01b0 t\u01b0\u1edfng t\u01b0\u1ee3ng v\u00e0 kh\u00e1m x\u00e9t theo chi\u1ec1u kim \u0111\u1ed3ng h\u1ed3, t\u1eeb tr\u00ean xu\u1ed1ng cho m\u1ed7i g\u00f3c.'},
     st:[
      {en:'All searches must be systematic - always search in the same way',vi:'M\u1ecdi kh\u00e1m x\u00e9t ph\u1ea3i c\u00f3 h\u1ec7 th\u1ed1ng - lu\u00f4n kh\u00e1m x\u00e9t theo c\u00f9ng m\u1ed9t c\u00e1ch'},
      {en:'If searching with other officers ensure no areas are missed; understand each other\'s technique',vi:'N\u1ebfu kh\u00e1m x\u00e9t c\u00f9ng s\u0129 quan kh\u00e1c \u0111\u1ea3m b\u1ea3o kh\u00f4ng b\u1ecf s\u00f3t khu v\u1ef1c; hi\u1ec3u k\u1ef9 thu\u1eadt c\u1ee7a nhau'},
      {en:'Decide your plan of search according to the circumstances; there is no wrong or right order',vi:'Quy\u1ebft \u0111\u1ecbnh k\u1ebf ho\u1ea1ch kh\u00e1m x\u00e9t theo ho\u00e0n c\u1ea3nh; kh\u00f4ng c\u00f3 th\u1ee9 t\u1ef1 \u0111\u00fang hay sai'},
      {en:'Break the search area into quadrants; search clockwise, top to bottom',vi:'Chia khu v\u1ef1c kh\u00e1m x\u00e9t th\u00e0nh c\u00e1c g\u00f3c; kh\u00e1m x\u00e9t theo chi\u1ec1u kim \u0111\u1ed3ng h\u1ed3, t\u1eeb tr\u00ean xu\u1ed1ng'},
      {en:'IED concern: begin with the underside using an inspection mirror; no police radio or cell phone within 100 metres',vi:'Lo ng\u1ea1i IED: b\u1eaft \u0111\u1ea7u t\u1eeb g\u1ea7m xe b\u1eb1ng g\u01b0\u01a1ng soi; kh\u00f4ng d\u00f9ng b\u1ed9 \u0111\u00e0m ho\u1eb7c \u0111i\u1ec7n tho\u1ea1i trong v\u00f2ng 100 m\u00e9t'},
      {en:'Be aware of hollow spaces - exhaust devices; look for new welding or disturbed dirt',vi:'L\u01b0u \u00fd c\u00e1c khoang r\u1ed7ng - \u1ed1ng x\u1ea3; t\u00ecm d\u1ea5u h\u00e0n m\u1edbi ho\u1eb7c l\u1edbp b\u1ee5i b\u1ecb x\u00e1o tr\u1ed9n'}
     ]},
    {t:{en:'Unusual Circumstances',vi:'T\u00ecnh hu\u1ed1ng \u0110\u1eb7c bi\u1ec7t'},fc:true,
     d:{en:'Officers should not overlook searching items belonging to small children, dealing with dogs, searching motorcycles, larger vehicles, and checking vehicle documents. Larger vehicles present much greater opportunities to hide contraband.',vi:'S\u0129 quan kh\u00f4ng n\u00ean b\u1ecf qua kh\u00e1m x\u00e9t \u0111\u1ed3 v\u1eadt c\u1ee7a tr\u1ebb nh\u1ecf, x\u1eed l\u00fd ch\u00f3, kh\u00e1m x\u00e9t xe m\u00e1y, xe l\u1edbn, v\u00e0 ki\u1ec3m tra gi\u1ea5y t\u1edd xe. Xe l\u1edbn t\u1ea1o nhi\u1ec1u c\u01a1 h\u1ed9i h\u01a1n \u0111\u1ec3 gi\u1ea5u h\u00e0ng c\u1ea5m.'},
     st:[

  // ---- TTS: Web Speech API + Oxford MP3 for dictionary words ----
  oxfordURL:function(word){
    var map={'UN':'un','UNSC':'unsc','UNGA':'unga','DPO':'dpo','DFS':'dfs','OCHA':'ocha','UNHCR':'unhcr','UNICEF':'unicef','UNDP':'undp','WHO':'who','WFP':'wfp','UNPOL':'unpol','FPU':'fpu','UNMISS':'unmiss','MONUSCO':'monusco','MINUSMA':'minusma','UNIFIL':'unifil','UNDOF':'undof','UNFICYP':'unficyp','PKO':'pko','POLMIL':'polmil','CIMIC':'cimic','DDR':'ddr','SSR':'ssr','PoC':'poc','SRSG':'srsg','JOC':'joc','ROE':'roe','SOP':'sop','CONOPS':'conops','ISR':'isr','TCC':'tcc','PCC':'pcc','MOU':'mou','DUF':'duf','QRF':'qrf','MEDEVAC':'medevac','CASEVAC':'casevac','SMT':'smt','HRDDP':'hrddp','CRSV':'crsv','robbery':'robbery','assault':'assault','kidnapping':'kidnap','evidence':'evidence','suspect':'suspect','confiscate':'confiscate','custody':'custody','autopsy':'autopsy','deployment':'deployment'};
    var key=word.toLowerCase().replace(/[^a-z]/g,'');
    if(map[key])return'https://ssl.gstatic.com/dictionary/static/sounds/oxford/'+map[key]+'--_gb_1.mp3';
    return null;
  },
  tts:function(text,lang,aggressive){
    text=this.cleanTTS(text);
    if(!text)return;
    var bundled=AUDIO[text];
    if(bundled){this.playAudio(bundled);return;}
    if(!aggressive){
      var oxUrl=this.oxfordURL(text);
      if(oxUrl){this.playAudio(oxUrl);return;}
    }
    if(!window.speechSynthesis)return;
    var self=this;
    window.speechSynthesis.cancel();
    // ponytail: Chrome drops the utterance if speak() fires in the same tick as cancel()
    setTimeout(function(){
      if(window.speechSynthesis&&window.speechSynthesis.resume){window.speechSynthesis.resume();}
      var u=new SpeechSynthesisUtterance(text);
      u.lang=lang||'en-US';
      var v=self.pickVoice(u.lang);
      if(v)u.voice=v;
      // ponytail: normal tone on every device — fixed natural rate/pitch
      u.rate=1;u.pitch=1;u.volume=1;
      window.speechSynthesis.speak(u);
    },60);
  },
  // ponytail: male-first voice pick (commander feel); falls back to the best same-language voice
  pickVoice:function(lang){
    var vs=window.speechSynthesis.getVoices();
    if(!vs||!vs.length)return null;
    var pre=lang.slice(0,2).toLowerCase();
    var pool=[];
    vs.forEach(function(v){if(v.lang&&v.lang.toLowerCase().indexOf(pre)===0)pool.push(v);});
    if(!pool.length)return null;
    var male='male|david|mark|daniel|george|james|alex|guy|ryan|thomas|eric|andrew|brian|robert|michael|richard|christopher|william|charles|steven|john|paul|roger|todd|sean|matthew|fred|tom|nick|matt|aaron|bruce|ralph|reed|stephen|oliver|joaquim|juan|diego|jorge|nicolas|paolo|yuri|markus|viktor|hans|stefan|klaus|wolfgang|pierre|jean|marc|andre|francois|giuseppe|marco|antonio|carlos|jose|pedro|raul|miguel|ahmed|omar|ali|nam|tuan|minh|huy|quang|cuong|trung|thanh|duy|hai|dung|phuc|manh|son|duc';
    var rx=new RegExp('(^|[^a-z])('+male+')([^a-z]|$)');
    for(var j=0;j<pool.length;j++){
      if(rx.test(pool[j].name.toLowerCase()))return pool[j];
    }
    return pool[0];
  },
  cleanTTS:function(t){
    // ponytail: speak only the order itself. One " — " => cut the whole instruction tail;
    // several (bundled terms "Roger — ... Negative — ...") => cut each sentence at its own " — "
    var j=t.indexOf(' — ');
    if(j>0&&t.indexOf(' — ',j+1)<0){t=t.slice(0,j);}
    else if(j>0){
      var out='',parts=t.split(/([.!?])\s+/);
      for(var i=0;i<parts.length;i+=2){
        var s=parts[i],k=s.indexOf(' — ');
        out+=(k>0?s.slice(0,k):s)+(parts[i+1]||'')+' ';
      }
      t=out;
    }
    // pause between " / " alternatives; unspaced slashes (Platoons/Sections) stay intact
    return t.replace(/ \/ /g,', ').replace(/[\[\]\(\)]/g,'').trim();
  },
  playAudio:function(url){
    if(this._audio)this._audio.pause();
    this._audio=new Audio(url);
    this._audio.volume=1;
    this._audio.play().catch(function(e){console.warn('Audio:'+e.message);if(window.LOG)LOG.warn('Audio playback failed: '+e.message);});
  },

  // ---- Convoy / VIP: generic card renderer (mirrors rPOM) ----
  rCard:function(list,intro,imgs){

    if(intro)h+='<h2 style="margin:16px 0 12px;font-size:var(--fl);font-weight:700">'+this.t(intro)+'</h2>';
    list.forEach(function(c,i){
      h+='<details class="sk" style="margin:8px 0;border:1px solid var(--bd);border-radius:12px;overflow:hidden"><summary style="padding:12px 16px;cursor:pointer;font-weight:600;font-size:var(--fm);background:var(--bg2)">'+self.t(c.t)+'</summary><div style="padding:12px 16px">';
      if(c.d)h+='<p style="margin:0 0 8px;font-size:var(--fs);color:var(--fg2);line-height:1.5">'+self.t(c.d)+'</p>';
      if(imgs&&imgs[i]){
        imgs[i].forEach(function(d){
          h+='<div style="margin:8px 0;text-align:center"><img src="'+d+'" alt="" loading="lazy" style="max-width:100%;border-radius:8px;border:1px solid var(--bd)"></div>';
        });
      }
      if(c.tbl){
        h+='<div class="tw"><table><tbody>';
        c.tbl.forEach(function(row){
          var speak=self.st.lang==='vi'?row[0].vi+' : '+row[1].vi:row[0].en+' : '+row[1].en;
          h+='<tr><td>'+self.t(row[0])+' <span class="tts" data-tts="'+self.esc(speak)+'" data-tts-lang="'+(self.st.lang==='vi'?'vi-VN':'en-US')+'">\u{1F50A}</span></td><td>'+self.t(row[1])+'</td></tr>';
        });
        h+='</tbody></table></div>';
      }
      if(c.st){
        h+='<ol style="margin:0 0 8px 16px;padding:0">';
        c.st.forEach(function(s){
          var speak=self.st.lang==='vi'?s.vi:s.en;
          h+='<li style="margin:4px 0;font-size:var(--fs);line-height:1.5">'+self.t(s)+' <span class="tts" data-tts="'+self.esc(speak)+'" data-tts-lang="'+(self.st.lang==='vi'?'vi-VN':'en-US')+'">\u{1F50A}</span></li>';
        });
        h+='</ol>';

  rf:function(){

      list.forEach(function(c,i){

  // PDF.js reader (the "view" feature Stirling-PDF wraps; pdf.js is Apache-2.0, embedded single-file)
  pdfInit:function(){
    if(this._pdfInit)return this._pdfInit;
    var self=this;
    this._pdfInit=new Promise(function(res){
      if(window.pdfjsLib){self._pdfWorker();res();return;}
      // fetch pdf.js core then indirect eval → global scope; runs once, cached
      fetch('js/pdfjs-core.js').then(function(r){return r.text();}).then(function(js){
        (0,eval)(js);
        return self._pdfWorker();
      }).then(function(){res();}).catch(function(e){
        if(window.LOG)LOG.error('pdf core load failed: '+e.message);
        res();
      });
    });
    return this._pdfInit;
  },
  _pdfWorker:function(){
    if(this._workerUrl)return Promise.resolve();
    var self=this;
    return fetch('js/pdfjs-worker.js').then(function(r){return r.text();}).then(function(w){
      self._workerUrl=URL.createObjectURL(new Blob([w],{type:'text/javascript'}));
      pdfjsLib.GlobalWorkerOptions.workerSrc=self._workerUrl;
    });
  },
  pdfOpen:function(id){
    var self=this,host=document.getElementById('dv-'+id);
    var v=this._pv&&this._pv[id];
    host.innerHTML='<div class="pview" id="pv-'+id+'">'
      +'<div class="pbar"><select data-pzoom data-pdf="'+id+'"><option value="0.75">75%</option><option value="1" selected>100%</option><option value="1.5">150%</option><option value="2">200%</option></select></div>'
      +'<div class="pbody"></div><div class="pload">Loading&#8230;</div>';
    if(v){this.pdfRender(id);return;}
    this._pv=this._pv||{};
    this._pv[id]={page:1,zoom:1,doc:null};
    this.pdfInit().then(function(){
      return pdfjsLib.getDocument({url:'pdfs/'+id+'.pdf'}).promise;
    }).then(function(doc){
      self._pv[id].doc=doc;
      self.pdfRender(id);
    }).catch(function(e){
      var pl=host.querySelector('.pload');
      if(pl)pl.textContent='PDF error: '+e.message;
      if(window.LOG)LOG.error('PDF open failed ('+id+'): '+e.message);
    });
  },
  pdfZoom:function(id,z){
    var v=this._pv&&this._pv[id];if(!v)return;
    v.zoom=parseFloat(z);
    v._built=false;
    this.pdfRender(id);
  },
  pdfRender:function(id){
    var v=this._pv&&this._pv[id],self=this;
    if(!v||!v.doc)return;
    var host=document.getElementById('pv-'+id);
    if(!host)return;
    var body=host.querySelector('.pbody'),dpr=window.devicePixelRatio||1;
    if(!v._scrolled){
      v._scrolled=1;
      body.addEventListener('scroll',function(){self.pdfRender(id);});
    }
    if(!v._built){
      v._ratio=body.scrollHeight?body.scrollTop/body.scrollHeight:0;
      body.innerHTML='';
      v.doc.getPage(1).then(function(p1){
        var base=(body.children[0]||body).clientWidth/p1.getViewport({scale:1}).width;
        var h=Math.round(p1.getViewport({scale:1}).height*base*v.zoom);
        for(var i=1;i<=v.doc.numPages;i++){
          var d=document.createElement('div');
          d.className='pslot';d.style.height=h+'px';
          d.appendChild(document.createElement('canvas'));
          body.appendChild(d);
        }
        v._built=true;
        body.scrollTop=v._ratio*body.scrollHeight;
        self.pdfRender(id);
      });
      return;
    }
    var slots=body.children,top=body.scrollTop,bot=top+body.clientHeight,i;
    for(i=0;i<slots.length;i++){
      var d=slots[i];
      if(!d._r&&d.offsetTop<bot&&d.offsetTop+d.offsetHeight>top){
        d._r=1;
        self.pdfPage(id,i+1,d);
      }
    }
    var pl=host.querySelector('.pload');
    if(pl)pl.parentNode.removeChild(pl);
  },
  pdfPage:function(id,n,slot){
    var v=this._pv&&this._pv[id];
    v.doc.getPage(n).then(function(page){
      var body=slot.parentNode,base=(body.children[0]||body).clientWidth/page.getViewport({scale:1}).width;
      var vp=page.getViewport({scale:base*v.zoom});
      var cv=slot.querySelector('canvas'),ctx=cv.getContext('2d'),dpr=window.devicePixelRatio||1;
      cv.width=vp.width*dpr;cv.height=vp.height*dpr;cv.style.width=vp.width+'px';cv.style.height=vp.height+'px';
      ctx.setTransform(dpr,0,0,dpr,0,0);
      page.render({canvasContext:ctx,viewport:vp});
    });
  },
  md2html:function(md){
    // ponytail: minimal md renderer — headings, bold/italic, flat lists, tables, hr, links-as-text.
    // Not a spec parser; upgrade only if new documents need richer markup.
    var lines=md.split(String.fromCharCode(10)),h='',i=0,list='',listT='ul',inT=false;
    function closeList(){if(list){h+='<'+listT+'>'+list+'</'+listT+'>';list='';}}
    function closeTable(){if(inT){h+='</tbody></table>';inT=false;}}
    function inline(s){
      s=s.replace(/\[([^\]]+)\]\([^)]*\)/g,'$1').replace(/\\([*#])/g,'$1');
      return s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\*([^*]+)\*/g,'<em>$1</em>');
    }
    while(i<lines.length){
      var L=lines[i];
      if(!L.trim()){closeList();closeTable();i++;continue;}
      if(L.trim().charAt(0)==='|'){
        closeList();
        var cells=L.trim().replace(/^\||\|$/g,'').split('|');
        if(!inT){h+='<table><tbody>';inT=true;}
        var allSep=cells.every(function(c){return /^[\s:-]+$/.test(c);});
        if(!allSep)h+='<tr>'+cells.map(function(c){return '<td>'+inline(c.trim())+'</td>';}).join('')+'</tr>';
        i++;continue;
      }
      closeTable();
      var m=/^(#{1,3})\s+(.*)$/.exec(L);
      if(m){closeList();var lv=m[1].length;h+='<h'+lv+'>'+inline(m[2])+'</h'+lv+'>';i++;continue;}
      if(/^\s*---+\s*$/.test(L)){closeList();h+='<hr>';i++;continue;}
      var lm=/^(\s*)([+\-]|\*(?!\*)|\d+\.)\s+(.*)$/.exec(L);
      if(lm){
        closeTable();
        var isOl=/^\d+\.$/.test(lm[2]);
        if(!list||listT!==(isOl?'ol':'ul')){
          if(list)h+='</'+listT+'>';
          listT=isOl?'ol':'ul';list='';
        }
        list+='<li>'+inline(lm[3])+'</li>';
        i++;continue;
      }
      closeList();
      h+='<p>'+inline(L)+'</p>';
      i++;
    }
    closeList();closeTable();
    return h;
  },
