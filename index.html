    ]}
  ],

  pom:[
    {cat:{en:'Shield & Baton Commands', vi:'Lệnh khiên & dùi cui'},
     desc:{en:"Sequence of shield and baton positions used to present force, protect the unit, and control crowd movement. Each position has a specific tactical purpose in the escalation ladder.", vi:"Trình tự các tư thế khiên và dùi cui được sử dụng để thể hiện sức mạnh, bảo vệ đơn vị và kiểm soát đám đông. Mỗi tư thế có mục đích chiến thuật cụ thể."},
     steps:[
      {en:"Shields down, visors up — Rest position, low threat. Visors open for ventilation.", vi:"Chống lá chắn, mở kính mũ — Tư thế nghỉ, mối đe dọa thấp. Mở kính để thông gió."},
      {en:"Shields standby — Shield held at waist, visors still up. Ready to react but not yet committed.", vi:"Cầm lá chắn ở vị trí chờ lệnh, vẫn mở kính mũ — Khiên ở thắt lưng, sẵn sàng nhưng chưa cam kết."},
      {en:"Shields ready — Combat stance, visors down. Maximum protection. Full engagement posture.", vi:"Tư thế chiến đấu, hạ kính mũ xuống — Tư thế sẵn sàng chiến đấu, bảo vệ tối đa."},
      {en:"Shields on the ground — Plant shield base on ground for stationary defense line.", vi:"Đặt lá chắn — Đặt khiên xuống đất để tạo tuyến phòng thủ tĩnh."},
      {en:"Batons at chest — Baton held horizontal at chest height. Ready to push or strike.", vi:"Gậy ngang ngực — Gậy ngang tầm ngực. Sẵn sàng đẩy hoặc đánh."},
      {en:"Batons at front — Baton extended forward, pointing at threat. Warning/presentation stance.", vi:"Gậy ở phía trước — Gậy hướng về phía trước, chỉ vào mối đe dọa. Tư thế cảnh cáo."},
      {en:"Batons along side — Baton held vertically along leg. Low profile, non-threatening.", vi:"Gậy dọc thân mình — Gậy dọc theo chân. Tư thế thấp, không đe dọa."},
      {en:"Batons at back — Baton behind back, palms out. De-escalation posture, open hands visible.", vi:"Gậy sau lưng — Gậy sau lưng, lòng bàn tay hướng ra ngoài. Tư thế giảm leo thang."},
     {en:"Shields on the front line - Take your position - Go — Shield holder moves to the front line.", vi:"Khiên lên tuyến trước - Vào vị trí - Đi — Người cầm khiên di chuyển lên hàng trước."},
     {en:"Batons on the front line - Take your position on the right - Go — Baton holder moves to the right to avoid the shield holder.", vi:"Gậy lên tuyến trước - Vào vị trí bên phải - Đi — Người cầm gậy di chuyển sang phải để tránh vướng vào người cầm khiên."},
     {en:"Shields and batons on the same line - Take your position - Go — Shield holder moves to the left of the baton holder. The row behind moves forward to align shields on the same line.", vi:"Khiên và gậy cùng một hàng - Vào vị trí - Đi — Người cầm khiên di chuyển bên trái người cầm gậy. Hàng nào đứng sau di chuyển lên để cùng một hàng ngang."},
     {en:"Unit! For a clearing wave of X meters. Shields on the front line, batons on the front line - Take your position. Shields and batons on the same line - Take the position. Go! — Full clearing command for the squad.", vi:"Đơn vị! Tiến hành đợt dọn đường X mét. Khiên lên tuyến trước, gậy lên tuyến trước - Vào vị trí. Khiên và gậy cùng một hàng - Vào vị trí. Đi!"}
     ],
     hazards:[
      {en:"Skipping the warning sequence (standby -> ready) escalates the situation too quickly.", vi:"Bỏ qua trình tự cảnh cáo (chờ -> sẵn sàng) làm leo thang quá nhanh."},
      {en:"Visors down too early limits visibility and communication with the team.", vi:"Hạ kính mũ quá sớm hạn chế tầm nhìn và giao tiếp trong đội."}
     ]},
    {cat:{en:'Formation Splitting', vi:'Phân tách đội hình'},
     desc:{en:"Splitting and reforming formations allows the unit to change frontage, bypass obstacles, or contain threats from multiple directions while maintaining command and control.", vi:"Phân tách và sát nhập đội hình cho phép đơn vị thay đổi chiều rộng mặt trận, vượt chướng ngại hoặc kiểm soát đe dọa từ nhiều hướng."},
     order:{en:"Reform: Merge smaller elements into the parent formation. When taking position, stand behind the reference element shown in bold. Platoons, sections, teams, buddy teams — reform into unit, platoons, sections, teams, buddy teams. From left to right / From right to left / From sides to center. X meters between elements. Ready to go? Go.", vi:"Sát nhập đội hình: Sát nhập các phần tử nhỏ hơn vào đội hình chính. Khi vào vị trí, đứng sau phần tử chuẩn (in đậm). Trung đội, tiểu đội, nhóm, nhóm 2 người — sát nhập thành đơn vị, trung đội, tiểu đội, nhóm, nhóm 2 người. Lấy bên trái / Lấy bên phải làm chuẩn / Nhìn giữa thẳng, dồn vào giữa. Cách nhau X mét. Trả lời khi đã sẵn sàng? Đi."},
     steps:[
      {en:"Split into Platoons/Sections/Teams/Buddy teams — Divide unit into smaller tactical elements. Command element retains C2.", vi:"Phân tách thành Trung đội/Tiểu đội/Nhóm 5/Nhóm 2 — Chia đơn vị thành các phần tử chiến thuật nhỏ hơn. Phần chỉ huy giữ quyền kiểm soát."},
      {en:"From left to right / From right to left — Use one flank as the base for splitting or reforming. The flank element moves first, others follow sequentially.", vi:"Lấy bên trái/phải làm chuẩn — Dùng một bên cánh làm chuẩn. Phần tử ở cánh di chuyển trước, các phần khác theo sau."},
      {en:"From center to the sides / From sides to center — Split outward from the middle or converge inward from flanks. Used to change frontage quickly.", vi:"Tách đội hình sang hai bên / Nhìn giữa thẳng — Tách ra từ giữa hoặc hội tụ từ hai cánh. Dùng để thay đổi chiều rộng mặt trận nhanh chóng."},
      {en:"Reform into Unit/Platoons/Sections — Reconsolidate elements back into parent formation after split, maintaining security during the merge.", vi:"Sát nhập đội hình thành Đơn vị/Trung đội — Tái hợp các phần tử vào đội hình chính, duy trì an ninh trong khi sát nhập."}
     ],
     hazards:[
      {en:"Losing accountability of subordinate elements during split — must maintain comms.", vi:"Mất kiểm soát các phần tử trong khi phân tách — phải duy trì liên lạc."},
      {en:"Reform too slowly leaves elements isolated and vulnerable to being overwhelmed.", vi:"Sát nhập quá chậm khiến các phần tử bị cô lập và dễ bị áp đảo."}
     ]},
    {cat:{en:'Movement Commands', vi:'Lệnh di chuyển'},
     desc:{en:"Movement commands control the speed, posture, and tactical momentum of the unit. The commander specifies distance, method, and rhythm.", vi:"Lệnh di chuyển kiểm soát tốc độ, tư thế và đà chiến thuật của đơn vị. Chỉ huy xác định cự ly, phương thức và nhịp điệu."},
     steps:[
      {en:"Unit, advance X meters. Start by walking — Standard controlled advance. Maintain formation integrity. Walk keeps unit steady.", vi:"Đơn vị, tiến lên X mét. Đi bộ — Tiến quân kiểm soát tiêu chuẩn. Giữ nguyên đội hình."},
      {en:"Unit, advance X meters. At the double — Rapid controlled advance. Double-time (180 steps/min). For quick closure or withdrawal.", vi:"Đơn vị, tiến lên X mét. Chạy đều bước nhỏ — Tiến nhanh có kiểm soát. 180 bước/phút. Áp sát hoặc rút lui nhanh."},
      {en:"Unit, advance X meters. By March with cadences — Formal march with step count/cadence calls. Use for show of force, parade, or deliberate movement.", vi:"Đơn vị, tiến lên X mét. Hành quân (có nhịp điệu) — Hành quân chính thức với nhịp đếm. Dùng để thể hiện sức mạnh hoặc di chuyển có chủ định."},
      {en:"Unit, advance X meters. By March without cadences — Tactical movement with no audible cadence. Stealthier, better for urban patrol or approaching crowds.", vi:"Đơn vị, tiến lên X mét. Hành quân (không nhịp điệu) — Di chuyển chiến thuật không có nhịp đếm. Ít tiếng động, phù hợp tuần tra đô thị hoặc tiếp cận đám đông."},
      {en:"Unit, advance X meters. By Dynamic March — Aggressive, fluid movement. Use when the situation requires rapid repositioning under tension.", vi:"Đơn vị, tiến lên X mét. Hành quân động lực — Di chuyển linh hoạt, tấn công. Dùng khi cần tái bố trí nhanh trong tình huống căng thẳng."},
      {en:"Unit, charge for X meters. Response as soon as you're ready. Charge — Rapid forward assault. Only on commander's order when non-lethal force is authorized. Maintain shield wall during charge.", vi:"Đơn vị, xông lên X mét. Trả lời ngay khi sẵn sàng. Xông lên! — Tấn công nhanh về phía trước. Chỉ khi có lệnh chỉ huy và được phép sử dụng vũ lực phi sát thương. Giữ tường khiên."},
     {en:"Unit! For an offensive bound of X meters. Ready to go! Go! Halt. Back, back, back. — Advance the formation, then return to the original position. The rear commander adjusts the route; shield officers keep observation; baton officers stand ready to support.", vi:"Đơn vị! Tiến hành bước tấn công X mét. Trả lời khi đã sẵn sàng! Đi! Dừng. Lùi, lùi, lùi. — Đưa đội hình lên tấn công rồi trở về vị trí ban đầu. Chỉ huy phía sau điều chỉnh đường đi; sĩ quan cầm khiên duy trì quan sát; sĩ quan cầm gậy sẵn sàng hỗ trợ."},
     {en:"Unit! For a defensive bound of X meters. Ready to go! Go! Halt. Back, back, back. — Advance the formation, then withdraw to a position deeper than the original, as ordered by the commander.", vi:"Đơn vị! Tiến hành bước phòng thủ X mét. Trả lời khi đã sẵn sàng! Đi! Dừng. Lùi, lùi, lùi. — Đưa đội hình lên tấn công rồi lùi về vị trí sâu hơn vị trí ban đầu theo lệnh của chỉ huy."},
     {en:"Unit! To disembark on the right or on the left of the vehicle. Shields in standby position. Ready to go. Go!", vi:"Đơn vị! Xuống xe bên phải hoặc bên trái xe. Lá chắn ở vị trí chờ lệnh. Trả lời khi đã sẵn sàng. Đi!"}
     ],
     hazards:[
      {en:"Advancing too fast (charge) without shield wall cohesion creates gaps the crowd can exploit.", vi:"Xông lên quá nhanh mà không giữ đội hình khiên tạo kẽ hở cho đám đông."},
      {en:"Marching with cadences in a sensitive area reveals unit position and intent.", vi:"Hành quân có nhịp điệu ở khu vực nhạy cảm tiết lộ vị trí và ý định của đơn vị."}
     ]},
    {cat:{en:'Cordon Formations', vi:'Đội hình chặn'},
     desc:{en:"Cordons establish controlled perimeters to contain, divert, or filter crowds. The type of cordon depends on the tactical objective: block, channel, or screen.", vi:"Đội hình chặn thiết lập vành đai kiểm soát để chặn, chuyển hướng hoặc lọc đám đông. Loại chặn phụ thuộc mục tiêu chiến thuật."},
     order:{en:"Unit. To set up: Blocking cordon, Filter cordon, Directional cordon. From: Center to right/left, Right to left, Left to right. Response as soon as you're ready, GO.", vi:"Đơn vị. Thiết lập: Chặn ngang, Chặn lọc, Chặn dồn đám đông. Từ: Giữa sang phải/trái, Phải sang trái, Trái sang phải. Trả lời ngay khi sẵn sàng, ĐI."},
     steps:[
      {en:"Blocking cordon — Linear formation across a route. Prevents passage in one direction. Shields interlocked, multiple ranks for depth.", vi:"Đội hình ngăn chặn hàng ngang — Đội hình thẳng băng qua đường. Chặn một hướng. Khiên khớp nhau, nhiều hàng."},
      {en:"Directional cordon — Wedge/angled formation that channels the crowd toward a specific exit or containment area.", vi:"Đội hình dồn đám đông — Đội hình nêm/góc dẫn đám đông về lối ra hoặc khu vực kiểm soát chị định."},
      {en:"Filter cordon — Checkpoint-style formation with a controlled passage. Allows vetted individuals through while blocking others.", vi:"Đội hình lọc — Đội hình kiểu trạm kiểm soát với lối đi có kiểm soát. Cho phép cá nhân đã kiểm tra qua."}
     ],
     hazards:[
      {en:"Cordon too thin (single rank) can be breached by a determined crowd. Minimum 2 ranks for blocking cordons.", vi:"Chặn quá mỏng (một hàng) có thể bị đám đông xâm phạm. Tối thiểu 2 hàng cho chặn ngang."},
      {en:"Filter cordon without clear signage causes confusion and crowd surge at the passage point.", vi:"Chặn lọc không có biển báo rõ gây nhầm lẫn và dồn đám đông tại điểm qua."}
     ]},
    {cat:{en:'Barricade Clearance Commands', vi:'Lệnh di dời rào chắn'},
     desc:{en:"Short, direct commands to remove barricades, clear obstacles, and reopen routes during crowd-control operations. Breach is used when more force is needed, for example with an APC.", vi:"Các lệnh ngắn gọn, trực tiếp để di dời rào chắn, dọn chướng ngại vật và mở lại đường đi trong các chiến dịch kiểm soát đám đông. Phá vỡ rào chắn dùng khi cần lực mạnh hơn, ví dụ với xe APC."},
     steps:[
      {en:"Check/ Clear the barricade! — Move the barricade aside.", vi:"Di dời rào chắn! — Di chuyển rào chắn sang bên."},
      {en:"Remove the barrier! — Remove the obstacle.", vi:"Dọn rào chắn! — Gỡ bỏ chướng ngại vật."},
      {en:"Breach the barricade! — Break through the barricade, used when more force is needed, e.g. with an APC.", vi:"Phá vỡ rào chắn! — Phá rào chắn, dùng khi cần lực mạnh hơn, ví dụ xe APC."},
      {en:"Clearance team, move! — Command for the dedicated clearance team.", vi:"Đội dỡ bỏ, hành động! — Lệnh cho đội chuyên trách dỡ bỏ."},
      {en:"Open the route! — Open the road.", vi:"Mở tuyến! — Mở thông đường đi."},
      {en:"Execute clearance! — Carry out the removal.", vi:"Thực hiện dỡ bỏ! — Tiến hành công tác dỡ bỏ."}
     ]},
    {cat:{en:'Radio Procedures', vi:'Thủ tục bộ đàm'},
     desc:{en:"Standard radio communication procedures ensure clear, concise, and unambiguous transmission between elements. Every transmission follows the sequence: callsign -> message -> over.", vi:"Các thủ tục liên lạc chuẩn đảm bảo truyền tin rõ ràng, ngắn gọn và không nhầm lẫn. Mỗi lần truyền theo trình tự: tên hiệu -> nội dung -> hết."},
     steps:[
      {en:"This is [callsign], do you copy? Over — Standard initial call to establish contact. Always identify yourself first.", vi:"[Tên hiệu] đây, anh có nghe rõ không? Hết — Gọi ban đầu để thiết lập liên lạc. Luôn xác định danh tính trước."},
      {en:"Roger — Message received and understood. Negative — Did not receive or cannot comply. Standby — Wait, I will return. WILCO — Will comply (follow instructions).", vi:"Rõ — Đã nhận và hiểu. Không — Không nhận hoặc không thể tuân thủ. Chờ — Chờ, tôi sẽ quay lại. Sẽ tuân thủ — Sẽ làm theo."},
      {en:"Out — End of transmission, no reply expected. Over — End of transmission, reply expected. Over and out — Redundant, avoid.", vi:"Cắt liên lạc — Kết thúc, không cần trả lời. Hết — Kết thúc, cần trả lời. Hết và cắt — Thừa, tránh dùng."},
      {en:"Say again — Please repeat last transmission. I say again — I am repeating my previous message for clarity.", vi:"Nhắc lại — Làm ơn nhắc lại. Tôi nhắc lại — Tôi lặp lại tin trước để rõ hơn."},
      {en:"Loud and clear — Excellent signal strength and clarity. Weak but readable — Signal is weak but message can be understood.", vi:"Rõ và to — Tín hiệu tốt và rõ. Yếu nhưng nghe được — Tín hiệu yếu nhưng có thể hiểu."},
      {en:"Affirmative — Yes / Correct. Negative — No / Incorrect. Use instead of 'yes/no' to avoid misunderstanding on poor connections.", vi:"Khẳng định — Đúng. Phủ định — Sai. Dùng thay 'có/không' để tránh hiểu nhầm."},
      {en:"Check — Verify or confirm. Correction — I made an error, corrected version follows. Wait out — I will be off the net for a period.", vi:"Kiểm tra — Xác nhận. Chỉnh lỗi — Tôi sai, bản sửa như sau. Chờ — Tôi sẽ tạm ngưng trong lúc chờ."},
      {en:"Radio check (1-5) — Signal strength check. 1=unreadable, 2=readable sometimes, 3=readable but difficult, 4=readable, 5=loud and clear.", vi:"Kiểm tra sóng (1-5) — Kiểm tra cường độ tín hiệu. 1=không nghe được, 2=thỉnh thoảng nghe được, 3=nghe được nhưng khó, 4=nghe được, 5=rõ và to."}
     ],
     hazards:[
      {en:"Using 'Over and out' — contradictory terms. 'Over' expects reply, 'Out' ends transmission. Use one or the other.", vi:"Dùng 'Hết và cắt' — mâu thuẫn. 'Hết' cần trả lời, 'Cắt' kết thúc. Chỉ dùng một trong hai."},
      {en:"Speaking too fast or without keying delay — cuts off first syllable. Pause 1 second after keying the mic.", vi:"Nói quá nhanh hoặc không chờ sau khi bấm mic — mất âm đầu. Chờ 1 giây sau khi bấm mic."}
     ]}
  ],

  sc:[
    // Patrol (p1-p6)

     st:[{en:'Use force to continue movement or avoid the killing zone (counter-ambush drills).',vi:'D\u00f9ng v\u0169 l\u1ef1c ti\u1ebfp t\u1ee5c di chuy\u1ec3n ho\u1eb7c tr\u00e1nh khu v\u1ef1c h\u1ecfa l\u1ef1c (b\u00e0i t\u1eadp ch\u1ed1ng ph\u1ee5c k\u00edch).'},{en:'Call in scout and reserve to attack the ambush site on its flanks.',vi:'G\u1ecdi trinh s\u00e1t v\u00e0 d\u1ef1 b\u1ecb t\u1ea5n c\u00f4ng v\u1ecb tr\u00ed ph\u1ee5c k\u00edch t\u1eeb hai s\u01b0\u1eddn.'},{en:'Vehicles under fire shoot back vigorously; fire smoke grenades toward the attackers.',vi:'C\u00e1c xe b\u1ecb b\u1eafn b\u1eafn tr\u1ea3 m\u1ea1nh; b\u1eafn l\u1ef1u \u0111\u1ea1n kh\u00f3i v\u1ec1 ph\u00eda k\u1ebb t\u1ea5n c\u00f4ng.'},{en:'Inform the Operation Centre and warn vehicles approaching the area.',vi:'B\u00e1o Trung t\u00e2m T\u00e1c chi\u1ebfn v\u00e0 c\u1ea3nh b\u00e1o c\u00e1c xe \u0111ang ti\u1ebfn v\u00e0o khu v\u1ef1c.'},{en:'Use force to prevent capture of hostages; first aid and Casevac where needed.',vi:'D\u00f9ng v\u0169 l\u1ef1c ng\u0103n ch\u1eb7n b\u1eaft c\u00f3c con tin; s\u01a1 c\u1ee9u v\u00e0 Casevac khi c\u1ea7n.'},{en:'Restart the convoy as soon as possible.',vi:'Cho \u0111o\u00e0n xe ti\u1ebfp t\u1ee5c c\u00e0ng s\u1edbm c\u00e0ng t\u1ed1t.'}]},
    {cat:'Escort',id:'e2',en:'Vehicle Breakdown',vi:'Ph\u01b0\u01a1ng ti\u1ec7n b\u1ecb h\u1ecfng',
     st:[{en:'Stop the convoy and set up 360\u00b0 security; call in the reserve.',vi:'D\u1eebng \u0111o\u00e0n xe v\u00e0 l\u1eadp v\u00f2ng b\u1ea3o v\u1ec7 360\u00b0; g\u1ecdi \u0111\u1ed9i d\u1ef1 b\u1ecb.'},{en:'Remove the blockage; be careful going off-road where mines may be located.',vi:'D\u1ecdn v\u1eadt c\u1ea3n; th\u1eadn tr\u1ecdng khi xu\u1ed1ng \u0111\u01b0\u1eddng \u1edf n\u01a1i c\u00f3 th\u1ec3 c\u00f3 m\u00ecn.'},{en:'Inform the Operation Centre; tow the vehicle or redistribute the load.',vi:'B\u00e1o Trung t\u00e2m T\u00e1c chi\u1ebfn; c\u1ee9u k\u00e9o xe ho\u1eb7c ph\u00e2n l\u1ea1i h\u00e0ng h\u00f3a.'},{en:'Restart the convoy as soon as possible.',vi:'Cho \u0111o\u00e0n xe ti\u1ebfp t\u1ee5c c\u00e0ng s\u1edbm c\u00e0ng t\u1ed1t.'}]},
    {cat:'Escort',id:'e3',en:'Road Obstruction',vi:'Ph\u00e1t hi\u1ec7n v\u1eadt c\u1ea3n tr\u00ean \u0111\u01b0\u1eddng',
     st:[{en:'Stop at a safe distance; assess for IED or ambush indicators (road blocks, mines).',vi:'D\u1eebng l\u1ea1i \u1edf kho\u1ea3ng c\u00e1ch an to\u00e0n; \u0111\u00e1nh gi\u00e1 d\u1ea5u hi\u1ec7u IED ho\u1eb7c ph\u1ee5c k\u00edch (ch\u1ed1t ch\u1eb7n, m\u00ecn).'},{en:'Deploy the Scout group to reconnoitre, clear or remove the obstruction.',vi:'Tri\u1ec3n khai \u0111\u1ed9i Trinh s\u00e1t trinh s\u00e1t, d\u1ecdn d\u1eb9p ho\u1eb7c lo\u1ea1i b\u1ecf v\u1eadt c\u1ea3n.'},{en:'Make a U-turn or reroute when feasible to keep the convoy moving.',vi:'Quay \u0111\u1ea7u ho\u1eb7c \u0111\u1ed5i h\u01b0\u1edbng khi kh\u1ea3 thi \u0111\u1ec3 gi\u1eef \u0111o\u00e0n xe di chuy\u1ec3n.'},{en:'Maintain communication with HQ for approval.',vi:'Duy tr\u00ec li\u00ean l\u1ea1c v\u1edbi ch\u1ec9 huy \u0111\u1ec3 xin ph\u00e9p.'}]},
    {cat:'Escort',id:'e4',en:'Hostile Checkpoint Setup',vi:'Ch\u1ed1t ki\u1ec3m so\u00e1t th\u00f9 \u0111\u1ecbch',
     st:[{en:'Stop the convoy out of sight of the checkpoint and set up 360\u00b0 security.',vi:'D\u1eebng \u0111o\u00e0n xe khu\u1ea5t t\u1ea7m nh\u00ecn c\u1ee7a ch\u1ed1t v\u00e0 l\u1eadp v\u00f2ng b\u1ea3o v\u1ec7 360\u00b0.'},{en:'The Commander goes forward to negotiate safe passage.',vi:'Ch\u1ec9 huy ti\u1ebfn l\u00ean \u0111\u00e0m ph\u00e1n th\u00f4ng h\u00e0nh an to\u00e0n.'},{en:'Once secured, the convoy drives straight through without stopping; the Commander remains until all pass.',vi:'Khi \u0111\u00e3 \u0111\u01b0\u1ee3c b\u1ea3o \u0111\u1ea3m, \u0111o\u00e0n xe \u0111i th\u1eb3ng qua kh\u00f4ng d\u1eebng; Ch\u1ec9 huy \u1edf l\u1ea1i \u0111\u1ebfn khi m\u1ecdi xe qua h\u1ebft.'},{en:'Reroute if the threat is confirmed.',vi:'\u0110\u1ed5i h\u01b0\u1edbng n\u1ebfu x\u00e1c nh\u1eadn \u0111e d\u1ecda.'}]},
    {cat:'Escort',id:'e5',en:'Panic in Civilian Area',vi:'Ho\u1ea3ng lo\u1ea1n trong khu v\u1ef1c d\u00e2n s\u1ef1',
     st:[{en:'Stop and secure perimeter.',vi:'D\u1eebng l\u1ea1i v\u00e0 b\u1ea3o \u0111\u1ea3m v\u00f2ng ngo\u00e0i.'},{en:'Assist civilians if safe; maintain convoy integrity.',vi:'H\u1ed7 tr\u1ee3 d\u00e2n n\u1ebfu an to\u00e0n; gi\u1eef nguy\u00ean \u0111o\u00e0n xe.'},{en:'Coordinate with humanitarian partners.',vi:'Ph\u1ed1i h\u1ee3p v\u1edbi \u0111\u1ed1i t\u00e1c nh\u00e2n \u0111\u1ea1o.'}]},
    {cat:'Escort',id:'e6',en:'Fuel Shortage',vi:'Thi\u1ebfu nhi\u00ean li\u1ec7u',
     st:[{en:'Communicate with rear convoy support.',vi:'Li\u00ean l\u1ea1c v\u1edbi b\u1ed9 ph\u1eadn h\u1ed7 tr\u1ee3 ph\u00eda sau.'},{en:'Secure location and coordinate resupply.',vi:'B\u1ea3o \u0111\u1ea3m v\u1ecb tr\u00ed v\u00e0 ph\u1ed1i h\u1ee3p ti\u1ebfp t\u1ebf.'},{en:'Prioritize protection around halted convoy.',vi:'\u01afu ti\u00ean b\u1ea3o v\u1ec7 xung quanh \u0111o\u00e0n xe d\u1eebng.'}]},
    {cat:'Escort',id:'e7',en:'Communications Failure',vi:'M\u1ea5t th\u00f4ng tin li\u00ean l\u1ea1c',
     st:[{en:'Regroup at pre-designated fail-safe point.',vi:'T\u1eadp k\u1ebft t\u1ea1i \u0111i\u1ec3m an to\u00e0n \u0111\u00e3 \u0111\u1ecbnh.'},{en:'Use visual signaling or backup radio.',vi:'D\u00f9ng t\u00edn hi\u1ec7u h\u00ecnh \u1ea3nh ho\u1eb7c b\u1ed9 \u0111\u00e0m d\u1ef1 ph\u00f2ng.'},{en:'Resume movement under contingency SOP.',vi:'Ti\u1ebfp t\u1ee5c di chuy\u1ec3n theo quy tr\u00ecnh d\u1ef1 ph\u00f2ng.'}]}
  ],

  // ==== 025-026 Convoy Escort (UN PDT) ====
  con:[
    {t:{en:'Background & Aim',vi:'B\u1ed1i c\u1ea3nh & M\u1ee5c \u0111\u00edch'},
     d:{en:'In UN peacekeeping, FPUs may be tasked with convoy escort duties to protect supplies and ensure the unhindered passage of UN equipment into or within the Mission. Any escort is subject to threat assessment; information and intelligence are key to the planning of the convoy Commander. This module enables FPU members to plan a convoy escort and carry out the various contingency drills.',
        vi:'Trong c\u00e1c ph\u00e1i b\u1ed9 g\u00ecn gi\u1eef h\u00f2a b\u00ecnh c\u1ee7a LHQ, FPU c\u00f3 th\u1ec3 \u0111\u01b0\u1ee3c giao nhi\u1ec7m v\u1ee5 h\u1ed9 t\u1ed1ng \u0111o\u00e0n xe \u0111\u1ec3 b\u1ea3o v\u1ec7 v\u1eadt t\u01b0 v\u00e0 b\u1ea3o \u0111\u1ea3m h\u00e0ng h\u00f3a c\u1ee7a LHQ \u0111\u01b0\u1ee3c l\u01b0u th\u00f4ng kh\u00f4ng b\u1ecb c\u1ea3n tr\u1edf v\u00e0o ho\u1eb7c trong ph\u00e1i b\u1ed9. M\u1ecdi cu\u1ed9c h\u1ed9 t\u1ed1ng \u0111\u1ec1u d\u1ef1a tr\u00ean \u0111\u00e1nh gi\u00e1 \u0111e d\u1ecda; th\u00f4ng tin v\u00e0 t\u00ecnh b\u00e1o l\u00e0 ch\u00eca kh\u00f3a cho c\u00f4ng t\u00e1c l\u1eadp k\u1ebf ho\u1ea1ch c\u1ee7a Ch\u1ec9 huy \u0111o\u00e0n xe. M\u00f4-\u0111un n\u00e0y gi\u00fap th\u00e0nh vi\u00ean FPU l\u1eadp k\u1ebf ho\u1ea1ch h\u1ed9 t\u1ed1ng \u0111o\u00e0n xe v\u00e0 th\u1ef1c hi\u1ec7n c\u00e1c b\u00e0i t\u1eadp \u1ee9ng ph\u00f3 kh\u00e1c nhau.'},
     st:[
      {en:'Familiarize and practice the FPU in the provision of security for UN convoys',vi:'L\u00e0m quen v\u00e0 hu\u1ea5n luy\u1ec7n FPU b\u1ea3o \u0111\u1ea3m an ninh cho c\u00e1c \u0111o\u00e0n xe c\u1ee7a LHQ'},
      {en:'Plan a safe convoy escort',vi:'L\u1eadp k\u1ebf ho\u1ea1ch h\u1ed9 t\u1ed1ng \u0111o\u00e0n xe an to\u00e0n'},
      {en:'Demonstrate convoy drills',vi:'Th\u1ef1c h\u00e0nh c\u00e1c b\u00e0i t\u1eadp \u0111\u1ed9i h\u00ecnh \u0111o\u00e0n xe'},
      {en:'Demonstrate the correct action for the various contingencies',vi:'Th\u1ef1c hi\u1ec7n \u0111\u00fang h\u00e0nh \u0111\u1ed9ng \u0111\u1ed1i v\u1edbi c\u00e1c t\u00ecnh hu\u1ed1ng kh\u1ea9n c\u1ea5p kh\u00e1c nhau'}
     ]},
     {t:{en:'FPU Role',vi:'Vai tr\u00f2 c\u1ee7a FPU'},fc:true,
     d:{en:'The FPU role is to ensure the free movement of the convoy in line with the Mission mandate, and to provide convoy protection and intervention in case of attack.',
        vi:'Vai tr\u00f2 c\u1ee7a FPU l\u00e0 \u0111\u1ea3m b\u1ea3o \u0111o\u00e0n xe di chuy\u1ec3n t\u1ef1 do theo \u1ee7y quy\u1ec1n c\u1ee7a Ph\u00e1i b\u1ed9, \u0111\u1ed3ng th\u1eddi b\u1ea3o v\u1ec7 \u0111o\u00e0n xe v\u00e0 can thi\u1ec7p khi b\u1ecb t\u1ea5n c\u00f4ng.'},
     st:[
      {en:'Ensure the free movement of UN supplies and aid in line with the Mission mandate',vi:'B\u1ea3o \u0111\u1ea3m v\u1eadt t\u01b0 v\u00e0 vi\u1ec7n tr\u1ee3 c\u1ee7a LHQ di chuy\u1ec3n t\u1ef1 do theo \u1ee7y quy\u1ec1n c\u1ee7a Ph\u00e1i b\u1ed9'},
      {en:'Facilitate the passage of the convoy through territory',vi:'H\u1ed7 tr\u1ee3 \u0111o\u00e0n xe v\u01b0\u1ee3t qua l\u00e3nh th\u1ed5'},
      {en:'Protect the convoy if attacked',vi:'B\u1ea3o v\u1ec7 \u0111o\u00e0n xe n\u1ebfu b\u1ecb t\u1ea5n c\u00f4ng'}
     ]},
    {t:{en:'Variable Factors',vi:'C\u00e1c y\u1ebfu t\u1ed1 bi\u1ebfn \u0111\u1ed5i'},
     d:{en:'Variable factors feed the risk assessment process and define the level of protection the FPU Commander assigns to the convoy.',
        vi:'C\u00e1c y\u1ebfu t\u1ed1 bi\u1ebfn \u0111\u1ed5i g\u00f3p ph\u1ea7n v\u00e0o quy tr\u00ecnh \u0111\u00e1nh gi\u00e1 r\u1ee7i ro v\u00e0 x\u00e1c \u0111\u1ecbnh m\u1ee9c \u0111\u1ed9 b\u1ea3o v\u1ec7 m\u00e0 Ch\u1ec9 huy FPU giao cho \u0111o\u00e0n xe.'},
     st:[
      {en:'Operational situation: crossing disputed territory with several armed factions requires a higher level of protection',vi:'T\u00ecnh h\u00ecnh t\u00e1c chi\u1ebfn: v\u01b0\u1ee3t qua v\u00f9ng tranh ch\u1ea5p c\u00f3 nhi\u1ec1u nh\u00f3m v\u0169 trang \u0111\u00f2i h\u1ecfi m\u1ee9c b\u1ea3o v\u1ec7 cao h\u01a1n'},
      {en:'Environment: extremes of weather (snow and ice, or mud and sand) may require extra equipment',vi:'M\u00f4i tr\u01b0\u1eddng: th\u1eddi ti\u1ebft kh\u1eafc nghi\u1ec7t (b\u0103ng tuy\u1ebft ho\u1eb7c b\u00f9n v\u00e0 c\u00e1t) c\u00f3 th\u1ec3 c\u1ea7n th\u00eam trang b\u1ecb'},
      {en:'Itinerary: distance, number of stops, vehicles joining at different points, dangerous territory',vi:'H\u00e0nh tr\u00ecnh: kho\u1ea3ng c\u00e1ch, s\u1ed1 \u0111i\u1ec3m d\u1eebng, xe tham gia t\u1ea1i c\u00e1c \u0111i\u1ec3m kh\u00e1c nhau, v\u00f9ng nguy hi\u1ec3m'},
      {en:'Sensitivity of the convoy: content of the convoy and the political situation in the country',vi:'\u0110\u1ed9 nh\u1ea1y c\u1ea3m c\u1ee7a \u0111o\u00e0n xe: h\u00e0ng h\u00f3a tr\u00ean \u0111o\u00e0n v\u00e0 t\u00ecnh h\u00ecnh ch\u00ednh tr\u1ecb trong n\u01b0\u1edbc'},
      {en:'Conditions of roads and traffic: affect the average speed, fuel consumption and safety',vi:'\u0110i\u1ec1u ki\u1ec7n \u0111\u01b0\u1eddng s\u00e1 v\u00e0 giao th\u00f4ng: \u1ea3nh h\u01b0\u1edfng \u0111\u1ebfn t\u1ed1c \u0111\u1ed9 trung b\u00ecnh, m\u1ee9c ti\u00eau th\u1ee5 nhi\u00ean li\u1ec7u v\u00e0 an to\u00e0n'},
      {en:'Convoys are best kept moving; if traffic is congested the Commander may reconsider the route',vi:'\u0110o\u00e0n xe t\u1ed1t nh\u1ea5t l\u00e0 duy tr\u00ec di chuy\u1ec3n; n\u1ebfu giao th\u00f4ng t\u1eafc ngh\u1ebdn Ch\u1ec9 huy c\u00f3 th\u1ec3 xem x\u00e9t l\u1ea1i tuy\u1ebfn \u0111\u01b0\u1eddng'}
     ]},
    {t:{en:'Generalities',vi:'Quy \u0111\u1ecbnh chung'},
     d:{en:'Reference figures and rules for planning and running a UN convoy.',
        vi:'C\u00e1c th\u00f4ng s\u1ed1 tham chi\u1ebfu v\u00e0 quy t\u1eafc \u0111\u1ec3 l\u1eadp k\u1ebf ho\u1ea1ch v\u00e0 v\u1eadn h\u00e0nh \u0111o\u00e0n xe LHQ.'},
     tbl:[
      [{en:'Maximum number of vehicles',vi:'S\u1ed1 xe t\u1ed1i \u0111a'},{en:'15 - 20',vi:'15 - 20'}],
      [{en:'Average speed',vi:'T\u1ed1c \u0111\u1ed9 trung b\u00ecnh'},{en:'30 - 60 km/h',vi:'30 - 60 km/h'}],
      [{en:'Distance between vehicles',vi:'Kho\u1ea3ng c\u00e1ch gi\u1eefa c\u00e1c xe'},{en:'about 70 metres',vi:'kho\u1ea3ng 70 m\u00e9t'}],
      [{en:'Distance between groups',vi:'Kho\u1ea3ng c\u00e1ch gi\u1eefa c\u00e1c nh\u00f3m'},{en:'300 - 400 metres',vi:'300 - 400 m\u00e9t'}],
      [{en:'Crews per vehicle',vi:'K\u00edp xe'},{en:'at least two armed police officers',vi:'\u00edt nh\u1ea5t hai c\u1ea3nh s\u00e1t c\u00f3 v\u0169 trang'}]
     ],
     st:[
      {en:'More than 20 vehicles makes the convoy difficult to manage; split into smaller convoys where possible',vi:'Tr\u00ean 20 xe khi\u1ebfn \u0111o\u00e0n xe kh\u00f3 qu\u1ea3n l\u00fd; n\u1ebfu c\u00f3 th\u1ec3 h\u00e3y chia th\u00e0nh c\u00e1c \u0111o\u00e0n nh\u1ecf h\u01a1n'},
      {en:'The convoy moves at the speed of the slowest vehicle; brief the truck drivers before departure',vi:'\u0110o\u00e0n xe di chuy\u1ec3n theo t\u1ed1c \u0111\u1ed9 c\u1ee7a xe ch\u1eadm nh\u1ea5t; ph\u1ed5 bi\u1ebfn cho l\u00e1i xe tr\u01b0\u1edbc khi kh\u1edfi h\u00e0nh'},
      {en:'Reduce the distance between vehicles in urban areas to avoid the convoy being split and attacked; two lines is a solution',vi:'Gi\u1ea3m kho\u1ea3ng c\u00e1ch gi\u1eefa c\u00e1c xe \u1edf khu \u0111\u00f4 th\u1ecb \u0111\u1ec3 tr\u00e1nh \u0111o\u00e0n xe b\u1ecb c\u1eaft r\u1eddi v\u00e0 b\u1ecb t\u1ea5n c\u00f4ng; c\u00f3 th\u1ec3 ch\u1ea1y hai h\u00e0ng'},
      {en:'Group vehicles between the protection elements, 300 - 400 m apart, to make an ambush harder',vi:'Nh\u00f3m c\u00e1c xe gi\u1eefa c\u00e1c th\u00e0nh ph\u1ea7n b\u1ea3o v\u1ec7, c\u00e1ch nhau 300 - 400 m, \u0111\u1ec3 kh\u00f3 b\u1ecb ph\u1ee5c k\u00edch h\u01a1n'},
      {en:'Each vehicle carries a buddy team, both armed, with radios (or a radio in every second vehicle)',vi:'M\u1ed7i xe c\u00f3 m\u1ed9t c\u1eb7p b\u1ea1n chi\u1ebfn \u0111\u1ea5u, c\u1ea3 hai \u0111\u1ec1u c\u00f3 v\u0169 trang, k\u00e8m b\u1ed9 \u0111\u00e0m (ho\u1eb7c b\u1ed9 \u0111\u00e0m \u1edf m\u1ed7i xe c\u00e1ch xe)'}
     ]},
     {t:{en:'Scout Patrols (Advanced Recce)',vi:'\u0110\u1ed9i tu\u1ea7n tra Trinh s\u00e1t (Do th\u00e1m n\u00e2ng cao)'},fc:true,
     d:{en:'The advanced reconnaissance element of the convoy protection. Their task is to spot any danger and either deal with it, or stop or reroute the convoy and warn of the obstruction.',
        vi:'Th\u00e0nh ph\u1ea7n trinh s\u00e1t n\u00e2ng cao c\u1ee7a l\u1ef1c l\u01b0\u1ee3ng b\u1ea3o v\u1ec7 \u0111o\u00e0n xe. Nhi\u1ec7m v\u1ee5 c\u1ee7a h\u1ecd l\u00e0 ph\u00e1t hi\u1ec7n nguy hi\u1ec3m v\u00e0 ho\u1eb7c x\u1eed l\u00fd, ho\u1eb7c d\u1eebng ho\u1eb7c \u0111\u1ed5i h\u01b0\u1edbng \u0111o\u00e0n xe v\u00e0 c\u1ea3nh b\u00e1o v\u1ec1 v\u1eadt c\u1ea3n.'},
     tbl:[
      [{en:'Vehicles',vi:'Ph\u01b0\u01a1ng ti\u1ec7n'},{en:'two light armoured vehicles',vi:'hai xe b\u1ecdc th\u00e9p h\u1ea1ng nh\u1eb9'}],
      [{en:'Position',vi:'V\u1ecb tr\u00ed'},{en:'precedes the convoy about 1 - 2 km',vi:'\u0111i tr\u01b0\u1edbc \u0111o\u00e0n xe kho\u1ea3ng 1 - 2 km'}],
      [{en:'Engineering capability',vi:'N\u0103ng l\u1ef1c c\u00f4ng binh'},{en:'minor: removes light barricades and fallen trees',vi:'nh\u1eb9: d\u1ecdn v\u1eadt c\u1ea3n nh\u1eb9 v\u00e0 c\u00e2y \u0111\u1ed5'}],
      [{en:'Tasks',vi:'Nhi\u1ec7m v\u1ee5'},{en:'recces critical points and removes obstacles',vi:'trinh s\u00e1t c\u00e1c \u0111i\u1ec3m tr\u1ecdng y\u1ebfu v\u00e0 d\u1ecdn v\u1eadt c\u1ea3n'}],
      [{en:'Equipment',vi:'Trang b\u1ecb'},{en:'obstacle removal gear, public order items (smoke, teargas, flares, shields), first aid kit, binoculars, night vision',vi:'d\u1ee5ng c\u1ee5 d\u1ecdn v\u1eadt c\u1ea3n, v\u1eadt d\u1ee5ng ch\u1ed1ng b\u1ea1o \u0111\u1ed9ng (kh\u00f3i, h\u01a1i cay, ph\u00e1o s\u00e1ng, khi\u00ean), b\u1ed9 s\u01a1 c\u1ee9u, \u1ed1ng nh\u00f2m, k\u00ednh nh\u00ecn \u0111\u00eam'}]
     ]},

      [{en:'Personnel',vi:'Nh\u00e2n s\u1ef1'},{en:'on average 5 - 7 officers per vehicle',vi:'trung b\u00ecnh 5 - 7 s\u0129 quan m\u1ed7i xe'}],

     tbl:[
      [{en:'Vehicles',vi:'Ph\u01b0\u01a1ng ti\u1ec7n'},{en:'two light armoured vehicles',vi:'hai xe b\u1ecdc th\u00e9p h\u1ea1ng nh\u1eb9'}],
      [{en:'Position',vi:'V\u1ecb tr\u00ed'},{en:'follows about 1 km behind the convoy',vi:'\u0111i ph\u00eda sau \u0111o\u00e0n xe kho\u1ea3ng 1 km'}],

     {t:{en:'Communications',vi:'Li\u00ean l\u1ea1c'},fc:true,
     d:{en:'Communication is a key element to control the convoy. External links provide mutual support; internal nets connect every element of the convoy.',

     tbl:[
      [{en:'External',vi:'B\u00ean ngo\u00e0i'},{en:'UN Police HQ, UN Police stations in the convoy transit area, emergency radio frequencies and procedures',vi:'Tr\u1ee5 s\u1edf C\u1ea3nh s\u00e1t LHQ, c\u00e1c \u0111\u1ed3n C\u1ea3nh s\u00e1t LHQ trong khu v\u1ef1c \u0111o\u00e0n xe \u0111i qua, t\u1ea7n s\u1ed1 v\u00e0 quy tr\u00ecnh \u0111\u00e0m kh\u1ea9n c\u1ea5p'}],

      [{en:'Air & medical',vi:'Kh\u00f4ng qu\u00e2n & y t\u1ebf'},{en:'support helicopters and Casevac',vi:'tr\u1ef1c th\u0103ng h\u1ed7 tr\u1ee3 v\u00e0 s\u01a1 t\u00e1n th\u01b0\u01a1ng binh'}]

     st:[
      {en:'Establish radio procedures with set frequencies and code words where required',vi:'Thi\u1ebft l\u1eadp quy tr\u00ecnh \u0111\u00e0m v\u1edbi t\u1ea7n s\u1ed1 v\u00e0 m\u1eadt m\u00e3 khi c\u1ea7n'},
      {en:'Set up good communications with the UN Control Centre and UN police stations on the route',vi:'Thi\u1ebft l\u1eadp li\u00ean l\u1ea1c t\u1ed1t v\u1edbi Trung t\u00e2m \u0110i\u1ec1u khi\u1ec3n LHQ v\u00e0 c\u00e1c \u0111\u1ed3n c\u1ea3nh s\u00e1t tr\u00ean tuy\u1ebfn'}

     {t:{en:'Special Equipment',vi:'Trang b\u1ecb \u0110\u1eb7c bi\u1ec7t'},fc:true,
     d:{en:'Specialist equipment the Commander should consider for a convoy escort.',
        vi:'Trang b\u1ecb chuy\u00ean d\u1ee5ng m\u00e0 Ch\u1ec9 huy c\u1ea7n c\u00e2n nh\u1eafc cho m\u1ed9t cu\u1ed9c h\u1ed9 t\u1ed1ng \u0111o\u00e0n xe.'},
     st:[
      {en:'Radios: short wave hand-held radios for each officer, in addition to the main radio equipment',vi:'B\u1ed9 \u0111\u00e0m: b\u1ed9 \u0111\u00e0m c\u1ea7m tay cho t\u1eebng s\u0129 quan, ngo\u00e0i b\u1ed9 \u0111\u00e0m ch\u00ednh tr\u00ean xe'},

      {en:'Mine detectors: useful if the convoy enters a minefield; otherwise call the nearest Engineer unit or UNMAS',vi:'M\u00e1y d\u00f2 m\u00ecn: h\u1eefu \u00edch n\u1ebfu \u0111o\u00e0n xe v\u00e0o b\u00e3i m\u00ecn; n\u1ebfu kh\u00f4ng h\u00e3y g\u1ecdi \u0111\u01a1n v\u1ecb C\u00f4ng binh g\u1ea7n nh\u1ea5t ho\u1eb7c UNMAS'},

      {en:'Medical equipment: always carried; an ambulance may be deployed on long-distance convoys',vi:'Trang b\u1ecb y t\u1ebf: lu\u00f4n mang theo; c\u00f3 th\u1ec3 b\u1ed1 tr\u00ed xe c\u1ee9u th\u01b0\u01a1ng cho \u0111o\u00e0n xe \u0111\u01b0\u1eddng d\u00e0i'},
      {en:'Signs in the local language: \u201cUN Convoy do not overtake\u201d',vi:'Bi\u1ec3n b\u00e1o b\u1eb1ng ng\u00f4n ng\u1eef \u0111\u1ecba ph\u01b0\u01a1ng: \u201c\u0110o\u00e0n xe LHQ kh\u00f4ng \u0111\u01b0\u1ee3c v\u01b0\u1ee3t\u201d'}

     st:[
      {en:'Command the convoy: in overall charge',vi:'Ch\u1ec9 huy \u0111o\u00e0n xe: ch\u1ecbu tr\u00e1ch nhi\u1ec7m to\u00e0n b\u1ed9'},

      {en:'Carry out dynamic threat assessment as events unfold',vi:'Th\u1ef1c hi\u1ec7n \u0111\u00e1nh gi\u00e1 \u0111e d\u1ecda \u0111\u1ed9ng khi t\u00ecnh h\u00ecnh di\u1ec5n bi\u1ebfn'},

      {en:'Stop the convoy',vi:'D\u1eebng \u0111o\u00e0n xe'},

     st:[
      {en:'Stop the convoy and assess the situation',vi:'D\u1eebng \u0111o\u00e0n xe v\u00e0 \u0111\u00e1nh gi\u00e1 t\u00ecnh h\u00ecnh'},
      {en:'Set up 360\u00b0 security: call in the reserve',vi:'L\u1eadp v\u00f2ng b\u1ea3o v\u1ec7 360\u00b0: g\u1ecdi \u0111\u1ed9i d\u1ef1 b\u1ecb l\u00ean'},
      {en:'Remove the blockage: be extra careful going off-road where mines may be located',vi:'D\u1ecdn v\u1eadt c\u1ea3n: h\u1ebft s\u1ee9c th\u1eadn tr\u1ecdng khi xu\u1ed1ng \u0111\u01b0\u1eddng \u1edf n\u01a1i c\u00f3 th\u1ec3 c\u00f3 m\u00ecn'},
      {en:'Inform the Operation Centre; arrange recovery or redistribute the load to other vehicles',vi:'B\u00e1o Trung t\u00e2m T\u00e1c chi\u1ebfn; s\u1eafp x\u1ebfp c\u1ee9u k\u00e9o ho\u1eb7c ph\u00e2n l\u1ea1i h\u00e0ng sang xe kh\u00e1c'},

     ]},

     d:{en:'The Scout Group should identify the checkpoint so that passage can be negotiated before the convoy arrives.',
        vi:'\u0110\u1ed9i Trinh s\u00e1t c\u1ea7n ph\u00e1t hi\u1ec7n ch\u1ed1t ch\u1eb7n \u0111\u1ec3 c\u00f3 th\u1ec3 \u0111\u00e0m ph\u00e1n th\u00f4ng h\u00e0nh tr\u01b0\u1edbc khi \u0111o\u00e0n xe t\u1edbi.'},
     st:[
      {en:'Stop the convoy out of sight of the checkpoint where possible',vi:'D\u1eebng \u0111o\u00e0n xe khu\u1ea5t t\u1ea7m nh\u00ecn c\u1ee7a ch\u1ed1t n\u1ebfu c\u00f3 th\u1ec3'},
      {en:'Set up 360\u00b0 security',vi:'L\u1eadp v\u00f2ng b\u1ea3o v\u1ec7 360\u00b0'},
      {en:'Negotiate: the Commander goes forward to negotiate safe passage',vi:'\u0110\u00e0m ph\u00e1n: Ch\u1ec9 huy ti\u1ebfn l\u00ean \u0111\u00e0m ph\u00e1n th\u00f4ng h\u00e0nh an to\u00e0n'},
      {en:'Clear the checkpoint: once passage is secured, the convoy drives straight through without stopping',vi:'Gi\u1ea3i t\u1ecfa ch\u1ed1t: khi \u0111\u00e3 b\u1ea3o \u0111\u1ea3m th\u00f4ng h\u00e0nh, \u0111o\u00e0n xe \u0111i th\u1eb3ng qua kh\u00f4ng d\u1eebng l\u1ea1i'},
      {en:'The Commander remains until all vehicles pass, keeping a security deployment with him',vi:'Ch\u1ec9 huy \u1edf l\u1ea1i cho \u0111\u1ebfn khi m\u1ecdi xe \u0111i qua h\u1ebft, gi\u1eef m\u1ed9t \u0111\u1ed9i h\u00ecnh an ninh b\u00ean m\u00ecnh'},
      {en:'Restart the convoy as soon as possible',vi:'Cho \u0111o\u00e0n xe ti\u1ebfp t\u1ee5c c\u00e0ng s\u1edbm c\u00e0ng t\u1ed1t'}
     ]},
     {t:{en:'Contingency - Ambush',vi:'T\u00ecnh hu\u1ed1ng - Ph\u1ee5c k\u00edch'},fc:true,
     d:{en:'The convoy support must respond with force. The key principle is to keep the convoy moving; the scout and reserve elements attack the ambush site on its flanks.',
        vi:'L\u1ef1c l\u01b0\u1ee3ng b\u1ea3o v\u1ec7 \u0111o\u00e0n xe ph\u1ea3i \u0111\u00e1p tr\u1ea3 b\u1eb1ng v\u0169 l\u1ef1c. Nguy\u00ean t\u1eafc ch\u00ednh l\u00e0 gi\u1eef cho \u0111o\u00e0n xe di chuy\u1ec3n; \u0111\u1ed9i trinh s\u00e1t v\u00e0 d\u1ef1 b\u1ecb t\u1ea5n c\u00f4ng v\u1ecb tr\u00ed ph\u1ee5c k\u00edch t\u1eeb hai b\u00ean s\u01b0\u1eddn.'},
     st:[
      {en:'Use force to continue movement OR avoid the killing zone',vi:'D\u00f9ng v\u0169 l\u1ef1c ti\u1ebfp t\u1ee5c di chuy\u1ec3n HO\u1eb6C tr\u00e1nh khu v\u1ef1c h\u1ecfa l\u1ef1c s\u00e1t th\u01b0\u01a1ng'},
      {en:'Define the actual level of threat to avoid over-reacting',vi:'X\u00e1c \u0111\u1ecbnh \u0111\u00fang m\u1ee9c \u0111\u1ed9 \u0111e d\u1ecda \u0111\u1ec3 tr\u00e1nh ph\u1ea3n \u1ee9ng th\u00e1i qu\u00e1'},
      {en:'Call in the scout and reserve elements to attack the ambush site on its flanks',vi:'G\u1ecdi \u0111\u1ed9i trinh s\u00e1t v\u00e0 d\u1ef1 b\u1ecb t\u1ea5n c\u00f4ng v\u1ecb tr\u00ed ph\u1ee5c k\u00edch t\u1eeb hai s\u01b0\u1eddn'},
      {en:'Vehicles under fire shoot back vigorously: the \u201cball of fire\u201d principle',vi:'C\u00e1c xe b\u1ecb b\u1eafn ph\u1ea3i b\u1eafn tr\u1ea3 m\u1ea1nh: nguy\u00ean t\u1eafc \u201cv\u00f2ng l\u1eeda\u201d'},
      {en:'Fire smoke grenades between the convoy and the attackers to protect the movement',vi:'B\u1eafn l\u1ef1u \u0111\u1ea1n kh\u00f3i gi\u1eefa \u0111o\u00e0n xe v\u00e0 k\u1ebb t\u1ea5n c\u00f4ng \u0111\u1ec3 che ch\u1edf di chuy\u1ec3n'},
      {en:'If blocked, protection elements disembark, take cover and deploy to engulf the whole convoy',vi:'N\u1ebfu b\u1ecb ch\u1eb7n, c\u00e1c th\u00e0nh ph\u1ea7n b\u1ea3o v\u1ec7 xu\u1ed1ng xe, \u1ea9n n\u1ea5p v\u00e0 tri\u1ec3n khai bao quanh to\u00e0n b\u1ed9 \u0111o\u00e0n xe'},
      {en:'Report immediately to all convoy elements and UN HQ; warn vehicles closing in toward the area',vi:'B\u00e1o ngay cho m\u1ecdi th\u00e0nh ph\u1ea7n \u0111o\u00e0n xe v\u00e0 Tr\u1ee5 s\u1edf LHQ; c\u1ea3nh b\u00e1o c\u00e1c xe \u0111ang ti\u1ebfn v\u00e0o khu v\u1ef1c'},
      {en:'Guard against attackers boarding vehicles or taking drivers hostage: respond with appropriate force',vi:'\u0110\u1ec1 ph\u00f2ng k\u1ebb t\u1ea5n c\u00f4ng l\u00ean xe ho\u1eb7c b\u1eaft l\u00e1i xe l\u00e0m con tin: \u0111\u00e1p tr\u1ea3 b\u1eb1ng v\u0169 l\u1ef1c th\u00edch h\u1ee3p'},
      {en:'Give first aid and arrange evacuation when safe; secure and treat wounded assailants',vi:'S\u01a1 c\u1ee9u v\u00e0 s\u1eafp x\u1ebfp s\u01a1 t\u00e1n khi an to\u00e0n; kh\u1ed1ng ch\u1ebf v\u00e0 ch\u0103m s\u00f3c k\u1ebb t\u1ea5n c\u00f4ng b\u1ecb th\u01b0\u01a1ng'},
      {en:'Ambush key points: counter-ambush, maximum firepower, threat assessment, coordination, mobility',vi:'\u0110i\u1ec3m m\u1ea5u ch\u1ed1t ph\u1ee5c k\u00edch: ch\u1ed1ng ph\u1ee5c k\u00edch, h\u1ecfa l\u1ef1c t\u1ed1i \u0111a, \u0111\u00e1nh gi\u00e1 \u0111e d\u1ecda, ph\u1ed1i h\u1ee3p, c\u01a1 \u0111\u1ed9ng'}
     ],
     bad:[
      {en:'Threatening an unarmed crowd with machine guns',vi:'\u0110e d\u1ecda \u0111\u00e1m \u0111\u00f4ng kh\u00f4ng v\u0169 trang b\u1eb1ng s\u00fang m\u00e1y'},
      {en:'Ignoring unauthorised entry of vehicles into the convoy: a possible indication of an impending ambush',vi:'B\u1ecf qua vi\u1ec7c xe kh\u00f4ng \u0111\u01b0\u1ee3c ph\u00e9p l\u1ecdt v\u00e0o \u0111o\u00e0n xe: d\u1ea5u hi\u1ec7u c\u00f3 th\u1ec3 s\u1eafp b\u1ecb ph\u1ee5c k\u00edch'},

  // ==== 025-048 Basic Tactics on VIP Protection (UN PDT) ====
  vip:[
    {t:{en:'Background & Aim',vi:'B\u1ed1i c\u1ea3nh & M\u1ee5c \u0111\u00edch'},
     d:{en:'Protection of UN personnel and facilities is one of the three core tasks for FPUs. FPU members tasked with VIP protection act according to the UN Manual of Guidance on Protective Services and in close cooperation with UN security / UNDSS representatives.',
        vi:'B\u1ea3o v\u1ec7 nh\u00e2n s\u1ef1 v\u00e0 c\u01a1 s\u1edf c\u1ee7a LHQ l\u00e0 m\u1ed9t trong ba nhi\u1ec7m v\u1ee5 c\u1ed1t l\u00f5i c\u1ee7a FPU. Th\u00e0nh vi\u00ean FPU \u0111\u01b0\u1ee3c giao b\u1ea3o v\u1ec7 VIP ph\u1ea3i h\u00e0nh \u0111\u1ed9ng theo S\u1ed5 tay H\u01b0\u1edbng d\u1eabn v\u1ec1 D\u1ecbch v\u1ee5 B\u1ea3o v\u1ec7 c\u1ee7a LHQ v\u00e0 ph\u1ed1i h\u1ee3p ch\u1eb7t ch\u1ebd v\u1edbi \u0111\u1ea1i di\u1ec7n an ninh LHQ / UNDSS.'},
     st:[
      {en:'Understand and apply the basic techniques and tactics used during VIP visits in support of UN close protection teams',vi:'Hi\u1ec3u v\u00e0 \u00e1p d\u1ee5ng c\u00e1c k\u1ef9 thu\u1eadt v\u00e0 chi\u1ebfn thu\u1eadt c\u01a1 b\u1ea3n \u0111\u01b0\u1ee3c s\u1eed d\u1ee5ng trong c\u00e1c chuy\u1ebfn th\u0103m c\u1ee7a VIP nh\u1eb1m h\u1ed7 tr\u1ee3 c\u00e1c \u0111\u1ed9i b\u1ea3o v\u1ec7 c\u1eadn c\u1ea3nh c\u1ee7a LHQ'},
      {en:'Identify the different phases of a Close Protection Operation',vi:'Nh\u1eadn bi\u1ebft c\u00e1c giai \u0111o\u1ea1n kh\u00e1c nhau c\u1ee7a m\u1ed9t Chi\u1ebfn d\u1ecbch B\u1ea3o v\u1ec7 C\u1eadn c\u1ea3nh'},
      {en:'Define the role of a close protection team',vi:'X\u00e1c \u0111\u1ecbnh vai tr\u00f2 c\u1ee7a m\u1ed9t \u0111\u1ed9i b\u1ea3o v\u1ec7 c\u1eadn c\u1ea3nh'},
      {en:'Demonstrate techniques and tactics for static and mobile protection',vi:'Th\u1ef1c h\u00e0nh c\u00e1c k\u1ef9 thu\u1eadt v\u00e0 chi\u1ebfn thu\u1eadt b\u1ea3o v\u1ec7 t\u0129nh v\u00e0 b\u1ea3o v\u1ec7 c\u01a1 \u0111\u1ed9ng'}
     ]},
    {t:{en:'Tactical Considerations',vi:'C\u00e2n nh\u1eafc Chi\u1ebfn thu\u1eadt'},
     d:{en:'Planning is carried out according to the type of mission. FPU support to a close protection team can be operated during static, mobile or direct protection. All officers must be aware of the protection strategy and the risks giving rise to it.',
        vi:'L\u1eadp k\u1ebf ho\u1ea1ch \u0111\u01b0\u1ee3c ti\u1ebfn h\u00e0nh theo lo\u1ea1i nhi\u1ec7m v\u1ee5. S\u1ef1 h\u1ed7 tr\u1ee3 c\u1ee7a FPU cho m\u1ed9t \u0111\u1ed9i b\u1ea3o v\u1ec7 c\u1eadn c\u1ea3nh c\u00f3 th\u1ec3 di\u1ec5n ra trong b\u1ea3o v\u1ec7 t\u0129nh, c\u01a1 \u0111\u1ed9ng ho\u1eb7c tr\u1ef1c ti\u1ebfp. M\u1ecdi s\u0129 quan ph\u1ea3i n\u1eafm r\u00f5 chi\u1ebfn l\u01b0\u1ee3c b\u1ea3o v\u1ec7 v\u00e0 c\u00e1c r\u1ee7i ro d\u1eabn \u0111\u1ebfn chi\u1ebfn l\u01b0\u1ee3c \u0111\u00f3.'},
     st:[
      {en:'Mission: support to close protection teams (static, mobile or direct protection)',vi:'Nhi\u1ec7m v\u1ee5: h\u1ed7 tr\u1ee3 c\u00e1c \u0111\u1ed9i b\u1ea3o v\u1ec7 c\u1eadn c\u1ea3nh (b\u1ea3o v\u1ec7 t\u0129nh, c\u01a1 \u0111\u1ed9ng ho\u1eb7c tr\u1ef1c ti\u1ebfp)'},
      {en:'Environment: private house, building, open area',vi:'M\u00f4i tr\u01b0\u1eddng: nh\u00e0 ri\u00eang, t\u00f2a nh\u00e0, khu v\u1ef1c tr\u1ed1ng'},
      {en:'Equipment of the unit: types of vehicles, armoured or not, weapons and optics',vi:'Trang b\u1ecb c\u1ee7a \u0111\u01a1n v\u1ecb: lo\u1ea1i xe, c\u00f3 b\u1ecdc th\u00e9p hay kh\u00f4ng, v\u0169 kh\u00ed v\u00e0 k\u00ednh ng\u1eafm'},
      {en:'Risk assessment and Use of Force',vi:'\u0110\u00e1nh gi\u00e1 r\u1ee7i ro v\u00e0 S\u1eed d\u1ee5ng V\u0169 l\u1ef1c'},
      {en:'Planning and coordination',vi:'L\u1eadp k\u1ebf ho\u1ea1ch v\u00e0 ph\u1ed1i h\u1ee3p'},
      {en:'Training: drivers and unit',vi:'Hu\u1ea5n luy\u1ec7n: l\u00e1i xe v\u00e0 \u0111\u01a1n v\u1ecb'}
     ]},
    {t:{en:'Definition & Objective',vi:'\u0110\u1ecbnh ngh\u0129a & M\u1ee5c ti\u00eau'},
     d:{en:'Close protection is the deployment of security-trained officers to provide a ring of protection in close proximity to the recipient, together with a reconnaissance capability to locations to be visited. The primary responsibility for staff security rests with the host country.',
        vi:'B\u1ea3o v\u1ec7 c\u1eadn c\u1ea3nh l\u00e0 tri\u1ec3n khai c\u00e1c s\u0129 quan \u0111\u01b0\u1ee3c \u0111\u00e0o t\u1ea1o an ninh \u0111\u1ec3 t\u1ea1o m\u1ed9t v\u00f2ng b\u1ea3o v\u1ec7 \u1edf c\u1ef1 ly g\u1ea7n ng\u01b0\u1eddi \u0111\u01b0\u1ee3c b\u1ea3o v\u1ec7, c\u00f9ng v\u1edbi n\u0103ng l\u1ef1c trinh s\u00e1t c\u00e1c \u0111\u1ecba \u0111i\u1ec3m s\u1ebd \u0111\u1ebfn. Tr\u00e1ch nhi\u1ec7m ch\u00ednh v\u1ec1 an ninh cho nh\u00e2n s\u1ef1 thu\u1ed9c v\u1ec1 n\u01b0\u1edbc s\u1edf t\u1ea1i.'},
     st:[
      {en:'Preserve the life of the person being protected (the Protectee)',vi:'B\u1ea3o to\u00e0n t\u00ednh m\u1ea1ng c\u1ee7a ng\u01b0\u1eddi \u0111\u01b0\u1ee3c b\u1ea3o v\u1ec7 (Protectee)'},
      {en:'Prevent or minimise the effect of an attack intended to cause physical harm or embarrassment',vi:'Ng\u0103n ch\u1eb7n ho\u1eb7c gi\u1ea3m thi\u1ec3u h\u1eadu qu\u1ea3 c\u1ee7a m\u1ed9t v\u1ee5 t\u1ea5n c\u00f4ng nh\u1eb1m g\u00e2y t\u1ed5n h\u1ea1i th\u1ec3 ch\u1ea5t ho\u1eb7c g\u00e2y l\u00fang t\u00fang'},
      {en:'Deployment (except GA President, SG and DSG) is based on a Security Risk Assessment (SRA) and for official travel only',vi:'Vi\u1ec7c tri\u1ec3n khai (tr\u1eeb Ch\u1ee7 t\u1ecbch \u0110\u1ea1i h\u1ed9i \u0111\u1ed3ng, T\u1ed5ng Th\u01b0 k\u00fd v\u00e0 Ph\u00f3 T\u1ed5ng Th\u01b0 k\u00fd) d\u1ef1a tr\u00ean \u0110\u00e1nh gi\u00e1 R\u1ee7i ro An ninh (SRA) v\u00e0 ch\u1ec9 cho c\u00e1c chuy\u1ebfn c\u00f4ng t\u00e1c ch\u00ednh th\u1ee9c'}
     ]},
    {t:{en:'Close Protection Operation - Phases',vi:'Chi\u1ebfn d\u1ecbch B\u1ea3o v\u1ec7 C\u1eadn c\u1ea3nh - C\u00e1c Giai \u0111o\u1ea1n'},
     d:{en:'CP operations are separated into distinct phases. The Operational Phase is further separated into direct, mobile and static protection.',
        vi:'C\u00e1c chi\u1ebfn d\u1ecbch b\u1ea3o v\u1ec7 c\u1eadn c\u1ea3nh \u0111\u01b0\u1ee3c chia th\u00e0nh c\u00e1c giai \u0111o\u1ea1n ri\u00eang bi\u1ec7t. Giai \u0111o\u1ea1n T\u00e1c chi\u1ebfn ti\u1ebfp t\u1ee5c \u0111\u01b0\u1ee3c chia th\u00e0nh b\u1ea3o v\u1ec7 tr\u1ef1c ti\u1ebfp, c\u01a1 \u0111\u1ed9ng v\u00e0 t\u0129nh.'},
     tbl:[
      [{en:'Planning Phase',vi:'Giai \u0111o\u1ea1n L\u1eadp k\u1ebf ho\u1ea1ch'},{en:'Operational Plan formalized: input from Advance Officers and Team Leader, rehearsals, coordination with the Host Country',vi:'K\u1ebf ho\u1ea1ch T\u00e1c chi\u1ebfn \u0111\u01b0\u1ee3c ch\u1ed1t: \u0111\u00f3ng g\u00f3p c\u1ee7a S\u0129 quan Ti\u1ec1n tr\u1ea1m v\u00e0 Tr\u01b0\u1edfng \u0111\u1ed9i, di\u1ec5n t\u1eadp, ph\u1ed1i h\u1ee3p v\u1edbi n\u01b0\u1edbc s\u1edf t\u1ea1i'}],
      [{en:'Operational Phase',vi:'Giai \u0111o\u1ea1n T\u00e1c chi\u1ebfn'},{en:'implementation of the Operational Plan',vi:'th\u1ef1c hi\u1ec7n K\u1ebf ho\u1ea1ch T\u00e1c chi\u1ebfn'}],
      [{en:'Post Deployment Phase',vi:'Giai \u0111o\u1ea1n Sau Tri\u1ec3n khai'},{en:'after action reports, post operational reviews, lessons learned and best practices',vi:'b\u00e1o c\u00e1o sau h\u00e0nh \u0111\u1ed9ng, r\u00fat kinh nghi\u1ec7m sau chi\u1ebfn d\u1ecbch, b\u00e0i h\u1ecdc v\u00e0 th\u1ef1c ti\u1ec5n t\u1ed1t'}],
      [{en:'Direct Protection',vi:'B\u1ea3o v\u1ec7 Tr\u1ef1c ti\u1ebfp'},{en:'the Protectee receives close protection on foot: airport collection, movement to the convoy, walking to venues',vi:'Protectee \u0111\u01b0\u1ee3c b\u1ea3o v\u1ec7 c\u1eadn c\u1ea3nh khi \u0111i b\u1ed9: \u0111\u00f3n t\u1ea1i s\u00e2n bay, di chuy\u1ec3n t\u1edbi \u0111o\u00e0n xe, \u0111i b\u1ed9 \u0111\u1ebfn c\u00e1c \u0111\u1ecba \u0111i\u1ec3m'}],
      [{en:'Mobile Protection',vi:'B\u1ea3o v\u1ec7 C\u01a1 \u0111\u1ed9ng'},{en:'the Protectee travels by vehicle in a convoy',vi:'Protectee di chuy\u1ec3n b\u1eb1ng xe trong m\u1ed9t \u0111o\u00e0n h\u1ed9 t\u1ed1ng'}],
      [{en:'Static Protection',vi:'B\u1ea3o v\u1ec7 T\u0129nh'},{en:'the Protectee is at a venue, residence or temporary accommodation',vi:'Protectee \u1edf t\u1ea1i m\u1ed9t \u0111\u1ecba \u0111i\u1ec3m, n\u01a1i c\u01b0 tr\u00fa ho\u1eb7c ch\u1ed7 \u1edf t\u1ea1m th\u1eddi'}]
     ],
     st:[
      {en:'The CSA produces the Security Risk Assessment, the Concept of Security and the Operational Plan',vi:'CSA so\u1ea1n th\u1ea3o \u0110\u00e1nh gi\u00e1 R\u1ee7i ro An ninh, Kh\u00e1i ni\u1ec7m An ninh v\u00e0 K\u1ebf ho\u1ea1ch T\u00e1c chi\u1ebfn'},
      {en:'The Operational Plan is kept strictly confidential',vi:'K\u1ebf ho\u1ea1ch T\u00e1c chi\u1ebfn \u0111\u01b0\u1ee3c gi\u1eef b\u1ea3o m\u1eadt tuy\u1ec7t \u0111\u1ed1i'}
     ]},
    {t:{en:'Direct Protection',vi:'B\u1ea3o v\u1ec7 Tr\u1ef1c ti\u1ebfp'},
     d:{en:'Eliminate or reduce the opportunity for attack during movement on foot by using individual and team skills and formations to place human barriers between the protected asset and a potential attacker.',
        vi:'Lo\u1ea1i b\u1ecf ho\u1eb7c gi\u1ea3m c\u01a1 h\u1ed9i b\u1ecb t\u1ea5n c\u00f4ng khi di chuy\u1ec3n b\u1ed9 b\u1eb1ng c\u00e1ch s\u1eed d\u1ee5ng k\u1ef9 n\u0103ng c\u00e1 nh\u00e2n, k\u1ef9 n\u0103ng \u0111\u1ed9i v\u00e0 \u0111\u1ed9i h\u00ecnh \u0111\u1ec3 t\u1ea1o c\u00e1c r\u00e0o c\u1ea3n ng\u01b0\u1eddi gi\u1eefa t\u00e0i s\u1ea3n \u0111\u01b0\u1ee3c b\u1ea3o v\u1ec7 v\u00e0 k\u1ebb t\u1ea5n c\u00f4ng ti\u1ec1m t\u00e0ng.'},
     st:[
      {en:'The PPO acts as bodyguard and remains with the Protectee at all times: the last line of defence',vi:'PPO \u0111\u00f3ng vai tr\u00f2 v\u1ec7 s\u0129 v\u00e0 lu\u00f4n \u1edf b\u00ean Protectee: tuy\u1ebfn ph\u00f2ng th\u1ee7 cu\u1ed1i c\u00f9ng'},
      {en:'The Personal Escort Team (PET) provides a second layer of protection in close proximity',vi:'T\u1ed5 H\u1ed9 t\u1ed1ng C\u00e1 nh\u00e2n (PET) cung c\u1ea5p l\u1edbp b\u1ea3o v\u1ec7 th\u1ee9 hai \u1edf c\u1ef1 ly g\u1ea7n'},
      {en:'Smallest deployment: one PPO (BG) and at least three Protection Officers, with two vehicles',vi:'Tri\u1ec3n khai t\u1ed1i thi\u1ec3u: m\u1ed9t PPO (BG) v\u00e0 \u00edt nh\u1ea5t ba S\u0129 quan B\u1ea3o v\u1ec7, v\u1edbi hai xe'},
      {en:'Primary role during an incident is to extract the Protectee to a safe haven',vi:'Vai tr\u00f2 ch\u00ednh khi c\u00f3 s\u1ef1 c\u1ed1 l\u00e0 \u0111\u01b0a Protectee \u0111\u1ebfn n\u01a1i an to\u00e0n'},
      {en:'Identify escape routes and rally points; make reconnaissance of each safe location',vi:'X\u00e1c \u0111\u1ecbnh tuy\u1ebfn tho\u00e1t v\u00e0 \u0111i\u1ec3m t\u1eadp k\u1ebft; trinh s\u00e1t t\u1eebng v\u1ecb tr\u00ed an to\u00e0n'},
      {en:'Foot formations may be supported by a Quick Reaction Force from police (FPU) or military services',vi:'\u0110\u1ed9i h\u00ecnh b\u1ed9 c\u00f3 th\u1ec3 \u0111\u01b0\u1ee3c h\u1ed7 tr\u1ee3 b\u1edfi L\u1ef1c l\u01b0\u1ee3ng Ph\u1ea3n \u1ee9ng Nhanh t\u1eeb c\u1ea3nh s\u00e1t (FPU) ho\u1eb7c qu\u00e2n \u0111\u1ed9i'},
      {en:'The host country has jurisdiction over the scene; UN police may support the investigation',vi:'N\u01b0\u1edbc s\u1edf t\u1ea1i c\u00f3 th\u1ea9m quy\u1ec1n \u0111\u1ed1i v\u1edbi hi\u1ec7n tr\u01b0\u1eddng; c\u1ea3nh s\u00e1t LHQ c\u00f3 th\u1ec3 h\u1ed7 tr\u1ee3 \u0111i\u1ec1u tra'}
     ]},
     {t:{en:'Foot Formations - Overview',vi:'\u0110\u1ed9i h\u00ecnh \u0110i b\u1ed9 - T\u1ed5ng quan'},fc:true,
     d:{en:'The choice of formation depends on the threat, the number of officers assigned and the visual impact desired. All formations use a layered defence of concentric rings: the PPO forms the innermost ring and the PET provides at least one additional layer.',
        vi:'Vi\u1ec7c ch\u1ecdn \u0111\u1ed9i h\u00ecnh ph\u1ee5 thu\u1ed9c v\u00e0o m\u1ed1i \u0111e d\u1ecda, s\u1ed1 s\u0129 quan \u0111\u01b0\u1ee3c ph\u00e2n c\u00f4ng v\u00e0 hi\u1ec7u \u1ee9ng th\u1ecb gi\u00e1c mong mu\u1ed1n. M\u1ecdi \u0111\u1ed9i h\u00ecnh \u0111\u1ec1u s\u1eed d\u1ee5ng ph\u00f2ng th\u1ee7 nhi\u1ec1u l\u1edbp \u0111\u1ed3ng t\u00e2m: PPO t\u1ea1o v\u00f2ng trong c\u00f9ng v\u00e0 PET cung c\u1ea5p \u00edt nh\u1ea5t m\u1ed9t l\u1edbp b\u1ed5 sung.'},
     tbl:[
      [{en:'Box',vi:'H\u00ecnh vu\u00f4ng'},{en:'good all-round defence and visual impact, but gaps between officers',vi:'ph\u00f2ng th\u1ee7 to\u00e0n di\u1ec7n t\u1ed1t v\u00e0 hi\u1ec7u \u1ee9ng th\u1ecb gi\u00e1c t\u1ed1t, nh\u01b0ng c\u00f3 kho\u1ea3ng tr\u1ed1ng gi\u1eefa c\u00e1c s\u0129 quan'}],
      [{en:'Diamond',vi:'H\u00ecnh thoi'},{en:'filters crowds around the Protectee but can appear very aggressive',vi:'l\u1ecdc \u0111\u00e1m \u0111\u00f4ng quanh Protectee nh\u01b0ng c\u00f3 th\u1ec3 tr\u00f4ng r\u1ea5t hi\u1ebfu chi\u1ebfn'}],
      [{en:'V',vi:'H\u00ecnh ch\u1eef V'},{en:'filters crowds but widens the individual arcs of responsibility for officers',vi:'l\u1ecdc \u0111\u00e1m \u0111\u00f4ng nh\u01b0ng m\u1edf r\u1ed9ng g\u00f3c \u0111\u1ed9 tr\u00e1ch nhi\u1ec7m c\u1ee7a t\u1eebng s\u0129 quan'}],
      [{en:'Low profile',vi:'H\u1ed3 s\u01a1 th\u1ea5p'},{en:'2, 3 or 4 close protection officers, discreet',vi:'2, 3 ho\u1eb7c 4 s\u0129 quan b\u1ea3o v\u1ec7 c\u1eadn c\u1ea3nh, k\u00edn \u0111\u00e1o'}]
     ]},
     {t:{en:'Foot Formation - Box',vi:'\u0110\u1ed9i h\u00ecnh \u0110i b\u1ed9 - H\u00ecnh vu\u00f4ng'},fc:true,
     d:{en:'Five police officers in a box around the Protectee. The PPO bodyguard stays with the Protectee while four PET officers take the corners of an imaginary box.',
        vi:'N\u0103m s\u0129 quan c\u1ea3nh s\u00e1t trong h\u00ecnh vu\u00f4ng quanh Protectee. PPO v\u1ec7 s\u0129 \u1edf b\u00ean Protectee trong khi b\u1ed1n s\u0129 quan PET chi\u1ebfm b\u1ed1n g\u00f3c c\u1ee7a m\u1ed9t h\u00ecnh vu\u00f4ng t\u01b0\u1edfng t\u01b0\u1ee3ng.'},
     tbl:[
      [{en:'Personnel',vi:'Nh\u00e2n s\u1ef1'},{en:'5 police officers: 1 PPO (BG) + 4 PET',vi:'5 s\u0129 quan: 1 PPO (BG) + 4 PET'}],

      [{en:'Weaknesses',vi:'\u0110i\u1ec3m y\u1ebfu'},{en:'gaps can open between officers',vi:'c\u00f3 th\u1ec3 xu\u1ea5t hi\u1ec7n kho\u1ea3ng tr\u1ed1ng gi\u1eefa c\u00e1c s\u0129 quan'}]
     ]},
     {t:{en:'Foot Formation - Diamond',vi:'\u0110\u1ed9i h\u00ecnh \u0110i b\u1ed9 - H\u00ecnh thoi'},fc:true,
